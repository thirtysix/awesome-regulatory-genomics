name: Tests

# The rule functions decide what is in scope, which repository link is
# trustworthy and which paper a citation count belongs to. Every bug this
# project has had lived in one of them, so they are tested on every push.
#
# Deliberately offline: no API keys, no network. The live-data checks belong to
# refresh.yml, which runs monthly and opens a PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: make test

      - name: Rebuild from committed data and check it converges
        # `make curate` is offline: it rebuilds the catalog, README and site
        # from data/ and curation/ only. A diff here means the committed
        # outputs are stale relative to the inputs, which is the failure mode
        # that ships a README disagreeing with its own catalog.
        run: |
          make curate
          make check
          # A rebuild stamps today's date into the README badge, the catalog
          # meta and the site's BUILD_YEAR, so a commit made just before
          # midnight UTC and a CI rebuild made just after differ by one
          # character and this gate fails with nothing actually wrong. Drop
          # changed lines that carry a date, then fail if anything else
          # changed. Real drift, a committed output stale against its inputs,
          # still fails: only date-bearing lines are excused.
          DRIFT=$(git diff -U0 -- README.md data/catalog.json data/catalog.tsv docs/ \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '[0-9]{4}-{1,2}[0-9]{2}-{1,2}[0-9]{2}' || true)
          if [ -n "$DRIFT" ]; then
            echo "Committed outputs are stale against their inputs:"
            echo "$DRIFT" | head -40
            exit 1
          fi
          echo "No drift beyond the build date."
