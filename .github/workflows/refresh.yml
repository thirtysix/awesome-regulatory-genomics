name: Refresh catalog

# Re-harvests bio.tools, refreshes repository activity and citation counts, and
# opens a pull request if anything changed. Monthly rather than on every push:
# the upstream data moves slowly and a full sweep takes over an hour.
#
# This job deliberately does NOT deploy the site. It opens a PR rather than
# committing to main, so anything chained to it would publish the pre-refresh
# docs. Deployment lives in pages.yml and triggers when the PR is merged.
on:
  schedule:
    - cron: "0 4 1 * *"     # 04:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # enrichment alone runs ~40 min against live APIs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Harvest, enrich and rebuild
        env:
          # Raises the GitHub API limit from 60 to 5,000 requests/hour, which
          # the repository-metadata step needs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make refresh

      - name: Sanity-check the catalog
        run: make check

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: catalog-refresh
          title: "Monthly catalog refresh"
          commit-message: "data: monthly catalog refresh"
          body: |
            Automated refresh of the catalog from bio.tools, the GitHub API and
            OpenAlex.

            Review the diff in `data/catalog.tsv` before merging: new tools and
            dropped tools both show up there. If a whole class of tools appeared
            or vanished, the selection rules in `pipeline/config.py` are the
            likely cause, not upstream data.

            `docs/coverage.md` is regenerated too. If benchmark recall dropped,
            treat that as a blocker rather than noise.
          delete-branch: true
