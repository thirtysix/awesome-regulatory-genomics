    was: Analysis tool for targeted bisulfite sequencing experiments and array-based methylation studies.
  EPIGENE:
    description: Annotates genome-wide active transcription units from histone modification data using
      a multivariate hidden Markov model
    was: 'genome wide transcription unit annotation using a multivariate probabilistic model of histone
      modifications.


      EPIGENE models the observed combination of histone modifications using a product of independent
      Bernoulli random variables, to identify active transcription units.


      Canadian Epigenetics, Environment and Health Research Consortium (CEEHRC) Network — Epigenomics.


      Canadian Epigenetics, Environment and Health Research Consortium (CEEHRC) Network.


      The network is funded by the Canadian Institutes of Health Research (CIHR) and Genome Canada and
      is run by epigenetics researchers from across Canada. CEEHRC is Canada''s contribution to the International
      Human Epigenome Consortium (IHEC)'
  EPIP:
    description: Predicts condition-specific enhancer-promoter interactions from genomic data
    was: A novel approach for condition-specific enhancer-promoter interaction prediction.
  EPIVAN:
    description: Predicts long-range enhancer-promoter interactions from genomic sequences using a neural
      network with pre-trained DNA vectors and attention mechanism
    was: 'Identifying enhancer-promoter interactions with neural network based on pre-trained DNA vectors
      and attention mechanism.


      EPIVAN(Promoter-Enhancer Interaction predictor with pre-trained Vector and Attention based neural
      Networks).


      EPIVAN is a new deep learning method that enables predicting long-range EPIs using only genomic
      sequences'
  EnhancerDB:
    description: Database of regulatory relationships between transcription factors, enhancers, miRNAs,
      genes, and SNPs across human tissues
    was: Database to discover the regulate relationships in the context of enhancers.
  EpiAlign:
    description: Aligns chromatin state sequences learned from multi-track epigenomic signals to identify
      locally aligned regions
    was: Alignment-based bioinformatic tool for comparing chromatin state sequences.
  EpiAlignment:
    description: Aligns genomic regions from two species using both DNA sequence and ChIP-seq epigenomic
      profiles via dynamic programming
    was: Alignment of genomic regions with both sequence and epigenomic information.
  EpiCompare:
    description: Defines and explores genomic regions with tissue or cell type-specific epigenomic features
      using user-selected epigenomes and classification algorithms
    was: Tool to define and explore genomic regions with tissue or cell type-specific epigenomic features.
  EpiMethEx:
    description: Performs large-scale integrated analysis of methylation hotspots linked to genetic regulation
      using cyclic correlation between methylation and gene expression data
    was: R package for large-scale integrated analysis in methylation hotspots linked to genetic regulation.
  EpiMethylTag:
    description: Simultaneously detects ATAC-seq or ChIP-seq signals with DNA methylation on the same
      DNA via bisulfite conversion
    was: 'EpiMethylTag simultaneously detects ATAC-seq or ChIP-seq signals with DNA methylation.

      Activation of regulatory elements is thought to be inversely correlated with DNA methylation levels'
  EpiSAFARI:
    description: Detects valley-shaped patterns in epigenetic signal profiles from ChIP-seq and bisulfite
      sequencing data to annotate cis-regulatory elements
    was: 'Sensitive detection of valleys in epigenetic signals for enhancing annotations of functional
      elements | EpiSAFARI: Sensitive Detection of Valley Shaped Patterns in Epigenetic Signal Profiles
      | EpiSAFARI is a command line tool for detection, annotation, and characterization of the valley
      shaped patterns within the functional genomics signal profiles. It takes:'
  Epigenomics_Workflow_on_Galaxy_and_Jupyter:
    description: Runs reproducible ChIP-seq and RNA-seq analysis workflows using Galaxy and Jupyter Docker
      images
    was: Reproducible Epigenomics Analysis pipeline for the analysis of ChIP-Seq and RNA-Seq data using
      Docker images containing Galaxy and Jupyter. The analysis workflow was originally designed to analyze
      Brassica rapa data.
  FFLtool:
    description: Detects feed forward loops of TF-miRNA-target regulation in human using integrated TF-target
      and miRNA-target data
    was: 'A Web Server for Transcription Factor and miRNA Feed Forward Loop Analysis in Human.


      FFLtool is a webserver for analyzing Feed Forward Loop (FFL) regulatory motifs among transcription
      factors (TFs), microRNAs (miRNAs) and genes. FFLs potentially regulate thousands of target genes
      in facilitating spatiotemporal avoidance or noise buffering and play important roles in biological
      processes and diseases (see Refs. PMIDs: 20157565 and 24307685 ). It integrated TF-target data from
      hTFtarget and miR-target data from several predicted and validated databases. Except for identifying
      FFLs, FFLtools can also be used to search miR-target and TF-target information'
  FINET:
    description: Infers any network from big data using stability selection, elastic-net, and parameter
      optimization
    was: FINET is a software to infer any network. Implemented by Julia with algorithms of stability selection
      and elastic-net, plus parameter optimization, finet can infer a network fast and accurately from
      a big data. Additionally, finet is user-friendly, only one single command line to complete all computational
      processes. Developed under Linux, but finet should work in any OS system. Installing and using finet
      becomes simple by using following instructions
  GLANET:
    description: Annotates genomic loci and performs enrichment analysis with a sampling-based test that
      accounts for GC content and mappability biases
    was: Genomic loci annotation and enrichment tool.
  GOPHER:
    description: Designs probes for capture Hi-C experiments using three strategies for promoter, GWAS
      hit, or genomic region targeting
    was: Generator of probes for capture Hi-C experiments at high resolution.
  GRAM:
    description: Predicts the expression-modulating effect of non-coding variants in a cell-type specific
      manner using SELEX features and expression profiles
    was: 'A GeneRAlized Model to predict the molecular effect of a non-coding variant in a cell-type specific
      manner | GRAM: A GeneRAlized Model to predict the molecular effect of a non-coding variant in a
      cell type-specific manner'
  GRN:
    description: Infers gene regulatory networks from perturbation experiments to identify oncogenic mechanisms
    was: Perturbation-based gene regulatory network inference to unravel oncogenic mechanisms | Abstract
      The gene regulatory network (GRN) of human cells encodes mechanisms to ensure proper functioning.
      However, if this GRN is dysregulated, the cell may enter into a disease state such as cancer. Understanding
      the GRN as a system can therefore help identify novel mechanisms underlying disease, which can lead
      to new therapies. Reliable inference of GRNs is however still a major challenge in systems biology.
      To deduce regulatory interactions relevant to cancer, we applied a recent computational inference
      framework to data from perturbation experiments in squamous carcinoma cell line A431. GRNs were
      inferred using several methods, and the false discovery rate was controlled by the NestBoot framework.
      We developed a novel approach to assess the predictiveness of inferred GRNs against validation data,
      despite the lack of a gold standard
  GeNeCK:
    description: Constructs gene networks from expression data using ten statistical methods and optional
      hub gene information
    was: GeNeCK (Gene Network Construction Kit) is a comprehensive online tool kit that integrate various
      statistical methods to construct gene networks based on gene expression data and optional hub gene
      information.
  GeneWalk:
    description: Identifies individual gene functions relevant to a biological context using network representation
      learning on condition-specific gene regulatory networks
    was: GeneWalk identifies relevant gene functions for a biological context using network representation
      learning | GeneWalk determines for individual genes the functions that are relevant in a particular
      biological context and experimental condition. GeneWalk quantifies the similarity between vector
      representations of a gene and annotated GO terms through representation learning with random walks
      on a condition-specific gene regulatory network. Similarity significance is determined through comparison
      with node similarities from randomized networks
  GkmExplain:
    description: Interprets predictive sequence patterns from nonlinear gapped k-mer SVM models using
      a feature attribution method
    was: 'Fast and accurate interpretation of nonlinear gapped k-mer SVMs | Accompanying repository for
      GkmExplain paper | GkmExplain: Fast and Accurate Interpretation of Nonlinear Gapped k-mer Support
      Vector Machines | This repository accompanies Gkmexplain: Fast and Accurate Interpretation of Nonlinear
      Gapped k-mer SVMs by Shrikumar*†, Prakash* and Kundaje† (*co-first authors †co-corresponding authors).'
  Graph_Peak_Caller:
    description: Calls transcription factor peaks from ChIP-seq data aligned to graph-based reference
      genomes
    was: Tool for calling transcription factor peaks on graph-based reference genomes using ChIP-seq data.
  GripDL:
    description: Predicts gene regulatory interactions from spatial gene expression images using deep
      learning
    was: Predicting gene regulatory interactions based on spatial gene expression data and deep learning
      | Gene regulatory interaction prediction through Deep Learning | Gene regulatory interaction prediction
      through Deep Learning By Qingwei Fang, 2018
  HOT:
    description: Identifies high-occupancy target regions from ChIP-seq data and characterizes them as
      likely artifacts
    was: Examining the basis of high-occupancy target regions.
  HaploReg:
    description: Explores annotations of noncoding genome at variants on haplotype blocks using LD information
      from 1000 Genomes Project and chromatin state from Roadmap Epigenomics and ENCODE
    was: Association between DIO2 polymorphism and the risk of Kashin-Beck disease in the Tibetan population
      | HaploReg is a tool for exploring annotations of the noncoding genome at variants on haplotype
      blocks, such as candidate regulatory SNPs at disease-associated loci. Using LD information from
      the 1000 Genomes Project, linked SNPs and small indels can be visualized along with chromatin state
      and protein binding annotation from the Roadmap Epigenomics and ENCODE projects, sequence conservation
      across mammals, the effect of SNPs on regulatory motifs, and the effect of SNPs on expression from
      eQTL studies. HaploReg is designed for researchers developing mechanistic hypotheses of the impact
      of non-coding variants on clinical phenotypes and normal variation
  IWEPoissonPaper:
    description: Models methylation dynamics with simultaneous changes in CpG islands using a Markov-chain
      Monte-Carlo method
    was: Modeling methylation dynamics with simultaneous changes in CpG islands.
  ImmuneRegulation:
    description: Web-based portal to explore immune regulatory elements, eQTLs, and TF-binding regions
      across human blood cell types
    was: Web-based tool for identifying human immune regulatory elements.
  LDmotif:
    description: Predicts leucine-aspartic acid motifs from protein sequences using an active learning
      framework
    was: 'Proteome-level assessment of origin, prevalence and function of Leucine-Aspartic Acid (LD) motifs.


      Source code for LD motif detection.


      In this repository, we uploaded the necessary files to set up and environment to predict the LD
      motif from input sequence. We also have a server for LD motif predition : https://www.cbrc.kaust.edu.sa/ldmf/.


      Users need to run scripts after changing the value of input parameters. The deatils of each parameter
      is also provide. The code is shared in the folder "src". All external jars are shared in the folder
      "ExternalJar_Required" There are two files that should be used for Amino Acid index. These files
      are also shared.'
  LSTrAP-Lite:
    description: Infers biosynthetic and gene regulatory networks from RNA sequencing data on a credit
      card-sized ARM computer
    was: 'Inferring biosynthetic and gene regulatory networks from Artemisia annua RNA sequencing data
      on a credit card-sized ARM computer.


      Large-Scale Transcriptome Analysis Pipeline-Lite on credit card-sized ARM computer.


      If you use LSTrAP-Lite in your research, please cite: Inferring biosynthetic and gene regulatory
      networks from Artemisia annua RNA sequencing data on a credit card-sized ARM computer. Tan and Mutwil,
      2019. (https://doi.org/10.1101/661058).'
  LTMG:
    description: Models transcriptional expression states from single-cell RNA-seq data using a left truncated
      mixture Gaussian distribution
    was: 'A novel statistical modeling of transcriptional expression states in single-cell RNA-Seq data
      | This repository contains the R codes which could reproduce the results of "LTMG: A statistical
      model of transcriptional regulatory states in single cell RNA-Seq data" by Changlin Wan, Wennan
      Chang, Yu Zhang, Fenil Shah, Sha Cao, Melissa L. Fishel, Qin Ma, and Chi Zhang'
  LiPLike:
    description: Predicts high-confidence gene regulatory network interactions using a regression model
      that filters out replaceable predictors
    was: Towards gene regulatory network predictions of high-certainty | Abstract Motivation Reverse engineering
      of gene regulatory networks has for years struggled with high correlation in expression between
      regulatory elements. If two regulators have matching expression patterns it is impossible to differentiate
      between the two, and thus false positive identifications are abundant. Results To allow for gene
      regulation predictions of high confidence, we propose a novel method, LiPLike, that assumes a regression
      model and iteratively searches for interactions that cannot be replaced by a linear combination
      of other predictors. To compare the performance of LiPLike with other available inference methods,
      we benchmarked LiPLike using three independent datasets from the previous DREAM5 challenge
  LuxR:
    description: Relates LuxR peaks to H-NS double peaks using a perl script
    was: 'Global H-NS counter-silencing by LuxR activates quorum sensing gene expression.


      FileUtil.pm - perl helper module for loading files reformatFasta.pl - perl script the cleans and
      reformats multi-fasta files findOverlaps.pl - perl script to identify sets of overlapping peaks
      for Venn diagram getPeakAnno.pl - perl script to add annotation information to Macs2 peaks getGenePeakAnno2.pl
      - perl script to add peaks to gene information findClosest2.pl - perl script to produce table relating
      luxR peaks to H-NS double peaks.'
  MAPS:
    description: Identifies long-range chromatin interactions from PLAC-seq and HiChIP data using a zero-truncated
      Poisson regression framework
    was: MAPS (Model-based Analysis of PLAC-Seq data) pipeline is a a set of multiple scripts used to
      analyze PLAC-Seq and HiChIP data.
  MASSIF:
    description: Improves linking of DNA-binding motifs to transcription factors by incorporating protein
      domain information
    was: 'Improved linking of motifs to their TFs using domain information.


      Improved motif enrichment analysis using protein domain type information.


      MASSIF - motif association with domain information.


      MASSIF is a novel method to improve the performance of existing tool that link motifs to TFs relying
      on TF-associated sequences.'
  MCOT:
    description: Identifies overrepresented composite elements of transcription factor binding motifs
      from a single ChIP-seq dataset
    was: 'A single ChIP-seq dataset is sufficient for comprehensive analysis of motifs co-occurrence with
      MCOT package.


      added a link to the publication · 92cb2e86.


      3rd_party/jemalloc_win_x64_5.1.0'
  MCSeEd:
    description: Profiles whole genome cytosine and adenine methylation patterns without a reference genome
      using methylation-sensitive enzyme ddRAD
    was: 'A reference-free, whole genome profiling system to address cytosine/adenine methylation changes.


      Methods for investigating DNA methylation nowadays either require a reference genome and high coverage,
      or investigate only CG methylation. Moreover, no large-scale analysis can be performed for N6-methyladenosine
      (6 mA) at an affordable price. Here we describe the methylation content sensitive enzyme double-digest
      restriction-site-associated DNA (ddRAD) technique (MCSeEd), a reduced-representation, reference-free,
      cost-effective approach for characterizing whole genome methylation patterns across different methylation
      contexts (e.g., CG, CHG, CHH, 6 mA). MCSeEd can also detect genetic variations among hundreds of
      samples. MCSeEd is based on parallel restrictions carried out by combinations of methylation insensitive
      and sensitive endonucleases, followed by next-generation sequencing.'
  MPRAnalyze:
    description: Quantifies enhancer activity and compares conditions from massively parallel reporter
      assay data using generalized linear models
    was: Statistical framework for massively parallel reporter assays | Statistical Analysis of MPRA data
      | MPRAnalyze provides statistical framework for the analysis of data generated by Massively Parallel
      Reporter Assays (MPRAs), used to directly measure enhancer activity. MPRAnalyze can be used for
      quantification of enhancer activity, classification of active enhancers and comparative analyses
      of enhancer activity between conditions. MPRAnalyze construct a nested pair of generalized linear
      models (GLMs) to relate the DNA and RNA observations, easily adjustable to various experimental
      designs and conditions, and provides a set of rigorous statistical testig schemes
  MPRAnator:
    description: Designs massively parallel reporter assay experiments with motif placement, SNP effects,
      and negative controls
    was: Web-based tool for the design of massively parallel reporter assay experiments.
  Manhattan_Harvester:
    description: Detects and characterizes peaks from GWAS Manhattan Plot output files
    was: Tool for automatically detecting and characterizing peaks from GWAS output files (Manhattan Plots).
  MariaOsmala:
    description: Predicts enhancers in the human genome by probabilistic modeling of chromatin feature
      patterns from ChIP-seq data
    was: 'Enhancer prediction in the human genome by probabilistic modeling of the chromatin feature patterns.


      This package is a PRobabilistic Enhancer PredictIoN Tool PREPRINT.


      Clone the project to the desired directory, this will be your path_to_dir.


      https://github.com/MariaOsmala/RFECS_BUG_FIXES.git.'
  MatrixMotif:
    description: Discovers and iterates transcription factor binding site motifs from NGS sequences using
      enumerative and probabilistic matrix models
    was: We propose MatrixMotif(MM), a new combinatorial hybrid algorithm allowing qualitative and quantitative
      analysis of TFBS (Transcription Factor Binding Site) motifs using NGS data originated from DNA extraction
      and enrichment techniques. MM allows de novo motifs discovery and motifs iteration employing enumerative
      and probabilistic models based on several types of matrixes. MM primarily utilizes set of sequences
      from NGS in fasta format as a template for mathematical and statistical modeling. Fasta format can
      be generated from fastq format (Illumina platform) set of individual enriched sequences. MM generates
      final motifs as PPM, PWM or TFFM allowing visualization of de novo computed motifs.
  MaveDB:
    description: An open-source platform to distribute and interpret data from multiplexed assays of variant
      effect
    was: 'An open-source platform to distribute and interpret data from multiplexed assays of variant
      effect.


      Table of Multiplexed Assay of Variant Effect (MAVE) studies.


      MaveDB - A repository for MAVE assay datasets.


      To cite this document, please use the citation details for MaveDB.


      MaveDB is a public repository for datasets from Multiplexed Assays of Variant Effect (MAVEs), such
      as those generated by deep mutational scanning (DMS) or massively parallel reporter assay (MPRA)
      experiments.


      Welcome to our table of Multiplexed Assay of Variant Effect (MAVE) studies. To contribute a study
      or amend/expand an existing entry, please use the GitHub issue tracker or create a pull request'
  MetaGxBreast:
    description: Provides a collection of breast cancer transcriptomic datasets for analysis
    was: A collection of Breast Cancer Transcriptomic Datasets that are part of the MetaGxData package
      compendium.
  MethBase:
    description: Provides a reference methylome database from public BS-seq datasets for different organisms
    was: A reference methylome database for different organisms that is created from public BS-seq datasets.
  MethylCal:
    description: Calibrates methylation levels from bisulfite amplicon sequencing using Bayesian modeling
      to correct PCR bias
    was: Bayesian calibration of methylation levels | This package allows the calibration of methylation
      levels using MethylCal, a Bayesian calibration tool based on INLA (Rue et al., 2009). The package
      permits the visualisation of the calibration curve derived from standard controls with known methylation
      percentages for a selected assay. It also allows the correction of the methylation levels in case
      and control samples. If cases are provided, MethylCal performs a differential methylation test to
      detect hyper- and hypo-methylated samples. Besides MethylCal method, the package also includes the
      calibration and the correction provided by two alternative methods (Warnecke et al., 1997; Moskalev
      et al., 2011)
  ModEx:
    description: Extracts mode of regulation (activation vs. repression) from text describing transcription
      factor-gene interactions
    was: 'A text mining system for extracting mode of regulation of transcription factor-gene regulatory
      interaction.


      Deciphering the network of TF-target interactions with information on mode of regulation (activation
      vs. repression) is an important step toward understanding the regulatory pathways that underlie
      complex traits. There are many experimental, computational, and manually curated databases of TF-gene
      interactions. In particular, high-throughput ChIP-seq datasets provide a large-scale map or transcriptional
      regulatory interactions.


      ModEx can be installed using the GitHub repository. All of the dependencies will be installed via
      setup.py script.


      Saman Farahmand, Todd Riley, Kourosh Zarringhalam, "ModEx: A text mining system for extracting mode
      of regulation of Transcription Factor-gene regulatory interaction", BioRxiv, 2019'
  MotifAnalyzer-PDZ:
    description: Identifies enrichment trends for specific amino acids in PDZ-binding motif-satisfying
      sequences across multiple organisms
    was: 'A computational program to investigate the evolution of PDZ-binding target specificity.


      PDZ domains bind the extreme C-terminus of target proteins and are critical components of signaling
      and trafficking pathways. MotifAnalyzer-PDZ identifies enrichment trends for specific amino acids
      in a PDZ-binding motif-satisfying sequence across multiple organisms'
  MtBNN:
    description: Quantifies functional impact of non-coding variants using a multi-task Bayesian neural
      network on genomic sequences
    was: 'Quantifying Functional Impact of Noncoding Variants with Multi-task Bayesian Neural Network.


      The python script for MtBNN. The help information can be obtain by'
  MutSpot:
    description: Detects non-coding mutation hotspots in cancer genomes by modeling background mutation
      probability and testing for recurrence
    was: Detection of non-coding mutation hotspots in cancer genomes | Non-coding MUTation hotSPOT dectection
      in cancer genomes | The MutSpot R package systematically and unbiasedly scans cancer whole genomes
      to detect mutation hotspots. MutSpot first builds a background mutation model that corrects for
      covariates of mutation probability, such as local nucleotide context, replication timing and epigenomic
      features. Then MutSpot evaluates the mutation recurrence of focal DNA regions using a Poisson binomial
      model to account for varying mutation rates across different tumors. Mutation hotspots identified
      have significantly higher mutation recurrence compared to the background genomic mutation rate,
      suggesting positive selection in cancer and involvement in tumorigenesis
  MutaNET:
    description: Scores the impact of individual mutations on gene regulation by incorporating them into
      a provided gene regulatory network
    was: Tool for automated analysis of genomic mutations in gene regulatory networks.
  NRL:
    description: Calculates nucleosome repeat length from multiple phasograms computed with NucTools
    was: 'CTCF-dependent chromatin boundaries formed by asymmetric nucleosome arrays with decreased linker
      length.


      NRLcalc: calculation of the Nucleosome Repeat Length.


      The NRLcalc app provides a visual interface for the bulk calculation of the Nucleosome Repeat Length
      (NRL) based on multiple phasograms computed with NucTools (https://github.com/homeveg/nuctools).'
  NeSSie:
    description: Identifies exact and degenerate DNA palindromes, mirrors, and triplex-forming patterns
      using dynamic programming
    was: Tool for the identification of approximate DNA sequence symmetries.
  Nucleosome_Dynamics:
    description: Compares MNase-seq reads to detect nucleosome inclusions, evictions, and shifts between
      two experimental conditions
    was: A new tool for the dynamic analysis of nucleosome positioning | R package for nucleosome architecture
      comparison | Nucleosome Dynamics - Singularity | Nucleosome Dynamics Singularity image is a containerized
      implementation of 'Nucleosome Dynamics suite' | Nucleosome Dynamics Docker Container | Nucleosome
      Dynamics - docker implementation | This repository includes the set of R programs implementing 'Nucleosome
      Dynamics' analyses | Nucleosome positioning plays a major role in transcriptional regulation and
      most DNA-related processes | Nucleosome positioning plays a major role in transcriptional regulation
      DNA replication and DNA repair | R package aimed at comparing the reads of two MNase-seq experiments
      for nucleosome positioning and detecting significant inclusions, evictions and shifts
  OnTAD:
    description: Calls nested topologically associating domains from Hi-C data using an optimized algorithm
    was: 'Hierarchical domain structure reveals the divergence of activity among TADs and boundaries.


      An Optimized Nested TAD caller for Hi-C data.


      OnTAD is an Optimized Nested TAD caller for Hi-C data.


      OnTAD <Hi-C matrix> [-penalty <float>] [-maxsz <int>] [-minsz <int>] [-ldiff <float>] [-lsize <int>]
      [-bedout <chrnum int> <chrlength int> <int>] [-log2] [-o output_file]'
  PCHi-C:
    description: Identifies connected components with significance scores from PCHi-C chromatin interaction
      networks to reveal topological features
    was: 'Topological structure analysis of chromatin interaction networks.


      Analysis and visualisation tools for PCHi-C interaction networks'
  PIRCh-seq:
    description: Classifies non-coding RNAs by their association with specific histone modifications from
      PIRCh-seq data
    was: This tool contains scripts for PIRCh-seq. It provides a pipeline for functional classification
      of non-coding RNAs associated with distinct histone modifications
  PRAS:
    description: Predicts functional mRNA targets of RNA binding proteins by integrating intensities and
      positions of CLIP-seq peaks
    was: '> HOMEPAGE BROKEN! | Predicting functional targets of RNA binding proteins based on CLIP-seq
      peaks | RNA-protein interaction plays important roles in post-transcriptional regulation. Recent
      advancements in cross-linking and immunoprecipitation followed by sequencing (CLIP-seq) technologies
      make it possible to detect the binding peaks of a given RNA binding protein (RBP) at transcriptome
      scale. However, it is still challenging to predict the functional consequences of RBP binding peaks.
      In this study, we propose the Protein-RNA Association Strength (PRAS), which integrates the intensities
      and positions of the binding peaks of RBPs for functional mRNA targets prediction. We illustrate
      the superiority of PRAS over existing approaches on predicting the functional targets of two related
      but divergent CELF (CUGBP, ELAV-like factor) RBPs in mouse brain and muscle'
  PRP:
    description: Integrates curated plant genomic data with a regulatory search engine and genome browser
      for analyzing transcription factors, methylation, and small RNAs
    was: 'PRP is a comprehensive integrated regulatory information and analysis portal for plant genomes.


      Gene regulation is a highly complex and networked phenomenon where multiple tiers of control determine
      the cell state in a spatio-temporal manner. Among these, the transcription factors, DNA and histone
      modifications, and post-transcriptional control by small RNAs like miRNAs serve as major regulators.
      An understanding of the integrative and spatio-temporal impact of these regulatory factors can provide
      better insights into the state of a ''cell system''. Yet, there are limited resources available
      to this effect. Therefore, we hereby report an integrative information portal (Plant Regulomics
      Portal; PRP) for plants for the first time.'
  PanoromiX:
    description: Integrates molecular assays with pathophenotypic data for time-course network medicine
      visualization
    was: Time-course network medicine platform integrating molecular assays and pathophenotypic data.
  PhysMPrePro:
    description: Recognizes prokaryotic promoters using an energy model based on molecular structure
    was: PhysMPrePro is an energy model for recognizing the prokaryotic promoters based on molecular structure.
  PlantRegMap:
    description: Charts functional regulatory maps by identifying transcription factors, cis-elements,
      and their interactions across 63 plant genomes
    was: PlantRegMap is a comprehensive, high-quality resource of plant transcription factors (TFs), regulatory
      elements and interactions between them, advancing the understanding of plant transcriptional regulatory
      system.
  Plant_Regulomics:
    description: Retrieves upstream regulators from plant multi-omics data by integrating transcriptomic
      and epigenomic datasets into a unified statistical framework
    was: Plant Regulomics is a data-driven interface for retrieving upstream regulators from plant multi-omics
      data, which integrates 20,737 transcriptomic and epigenomic data sets and diverse sources of functional
      evidence (58,112 functional terms and 695,414 protein-protein interactions) from six plant species,
      namely Arabidopsis thaliana, Oryza sativa, Zea mays, Glycine max, Solanum lycopersicum and Triticum
      aestivum, along with the orthologous genes from 56 whole-genome sequenced plant species. These data
      were well-organized to gene modules and further implemented into the same statistical framework.
  ProSampler:
    description: Finds target and cooperative motifs from large ChIP-seq datasets using a numeration method
      and Gibbs sampler
    was: Ultra-fast and accurate motif finder in large ChIP-seq datasets for combinatory motif discovery.
  PromoterPredict:
    description: Predicts Escherichia coli σ70 promoter strength from –10 and –35 hexamer sequences using
