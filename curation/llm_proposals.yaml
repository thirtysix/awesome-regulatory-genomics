  SCALE:
    description: Analyzes single-cell ATAC-seq data by learning latent features with a deep generative
      framework and Gaussian Mixture Model for visualization, clustering, denoising, and imputation
    was: 'SCALE method for single-cell ATAC-seq analysis via latent feature extraction.


      Single-cell ATAC-seq analysis via Latent feature Extraction.


      SCALE neural network is implemented in Pytorch framework.


      Lei Xiong, Kui Xu, Kang Tian, Yanqiu Shao, Lei Tang, Ge Gao, Michael Zhang, Tao Jiang & Qiangfeng
      Cliff Zhang. SCALE method for single-cell ATAC-seq analysis via latent feature extraction. Nature
      Communications, (2019).'
  SEACR:
