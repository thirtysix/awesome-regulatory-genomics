descriptions:
  3d-spagnn-e:
    description: Develops spatially resolved gene neighborhood network embedding to identify subcellular
      gene proximity and communication motifs
    was: 3D-spaGNN-E is a pipeline that develops spatially resolved gene neighborhood network embedding
      to identify subcellular gene proximity relationships and key subcellular motifs in cell-cell communication
  3defdr:
    description: Identifies cell type-specific looping interactions in 5C and Hi-C data using statistical
      methods
    was: 3DeFDR is a statistical methods for identifying cell type-specific looping interactions in 5C
      and Hi-C data
  3dtf:
    description: Analyses protein-DNA binding sites through a web-server for transcription factor binding
      site prediction
    was: 3D Transcription Factor (3DTF) is a web-server for the analysis of protein-DNA binding sites
  4accpred:
