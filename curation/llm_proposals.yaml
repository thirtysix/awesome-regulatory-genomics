    was: 'SEACR: Sparse Enrichment Analysis for CUT&RUN'
  SEMpl:
    description: Predicts effects of SNPs on transcription factor binding affinity by observing ChIP-seq
      signal intensity differences within binding sites genome-wide
    was: Predicting the effects of SNPs on transcription factor binding affinity | MOTIVATION:GWAS have
      revealed that 88% of disease associated SNPs reside in noncoding regions. However, noncoding SNPs
      remain understudied, partly because they are challenging to prioritize for experimental validation.
      To address this deficiency, we developed the SNP effect matrix pipeline (SEMpl). RESULTS:SEMpl estimates
      transcription factor binding affinity by observing differences in ChIP-seq signal intensity for
      SNPs within functional transcription factor binding sites genome-wide. By cataloging the effects
      of every possible mutation within the transcription factor binding site motif, SEMpl can predict
      the consequences of SNPs to transcription factor binding. This knowledge can be used to identify
      potential disease-causing regulatory loci
  SNPnotes:
    description: Annotates single nucleotide variants with tissue-specific functional information from
      GWAS, open chromatin, gene expression, and clinical databases
    was: 'high-throughput tissue-specific functional annotation of single nucleotide variants.


      Tissue-specific variant annotation pipeline.


      This pipeline annotates variants based on multiple sources of prior knowledge, including the GWAS
      literature, tissue-specific open chromatin, tissue-specific modulation of gene expression, and clinical
      pathogenicity.


      To download and prepare annotation files'
  SalMotifDB:
    description: Analyzes transcription factor binding sites and constructs putative regulatory networks
      in salmonid genomes
    was: 'a tool for analyzing putative transcription factor binding sites in salmonid genomes | SalMotifDB:
      cis-regulatory motif database for salmonids | We''re getting there, it''s worth the wait'
  SciApps:
    description: Provides a cloud-based portal for analysis and distribution of MaizeCODE functional genomics
      data
    was: 'A Cloud-Based Platform for Analyses and Distribution of the MaizeCODE data.


      MaizeCODE is a project aimed at identifying and analyzing functional elements in the maize genome.
      In its initial phase, MaizeCODE assayed up to five tissues from four maize strains (B73, NC350,
      W22, TIL11) by RNA-Seq, Chip-Seq, RAMPAGE, and small RNA sequencing. To facilitate reproducible
      science and provide both human and machine access to the MaizeCODE data, we developed SciApps, a
      cloud-based portal, for analysis and distribution of both raw data and analysis results. Based on
      the SciApps workflow platform, we generated new components to support the complete cycle of the
      MaizeCODE data management'
  Sierra:
    description: Detects differential transcript usage from polyA-captured single-cell RNA-seq data by
      identifying read pileup coordinates and performing UMI counting
    was: 'Discovery of differential transcript usage from polyA-captured single-cell RNA-seq data.


      Sierra is an R package designed for detecting differential transcript usage analysis from polyA-enriched
      single cell RNASeq data. Sierra identifies coordinates of read pileups (i.e. peaks) and performs
      UMI counting, followed by differential usage analysis between defined cell populations. Please read
      vignette for a demonstration on how to use this software'
  Signaling_Pathways_Project:
    description: Integrates public transcriptomic and cistromic datasets to predict transcriptional regulatory
      relationships in mammalian signaling pathways
    was: 'integrated ''omics knowledgebase for mammalian cellular signaling pathways.


      A multi-omics knowledgebase for cellular signaling pathways.


      Welcome to the Signaling Pathways Project.


      The Signaling Pathways Project is a multi-omics knowledgemine based upon public, manually curated
      transcriptomic and cistromic (ChIP-Seq) datasets involving genetic and small molecule manipulations
      of cellular receptors, enzymes and transcription factors. Our goal is to create a resource where
      scientists can routinely generate research hypotheses or validate bench relevant to cellular signaling
      pathways. Learn more ».


      1555 datasets found. Use the filter to narrow the listings.


      Transcriptomic Cistromics (ChIP-Seq)'
  StoatyDive:
    description: Evaluates and classifies peak profile shapes from CLIP-seq or ChIP-seq data to assess
      binding specificity
    was: 'Evaluation and Classification of Peak Profiles for Sequencing Data.


      StoatyDive is a tool to evaluate and classify predicted peak profiles to assess the binding specificity
      of a protein to its targets. It can be used for sequencing data such as CLIP-seq or ChIP-Seq, or
      any other type of peak profile data.


      StoatyDive is a tool to evaluate and classify predicted peak profiles to assess the binding specificity
      of a protein to its targets'
  T-Gene:
    description: Predicts transcription factor target genes and regulatory binding sites by combining
      genomic distance with histone-expression correlation
    was: 'Improved target gene prediction.


      Abstract Motivation Identifying the genes regulated by a given transcription factor (its “target
      genes”) is a key step in developing a comprehensive understanding of gene regulation. Previously
      we developed a method for predicting the target genes of a transcription factor (TF) based solely
      on the correlation between a histone modification at the TF’s binding site and the expression of
      the gene across a set of tissues. That approach is limited to organisms for which extensive histone
      and expression data is available, and does not explicitly incorporate the genomic distance between
      the TF and the gene. Results We present the T-Gene algorithm, which overcomes these limitations.
      T-Gene can be used to predict which genes are most likely to be regulated by a TF, and which of
      the TF’s binding sites are most likely involved in regulating particular genes.'
  TAD-Lactuca:
    description: Predicts topologically associating domain boundaries from histone marks and DNA sequence
      using Random Forests and Multilayer Perceptron
    was: 'A computational method to predict topologically associating domain boundaries combining histone
      Marks and sequence information.


      TAD-Lactuca is a tool to predict Topologically Associating Domains(TAD) boundary using histone marks
      information. It was written in Python language, using Random Forests(RF) and Multilayer Perception(MLP)'
  TDimpute:
    description: Imputes missing gene expression data from DNA methylation using a transfer learning-based
      neural network trained on pan-cancer data
    was: TDimpute is a novel transfer learning-based neural network to impute missing gene expression
      data from DNA methylation data. In the tool, the pan-cancer dataset from TCGA was utilized for training
      a general model for all cancers, which was then fine-tuned on the target cancer dataset for imputation.
  TFBSshape:
    description: Provides DNA shape features for transcription factor binding sites, including methylated
      and unmethylated DNA, with tools for comparison and analysis
    was: 'an expanded motif database for DNA shape features of transcription factor binding sites.


      Responsive Bootstrap 4 Admin & Dashboard Template.


      TFBSshape provides DNA shape features for transcription factor binding sites (TFBSs). These structural
      features refine the description of TF binding specificities and provide mechanistic insights into
      protein–DNA recognition. The DNA shape features were predicted using our recently published high-throughput
      method (Zhou et al. NAR 2013) and visualized in the form of heat maps. Users can download these
      DNA shape feature data and perform further analysis, for example, to identify which DNA shape feature(s)
      at which position(s) in the target DNA contribute to the DNA binding specificity of a TF. Users
      can also compare DNA shape profiles, both qualitatively and quantitatively, between two TF datasets
      from the database, or between a set of uploaded sequences and a TF from the database'
  TFmiR2:
    description: Constructs and analyzes disease-, tissue- and process-specific transcription factor and
      microRNA co-regulatory networks from user-provided deregulated genes and miRNAs
    was: 'Constructing and analyzing disease-, tissue- and process-specific transcription factor and microRNA
      co-regulatory networks.


      It seems like you are using Internet Explorer, which is not supported yet.


      Please switch to Chrome , Firefox , or Safari'
  TFregulomeR:
    description: Integrates transcription factor binding sites and DNA methylation profiles from MethMotif
      and GTRD for cell-specific analysis in R
    was: TFregulomeR comprises of a comprehensive compendium of transcription factor binding sites (TFBSs)
      derived from the MethMotif and GTRD, as well as the ready-to-use functionality in R language facilitating
      data access, integration and analysis. The binding motifs predicted in-silico from MethMotif and
      GTRD describe cell specific transcription factor (TF) binding propensities, while the DNA methylation
      profiles from MethMotif portray a second epigenetic dimension in TF binding events. The whole toolbox
      allows a better understanding of the TF binding propensities in a cell-specific manner.
  TGS-Lite:
    description: Reconstructs time-varying gene regulatory networks from time-series gene expression data
      without assuming smooth transitions, using limited memory
    was: Rapid Reconstruction of Time-varying Gene Regulatory Networks with Limited Main Memory | Abstract
      Reconstruction of time-varying gene regulatory networks underlying a time-series gene expression
      data is a fundamental challenge in the computational systems biology. The challenge increases multi-fold
      if the target networks need to be constructed for hundreds to thousands of genes. There have been
      constant efforts to design an algorithm that can perform the reconstruction task correctly as well
      as can scale efficiently (with respect to both time and memory) to such a large number of genes.
      However, the existing algorithms either do not offer time-efficiency, or they offer it at other
      costs memory-inefficiency or imposition of a constraint, known as the ‘smoothly time-varying assumption’
  TMB:
    description: Provides a library of all-atom molecular dynamics simulations of nucleosomes for comparative
      analysis of DNA conformation and dynamics
    was: '> LOW CONFIDENCE! | > CORRECT NAME OF TOOL COULD ALSO BE ''iBIOMES'', ''Lite'', ''iBIOMES Lite'',
      ''nucleosome'' | TMB Library of Nucleosome Simulations | Nucleosomes are the fundamental building
      blocks of chromatin, the biomaterial that houses the genome in all higher organisms. A nucleosome
      consists of 145-147 base pairs of DNA wrapped 1.7 times around eight histones. Given a four-letter
      code (A, C, G, T), there are approximately 4147 or 1088 oligonucleotides that can form a nucleosome.
      Comparative, rather than comprehensive, studies are required. Here we introduce the TMB Library
      of nucleosome simulations and present a meta-analysis of over 20 μs of all atom molecular dynamics
      simulations representing 518 different realizations of the nucleosome. The TMB Library serves as
      a reference for future comparative, on-demand simulations of nucleosomes and a demonstration of
      iBIOMES Lite as a tool for managing a laboratory''s simulation library'
  TOBIAS:
