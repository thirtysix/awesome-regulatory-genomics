  REPIC:
    description: A database of m6A modification sites from reprocessed m6A-seq and MeRIP-seq data, integrated
      with ENCODE ChIP-seq and DNase-seq tracks for exploration in a genome browser
    was: 'A database for exploring N6-methyladenosine methylome.


      REPIC (RNA Epitranscriptome Collection) is a database dedicated to provide a new resource to investigate
      potential functions and mechanisms of N6-adenosine methylation (m6A) modifications. Currently, The
      database includes about 700 samples of 50 public studies that were reprocessed by our refined pipeline.
      The database also contains ENCODE histone ChIP-seq and DNase-seq data to correlate m6A modifications.
      It provided multi-dimensional information (e.g. cell or tissue specificity) to query m6A modification
      relevance in cellular processes. In addition, a built-in modern genome browser presented a comprehensive
      atlas of m6A modifications which is helpful to visualize m6A modification sites between different
      samples and conditions.'
  RHPCG:
    description: Provides multi-omics analyses and visualization of Hippo pathway genes and regulatory
      motifs in cancer
    was: 'a database of the Regulation of the Hippo Pathway in Cancer Genome.


      Hippo signaling pathway is a highly conserved pathway, which is consisted of a group of kinases.
      Dysregulation of Hippo signaling pathway is involved in the initiation and progression of cancer,
      such as breast cancer, lung cancer and so on. RHPCG serves as a valuable resource for understanding
      the roles of Hippo signaling pathway in carcinogenesis. The features of RHPCG contain: (i) the landscape
      of Hippo gene alterations at multiple omics level; (ii) quick search Hippo regulatory motifs by
      mRNA, lncRNA, circRNA or miRNA; and (iii) all the Hippo related motifs can be visualized as network
      and be downloaded freely'
  RRBSsim:
