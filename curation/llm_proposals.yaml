  repark:
    filter_said: weak-operation, no corroboration
    name: RepARK
    reason: Repetitive motif detection is relevant to regulatory genomics, and the tool's focus on repetitive
      elements can inform chromatin structure and regulatory regions.
  ribex:
    filter_said: hard-excluded:\briboswitch|\bribosome profil
    name: RibEx
    reason: RibEx predicts regulatory elements, not ribosome profiling.
  riboswitch_finder:
    filter_said: hard-excluded:\briboswitch|\bribosome profil
    name: Riboswitch finder
    reason: Riboswitches are cis-regulatory RNA elements that control gene expression by binding metabolites,
      fitting regulatory-genomics scope despite the filter's riboswitch exclusion.
  seprom:
    filter_said: hard-excluded:\bprotein (crystall|folding|st
    name: SEProm
    reason: Prokaryotic promoter prediction is in scope for cis-regulatory elements.
  snpinfo:
    filter_said: no-match
    name: SNPinfo
    reason: Includes functional predictions for gene regulation and miRNA binding, which are regulatory-genomics
      tasks.
  ucsc-genome-browser:
    filter_said: no-match
    name: UCSC Genome Browser database
    reason: Provides genome annotation and visualisation for regulatory elements like promoters and enhancers
  vimic:
    filter_said: no-match
    name: ViMIC
    reason: Focuses on virus integration sites and cis-effects, which involve cis-regulatory elements.
  x2k:
    filter_said: hard-excluded:\bphosphorylat|\bkinase substr
    name: X2K
    reason: Integrates ChIP-seq and PWMs for regulatory analysis, fitting regulatory-genomics scope.
