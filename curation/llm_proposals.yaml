      The association of genes with AD are validated by multiple lines of functional genomic evidence
      with statistical approaches.
  ananastra:
    description: Identifies and annotates regulatory SNPs with allele-specific transcription factor binding
      from ChIP-seq data
    was: A web server for the identification and annotation of regulatory single-nucleotide polymorphisms
      (SNPs) with allele-specific binding events.
  ananse:
    description: Infers enhancer-based gene regulatory networks and identifies key transcription factors
      in cell fate determination
    was: ANANSE is a computational approach to infer enhancer-based gene regulatory networks (GRNs) and
      to use these GRNs to identify the key transcription factors in cell fate determination.
  animal-ernadb:
    description: A database of enhancer RNAs characterized from 10 animal species using RNA-seq data
    was: A comprehensive animal enhancer RNA database.
  animal_tfdb:
    description: Identifies and classifies genome-wide transcription factors, co-factors, and chromatin
      remodeling factors across 50 sequenced animal genomes
    was: Comprehensive TF database; identified and classified all the genome-wide TFs in 50 sequenced
      animal genomes. Also collects transcription co-factors and chromatin remodeling factors of those
      genomes, which are also essential in the gene transcription regulation.
  annominer:
    description: Integrates epigenetics, transcription factor occupancy and transcriptomics data to predict
      transcriptional regulators
    was: AnnoMiner is a web-tool to integrate epigenetics, transcription factor occupancy and transcriptomics
      data to predict transcriptional regulators.
  annotategenes:
    description: Annotates peaks with genomic features such as promoters, enhancers, exons, and introns,
      and creates a distribution PNG
    was: This tool annotates peaks with genomic feature (promoter, enhancer, exon, intron, etc.) and creates
      a .png file with distribution.
  annotatepeaks:
    description: Annotates peaks with genomic features and creates a distribution PNG
    was: This tool annotates peaks with genomic feature (promoter, enhancer, exon, intron, etc.) and creates
      a .png file with distribution.
  annotatr:
    description: Annotates genomic regions with gene model, CpG, and regulatory annotations and visualizes
      the intersections
    was: Given a set of genomic sites/regions (e.g. ChIP-seq peaks, CpGs, differentially methylated CpGs,
      etc.) it is often of interest to investigate the intersecting genomic annotations. Such annotations
      include those relating to gene models (promoters, 5'UTRs, exons, introns, and 3'UTRs), CpGs (CpG
      islands, CpG shores, CpG shelves), or regulatory sequences such as enhancers. The package provides
      an easy way to summarize and visualize the intersection of genomic sites/regions with genomic annotations.
  apples:
    description: Analyses promoter sequences genome-wide to identify conserved non-coding elements via
      phylogenetic footprinting
    was: Set of tools to analyse promoter sequences on a genome-wide scale.
  aqua-hichip:
    description: Measures differential chromatin interactions from HiChIP data using absolute quantification
      of architecture
    was: 'Measurement of differential chromatin interactions with absolute quantification of architecture
      (AQuA-HiChIP).


      Bioinformatic tools (R scripts) for the analysis of Absolute Quantification of Architecture (AQuA-HiChIP)
      style data.


      Induced chromatin interactions anchored with protein contacts will be readily differentiated using
      AQuA-HiChIP, but with normalizing by total interactive paired-end tags (PETs), differential interaction
      frequencies may produce false positives or false negatives.'
  aracne:
    description: Reconstructs gene regulatory networks from microarray expression profiles using an information
      theoretic approach to eliminate indirect interactions
    was: ARACNE (Algorithm for the Reconstruction of Accurate Cellular Networks), a novel algorithm, using
      microarray expression profiles, specifically designed to scale up to the complexity of regulatory
      networks in mammalian cells, yet general enough to address a wider range of network deconvolution
      problems. This method uses an information theoretic approach to eliminate the vast majority of indirect
      interactions typically inferred by pairwise analysis.
  arboreto:
    description: Infers gene regulatory networks from gene expression data using gradient boosting and
      the GENIE3 architecture
    was: 'efficient and scalable inference of gene regulatory networks.


      Usage Example — arboreto 0.1.5 documentation.


      Free document hosting provided by Read the Docs.'
  archr:
    description: Processes and analyzes single-cell ATAC-seq data, including clustering, peak calling,
      trajectory identification, and multi-omic integration
    was: ArchR is a full-featured R package for processing and analyzing single-cell ATAC-seq data. ArchR
      provides the most extensive suite of scATAC-seq analysis tools of any software available. Maybe
      licensed under GPL>=2.
  arem:
    description: Aligns short reads from ChIP-seq data and calls peaks using an expectation-maximization
      algorithm that utilizes all reads, including those in repeat regions
    was: 'AREM: Aligning Short Reads from ChIP-sequencing by Expectation Maximisation'
  argo:
    description: Detects and visualizes sets of region-specific degenerate oligonucleotide motifs in regulatory
      regions of eukaryotic genes
    was: Tool for the detection and visualization of sets of region-specific degenerate oligonucleotide
      motifs in the regulatory regions of eukaryotic genes.
  aryana-bs:
    description: Aligns bisulfite sequencing reads by integrating DNA methylation patterns and genomic
      context to improve accuracy
    was: ARYANA-BS is a software tool for context-aware alignment of bisulfite sequencing reads. It improves
      alignment accuracy by integrating DNA methylation patterns and genomic context, outperforming existing
      methods like BSMAP and Bismark.
  asap:
    description: Searches for over-represented transcription factor binding sites in promoter sequences
      using position weight matrices and multiple statistical methods
    was: A framework for promoter analysis based on a fast search engine using enhanced suffix arrays.
      The framework includes several statistics for calculating over-representation of motifs in a set
      of promoters from co-regulated genes compared to a background set.
  asap-sml:
    description: Identifies distinguishing features in targeting antibody sequences compared to a reference
      set using statistical testing and machine learning
    was: Antibody Sequence Analysis Pipeline Using Statistical Testing and Machine Learning (ASAP-SML)
      is a pipeline to identify distinguishing features in targeting antibody set when compared to a reference
      non-targeting set. The pipeline first extracts germline, CDR canonical structure, isoelectric point
      and frequent positional motifs features from sequences and creates an antibody feature fingerprint.
      Machine-learning and statistical significance testing are applied to antibody sequences and feature
      fingerprints to identify distinguishing feature values and combinations thereof. When applied to
      an MMP-targeting set, ASAP identifies salient features and recommends features to use when designing
      novel MPP-targeting antibody sequences.
  ashic:
    description: Models allele-specific chromatin contacts and 3D structures from diploid Hi-C data using
      hierarchical Bayesian modeling
    was: A method for allele-specific modeling of diploid Hi-C data (chromatin contacts and structures)
      using hierarchical Bayesian modeling.
  asian:
    description: Infers regulatory networks from gene expression profiles using hierarchical clustering
      and graphical Gaussian modeling
    was: Server for inferring regulatory networks from gene expression profiles that combines cluster
      analysis, regression analysis, and graphical Gaussian modeling.
  asp-g:
    description: Finds attractors in Boolean network models of genetic regulatory networks using answer
      set programming
    was: An ASP-based method for finding attractors in genetic regulatory networks.
  asseq:
    description: Models total read count and allele-specific expression to map eQTLs from RNA-seq and
      ChIP-seq data
    was: Software of allele specific study of next generation sequencing data, with emphasis on RNA-seq
      and ChIP-seq data.
  aster:
    description: Estimates the number of cell types in single-cell chromatin accessibility data using
      ensemble learning
    was: A package for accurately estimating the number of cell types in single-cell chromatin accessibility
      data.
  asymmetron:
    description: Identifies strand asymmetry patterns in biological sequences, including consecutive genomic
      elements and pairs of overlapping or non-overlapping elements
    was: Asymmetron is a toolkit for the identifcation of asymmetry patterns in biological sequences.
      Asymmetron can identify strand asymmetries within consecutive occurrences of a single genomic element
      and for pairs of overlapping and non-overlapping genomic elements. It can also measure strand asymmetries
      of genomic elements relative to transcriptional and replicative orientations. Asymmetron can assign
      strand orientation to third features such as mutations, by orienting them relative to other genomic
      elements.
  atac-seq:
    description: Analyzes ATAC-seq data from pooled-cell and single-cell populations using a cloud-based
      interactive framework
    was: Cloud ATAC is an open-source, cloud-based interactive framework designed for the analysis of
      ATAC-seq data, particularly suited for both pooled-cell and single-cell populations. It offers a
      streamlined analysis workflow and leverages interactive tutorials and cloud resources to simplify
      the data processing for non-bioinformatic researchers.
  atacdb:
    description: Provides a comprehensive human chromatin accessibility database with tissue/cell type-specific
      annotations and TF footprint inference from ATAC-seq data
    was: A comprehensive human chromatin accessibility database with the aim of providing a large amount
      of publicly available resources on human chromatin accessibility data, and to annotate and illustrate
      potential roles in a tissue/cell type-specific manner.
  atacgraph:
    description: Profiles chromatin accessibility from ATAC-seq data, identifies nucleosome-free and nucleosome-occupied
      regions, and detects differentially accessible regions between two datasets
    was: ATACgraph is a simple and effective software for the analysis of ATAC-Seq data. It contains 12
      analyses to profile (epi)genome. ATACgraph utilizes peak BED files and BigWig files generated by
      callPeak module to compute peaks abundances between two samples.
  atacseqqc:
    description: Generates diagnostic plots and preprocesses aligned ATAC-seq data for quality assessment
      and subsequent peak calling
    was: an assay for Transposase-Accessible Chromatin using sequencing, is a rapid and sensitive method
      for chromatin accessibility analysis. It was developed as an alternative method to MNase-seq, FAIRE-seq
      and DNAse-seq.
  ataqv:
    description: Measures, visualizes, and compares quality control metrics from ATAC-seq data across
      samples and experiments
    was: A toolkit for measuring and comparing ATAC-seq results.
  atcoecis:
    description: Identifies coexpressed genes and cis-regulatory motifs or GO categories from gene expression
      data
    was: Identify coexpressed genes or gene coexpression neighborhoods associated with cis-regulatory
      motifs or GO categories.
  athamap:
    description: Generates a genome-wide map of putative transcription factor binding sites in Arabidopsis
      thaliana
    was: AthaMap is a genome-wide map of putative transcription factor binding sites in Arabidopsis thaliana
  atlas-modeling:
    description: Converts genome graphs and gene regulatory, interaction, and metabolic networks into
      dynamic rule-based models for PySB
    was: Atlas is a Python software that converts genome graphs and gene regulatory, interaction, and
      metabolic networks into dynamic models using rule-based languages.
  atmad:
    description: A public repository storing multi-omics associations (genome, transcriptome, methylome,
      pathway, phenotype) for Arabidopsis to facilitate eQTL, emQTL, GWAS, TWAS and EWAS identification
    was: a public repository for large-scale measurements of genome, transcriptome, methylome, pathway
      and phenotype associations in Arabidopsis, designed for facilitating identification of eQTL, emQTL,
      pathway-mQTL, pathway-phenotype, GWAS, TWAS and EWAS. AtMAD identifies candidate variants/methylations/genes
      for specific phenotypes or biological processes,and provides many associations that were previously
      unknown in exploring biological mechanisms.
  atsnp:
    description: Tests significance of transcription factor binding affinity changes caused by regulatory
      SNPs using importance sampling and a first-order Markov model
    was: Affinity Test for regulatory SNP detection package is a bioinformatics tool for computing and
      testing large-scale motif-SNP interactions.
  attune:
    description: Integrates gene expression and chromatin accessibility to infer regulatory mechanisms
      and predict gene expression from cross-modal data
    was: Attune offers a versatile framework for integrating gene expression and chromatin accessibility,
      enabling the inference of regulatory mechanisms and the prediction of gene expression from cross-modal
      data.
  aucell:
    description: Identifies cells with active gene sets in single-cell RNA-seq data using the Area Under
      the Curve
    was: Analysis of 'gene set' activity in single-cell RNA-seq data  allows to identify cells with active
      gene sets (e.g. signatures, gene modules...) in single-cell RNA-seq data. AUCell uses the "Area
      Under the Curve" (AUC) to calculate whether a critical subset of the input gene set is enriched
      within the expressed genes for each cell.
  augusta:
    description: Infers gene regulatory networks and Boolean networks from RNA-Seq expression data, refining
      predictions with transcription factor binding motifs and curated interactions
    was: Python package for inferring Gene Regulatory Networks (GRNs) and Boolean Networks (BNs) by processing
      high-throughput gene expression data (RNA-Seq).
  auto-drrafter:
    description: Builds RNA models into moderate-resolution cryo-EM density maps using a Rosetta-based
      method
    was: The Rosetta-based "auto-DRRAFTER" method builds RNA models into moderate-resolution RNA cryo-EM
      density as part of the Ribosolve pipeline.
  autophagynet:
    description: Provides over 280,000 experimentally verified interactions between core autophagy proteins
      and their regulators, with customizable downloads and Cytoscape integration
    was: High-resolution data source for the analysis of autophagy and its regulation.
  autorelacs:
    description: Automates generation and analysis of ultra-parallel ChIP-seq data using chromatin barcoding
    was: AutoRELACS is a Python script for automated generation and analysis of ultra-parallel ChIP-seq.
  bTSSfinder:
    description: Predicts promoters for five sigma factor classes in cyanobacteria and Escherichia coli
    was: Tool for the prediction of promoters in cyanobacteria and Escherichia coli.
  baalchip:
    description: Processes multiple ChIP-seq BAM files to detect allele-specific events using a Bayesian
      framework that accounts for copy number differences
    was: This package offers functions to process multiple ChIP-seq BAM files and detect allele-specific
      events. Computes allele counts at individual variants (SNPs/SNVs), implements extensive QC steps
      to remove problematic variants, and utilizes a bayesian framework to identify statistically significant
      allele-specific events. It is able to account for copy number differences between the two alleles,
      a known phenotypical feature of cancer samples.
  bac:
    description: Detects enriched regions from ChIP-chip experiments using a Bayesian hierarchical model
    was: This package uses a Bayesian hierarchical model to detect enriched regions from ChIP-chip experiments.
  bacpp:
    description: Predicts Gram-negative bacterial promoters and their sigma factor specificity from given
      sequences
    was: A web-based tool for Gram-negative bacterial promoter prediction.
  bamm:
    description: Discovers enriched motifs de novo in nucleotide sequences using higher-order Bayesian
      Markov Models
    was: 'de-novo motif discovery and regulatory sequence analysis.

      Discovery of regulatory motifs with higher-order Bayesian Markov Models (BaMMs)'
  bamscale:
    description: Quantifies and normalizes coverage of peaks from BAM files and generates scaled BigWig
      tracks for sequencing data
    was: BAMscale is a one-step tool for either 1) quantifying and normalizing the coverage of peaks or
      2) generated scaled BigWig files for easy visualization of commonly used DNA-seq capture based methods.
  bardic:
    description: Calls peaks from RNA-DNA interaction data using a binomial model that accounts for chromatin
      heterogeneity and distance-dependent decay
    was: Robust peak calling for RNA-DNA interaction data.
  bart:
    description: Predicts functional transcription factors from query gene sets or epigenomic profiles
      using existing ChIP-seq data
    was: Transcription factor prediction tool with query gene sets or epigenomic profiles.
  bart-cancer:
    description: Displays putative transcriptional regulators responsible for differentially regulated
      genes in 15 cancer types from TCGA
    was: BART Cancer Database is a web resource designed to display putative transcriptional regulators
      (TRs) that are responsible for up and downregulation of genes in 15 different cancer types in The
      Cancer Genome Atlas. BART Cancer uses BART (Binding Analysis for Regulation of Transcription) to
      make the prediction.
  bart3d:
    description: Infers transcriptional regulators associated with differential chromatin interactions
      from Hi-C data using public ChIP-seq data
    was: BART3D is a computational method for inferring transcriptional regulators (TRs) associated with
      genome-wide differential chromatin interactions (DCIs) detected by comparing two Hi-C maps. And
      Inferring transcriptional regulators associated with differential chromatin interactions from Hi-C
      data.
  bartweb:
    description: Predicts transcription factors and chromatin regulators binding at cis-regulatory regions
      from a gene list or ChIP-seq data in human or mouse
    was: This web server is to perform Binding Analysis for Regulation of Transcription (BART) is a bioinformatics
      tool for predicting functional factors (including transcription factors and chromatin regulators)
      that bind at cis-regulatory regions to regulate gene expression in human or mouse, taking a query
      gene list or a ChIP-seq dataset as input.
  basicstarrseq:
    description: Basic peak calling on STARR-seq data
    was: Basic peak calling on STARR-seq data.
  bayesmd:
    description: Discovers sequence motifs from various biological data using a flexible Bayesian model
      with modular motif, background and alignment components
    was: Flexible, fully Bayesian model for motif discovery consisting of motif, background and alignment
      modules. It can be customized to different kind of biological applications, e.g. microarray, ChIP-chip,
      ditag, CAGE data analysis by integrating appropriately chosen features and functionalities.
  bayespeak:
    description: Calls peaks from ChIP-seq data using a fully Bayesian hidden Ising model
    was: This package is an implementation of the BayesPeak algorithm for peak-calling in ChIP-seq data.
  bayespi:
    description: Estimates transcription factor binding energy matrices and binding affinities from ChIP-chip
      data using Bayesian model regularization
    was: BayesPI is a biophysical model for studying protein-DNA interaction. Using Bayesian model regularization
      with biophysical modeling to study protein-DNA interaction.
  bcrank:
    description: Predicts transcription factor binding consensus from DNA sequences by heuristic search
    was: Functions and classes for de novo prediction of transcription factor binding consensus by heuristic
      search.
  bddb:
    description: Integrates multi-omics data and biomarkers for 22 birth-defect diseases with search,
      browse, and download functions
    was: BDdb is a comprehensive database associated with birth-defect-related diseases. It consists of
      multi-omics datasets involving tens of common birth-defect diseases, and BDdb supplements more than
      2000 biomarkers belonging to 22 types of birth defects.
  bdetools:
    description: Numerically solves Boolean delay equation models of biological networks
    was: A MATLAB Package for Boolean Delay Equation Modeling.
  beaconlab_pscan:
    description: Scans sequences from co-regulated genes with transcription factor motifs to identify
      over- or under-represented binding sites
    was: Software tool that scans a set of sequences (e.g. promoters) from co-regulated or co-expressed
      genes with motifs describing the binding specificity of known transcription factors and assesses
      which motifs are significantly over- or under-represented, providing thus hints on which transcription
      factors could be common regulators of the genes studied, together with the location of their candidate
      binding sites in the sequences
  beads:
    description: Normalizes ChIP-seq data from Illumina by correcting for GC content, mappability, and
      regional biases
    was: ChIP-seq data normalization for Illumina
  bearr:
    description: Identifies transcription factor binding sites in cis-regulatory regions from lists of
      gene identifiers and consensus patterns
    was: Takes a list of gene identifiers (such as RefSeq and Unigene IDs), consensus patterns, and (optionally)
      a position weight matrix as input and returns a list of matches for the patterns in both the sense
      and anti-sense strands of the relevant genomic sequence.  The user specifies what distance up and
      downstream from both the transcription start site and the 3' terminus to look for the patterns.
  bedtoolsr:
    description: Wraps bedtools functions for use within R, accepting file paths or R objects as input
      and output
    was: BedtoolsR is an R package that provides a convenient wrapper for bedtools functions allowing
      for the documentation and use of them from within the R programming environment, using standard
      R data types. It uses the version of bedtools installed on your system, rather than its own version,
      such that you should be able to use it interchangeably from the command line or within R. It also
      includes additional functionality including the ability to provide either file paths or R objects
      as inputs and outputs. Bedtoolsr automatically detects the format of the input/output and handles
      it accordingly.
  belt:
    description: Calls peaks from ChIP-seq data using a bin-based enrichment threshold
    was: BELT (Bin-based Enrichment Level Threshold) is a ChIP-seq peak calling tool. This is the engine
      used in our published web application W-ChIPeaks, meant to be used as a command-line application.
      Although it does not include all of the features of W-ChIPeaks (such as archive support and target
      FDR) as some of these are implemented by the Web-based framework, it is nonetheless a full-fledged
      standalone peakcalling utility.
  bert-promoter:
    description: Predicts DNA promoters from sequences using a BERT pre-trained model with SHAP feature
      selection
    was: An improved sequence-based predictor of DNA promoter using BERT pre-trained model and SHAP feature
      selection.
  betavaeimputation:
    description: Imputes missing values in transcriptome and methylome data using a variational autoencoder
    was: A deep learning framework based on the variational autoencoder (VAE) to impute missing values
      in transcriptome and methylome data analysis.
  biasaway:
    description: Generates nucleotide composition-matched DNA background sequences using six approaches
      for motif enrichment analysis
    was: BiasAway is a command-line and web server to generate nucleotide composition-matched DNA background
      sequences. The BiasAway tool provides users with six approaches to generate synthetic or genomic
      background sequences matching mono- and Dinucleotide composition of user-provided foreground sequences.
  bicorn:
    description: Infers context-specific cis-regulatory modules from transcription factor binding and
      gene expression data using a hierarchical Bayesian model
    was: BICORN (Bayesian Inference of Cooperative Regulatory Network) builds a hierarchical Bayesian
      model and infers context-specific cis-regulatory modules based on transcription factor-gene binding
      events and gene expression data for a particular cell type. BICORN automatically searches for a
      list of candidate CRMs based on the input transcription factor bindings at regulatory regions associated
      with genes of interest. Applying Gibbs sampling, BICORN iteratively estimates model parameters of
      CRMs, transcription factor activities, and corresponding regulation on gene transcription, which
      it models as a sparse network of functional cis-regulatory modules regulating target genes.
  bidchips:
    description: Quantifies and removes multiple biases from ChIP-seq signals using regression models
      built from ENCODE datasets
    was: Software for quantifying and Removing Biases in ChIP-Seq Signals.
  bifet:
    description: Identifies transcription factors with over-represented footprints in target versus background
      regions, correcting for read count and GC content biases
    was: Bias-free Footprint Enrichment Test identifies TFs whose footprints are over-represented in target
      regions compared to background regions after correcting for the bias arising from the imbalance
      in read counts and GC contents between the target and background regions.
  bij:
    description: Provides genomic data on seed development and identifies lncRNAs from transcriptome data
      in Brassica juncea
    was: The BIJ Database is a resource for Brassica juncea seed omics data, providing genomic data on
      seed development across contrasting genotypes. It leverages computational analysis of transcriptome
      data to identify and characterize long non-coding RNAs (lncRNAs) and related regulatory networks.
  bimm_sc:
    description: Discovers hub genes from scRNA-seq and proteomics data using multiscale modeling
    was: A novel Bioinformatic Inference and Multiscale Modeling (BIMM) method that can  discovers hub
      genes of TGFβ, MYC, and SMAD3 varied underlie DEX treatment
  bindingsitefinder:
    description: Extracts reproducible binding sites from plant iCLIP2 data with functions for definition
      and visualization
    was: BindingSiteFinder is an R/Bioconductor package used to extract reproducible binding sites from
      iCLIP data, specifically designed for plant iCLIP2 workflows. It provides functions for binding
      site definition and result visualization.
  bindsc:
    description: Integrates unpaired single-cell multi-omic data across modalities using bi-order canonical
      correlation analysis
    was: bindSC (Bi-order INtegration of multi-omics Data from Single Cell sequencing technologies) is
      an R package for single cell multi-omic integration analysis. bindSC is developed to address the
      challenge of single-cell multi-omic data integration that consists of unpaired cells measured with
      unmatched features across modalities. Previous methods such as Seurat, Liger, Harmony did not work
      on this case unless match feature empricallcy. For example, integration of scRNA-seq and scATAC-seq
      data requires to calculate the gene/promoter activity by counting peaks in gene body, which always
      loses information. This strategy also did not work on integrating scRNA-seq and cytof data becasue
      gene expression and protein abundance level is not always correlated due to sparsity of scRNA-seq
      data or post translational modification.
  binquasi:
    description: Detects peaks from ChIP-seq data with biological replicates using a quasi-likelihood
      ratio test
    was: Peak detection method for ChIP-sequencing data with biological replicates.
  biobike:
    description: Web-based environment that lets biologists with little programming expertise combine
      tools, data, and knowledge via a graphical programming interface
    was: 'Web-based environment enabling biologists with little programming expertise to combine tools,
      data and knowledge in novel and complex ways. It is composed of three components: a biological knowledge
      base, a graphical programming interface and an extensible set of tools. Users may also invent their
      own tools.'
  biologicalnetworks:
    description: Retrieves, constructs, and visualizes biological networks while mapping high-throughput
      expression data onto network graphs
    was: Allows retrieval, construction, and visualization of biological networks and allows for the analysis
      of high-throughput expression data by mapping onto network graphs. It queries the PathSys system,
      a combined database of biological pathways, gene regulatory networks, and protein interaction maps.
  biolqm:
    description: Provides a standard format and infrastructure for exchanging qualitative models of biological
      networks
    was: A model representation format and infrastructure to foster interactions between qualitative modelling
      formalisms and tools
  biomaster:
    description: Integrates and provides comprehensive information about BioBrick parts from multiple
      databases
    was: BioMaster is an integrated database and analytic platform to provide comprehensive information
      about BioBrick parts.
  bionero:
    description: Reconstructs biological networks from expression data with preprocessing, inference,
      and functional analyses
    was: BioNERO is an all-in-one R/Bioconductor package for comprehensive and easy biological network
      reconstruction. BioNERO aims to integrate all aspects of biological network inference in a single
      package, including data preprocessing, exploratory analyses, network inference, and analyses for
      biological interpretations.
  bioprospector:
    description: Scans upstream regions of co-expressed genes for regulatory motifs using a Gibbs sampling
      strategy with a Markov background model
    was: Server which scans upstream of genes in the same gene expression cluster for regulatory sequence
      motifs using a Gibbs sampling strategy.  The Markov background model is used for non-motif bases,
      improving specificity of predicted motif locations.
  bioswitch-grn:
    description: Converts static BioPAX gene regulatory networks into executable GINML logical networks
      to predict cellular behaviour
    was: BioSWITCH iis a command-line program using the BioPAX standardised language to “switch on” static
      regulatory networks so that they can be executed in GINML to predict cellular behaviour. Using a
      previously published haematopoiesis gene network, we show that BioSWITCH successfully and faithfully
      automates the network de-coding and re-coding into an executable logical network. BioSWITCH also
      supports the integration of a BioPAX model into an existing GINML graph.
  biotip:
    description: Identifies critical transition signals from single-cell transcriptomes to infer lineage-determining
      transcription factors
    was: 'BioTIP: an R-package for Characterization of Biological Tipping Points.'
  biotranslator:
    description: Performs semantic interpretation of genomic data via pathway analysis and gene prioritization
    was: "BioTranslator performs semantic interpretation of genomic data, using pathway analysis and gene\
      \ prioritization approaches\n\nThe tool is available at: \nhttp://www.biotranslator.gr:8080/\nhttp://motherbox.chemeng.ntua.gr/anastasia_dev/"
  biovizseq:
    description: Visualizes the types and distribution of elements within biological sequences from GFF/GTF,
      MEME, and Plantcare data
    was: BioVizSeq is an R package designed for visualizing the types and distribution of elements within
      bio-sequences, offering flexibility and user-friendly visualization capabilities. It includes a
      novel geom layer (geom_rrect()) and supports various data formats like GFF/GTF, MEME, and Plantcare.
  biovlab-cancer-pharmacogenomics:
    description: Analyzes multi-omics breast cancer data for intratumor heterogeneity and matches tumor
      gene expression to cell lines using DNA methylation profiles on Amazon Web Services
    was: A system to analyze multi-omics cancer tissue intratumor heterogeneity and connect to cancer
      cell lines on user's Amazon cloud computing environment.
  biovnn:
    description: Predicts cancer dependencies using pathway knowledge with an interpretable visible neural
      network
    was: Biological visible neural network (BioVNN) is a tool  to predict cancer dependencies using pathway
      knowledge.
  biq_analyzer:
    description: Visualizes and quality-controls DNA methylation data from bisulfite sequencing with automated
      warnings for critical sequences
    was: BiQ Analyzer is a software tool for visualization and quality control of DNA methylation data
      from bisulfite sequencing.
  birgrn:
    description: Infers gene regulatory networks from time-series scRNA-seq data using a bidirectional
      recurrent neural network
    was: A computational method BiRGRN to infer GRNs from time-series scRNA-seq data.
  bisa:
    description: Archives transcription factor binding sites and histone modifications, then identifies
      overlaps and proximity between genomic regions
    was: Binding sites analyser is a database driven software and stores all of its data in a relational
      database management system (RDBMS) such as SQL Server in Windows or PostgreSQL on Linux.
  bismark:
    description: Maps bisulfite-treated sequencing reads and performs methylation calling in CpG, CHG
      and CHH contexts
    was: Bismark is a tool to map bisulfite treated sequencing reads and perform methylation calling in
      a quick and easy-to-use fashion.
  bit:
    description: Identifies transcriptional regulators from epigenomic profiling data using a Bayesian
      hierarchical model with ChIP-seq binding library
    was: BIT is a Bayesian hierarchical model for in-silico identification of transcriptional regulators
      (TRs) leveraging ChIP-seq data to assess consistency between user-provided epigenomic profiling
      data and a TR binding library. It offers a fully integrated Bayesian approach to quantify uncertainty
      and identifies perturbed TRs in perturbation experiments.
  blamm:
    description: Finds position weight matrix occurrences in DNA sequences using a BLAS-accelerated algorithm
      on CPUs and GPUs
    was: BLAS Accelerated Motif Matching or blamm is a tool to find Position Weight Matrix (PWM) occurrences
      in DNA sequences.
  blsspeller:
    description: Exhaustively enumerates putative cis-regulatory motifs from promoter sequences of related
      species using alignment-free or alignment-based conservation scoring
    was: Exhaustive comparative discovery of conserved cis-regulatory elements.
  bmf:
    description: Finds multivalent sequence motifs and their distance dependency in RNA or DNA sequences
      using a thermodynamic model
    was: Bipartite Motif Finder (BMF) is a tool for finding multivalent sequence motifs and their distance
      dependency in RNA (or DNA) sequences.
  bml:
    description: Discovers and analyzes sequence motifs from high-throughput sequencing data using position
      weight matrix and dinucleotide weight matrix
    was: Web server for bipartite motif discovery.
  bobro:
    description: Predicts cis-regulatory motifs from promoter sequences using a model-based background
    was: BOTTLENECK BROKEN TOOL is a software  for prediction of cis-regulatory motifs in a given set
      of promoter sequences.
  bom:
    description: Predicts cell-type-specific enhancers from distal cis-regulatory elements using transcription
      factor motif counts and gradient-boosted trees
    was: BOM is a computational framework that predicts cell-type-specific enhancers by representing distal
      cis-regulatory elements as counts of transcription factor motifs. It combines this minimalist representation
      with gradient-boosted trees to achieve accurate predictions across diverse species.
  boolnet:
    description: Reconstructs and analyzes synchronous, asynchronous, probabilistic and temporal Boolean
      networks from time series data
    was: Provides methods to reconstruct and generate synchronous, asynchronous, probabilistic and temporal
      Boolean networks, and to analyze and visualize attractors in Boolean networks.
  boostdiff:
    description: Infers differential gene regulatory networks between two conditions using boosted differential
      regression trees
    was: Inference of differential gene regulatory networks using boosted differential trees.
  boxshade:
    description: Creates printouts from multiple-aligned protein or DNA sequences
    was: Program for creating printouts from multiple-aligned protein or DNA sequences.
  bpac:
    description: Predicts transcription factor binding sites from chromatin accessibility data using a
      universal random forest model
    was: Predict of transcription factor binding sites based on chromatin accessibility.
  bphunter:
    description: Detects human intronic branchpoint-disrupting variants genome-wide using a comprehensive
      BP database
    was: Genome-wide detection of human variants that disrupt intronic branchpoints.
  branenet:
    description: Embeds graph-based information from multi-omics data in a lower-dimensional space using
      random walks and matrix factorization
    was: BRANEnet is  a novel multi-omics integration framework for multilayer heterogeneous networks.
      In particular, it embeds graph-based information from multi-omics data in a lower-dimensional space.
  brat:
    description: Maps bisulfite-converted short reads from the Illumina Genome Analyzer, supporting single
      and paired ends
    was: accurate and efficient tool for mapping short reads obtained from the Illumina Genome Analyzer
      following sodium bisulfite conversion.  Both single and paired ends are supported.
  brio:
    description: Searches known sequence and structure protein-binding motifs in RNA molecules using over
      2500 motifs from human and mouse
    was: BRIO (BEAM RNA Interaction mOtifs) is a web server designed for searching known sequence and
      structure protein binding motifs in RNA molecules of interest.
  broadpeak:
    description: Identifies broad peaks from diffuse ChIP-seq datasets using a linear time algorithm
    was: Algorithm for the identification of broad peaks from diffuse ChIP-seq datasets.
  brockman:
    description: Converts genomics data into DNA k-mer words for chromatin marks and analyzes k-mer sets
      to identify variation in transcription factor activity across single-cell samples
    was: It converts genomics data into DNA k-mer words representing the regions associated with a chromatin
      mark, and then analyzing these k-mer sets to see how samples differ from each other. This approach
      is primarily intended for single cell genomics data, and was tested most extensively on single cell
      ATAC-seq data. The bash scripts in particular may require some alteration for other types of genomics
      data.
  bs_seeker:
    description: Maps bisulfite-treated reads to a reference genome using a three-letter alphabet and
      Bowtie
    was: Mapping tool for bisulfite treated reads.
  bscm2tdb:
    description: Relational database cataloguing genome-wide DNA methylation and gene expression profiles
      from water buffalo with subclinical mastitis
    was: Buffalo Subclinical Mastitis Methylome–Transcriptome database (BSCM2TDb) is a three-tier architecture-based
      relational database in Water Buffalo.
  bsdb:
    description: Provides mechanostability data from simulated stretching of proteins, including force
      peaks and mechanical clamp types
    was: Provides information about mechanostability of proteins. Its core is based on simulations of
      stretching of proteins within a structure-based model. The primary information is about the heights
      of the maximal force peaks, the force-displacement patterns, and the sequencing of the contact-rupturing
      events. Information on the possible types of the mechanical clamps (the motifs which are responsible
      for a protein's resistance to stretching) are also given.
  bsdd:
    description: Searches for user-defined sequence motifs in known protein structures and displays them
      using RASMOL visualization
    was: BSDD (Biomolecules Segment Display Device) searches for and displays user defined sequence motifs
      in known protein structures.  This web based tool incorporates the graphics package of RASMOL for
      visualization.
  bta7:
    description: Curates cattle QTL and association data from published literature to facilitate gene
      discovery for production traits
    was: The Cattle Quantitative Trait Locus (QTL) Database (Cattle QTLdb) curates cattle QTL and association
      data from published literature to facilitate gene discovery related to important cattle production
      traits. The database contains data from 1,225 publications, lifted to build Btau5.0.
  bubble_gum:
    description: Automatically extracts phenotype molecular signatures from transcriptomic data and performs
      multiple GSEA runs with correction
    was: Computational tool that allows to automatically extract phenotype signatures based on transcriptomic
      data and to perform easily multiple GSEA runs in a row.
  bwtool:
    description: Manipulates and analyzes bigWig files for genome-wide signal data
    was: Command-line utility for bigWig files. BigWig files are a compressed, indexed, binary format
      for genome-wide signal data for calculations (e.g. GC percent) or experiments (e.g. ChIP-seq/RNA-seq
      read depth).
  cLoops:
    description: Calls loops from ChIA-PET, Hi-C, HiChIP and Trac-looping data using a clustering algorithm
      and permuted local background
    was: 'Accurate loop calling for 3D genomic data with cLoops | Accurate and flexible loops calling
      tool for 3D genomic data | cLoops: loop-calling for ChIA-PET, Hi-C, HiChIP and Trac-looping | Chromosome
      conformation capture (3C) derived high-throughput sequencing methods such as ChIA-PET,HiChIP and
      Hi-C provide genome-wide view of chromatin organization. Fine scale loops formed by interactions
      of regulatory elements spanning hundreds kilobases can be detected from these data. Here we introduce
      cLoops (''see loops''),a common loops calling tool for ChIA-PET, HiChIP and high-resolution Hi-C
      data. Paired-end tags (PETs) are first classified as self-ligation and inter-ligation clusters using
      an optimized unsupervisied clustering algorithm. The significances of the inter-ligation clusters
      are then estimated using permutated local background'
  cRegulome:
    description: Accesses, manages, and visualizes microRNA and transcription factor-gene expression correlations
      from cancer databases
    was: R package for accessing microRNA and transcription factor-gene expression correlations in cancer.
  cabean:
    description: Identifies efficacious node perturbations to drive asynchronous Boolean networks from
      source to target attractors for direct cell reprogramming
    was: CABEAN is a Software Tool for the Control of Asynchronous Boolean Networks. Combining the two
      categories, there are six different control strategies. CABEAN provides the following methods to
      solve the six source-target control problems:.
  cabernet:
    description: Generates, simulates, and analyzes augmented Boolean models of gene regulatory networks
      to investigate their robustness
    was: A Cytoscape 3.2.0 app for the generation, the simulation, the analysis and the visualization
      of Boolean models of gene regulatory networks, particularly focused on the investigation of their
      robustness.
  cagefightr:
    description: Performs a wide range of CAGE data analysis tasks including TSS and enhancer identification,
      annotation, and quantification
    was: 'It is an R/Bioconductor package for performing a wide range of common CAGE data analysis tasks.
      Core functionality includes: import of CAGE TSSs (CTSSs), tag (or unidirectional) clustering for
      TSS identification, bidirectional clustering for enhancer identification, annotation with transcript
      and gene models, calculation of TSS shapes and quantification of CAGE expression as expression matrices.'
  cager:
    description: Preprocesses CAGE sequencing data, identifies and normalizes transcription start sites,
      and analyzes TSS clusters
    was: Preprocessing of CAGE sequencing data, identification and normalization of transcription start
      sites and downstream analysis of transcription start sites clusters (promoters).
  cagexplorer:
    description: Detects and visualizes changes in transcription start site usage from CAGE data across
      multiple samples
    was: R package that facilitates the detection and visualization of changes in the relative transcription
      from promoter regions in multi-promoter genes, all in the context of overall gene expression. Multiple
      samples can be compared simultaneously.
  cainet:
    description: Simulates gene regulatory networks including stochastic molecular kinetics using a modular
      synchronization approach
    was: Stochastic simulation tool for gene regulatory networks
  camregbase:
    description: Provides gene expression, co-expression, transcription factors, lipid-associated genes,
      and orthologs for Camelina sativa
    was: The Camelina Gene Expression Database (CamRegBase) is a one-stop resource to access Camelina
      information on gene expression and co-expression, transcription factors, lipid associated genes
      and genome-wide orthologs in the close-relative reference plant Arabidopsis.
  canasm:
    description: Catalogs allele-specific DNA methylation sites identified from bisulfite sequencing data
      across 31 cancer types with regulatory annotations
    was: CanASM is a database providing comprehensive allele-specific DNA methylation identification and
      annotation specifically for cancer. It catalogs ASM sites identified from bisulfite sequencing data
      across 31 cancer types and includes extensive regulatory annotations.
  cancer_crc:
    description: Integrates ATAC-seq and H3K27ac ChIP-seq data to identify and analyze core transcriptional
      regulatory circuits in cancer cell lines
    was: CancerCRCdb is a comprehensive database of human core regulatory circuitry.
  cancercontextualized:
    description: Infers sample-specific gene regulatory networks for tumors using phenotypic, molecular,
      and environmental contexts
    was: Cancer Contextualized is a tool for inferring sample-specific transcriptional networks for tumors
      using contextualized learning. It leverages phenotypic, molecular, and environmental information
      to improve accuracy and generalize to unseen cancer types, utilizing a Python package and interactive
      plotting tools.
  canmethdb:
    description: A database annotating CpG methylation with cis-regulatory elements and transcription
      factor binding sites across 33 cancer types
    was: A database for genome-wide DNA methylation annotation in cancers.
  cantata:
    description: Finds missing interactions in Boolean networks by adapting prior network knowledge to
      match experimental results using genetic programming
    was: 'CANTATA is an approach to find missing interactions in Boolean networks using prior network
      knowledge and experimental results.

      Using genetic programming the prior network is adapted to match the desired behavior as specified
      in the experimental results.'
  capC-MAP:
    description: Analyses Capture-C data to probe genome-wide chromatin interactions from target genomic
      locations
    was: Software package for the analysis of Capture-C data.
  capsnh_kcr:
    description: Predicts lysine crotonylation sites in human non-histone proteins using a capsule network-based
      model
    was: Capsule network-based prediction of lysine crotonylation sites in human non-histone proteins.
  cardiopy:
    description: Detects R-peaks and performs heart rate variability analysis on single-lead EKG data
      using adaptive thresholding and manual artifact removal
    was: CardioPy is an open-source heart rate variability toolkit for single-lead EKG. A flexibile package
      for R-peak detection and heart rate variability analysis of single-lead EKG data.
  carmen-variant:
    description: Identifies functional noncoding expression-modulating variants from GWAS and eQTL data
    was: 'Computational Assessment of the Regulation-Modulating Potential for Noncoding Variants.

      Large-scale genome-wide association and expression quantitative trait loci studies have identified
      multiple noncoding variants associated with genetic diseases via affecting gene expression.'
  carrie:
    description: Infers transcriptional regulatory networks from microarray and promoter sequence data
      associated with a stimulus response
    was: Server which analyzes microarray and promoter sequence data associated with a response to a specific
      stimulus.  After analysis a potential transcriptional regulatory network is created.  CARRIE also
      determines which transcription factors were likely involved in regulation and which genes they regulated.
  casava:
    description: Predicts disease category-specific risk for non-coding variants using an ensemble learning
      framework trained on GWAS data and genomic features
    was: CASAVA provides a comprehensive annotation of disease risk in 24 disease categories for any non-coding
      variant in the genome.
  casilico:
    description: Designs CRISPR RNAs for Cas12, Cas13, and Cas14 systems with off-target analysis from
      user-input sequences
    was: A versatile CRISPR package for in silico CRISPR RNA designing for Cas12, Cas13, and Cas14.
  casowary:
    description: Predicts sgRNA efficacy for CRISPR Cas13 transcript targeting using a decision tree model
      with sequence and target availability features
    was: CASowary is a command line machine learning tool written in Python 3.6.8 for predicting the efficacy
      of sgRNAs for CRISPR Cas13 and other transcript targeting systems.
  cassys:
    description: Performs the complete ChIP-seq analysis workflow from quality control and read mapping
      to peak detection and follow-up analyses
    was: An integrated system that supports all steps of computational ChIP-seq data analysis and supersedes
      the laborious application of several single command line tools. It provides functionality ranging
      from quality assessment and -control of short reads, over the mapping of reads against a reference
      genome (readmapping) and the detection of enriched regions (peakdetection) to various follow-up
      analyses.
  castnet:
    description: Simulates genome evolution with coevolving sequences and regulatory interactions
    was: Systems-level sequence evolution simulator.
  cat_e:
    description: Integrates molecular datasets from key databases to perform multi-omics analyses for
      cancer target evaluation
    was: A comprehensive web tool for exploring cancer targeting strategies.
  cata:
    description: Annotates chromatin accessible regions in cancer with SNPs, transcription factors, and
      clinical data from ATAC-seq samples
    was: CATA (The chromatin accessibility of cancer database) is a comprehensive Cancer ATAC-seq database
      that aim to provided a large number of available resources on cancer ATAC-seq datas. The database
      was annotated with potential functions of ATAC-Peak in the cancer.
  catch:
    description: Clusters and aligns ChIP profiling data to detect spatial and combinatorial binding patterns
    was: A tool for exploring patterns in ChIP profiling data.
  causaldag:
    description: Creates, manipulates, and learns causal DAGs for gene regulatory network analysis
    was: CausalDAG is a Python package for the creation, manipulation, and learning of Causal DAGs.
  causalr:
    description: Predicts regulators and reconstructs regulatory networks from high-dimensional data using
      causal reasoning on biological networks
    was: Causal reasoning methods for biological networks, to enable regulator prediction and reconstruction
      of regulatory networks from high dimensional data.
  cbnplot:
    description: Infers Bayesian networks from gene expression data using enrichment analysis results
    was: 'CBNplot: Bayesian network plot for the enrichment analysis results.'
  ccat:
    description: Estimates noise rate from a control library to identify weak ChIP-enriched sites in ChIP-seq
      data
    was: Analysis of ChIP-seq data with negative control.
  ccip:
    description: Predicts CTCF-mediated chromatin loops using a two-stage random-forest method that leverages
      transitivity information
    was: CCIP is a machine learning method for predicting CTCF-mediated chromatin loops with transitivity.
  ccnetviz:
    description: Visualizes large network graphs with WebGL, supporting custom styling, force-directed
      layout, and dynamic changes
    was: ccNetViz is a lightweight, high-performance JavaScript library for large network graphs visualization
      using WebGL. It enables custom styling of nodes and edges in CSS like way, curve edges, dynamic
      changes of the network, force-directed layout and basic graph interactivity.
  cdbprom:
    description: A directory of in-silico predicted bacterial promoter sequences from over 6000 genomes
      using XGBoost classifiers
    was: A comprehensive directory of bacterial promoters.
  ceas:
    description: Characterizes genome-wide protein-DNA interaction patterns from ChIP-chip and ChIP-Seq
      data by providing summary statistics on ChIP enrichment in genomic regions and inferring regulated
      genes
    was: Cis-regulatory Element Annotation System (CEAS) is a resource for ChIP-chip analyses that retrieves
      repeat-masked genomic sequences, calculates GC content, plots evolutionary conservation, maps nearby
      genes, and identifies enriched transcription factor binding (TFBS) motifs.
  cell2location:
    description: Infers cell type abundances from spatial transcriptomics data, and generalizes to spatial
      chromatin accessibility data
    was: Cell2location is a software tool for spatial transcriptomics deconvolution, enabling the inference
      of cell type abundances within spatial data. It has been shown to generalize well to chromatin accessibility
      data, as demonstrated in a recent publication.
  cellcano:
    description: Identifies cell types from single-cell ATAC-seq data using a two-round supervised learning
      algorithm
    was: Supervised cell type identification for single-cell ATAC-seq data.
  cellcraft:
    description: Infers gene regulatory networks from single-cell RNA-seq data via a visual programming
      interface that integrates multiple reconstruction tools
    was: CellCraft is a web-based application designed to streamline gene regulatory network inference
      from single-cell RNA sequencing data. It integrates multiple GRN reconstruction tools and offers
      a visual programming interface for accessible and interpretable computational experiments.
  cellnetanalyzer:
    description: Analyzes structure and function of metabolic, signaling, and regulatory networks using
      stoichiometric modeling and logical network approaches
    was: "CellNetAnalyzer (CNA) is a MATLAB toolbox providing various computational methods for analyzing\
      \ structure and function of metabolic, signaling, and regulatory networks. \n\nMetabolic networks\
      \ can be analyzed by means of stoichiometric and constraint-based modeling techniques while signal\
      \ transduction and (gene) regulatory networks can be represented and analyzed as logical networks\
      \ (Boolean or multivalued logic) or as interaction graphs. Computations can be started within a\
      \ GUI (interactive network maps) or from command line (via API functions)."
  cellregulon:
    description: An atlas of transcription factor-driven gene programs across human cells from single-cell
      data, linking disease signatures and enhancer-gene regulatory networks
    was: CellRegulonDB is an atlas of transcription factor-driven gene programs across human cells, based
      on single-cell data from the Human Cell Atlas. It provides researchers with a resource to understand
      gene regulation, link disease signatures, and explore enhancer-gene regulatory networks.
  cellrouter:
    description: Infers stem cell fate decisions from single-cell trajectory data
    was: 'Trajectory Algorithms to Infer Stem Cell Fate Decisions.


      New version available! Please, check our updated tutorial. Updates include:.


      Raw count/UMI data can be provided as input.


      Perform quality control on genes and cells.'
  celltics:
    description: Identifies cell types from single-cell RNA-seq data using an explainable neural network
      that prioritizes marker genes and biological pathways
    was: Explainable neural network for cell-type identification and interpretation based on single-cell
      RNA-seq data.
  cellwalker:
    description: Integrates single-cell and bulk data to resolve regulatory elements across cell types
      in complex tissues
    was: CellWalker is a tool that integrates single-cell and bulk data to resolve regulatory elements
      across cell types in complex tissues.
  cellwalkr:
    description: Integrates single-cell and bulk epigenetic data using a network-based random walk model
      to label cell types and regulatory regions
    was: CellWalkR is an R Package for integrating single-cell and bulk data to resolve regulatory elements.
  cemig:
    description: Predicts cis-regulatory motifs from ATAC-seq data using de Bruijn and Hamming distance
      graph paradigms
    was: Prediction of the cis-regulatory motif using the de Bruijn graph from ATAC-seq.
  cenhancer:
    description: Curates H3K27ac ChIP-seq data from primary tissues and cell lines to identify typical
      enhancers, super-enhancers, and enriched transcription factors across cancer types
    was: Comprehensive cancer enhancer database for primary tissues and cell lines.
  centdist:
    description: Ranks co-transcription factor motifs based on their distribution around ChIP-seq peaks
      without user-specified parameters
    was: Co-motif scanning program to identify co-transcription factors. It ranks co-transcription factors
      based on their distribution around CHIP-seq peaks.
  centre:
    description: Predicts cell-type-specific enhancer-target interactions using gene expression and ChIP-seq
      data for three histone modifications via gradient boosting
    was: A gradient boosting algorithm for cell-type-specific enhancer-target prediction.
  cermit:
    description: Identifies sequence motifs from large sets of sequences using rank-order statistics and
      quantitative evidence
    was: Fast sequence motif identification algorithm that utilizes suffix arrays to efficiently find
      optimal motifs in large sequence sets (such as tens of thousands of sequences identified by chromatin
      or RNA immunopreciptation experiments). It uses rank-order statistics and accounts for quantitative
      information for each sequence.
  cernaseek:
    description: Identifies and analyzes ceRNA-ceRNA interactions by integrating multiple-omics data with
      six computational methods
    was: CeRNASeek is an R package for identification and analysis of ceRNA regulation. It årovides several
      functions to identify and analyse miRNA sponge, including popular methods for identifying miRNA
      sponge interactions, two types of global ceRNA regulation prediction methods and four types of context-specific
      prediction methods, which are based on miRNA-messenger RNA regulation alone, or by integrating heterogeneous
      data, respectively. In addition, For predictive ceRNA relationship pairs, this package provides
      several downstream analysis algorithms, including regulatory network analysis and functional annotation
      analysis, as well as survival prognosis analysis based on expression of ceRNA ternary pair.
  cetf:
    description: Identifies transcription factors regulating co-expression networks from microarray, RNA-seq,
      or single-cell RNA-seq data using PCIT and RIF algorithms
    was: CeTF is an R package to Coexpression for Transcription Factors using Regulatory Impact Factors
      (RIF) and Partial Correlation and Information (PCIT) analysis. The package provides the necessary
      functions for performing the Partial Correlation coefficient with Information Theory (PCIT) (Reverter
      and Chan 2008) and Regulatory Impact Factors (RIF) (Reverter et al. 2010) algorithm.
  cfa:
    description: Annotates transcriptional roles of cis-regulatory modules from epigenetic codes using
      an explainable deep learning model
    was: An explainable deep learning model for annotating the transcriptional roles of cis-regulatory
      modules based on epigenetic codes.
  cfdnapipe:
    description: Analyzes cell-free DNA WGBS/WGS data with quality control, CNV detection, methylation
      analysis, and fragment size profiling
    was: cfDNApipe(cell free DNA Pipeline) is an integrated pipeline for analyzing cell-free DNA WGBS/WGS
      data. It contains many cfDNA quality control and statistical algorithms. It is a comprehensive quality
      control and analysis pipeline for cell-free DNA high-throughput sequencing data.
  cfsp:
    description: Discovers frequent sub-sequence pairs with large gaps from nucleic acid sequences for
      classification
    was: CFSP is a collaborative frequent sequence pattern discovery algorithm for nucleic acid sequence
      classification.
  cga-bni:
    description: Infers Boolean network structure and dynamics from steady-state gene expression data
      using a constrained genetic algorithm
    was: A novel constrained genetic algorithm-based Boolean network inference method from steady-state
      gene expression data..
  cgnaweb:
    description: Visualises sequence-dependent ground states of double-stranded nucleic acid fragments
      using a statistical mechanics model
    was: A visual interface to the cgNA+ sequence-dependent statistical mechanics model of double-stranded
      nucleic acids.
  cgrnb:
    description: Builds combinatorial gene regulatory networks from seed-matching sequence information
      and gene expression datasets
    was: A web server for building combinatorial gene regulatory networks through integrated engineering
      of seed-matching sequence information and gene expression datasets.
  charid:
    description: Predicts chromatin loops mediated by open chromatin regions using a two-step neural network
      and ensemble learning model
    was: CharID (Chromatin Accessible Region Interaction Detector), a two-step model that combines neural
      network and ensemble learning to predict OCR-mediated loops.
  charplant:
    description: Predicts open chromatin regions from plant DNA sequences using a deep convolutional neural
      network trained on DNase-seq and ATAC-seq data
    was: 'CharPlant (Chromatin Accessible Regions for Plant) is a de novo OCRs prediction tool based on
      deep learning model. It can take complete DNA sequences or scaffolds as input, and output the outline
      of OCRs in a .Bed format file rely on sequence features. To our knowledge, this is the first tool
      to de novo predict potential open chromatin regions from DNA sequence and assay data.

      The result of OCR (Open Chromatin Region) assay technologies such as DNase-seq and ATAC-seq represents
      the open state of a tissue at a given time and does not cover all the chromatin accessible information
      of this species. To predict the potential open regions of different tissues at different times in
      the whole sequence can help to understand gene transcription and regulation from a global perspective.'
  chas:
    description: Infers cell type-specific signatures from bulk brain histone acetylation data to identify
      disease-associated pathways at cellular resolution
    was: CHAS is an R package that infers cell type-specific signatures in bulk brain histone acetylation
      studies. It enables the identification of biological pathways associated with neurological and psychiatric
      disorders at cellular resolution.
  cheap:
    description: Trims, aligns, and visualizes ChIP-exo sequencing reads in a one-step Jupyter Notebook
      pipeline
    was: ChIP-exo Analysis Pipeline (ChEAP) that executes the one-step process, starting from trimming
      and aligning raw sequencing reads to visualization of ChIP-exo results.
  chia-pet2:
    description: Analyzes ChIA-PET data from raw sequencing reads to chromatin loops, including linker
      trimming, read alignment, peak calling and loop calling
    was: Versatile and flexible pipeline for ChIA-PET data analysis.
  chia-pipe:
    description: Fully automated pipeline for ChIA-PET data processing, quality assessment, peak and loop
      calling, and visualization
    was: ChIA-PIPE is a fully automated pipeline for comprehensive ChIA-PET data analysis and visualization.
      ChIA-PET (chromatin interaction analysis with paired-end tags) enables genome-wide discovery of
      chromatin interactions involving specific protein factors, with base pair resolution. Interpretation
      of ChIA-PET data requires a robust analytic pipeline. Here, we introduce ChIA-PIPE, a fully automated
      pipeline for ChIA-PET data processing, quality assessment, visualization, and analysis. ChIA-PIPE
      performs linker filtering, read mapping, peak calling, and loop calling and automates quality control
      assessment for each dataset. To enable visualization, ChIA-PIPE generates input files for two-dimensional
      contact map viewing with Juicebox and HiGlass and provides a new dockerized visualization tool for
      high-resolution, browser-based exploration of peaks and loop.
  chic:
    description: Assesses ChIP-seq data quality using a comprehensive set of metrics and machine learning
      models for scoring samples
    was: Quality control pipeline for ChIP-seq data using a comprehensive set of quality control metrics,
      including previously proposed metrics as well as novel ones, based on local characteristics of the
      enrichment profile. The framework allows assessing quality of samples with sharp or broad enrichment
      profiles, whereas previously proposed metrics were not taking this into account. It provides a reference
      compendium of quality control metrics and trained machine learning models for scoring samples.
  chilin:
    description: Automates quality control and analysis of ChIP-seq and DNase-seq data with comprehensive
      reports and historical metric comparisons
    was: Comprehensive ChIP-seq and DNase-seq quality control and analysis pipeline.
  chinn:
    description: Predicts chromatin interactions between open chromatin regions from DNA sequences using
      a neural network
    was: 'Chromatin Interaction Neural Network (ChINN): a machine learning-based method for predicting
      chromatin interactions from DNA sequences'
  chip-ap:
    description: Runs an integrated ChIP-seq analysis pipeline from raw FASTQ files to consensus peak
      sets using four peak callers
    was: ChIP-AP (Chromatin ImmunoPrecipitation Sequencing Analysis Pipeline) is an integrated ChIP-Seq
      analysis pipeline.
  chip-array:
    description: Integrates ChIP-seq and microarray gene expression data to discover direct and indirect
      target genes regulated by a transcription factor
    was: ChIP-Array is a web server that integrates ChIP-seq and microarray gene expression data to discover
      direct and indirect target genes regulated by a transcription factor of interest.
  chip-atlas:
    description: Integrates ChIP-seq, ATAC-seq, and Bisulfite-seq data to explore epigenomic landscapes
      via GUI and API
    was: ChIP-Atlas is a web service providing both GUI- and API-based data-mining tools to reveal the
      architecture of the transcription regulatory landscape.
  chip-bit2:
    description: Detects strong and weak binding sites from ChIP-seq data using a Bayesian integration
      model
    was: ChIP-BIT2 is a software tool to detect weak binding events using a Bayesian integration approach.
  chip-gpt:
    description: Extracts metadata, particularly ChIP targets and cell lines, from biomedical database
      records using a fine-tuned large language model
    was: ChIP-GPT is a large language model fine-tuned to extract metadata from biomedical databases,
      particularly focusing on chromatin immunoprecipitation (ChIP) targets and cell lines. It demonstrates
      high accuracy in extracting data even from records with errors and is adaptable to different databases.
  chip-gsm:
    description: Infers active transcription factor modules from ChIP-seq profiles to predict functional
      regulatory elements
    was: Inferring active transcription factor modules to predict functional regulatory elements.
  chip-hub:
    description: Integrative web-based platform for exploring plant regulome through visualization and
      meta-analysis of over 10,000 reanalyzed datasets from 40+ plant species
    was: ChIP-Hub is an integrative web-based/Shiny application for exploring plant regulome.
  chip-seq:
    description: Performs ChIP-seq data analysis tasks including peak detection, correlation analysis,
      and genome partitioning from read alignment files
    was: The ChIP-seq web server provides access to a set of useful tools performing common ChIP-seq data
      analysis tasks, including positional correlation analysis, peak detection, and genome partitioning
      into signal-rich and signal-poor regions. It is an open system designed to allow interoperability
      with other resources, in particular the motif discovery programs from the Signal Search Analysis
      (SSA) server.
  chip-seq-analysis:
    description: Estimates population size to control false positives and false negatives in ChIP-Seq
      datasets
    was: Population size estimation for quality control of ChIP-Seq datasets | If you are not redirected
      automatically, follow the link
  chipanalyser:
    description: Predicts and models transcription factor binding to DNA using a statistical thermodynamics
      framework
    was: 'Based on a statistical thermodynamic framework, ChIPanalyser tries to produce ChIP-seq like
      profile. The model relies on four consideration: TF binding sites can be scored using a Position
      weight Matrix, DNA accessibility plays a role in Transcription Factor binding, binding profiles
      are dependant on the number of transcription factors bound to DNA and finally binding energy (another
      way of describing PWM''s) or binding specificity should be modulated (hence the introduction of
      a binding specificity modulator).'
  chipbase:
    description: Provides a comprehensive transcriptional regulation atlas of non-coding RNAs and protein-coding
      genes from ChIP-seq data
    was: The encyclopedia of transcriptional regulations of non-coding RNAs and protein-coding genes.
  chipcomp:
    description: Detects differentially bound sharp binding sites across multiple ChIP-seq conditions
      considering matching control
    was: Detects differentially bound sharp binding sites across multiple conditions considering matching
      control.
  chipenrich:
    description: Performs gene set enrichment testing on ChIP-seq peaks with empirical correction for
      gene locus length and mappability
    was: ChIP-Enrich performs gene set enrichment testing using peaks called from a ChIP-seq experiment.
      The method empirically corrects for confounding factors such as the length of genes, and the mappability
      of the sequence surrounding genes.
  chipexoqual:
    description: Provides a quality control pipeline for ChIP-exo and ChIP-nexus data
    was: Package with a quality control pipeline for ChIP-exo/nexus data.
  chipin:
    description: Normalizes ChIP-seq signals across conditions using gene expression data to identify
      transcriptionally constant genes
    was: CHIPIN is an R package that provides a normalization procedure to compare signals between ChIP-seq
      samples in different conditions; experiments should be performed using the same antibody.
  chipmeta:
    description: Combines ChIP-seq and ChIP-chip data with a hierarchical hidden Markov model to identify
      transcription factor binding sites
    was: Combining data from ChIP-seq and ChIP-chip.
  chipmunk:
    description: Discovers DNA motifs with maximum Kullback Discrete Information Content using a greedy
      heuristic with bootstrapping
    was: ChIPMunk is a fast heuristic DNA motif digger based a on greedy approach accompanied by bootstrapping.
      ChIPMunk identifies the strong motif with the maximum Kullback Discrete Information Content in a
      given set of DNA sequences.
  chipmunk_chiphorde:
    description: Discovers DNA binding motifs from ChIP-seq data using an iterative algorithm that combines
      greedy optimization with bootstrapping and coverage profiles
    was: De novo motif finding.
  chippeakanno:
    description: Annotates enriched peaks from ChIP-seq, ChIP-chip, or CAGE experiments with nearby genes,
      GO terms, and motifs
    was: The package includes functions to retrieve the sequences around the peak, obtain enriched GO
      terms, find the nearest gene, exon, miRNA or custom features such as most conserved elements and
      other TF binding sites supplied by users. New functions have been added for finding the peaks with
      bi-directional promoters with summary statistics, for summarizing the occurrence of motifs in peaks
      and for adding other IDs to annotated peaks or enrichedGO.
  chipqc:
    description: Computes quality metrics for ChIP-seq and ChIP-exo data
    was: Quality metrics for ChIPseq data.
  chips-seq:
    description: Streamlines processing of ChIP-seq, ATAC-seq, and DNase-seq data with quality control,
      peak calling, and downstream analysis
    was: CHIPS (CHromatin enrIchment ProceSsor) is an Snakemake  analysis pipeline in to streamline the
      processing of ChIP-seq, ATAC-seq, and DNase-seq data.
  chipseeker:
    description: Annotates ChIP-seq peaks with nearest genes, genomic regions, and visualizes coverage
      and TSS profiles
    was: This package implements functions to retrieve the nearest genes around the peak, annotate the
      genomic region of the peak, statistical methods for estimating the significance of overlap among
      ChIP peak data sets, and incorporate GEO database to compare the own dataset with those deposited
      in database. The comparison can be used to infer cooperative regulation and thus can be used to
      generate hypotheses.
  chipseeker_R:
    description: Annotates, compares, and visualizes ChIP-seq peaks and other epigenomic datasets
    was: R package for ChIP peak Annotation, Comparison, and Visualization.
  chipseq:
    description: Processes short read data for ChIP-seq experiments using Bioconductor
    was: Tools for helping process short read data for chipseq experiments.
  chipseqr:
    description: Identifies protein binding sites from ChIP-seq data, designed for nucleosome positioning
      and histone modification experiments
    was: Identify protein binding sites from ChIP-seq and nucleosome positioning experiments. The model
      used to describe binding events was developed to locate nucleosomes but it is flexible enough to
      handle other types of experiments as well.
  chipseqspike:
    description: Normalizes ChIP-seq data using spike-in controls to enable quantitative comparisons across
      samples
    was: Chromatin Immuno-Precipitation followed by Sequencing is used to determine the binding sites
      of any protein of interest, such as transcription factors or histones with or without a specific
      modification, at a genome scale. The many steps of the protocol can introduce biases that make ChIP-Seq
      more qualitative than quantitative.
  chipsim:
    description: Simulates ChIP-seq data with a focus on nucleosome positioning
    was: A general framework for the simulation of ChIP-seq data. Although currently focused on nucleosome
      positioning the package is designed to support different types of experiments.
  chipuana:
    description: Snakemake-based workflow for ChIP-seq data from raw FASTQ to differential analysis of
      transcription factor binding or histone modifications
    was: ChIPuana is a snakemake-based workflow for the analysis of ChIP-seq data from the raw fastq files
      to the differential analysis of transcription factor binding or histone modification marking.
  chipxpress:
    description: Ranks transcription factor bound genes from ChIPx data by integrating publicly available
      gene expression profiles to prioritize functional targets
    was: This tool takes as input predicted TF bound genes from ChIPx data and uses a corresponding database
      of gene expression profiles downloaded from NCBI GEO to rank the TF bound targets in order of which
      gene is most likely to be functional TF target.
  chrogps:
    description: Visualizes associations between genetic elements using multidimensional scaling of epigenetic
      data
    was: We provide intuitive maps to visualize the association between genetic elements, with emphasis
      on epigenetics. The approach is based on Multi-Dimensional Scaling. We provide several sensible
      distance metrics, and adjustment procedures to remove systematic biases typically observed when
      merging data obtained under different technologies or genetic backgrounds.
  chrokit:
    description: Interactive web-based framework for analysis, visualization and integration of genomic
      data from ChIP-Seq and other NGS enrichment experiments
    was: Shiny-based framework for interactive analysis, visualization and integration of genomic data.
  chromasig:
    description: Finds commonly occurring chromatin signatures from tiling microarray and sequencing data
      using unsupervised learning
    was: An unsupervised learning method, which finds, in an unbiased fashion, commonly occurring chromatin
      signatures in both tiling microarray and sequencing data.
  chromatinhd:
    description: Analyzes single-cell ATAC+RNA data to connect chromatin accessibility and gene expression
      using scale-adaptive machine learning
    was: ChromatinHD is a computational tool that analyzes single-cell ATAC+RNA data to connect chromatin
      accessibility and gene expression. It uses scale-adaptive machine learning to identify functional
      chromatin changes and understand gene regulatory networks.
  chrombpnet:
    description: Learns base-resolution chromatin accessibility models that deconvolve enzyme biases from
      regulatory sequence determinants to discover TF motifs, footprints, and regulatory variants
    was: Bias factorized, base-resolution deep learning models of chromatin accessibility (chromBPNet).
  chromdmm:
    description: Clusters genomic regions characterized by multiple chromatin features using a Dirichlet-multinomial
      mixture model with profile shifting and flipping
    was: A Dirichlet-Multinomial Mixture Model For Clustering Heterogeneous Epigenetic Data.
  chromegcn:
    description: Predicts epigenetic states from DNA sequence and 3D genome data using a graph convolutional
      network
    was: ChromeGCN is a graph convolutional network for epigenetic state prediction using both sequence
      and 3D genome data.
  chromhmm:
    description: Learns and characterizes chromatin states from epigenomic data
    was: ChromHMM is software for learning and characterizing chromatin states.
  chromnet:
    description: Infers and interactively visualises a chromatin network from ChIP-seq data using conditional-dependence
      relationships
    was: Displays the nodes and edges of the chromatin network using a real-time force model.
  chromosight:
    description: Detects patterns such as loops and domains in Hi-C contact maps using computer vision
    was: Chromosight is an algorithm inspired from computer vision that can detect patterns in Hi-C maps.
      Chromosight has greater sensitivity than existing methods, while being faster and applicable to
      any type of genomes, including bacteria, viruses, yeasts and mammals.
  chromscape:
    description: Processes single-cell epigenomic data to analyze repressive and active histone modifications
      and chromatin accessibility landscapes
    was: ChromSCape is a user-friendly interactive Shiny/R application distributed as a Bioconductor package,
      that processes single-cell epigenomic data to assist the biological interpretation of chromatin
      landscapes within cell populations. ChromSCape analyses the distribution of repressive and active
      histone modifications as well as chromatin accessibility landscapes from single-cell datasets.
  chromstar:
    description: Infers combinatorial chromatin state dynamics across conditions from multiple ChIP-seq
      experiments using a multivariate Hidden Markov Model
    was: This package implements functions for combinatorial and differential analysis of ChIP-seq data.
      It includes uni- and multivariate peak-calling, export to genome browser viewable files, and functions
      for enrichment analyses.
  chromvar:
    description: Infers transcription-factor-associated accessibility from single-cell epigenomic data
    was: Inferring transcription-factor-associated accessibility from single-cell epigenomic data.
  cipher:
    description: Integrates ChIP-seq, RNA-seq, MNase-seq, DNase-seq, GRO-seq, and ATAC-seq data analysis
      with quality control and regulatory element prediction
    was: Flexible and extensive workflow platform for integrative next-generation sequencing data analysis
      and genomic regulatory element prediction.
  circe:
    description: Infers co-accessibility networks and predicts cis-regulatory DNA interactions from single-cell
      ATAC-seq data using graphical lasso
    was: CIRCE is a Python package for inferring co-accessibility networks from single-cell ATAC-seq data,
      predicting cis-regulatory DNA interactions. It utilizes skggm for graphical lasso and scanpy for
      data processing, offering scalability and improvements over existing workflows like Cicero.
  circlebase:
    description: Curates and interprets extrachromosomal circular DNAs from human sequencing data, integrating
      computational predictions and manual annotations
    was: An integrated resource and analysis platform for human eccDNAs.
  circlehunter:
    description: Identifies extrachromosomal circular DNA from ATAC-Seq data using enhanced chromatin
      accessibility
    was: Tool to identify extrachromosomal circular DNA from ATAC-Seq data.
  ciscross:
    description: Predicts upstream transcription factor regulators from Arabidopsis thaliana gene lists
      using DAP-seq binding profiles
    was: CisCross web service that gives more flexibility in the analysis of potential upstream TF regulators
      for Arabidopsis thaliana gene
  cisformer:
    description: Generates gene expression from chromatin accessibility and vice versa at single-cell
      resolution using cross-attention
    was: Cisformer is a generative model for cross-modality generation between gene expression and chromatin
      accessibility at single-cell resolution. It leverages cross-attention to link cis-regulatory elements
      to target genes, facilitating the identification of functional transcription factors.
  cisgenome:
    description: Integrates analysis of ChIP-chip and ChIP-seq data for tiling arrays, genome, and cis-regulatory
      elements
    was: An integrated tool for tiling array, ChIP-seq, genome and cis-regulatory element analysis
  cisminer:
    description: Predicts cis-regulatory modules genome-wide by fuzzy itemset mining of transcription
      factor binding sites without prior motif information
    was: Genome-Wide In-Silico Cis-Regulatory Module Prediction by Fuzzy Itemset Mining.
  cismols:
    description: Identifies compositionally similar cis-element clusters in ortholog-conserved regulatory
      regions of co-regulated genes
    was: CisMols (Cis-regulatory Modules) is a tool that identifies compositionally predicted cis-clusters
      that occur in groups of co-regulated genes within each of their ortholog-pair evolutionarily conserved
      cis-regulatory regions.
  cisred:
    description: Database of conserved regulatory elements identified by a genome-scale computational
      pipeline using multiple motif discovery methods
    was: cisRED is a database system for genome-scale computational discovery of regulatory elements.
  cisregtest:
    description: Performs statistical tests for natural selection on regulatory regions using transcription
      factor binding site strength
    was: Statistical tests for natural selection on regulatory regions based on the strength of transcription
      factor binding sites.
  cistopic:
    description: Models cis-regulatory topics from single-cell ATAC-seq data
    was: 'cis-regulatory topic modeling on single-cell ATAC-seq data.


      cisTopic v3: Faster topic modelling based on WarpLDA (see vignettes for details).'
  cistrome:
    description: Web-based platform for ChIP-chip/seq and gene expression data analysis, including peak
      calling, correlation, motif discovery, and genome feature association
    was: A web-based application with an analysis platform for CHIP-chip/seq and gene expression microarray
      data.
  citl:
    description: Infers time-lagged causal relationships between genes from scRNA-seq data using RNA velocity
    was: CITL (Causal inference with time-lagged information)  that  infer the time-lagged causality of
      genes using scRNA-seq data
  citrus:
    description: Models the impact of somatic alterations on transcription factors and downstream transcriptional
      programs using a self-attention mechanism on genomic, transcriptomic, and epigenomic data
    was: Interpretable deep learning for chromatin-informed inference of transcriptional programs driven
      by somatic alterations across cancers.
  clarion:
    description: Transforms multi-label problems to predict mRNA subcellular localizations using a weighted
      series method
    was: Clarion is a multi-label problem transformation method for identifying mRNA subcellular localizations.
  clipper-fdr:
    description: Controls false discovery rates without p-values for high-throughput data from two conditions
    was: 'p-value-free FDR control on high-throughput data from two conditions.


      A p-value-free method for controlling false discovery rates in high-throughput biological data with
      two conditions.'
  clipseq:
    description: Performs quality control, pre-mapping, genome mapping, UMI deduplication, and peak calling
      from CLIP sequencing data
    was: 'Nextflow pipeline for comprehensive CLIP data analysis.


      CLIP sequencing analysis pipeline for QC, pre-mapping, genome mapping, UMI deduplication, and multiple
      peak-calling options.'
  clnn-loop:
    description: Predicts CTCF-mediated chromatin loops across cell lines and binding site pair types
      using a deep learning model fusing sequence-based features
    was: A deep learning model to predict CTCF-mediated chromatin loops in the different cell lines and
      CTCF-binding sites (CBS) pair types.
  cloops2:
    description: Performs peak-calling, loop-calling, differential loop analysis, and annotation from
      chromatin interaction data such as TrAC-looping
    was: 'cLoops2: full stack analysis tool for chromatin interactions.'
  cloudasm:
    description: Maps allele-specific DNA methylation from sequencing data using a cloud-based pipeline
    was: 'an ultra-efficient cloud-based pipeline for mapping allele-specific DNA methylation.


      Last updated: July 31, 2020. Please check our preprint on biorxiv and our published paper on Bioinformatics.


      Med Google Cloud Platform kan du oprette, implementere og skalere apps, websites og tjenester på
      den samme infrastruktur som Google.


      Fortsæt til Google Cloud Platform.


      Skriv den tekst, du hører eller ser.


      To be able use CloudASM, you need to create an account on https://cloud.google.com/ and set up how
      you want to be billed (e.g. with a credit card). As of January 2020, GCP offers $300 in credits
      for opening an account -- which is enough to test this pipeline.'
  cluster_buster:
    description: Finds dense clusters of pre-specified motifs in DNA sequences
    was: Cluster Buster is a tool that finds clusters of pre-specified motifs in DNA sequences.
  cmirc_update_2024:
    description: Explores clustered miRNA expression patterns and their relationship with copy number
      variations and DNA methylation in cancer
    was: cmirC is a database and analysis tool providing insights into clustered miRNAs and their relationship
      with copy number variations and DNA methylation in cancer. It allows users to explore miRNA expression
      patterns and identify regulatory mechanisms associated with cancer progression.
  cncdatabase:
    description: Provides a curated database of non-coding cancer drivers in promoters, enhancers, ncRNAs
      and CTCF insulators from published studies
    was: CNCDatabase(Cornell Non-Coding Cancer driver Database) provides a helpful resource for researchers
      to explore the pathological role of non-coding alterations and their associations with gene expression
      in human cancers. This database provides the list of non-coding cancer drivers in gene promoters,
      enhancers, ncRNAs and CTCF-cohesin insulators published in over 25 studies. It is created from text
      mining and manual curation to the PubMed articles.
  cncrnadb:
    description: Manually curated database of experimentally supported RNAs with both protein-coding and
      noncoding functions
    was: cncRNAdb is a manually curated resource of experimentally supported RNAs with both protein-coding
      and noncoding function.
  cner:
    description: Identifies and visualizes conserved noncoding elements across large-scale genomic data
    was: Large-scale identification and advanced visualization of sets of conserved noncoding elements.
  cnn-peaks:
    description: Calls ChIP-seq peaks using convolutional neural networks trained on human-annotated genomic
      segments
    was: CNN-peaks is a Convolution Neural Network(CNN) based ChIP-Seq peak calling software. ChIP-Seq
      peak detection pipeline using convolutional neural networks that imitate human visual inspection.
  cnn_pred:
    description: Predicts single-stranded and double-stranded DNA-binding proteins using convolutional
      neural networks
    was: CNN-Pred is a machine learning tool to accurately predict single-stranded DNA-binding proteins
      (SSBs) or double-stranded DNA-binding proteins (DSBs).
  cnvxplorer:
    description: Mines clinical, genomic, and epigenomic features to functionally assess CNVs in a clinical
      diagnostic setting
    was: CNVxplorer is a web server suited for the functional assessment of CNVs in a clinical diagnostic
      setting. CNVxplorer mines a comprehensive set of clinical, genomic, and epigenomic features associated
      with CNVs. It provides sequence constraint metrics, impact on regulatory elements and topologically
      associating domains, as well as expression patterns. Analyses offered cover (a) agreement with patient
      phenotypes; (b) visualizations of associations among genes, including those mediated by regulatory
      elements, and transcription factors; (c) enrichment on functional and pathway annotations; and (d)
      co-occurrence of terms across PubMed publications related to the query CNVs. A flexible evaluation
      workflow allows dynamic re-interrogation in clinical sessions.
  cobind:
    description: Quantifies the collocation strength between two sets of genomic intervals using six statistical
      measures
    was: Quantitative analysis of the genomic overlaps.
  cobindr:
    description: Finds and analyses co-occurring transcription factor binding site motifs in groups of
      genes
    was: Finding and analysing co-occuring motifs of transcription factor binding sites in groups of genes.
  cobolt:
    description: Learns a shared latent representation from multi-omic single-cell sequencing data using
      a multimodal variational autoencoder
    was: Cobolt is a method developed for modeling multi-omic single-cell sequencing datasets. It provides
      an integrated analysis of multi-omic data by learning a latent representation shared by the different
      data modalities. Cobolt jointly models these multiple modalities via a novel application of Multimodal
      Variational Autoencoder to a hierarchical generative model. It uses a probablity model that is robust
      to sparse counts and high numbers of features, therefore works for omics such as chromatin accessibility
      or methylation status.
  cobra:
    description: Performs unsupervised and supervised analysis of ChIP/ATAC-seq data including differential
      peak calling, motif enrichment, and pathway analysis
    was: 'CoBRA is a comprehensive ChIP/ATAC‐seq analysis tool built using snakemake and Docker which
      allows for escalable, reproducible, portable and easy-to-use workflows.


      CoBRA combines the use of several dozen ChIP/ATAC‐seq tools, suites, and packages to create a complete
      pipeline that takes ChIP/ATAC‐seq analysis from unsupervised analyses, differential peak calling,
      and downstream pathway analysis. In addition, CoBRA has been outfitted with several recently published
      tools that allow for better normalziation and CNV correction. The results are compiled in a simple
      and highly visual report containing the key figures to explain the analysis, and then compiles all
      of the relevant files, tables, and pictures into an easy to navigate folder.'
  cocoa:
    description: Quantifies inter-sample epigenetic variation using region set databases for DNA methylation
      and chromatin accessibility data
    was: COCOA is a method for understanding epigenetic variation among samples. COCOA can be used with
      epigenetic data that includes genomic coordinates and an epigenetic signal, such as DNA methylation
      and chromatin accessibility data. To describe the method on a high level, COCOA quantifies inter-sample
      variation with either a supervised or unsupervised technique then uses a database of "region sets"
      to annotate the variation among samples. A region set is a set of genomic regions that share a biological
      annotation, for instance transcription factor (TF) binding regions, histone modification regions,
      or open chromatin regions. COCOA can identify region sets that are associated with epigenetic variation
      between samples and increase understanding of variation in your data.
  cogito:
    description: Provides a workflow for unbiased, structured overview and systematic analysis of complex
      genomic interval-based datasets from different data types and conditions
    was: Cogito “COmpare annotated Genomic Intervals TOol” provides a workflow for an unbiased, structured
      overview and systematic analysis of complex genomic datasets consisting of different data types
      (e.g. RNA-seq, ChIP-seq) and conditions.
  cohesindb:
    description: Integrates and annotates cohesin binding sites, chromatin loops and cis-regulatory modules
      from multiomics datasets in human cells
    was: A comprehensive database for decoding cohesin-related epigenomes, 3D genomes and transcriptomes
      in human cells.
  coman:
    description: Analyses metatranscriptomic data with quality control, functional annotation, pathway
      enrichment, and co-expression network analysis
    was: Comprehensive metatranscriptomics analysis.
  combind:
    description: Predicts joint transcription factor binding sites from CAP-SELEX data using random forests
      that consider multiple orientations and spacings
    was: Modeling binding specificities of transcription factor pairs with random forests.
  combsafe:
    description: Identifies combinations of static and dynamic functional elements from ChIP-seq data
      using hidden Markov models and semantic annotations
    was: Combinatorial and Semantic Analysis of Functional Elements (CombSAFE). It is a flexible computational
      method to identify combinations of static and dynamic functional elements genome-wide, or in a specific
      genomic region, and how they change across semantically annotated biological conditions.
  comeback:
    description: Estimates DNA co-methylation from array data to output co-methylated regions based on
      all genomic CpG sites without phenotypic inputs
    was: Co-Methylation with genomic CpG Background (CoMeBack) estimates DNA co-methylation, defined as
      proximal CpG probes with correlated DNAm across individuals. CoMeBack outputs co-methylated regions
      (CMRs), spanning sets of array probes constructed based on all genomic CpG sites, including those
      not measured on the array, and without any phenotypic variable inputs.
  comethyl:
    description: Performs weighted gene correlation network analysis on user-defined genomic regions to
      find comethylated modules and test their correlation with sample traits
    was: A network-based methylome approach to investigate the multivariate nature of health and disease.
  compareprospector:
    description: Identifies regulatory motifs from co-regulated genes in higher eukaryotes by biasing
      Gibbs sampling towards conserved sequences across multiple species
    was: Server which attempts to identify any motifs related to genes predicted to share regulatory elements.
      It alters Gibbs sampling through biasing searches towards conserved sequences across multiple species.
  compepitools:
    description: Integrates epigenomics data with DNA methylation results to score regions of interest
      and identify enhancers, lncRNAs, and RNAPII dynamics
    was: Tools for computational epigenomics developed for the analysis, integration and simultaneous
      visualization of various (epi)genomics data types across multiple genomic regions in multiple samples.
  confac:
    description: Identifies conserved transcription factor binding sites enriched in promoter regions
      of gene clusters from microarray analyses compared to control gene sets
    was: The Conserved Transcription Factor Binding Site Finder (CONFAC) takes a list of human gene names
      and identifiers as input, and compares them with their mouse orthologues to identify conserved transcription
      factor binding sites.  Further information from the user allows CONFAC to identify binding sites
      that are enriched in the promoter regions of gene clusters from microarray analyses when compared
      to control gene sets.
  congri:
    description: Identifies gene regulatory interactions from spatial gene expression images using a contrastive
      learning scheme and deep Siamese CNN architecture
    was: ConGRI is a contrastive learning scheme based on deep Siamese CNN architecture, which identifies
      gene regulatory interactions from gene expression images.
  connectf:
    description: Builds gene networks by integrating transcription factor-target gene interactions from
      genome-wide studies
    was: ConnecTF is a platform to build gene networks by integrating transcription factor-target gene
      interactions.
  conquer:
    description: Integrates and visualizes GWAS risk loci with functional genomics data from multiple
      repositories
    was: CONQUER is an interactive toolbox to understand functional consequences of GWAS hits.
  conreal:
    description: Identifies transcription factor binding sites conserved between two orthologous promoter
      sequences using multiple alignment algorithms
    was: CONREAL (Conserved Regulatory Elements Anchored Alignment) allows identification of transcription
      factor binding sites (TFBS) that are conserved between two orthologous promoter sequences.
  conrel:
    description: Explores consensus regulatory elements with transcription factor binding affinities across
      cell lines and tissues
    was: CONREL is a genome browser that allows for the exploration of consensus regulatory elements at
      different levels of abstraction. The total binding affinity of transcription factors on whole consensus
      region sequences is here fully exploited to characterize and annotate functional properties of regulatory
      elements. CONREL can be used to explore genomic loci, genes or genomic regions of interest across
      different cell lines and tissues.
  consensuspathdb:
    description: Integrates physical molecular interactions, biochemical pathways, and gene regulatory
      networks from multiple databases for human
    was: Information on physical molecular interactions, biochemical pathways, and gene regulatory networks
      in human.
  consept:
    description: Predicts gene expression from enhancer sequence and transcription factor levels using
      a convolutional neural network
    was: CoNSEPT (Convolutional Neural Network-based Sequence-to-Expression Prediction Tool) is a tool
      to predict gene expression in various cis and trans contexts. Inputs to CoNSEPT are enhancer sequence,
      transcription factor levels in one or many trans conditions, TF motifs (PWMs), and any prior knowledge
      of TF-TF interactions.
  consite:
    description: Detects transcription factor binding sites in genomic sequences using phylogenetic footprinting
      and experimentally-confirmed binding profiles
    was: Detect transcription factor binding sites in genomic sequences using phylogenetic footprinting
      and experimentally-confirmed binding profiles.
  consreg:
    description: Predicts condition-specific regulatory genes by integrating genomic data with machine
      learning models
    was: ConSReg is a Python package for condition specific regulatory network analysis.
  contra_v2:
    description: Identifies and visualizes transcription factor binding sites in any genomic region across
      nine reference organisms using position weight matrices
    was: A tool to identify transcription factor binding sites across species.
  contra_v3:
    description: Visualizes and explores predicted transcription factor binding sites in genomic regions
      of coding or non-coding genes across nine reference organisms
    was: Visualization and exploration of predicted transcription factor binding sites (TFBSs) in any
      genomic region surrounding coding or non-coding genes.
  convert-matrix:
    description: Converts between formats of position-specific scoring matrices and computes statistical
      scores and consensus sequences
    was: Inter-conversions between various formats of position-specific scoring matrices (PSSM). The program
      also performs a statistical analysis of the original matrix to provide different position-specific
      scores (weight, frequencies, information contents), general statistics (marginal frequencies, total
      information content), and synthetic descriptions (strict and degenerate consensus).
  cooboostr:
    description: Predicts tissue or cell-of-origin of tumors using somatic mutation density and chromatin
      mark features with extreme gradient boosting
    was: An extreme gradient boosting-based tool for robust tissue or cell-of-origin prediction of tumors.
  coolbox:
    description: Provides a flexible toolkit for visual analysis of genomics data, including genome track
      plots and interactive exploration
    was: CoolBox is a flexible toolkit for visual analysis of genomics data.
  cooltools:
    description: Enables flexible, scalable, and reproducible analysis of high-resolution Hi-C contact
      frequency data via CLI and Python API
    was: Enabling high-resolution Hi-C analysis in Python.
  copy-scat:
    description: Infers copy number variants from single-cell epigenomic data to distinguish malignant
      from nonmalignant cells in cancer
    was: Deconvoluting single-cell chromatin accessibility of genetic subclones in cancer.
  coreatac:
    description: Classifies cis-regulatory elements as promoters, enhancers, or insulators from single
      cell and bulk ATAC-seq data using a deep learning model
    was: A deep learning model for the functional classification of regulatory elements from single cell
      and bulk ATAC-seq data.
  corec:
    description: Profiles cell-specific transcription factor-cofactor complexes from DNA-binding data
    was: CoRec is a method for rapid profiling of cell-specific transcription factor-cofactor complexes.
      This GitHub repository provides code and related resources for implementing and analyzing CoRec
      data.
  coregnet:
    description: Reconstructs co-regulatory networks from transcriptomic data and integrates TF binding
      and ChIP evidence to identify cooperative transcription factors
    was: This package provides methods to identify active transcriptional programs, including methods
      and classes to import or infer large scale co-regulatory network from transcriptomic data. The specificity
      of the encoded networks is to model TF cooperation. External regulation evidences (TFBS, ChIP,...)
      can be integrated to assess the inferred network and refine it if necessary.
  corenup:
    description: Identifies nucleosomes from DNA sequences using a parallel convolutional and recurrent
      neural network
    was: CORENup is a deep learning model for nucleosome identification. CORENup processes a DNA sequence
      as input using one-hot representation and combines in a parallel fashion a fully convolutional neural
      network and a recurrent layer. These two parallel levels are devoted to catching both non periodic
      and periodic DNA string features.
  corto:
    description: Infers gene networks and performs master regulator analysis from gene expression data
      using Spearman correlation and Data Processing Inequality
    was: corto (correlation tool) is a lightweight R package for Gene Network Inference and Master Regulator
      Analysis. corto package provides a pipeline to infer networks between "centroid" and "target" variables
      in a dataset, using a combination of Spearman correlation and Data Processing Inequality (DPI).
  coryneregnet:
    description: Reference database and analysis platform for corynebacterial transcription factors and
      gene regulatory networks
    was: Reference database and analysis platform for corynebacterial transcription factors and gene regulatory
      networks.
  couger:
    description: Identifies protein co-factors that distinguish genomic regions bound by paralogous transcription
      factors
    was: Framework for identifying co-factors associated with uniquely-bound genomic regions.
  coverageview:
    description: Visualizes genome coverage profiles from ChIP-seq and nucleosome positioning experiments
    was: This package provides a framework for the visualization of genome coverage profiles. It can be
      used for ChIP-seq experiments, but it can be also used for genome-wide nucleosome positioning experiments
      or other experiment types where it is important to have a framework in order to inspect how the
      coverage distributed across the genome.
  coxpresdb:
    description: Compares gene coexpression relationships across seven animal species using Mutual Rank
      and integrated omics data
    was: COXPRESdb (coexpressed gene database) represents the coexpression relationship for human and
      mouse. Upgrades include a new comparable coexpression measure, Mutual Rank, five other animal species,
      rat, chicken, zebrafish, fly and nematoda, and addition of different layers of omics data into the
      integrated network of genes.
  cpdseqer:
    description: Processes, elucidates and quality controls cyclobutane pyrimidine dimer sequencing data
    was: CPDSeqer is a tool for processing, elucidating and quality control of cyclobutane pyrimidine
      dimer sequencing data.
  cpg_transformer:
    description: Imputes single-cell methylomes using a transformer neural network with axial and sliding
      window self-attention
    was: CpG Transformer for imputation of single-cell methylomes.
  cpgmotifs:
    description: Discovers DNA motifs associated with CpG methylation events and predicts transcription
      factor binding sites in the human genome
    was: CpGmotifs is a tool to discover DNA motifs associated to CpG methylation events.
  cpmodule:
    description: Detects cis-regulatory modules from ChIP-seq data using a query-based approach to recover
      combinatorial regulation
    was: Unveiling combinatorial regulation through the combination of ChIP information and in silico
      cis-regulatory module detection.
  crcdb:
    description: A database of super enhancer-driven core transcription regulatory circuitry and core
      transcription factors across human tissues and cell types
    was: Landscape and significance of human super enhancer-driven core transcription regulatory circuitry.
  createcontrolsubset:
    description: Filters duplicate reads from ChIP-seq samples and creates a control dataset with matching
      read counts
    was: 'Preprocess ChIP-seq aligned reads before calling FindPeaks: Filter out dulpicates from the SAMPLE
      (optional) and create a CONTROL dataset w/o duplicates with the same number of reads as in the SAMPLE.
      Only eland, sam and bam files are accepted.'
  crema:
    description: Infers regulatory networks from chromatin accessibility or enhancer mark data by processing
      raw FASTQ files to identify cis-regulatory elements and key transcription factors
    was: CREMA is an online tool which automatically infers regulatory networks from chromatin accessibility
      (ATAC/DNase-seq) or enhancer mark (ChIP-seq) data. CREMA directly processes raw data of a set of
      samples (FASTQ files), identifies cis-regulatory elements (CREs) , infers key transcription factors
      driving the observed chromatin state changes across the experimental conditions, and makes detailed
      predictions regarding their regulatory roles.
  creme:
    description: Identifies and visualizes cis-regulatory modules in promoter regions of a given set of
      potentially co-regulated human genes
    was: CREME (Cis-Regulatory Module Explorer for the human genome) is a tool for identifying and visualizing
      cis-regulatory modules for a given set of genes that are potentially co-expressed or co-regulated.  It
      takes as input a list of accession numbers, and reports back common modules, grouping genes from
      the list by which modules are found in their promoter regions.
  crepe:
    description: Catalogues and annotates transcription factors from genomic data using a Shiny app
    was: Shiny app for transcription factor cataloguing.
  crinet:
    description: Infers genome-wide competing endogenous RNA interactions and groups from expression data
      using network deconvolution
    was: CrinetCeRna Interaction NETwork) is a computational R tool to infer genome-wide competing endogenous
      RNA (ceRNA) interactions and groups.
  crispr-gem:
    description: Predicts downstream effects of CRISPR gene editing by constructing a synthetic gene regulatory
      network to identify optimal target genes
    was: CRISPR-GEM is a machine learning model that predicts the downstream effects of CRISPR gene editing
      by constructing a synthetic gene regulatory network. It identifies optimal CRISPR target genes by
      modulating experimental group GRNs to motivate transcriptomic shifts toward a target group phenotype.
  crisprepi:
    description: Consolidates multi-omic sequencing data to analyze CRISPR-based epigenome editing outcomes
      and off-target effects
    was: CRISPRepi is a platform that consolidates extensive sequencing data from RNA-seq, ChIP-seq, Bisulfite-seq,
      and ATAC-seq datasets related to CRISPR-based epigenome editing. It allows users to analyze editing
      outcomes and assess off-target effects.
  crispron_off:
    description: Predicts CRISPR Cas9 on-target efficiency and off-target potential for gRNA design
    was: Webservers for CRISPR Cas9 on- and off-target predictions.
  crisprware:
    description: Designs context-specific guide RNA libraries from next-generation sequencing data with
      allele-specific guide design
    was: CRISPRware is a software package for designing context-specific guide RNA (gRNA) libraries leveraging
      next-generation sequencing data, allowing for allele-specific guide design and publicly accessible
      through the UCSC Genome Browser.
  croconet:
    description: Quantitatively compares gene regulatory networks across species to identify conserved
      and diverged modules while distinguishing true evolutionary divergence from confounders
    was: CroCoNet is an R package for quantitatively comparing gene regulatory networks across species.
      It identifies conserved and diverged modules and distinguishes true evolutionary divergence from
      technical and biological confounders.
  crocs:
    description: Detects peaks from ChIP-seq data using supervised segmentation models that account for
      over-dispersion
    was: Increased peak detection accuracy in over-dispersed ChIP-seq data with supervised segmentation
      models.
  crosshub:
    description: Analyses TCGA data to identify TF-gene and mRNA-miRNA interactions using ChIP-Seq, prediction
      databases, and expression correlations
    was: A tool for multi-way analysis of The Cancer Genome Atlas (TCGA) in the context of gene expression
      regulation mechanisms.
  crsd:
    description: Discovers composite regulatory signatures including microRNA and transcription factor
      binding sites from microarray data
    was: Microarray analysis pipeline aimed at the discovery of motifs involved in gene regulation including
      microRNA signatures and transcription factor binding sites (TFBS).
  crunch:
    description: Performs automated ChIP-seq analysis from raw reads to peak calling and regulatory motif
      modeling
    was: A completely automated pipe-line for ChIP-seq data analysis, starting from raw sequencing reads,
      through quality filtering, read mapping, fragment size estimation, peak calling, peak annotation
      and comprehensive regulatory motif analysis. It runs with data from human (hg19), mouse (mm9) or
      drosophila (dm3).
  csRNA-seq:
    description: Identifies transcription start sites at single-nucleotide resolution from total RNA
    was: 'Identification and dynamic quantification of regulatory elements using total RNA.

      Software for motif discovery and next-gen sequencing analysis.

      Sequencing the 5'' end of cap-protected RNAs enables the identification of Transcription Start Sites
      (TSS) at nucleotide resolution.'
  csa-chip:
    description: Performs the complete ChIP-seq analysis pipeline from raw data to downstream analysis
      via a web interface
    was: 'a web service for the complete process of ChIP-Seq analysis.


      BACKGROUND:Chromatin immunoprecipitation sequencing (ChIP-seq) is a technology that combines chromatin
      immunoprecipitation (ChIP) with next generation of sequencing technology (NGS) to analyze protein
      interactions with DNA. At present, most ChIP-seq analysis tools adopt the command line, which lacks
      user-friendly interfaces. Although some web services with graphical interfaces have been developed
      for ChIP-seq analysis, these sites cannot provide a comprehensive analysis of ChIP-seq from raw
      data to downstream analysis. RESULTS:In this study, we develop a web service for the whole process
      of ChIP-Seq Analysis (CSA), which covers mapping, quality control, peak calling, and downstream
      analysis. In addition, CSA provides a customization function for users to define their own workflows.'
  csar:
    description: Detects protein-bound genomic regions from ChIP-seq data using a Poisson-based test with
      FDR control via random permutations
    was: Statistical tools for ChIP-seq data analysis. Taking the average DNA fragment size subjected
      to sequencing into account, the software calculates genomic single-nucleotide read-enrichment values.
      After normalization, sample and control are compared using a test based on the Poisson distribution.
      Test statistic thresholds to control the false discovery rate are obtained through random permutation.
  csaw:
    description: Detects differentially bound regions in ChIP-seq data using sliding windows with normalization
      and FDR control
    was: Detection of differentially bound regions in ChIP-seq data with sliding windows, with methods
      for normalization and proper FDR control.
  csdeconv:
    description: Maps transcription factor binding sites from ChIP-seq data to high resolution using blind
      deconvolution
    was: CSDeconv maps transcription factor binding sites from ChIP-seq data to high resolution using
      a blind deconvolution approach
  cshmm-tf:
    description: Integrates probabilistic modeling of time series scRNA-seq data to assign transcription
      factors to specific activation points and infer their order of activation
    was: Continuous-State Hidden Markov Models Transcription Factors(TF) (CSHMM-TF) is a method which
      integrates probabilistic modeling of single cell RNA-seq data with the ability to assign TFs to
      specific activation points in the model. TFs are assumed to influence the emission probabilities
      for cells assigned to later time points allowing us to identify not just the TFs controlling each
      path but also their order of activation.
  cssp:
    description: Computes statistical power for ChIP-seq experiments using a Bayesian local Poisson model
      to determine required sequencing depth
    was: Power computation for ChIP-Seq data based on Bayesian estimation for local poisson counting process.
  cssq:
    description: Quantifies ChIP-seq signal and performs differential binding analysis using a mixture
      of Gaussians model
    was: ChIP-seq signal quantifier pipeline.
  ctk:
    description: Discovers structural variations, including larger insertions and deletions, in genomes
      from paired-end sequencing reads
    was: Suite of tools to discover structural variations such as (larger) insertions and deletions in
      genomes from paired-end sequencing reads.
  cuda-meme:
    description: Discovers sequence motifs from biological sequences using the MEME algorithm accelerated
      on a single GPU
    was: Motif discovery software based on MEME algorithm for a single GPU device using CUDA programming
      model. At present, it only supports the OOPS and ZOOPS models.
  cutruntools:
    description: A flexible pipeline for processing CUT&RUN data to identify chromatin-associated protein
      binding and perform genomic footprinting analysis
    was: 'A flexible pipeline for CUT&RUN processing and footprint analysis | We introduce CUT&RUNTools
      as a flexible, general pipeline for facilitating the identification of chromatin-associated protein
      binding and genomic footprinting analysis from antibody-targeted CUT&RUN primary cleavage data.
      CUT&RUNTools extracts endonuclease cut site information from sequences of short-read fragments and
      produces single-locus binding estimates, aggregate motif footprints, and informative visualizations
      to support the high-resolution mapping capability of CUT&RUN. CUT&RUNTools is available at https:
      bitbucket.org qzhudfci cutruntools'
  cwas-plus:
    description: Estimates category-wide association of rare noncoding variation from whole-genome sequencing
      data by integrating user-provided functional data
    was: CWAS-Plus is a software resource that estimates category-wide association of rare noncoding variation
      from whole-genome sequencing data by integrating user-provided functional data. It facilitates the
      identification of noncoding variant associations in genomic disorders and enables scalability for
      processing large-scale whole-genome sequencing data.
  cwords:
    description: Identifies over-represented sequence motifs in ranked lists of genes from differential
      expression data, typically for miRNA regulatory motif discovery
    was: Method used for identification of over-represented words in a set of ranked sequences. By default
      it is aimed at human miRNA analysis; you give a ranked list of differential expression values of
      genes across two conditions and it finds words in 3' UTRs of lengths 6 and 7 over-represented in
      the most regulated genes.
  dagbagm:
    description: Learns directed acyclic graphs from mixed continuous and binary variables using bootstrap
      aggregation
    was: DAGBagM is a tool for Learning Directed Acyclic Graphs via Bootstrap Aggregation for Mixture
      of Continuous and Binary Variables.
  damid-seq:
    description: Analyzes DamID-seq data with a Snakemake workflow for processing replicates and quality
      control visualization
    was: DamMapper is a Snakemake workflow for analyzing DamID-seq data. It provides a comprehensive pipeline
      for processing multiple biological replicates, quality control visualization, and robust code quality,
      ensuring reproducibility across diverse computational environments.
  damidseq_pipeline:
    description: Automatically processes DamID-seq FASTQ datasets with alignment, normalization and background
      reduction
    was: Single script that automatically handles sequence alignment, read extension, binned counts, normalisation,
      pseudocount addition and final ratio file generation.
  danio-code:
    description: Provides a central repository for storing, processing, and viewing zebrafish developmental
      functional genomic data with standardized metadata
    was: This Data Coordination Center web page allows DANIO-CODE consortium members to submit and view
      their data sets annotated with standard metadata nomenclatures.
  dataremix:
    description: Transforms gene expression data to prioritize biological signals over noise using a three-parameter
      SVD-based method
    was: DataRemix is a R package for universal data transformation for optimal inference from gene expression
      datasets.
  datf:
    description: Provides known and predicted Arabidopsis transcription factors with cloned sequences,
      3D structure templates, EST expression, binding sites, and nuclear location signals
    was: The Database of Arabidopsis Transcription Factors (DATF) contains information of more than 1800
      known and predicted transcription factors for Arabidopsis.
  dbInDel:
    description: A database of enhancer-associated insertion and deletion variants identified from H3K27ac
      ChIP-Seq data, with TF binding motif and target gene predictions
    was: 'A database of enhancer-associated insertion and deletion variants by analysis of H3K27ac ChIP-Seq.


      Cancer hallmarks rely on its specific transcriptional programs, which are dysregulated by multiple
      mechanisms, including genomic aberrations in the DNA regulatory regions. Genome-wide association
      studies (GWAS) have shown many variants are found within putative enhancer elements. To provide
      insights into the regulatory role of enhancer-associated noncoding variants in cancer epigenome,
      and to facilitate the identification of functional noncoding mutations, we present dbInDel, a database
      where we have comprehensively analyzed enhancer-associated insertion and deletion variants for both
      human and murine samples using ChIP-Seq data. Moreover, we provide the identification and visualization
      of upstream TF binding motifs in InDel-containing enhancers. Downstream target genes are also predicted
      and analyzed in the context of cancer biology.'
  dbchip:
    description: Detects differentially bound sharp binding sites across multiple conditions from ChIP-seq
      data, with or without matching control samples
    was: Detects differentially bound sharp binding sites across multiple conditions, with or without
      matching control samples.
  dbd:
    description: Predicts sequence-specific DNA-binding transcription factors in completely sequenced
      genomes using hidden Markov models
    was: Predicted transcription factors in completely sequenced genomes.
  dbd2bs:
    description: Predicts DNA-binding site position weight matrices from the structure of a DNA-binding
      domain, using bound or unbound protein structures
    was: Uses the structure of DNA binding domains (DBDs) to predict the corresponding binding sites on
      DNA. Queries can be specified by a PDB ID or the coordinates of a DNA-binding protein in PDB format.
  dbscatac:
    description: Annotates super-enhancers, gene markers, and enhancer-gene interactions from scATAC-seq
      data across thirteen species
    was: dbscATAC is a database providing annotations of single-cell super-enhancers, gene markers, and
      enhancer-gene interactions derived from scATAC-seq data across thirteen species.  It offers search
      and visualization tools for exploring enhancer landscapes and gene regulation.
  dbtss:
    description: Provides precise transcription start site positions from TSS-seq data across multiple
      species and tissues
    was: DataBase of Transcription Start Sites is a database which contains precise positional information
      for transcription start sites of eukaryotic mRNAs. Included are 330 million new tags generated by
      massively sequencing the 5-end of oligo-cap selected cDNAs in humans and mice. 31 different cell
      types or culture conditions are represented. Promoter sequence information is now displayed in a
      comparative genomics viewer where evolutionary turnover of the TSSs can be evaluated.
  dchiprep:
    description: Assesses differences between histone modification ChIP-seq profiles around genomic elements
      using biological replicates and input data
    was: Implements a methodology to assess differences between chromatin modification profiles in replicated
      ChIP-Seq studies as described in Chabbert et. al.
  dci:
    description: Learns differences between two causal graphs from gene expression data under different
      conditions
    was: The Difference Causal Inference (DCI) algorithm directly learns the difference between two causal
      graphs given two datasets. DCI is implemented as a part of the causaldag package.
  ddapred:
    description: Predicts drug repositioning using regularized logistic matrix factorization
    was: DDAPRED is a computational method for predicting drug repositioning using regularized logistic
      matrix factorization
  ddpc:
    description: Integrates experimentally verified prostate cancer genes with protein annotations, pathways,
      ontologies, transcription regulation, and drug data
    was: 'Dragon Database of Genes Implicated in Prostate Cancer is a knowledgebase of genes experimentally
      verified to be involved in prostate cancer (PC).

      DDPC provides gene-associated data such as protein annotation, molecular pathways, ontologies and
      transcription regulation. It enables biologist to circumvent the large amount of energy and time
      spent in analyzing pertinent biological problems involving PC.'
  decode-framework:
    description: Predicts enhancers and refines their boundaries from functional assay data using a deep-learning
      framework
    was: A Deep-learning Framework for Condensing Enhancers and Refining Boundaries with Large-scale Functional
      Assays.
  decoden:
    description: Learns shared chromatin landscapes and de-biases histone modification assays from multiple
      measurement tracks
    was: DecoDen is a software tool that learns shared chromatin landscapes and de-biases histone modification
      assays. It addresses biases introduced by the chromatin landscape itself when measuring genomic
      distributions of chromatin features.
  deconpeaker:
    description: Estimates cell type proportions from chromatin accessibility (ATAC-Seq) and gene expression
      (RNA-Seq, microarray) data using a deconvolution model
    was: DeconPeaker is a deconvolution method to estimate cell type proportions in chromatin accessibility
      data (ATAC-Seq), as well as gene expression data (RNA-Seq & Microarray).
  decorate:
    description: Identifies correlated epigenetic features and finds clusters differentially correlated
      between data subsets using an R package
    was: decorate is a R package for differential epigenetic correlation test.
  decres:
    description: Predicts enhancer and promoter regions genome-wide using supervised deep learning on
      ENCODE and FANTOM data
    was: DEep learning for identifying Cis-Regulatory ElementS is an extension of the Deep Learning Tutorials
      developped by LISA lab (www.deeplearning.net/tutorial/). Although it is developped for the identification
      of CREs, it can also be used for other applications.
  dedoc2:
    description: Identifies and characterizes the hierarchy and dynamics of chromatin TAD-like domains
      in single cells using dynamic programming
    was: DeDoc2 identifies and characterizes the hierarchy and dynamics of chromatin TAD-like domains
      in the single cells.
  deep-loop:
    description: Predicts CTCF-mediated chromatin loops from DNA sequence using a convolutional neural
      network
    was: Deep-loop is a sequence-based deep learning approach to predict CTCF-mediated chromatin loop.
  deep-pla:
    description: Predicts HAT/HDAC-specific lysine acetylation sites from protein sequences using deep
      learning
    was: Deep-PLA is a web server developed for understanding the reversible enzyme-specific lysine acetylation
      regulation for histone acetyltransferases
  deepRAM:
    description: Predicts DNA/RNA sequence binding specificities using an end-to-end deep learning toolkit
      with automatic model selection
    was: Comprehensive evaluation of deep learning architectures for prediction of DNA/RNA sequence binding
      specificities | End-to-end deep learning toolkit for predicting protein binding sites and motifs
      | deepRAM is an end-to-end deep learning toolkit for predicting protein binding sites and motifs.
      It helps users run experiments using many state-of-the-art deep learning methods and addresses the
      challenge of selecting model parameters in deep learning models using a fully automatic model selection
      strategy. This helps avoid hand-tuning and thus removes any bias in running experiments, making
      it user friendly without losing its flexibility. While it was designed with ChIP-seq and CLIP-seq
      data in mind, it can be used for any DNA/RNA sequence binary classification problem
  deepark:
    description: Predicts regulatory activities and variant effects from genomic sequences for worm, fish,
      fly, and mouse using deep convolutional neural networks
    was: DeepArk is a set of models of the worm, fish, fly, and mouse regulatory codes. For each of these
      organism, we constructed a deep convolutional neural network that predict regulatory activities
      (i.e. histone modifications, transcription factor binding, and chromatin state) directly from genomic
      sequences. Besidese accurately predicting a sequence's regulatory activity, DeepArk can predict
      the effects of variants on regulatory function and profile sequences regulatory potential with in
      silico saturated mutagenesis.
  deepblue:
    description: Provides a programmatic interface for finding, selecting, filtering, summarizing and
      downloading epigenomic region sets from multiple projects
    was: Provides a central data access hub for large collections of epigenomic data. It organizes the
      data from different sources using controlled vocabularies and ontologies. The data is stored in
      our server, where the users can access the data programmatically or by our web interface. It contains
      a set of commands designed to perform operations on the epigenomic data. Users can execute all operations
      in a pipeline fashion in the server and transfer only meaningful data.
  deepbound:
    description: Identifies transcript boundaries from RNA-seq read alignments using deep convolutional
      neural fields
    was: Accurate identification of transcript boundaries via deep convolutional neural fields.
  deepc:
    description: Predicts Hi-C chromatin interactions from megabase-scale DNA sequences using a neural
      network framework
    was: DeepC is a neural network framework for predicting the Hi-C chromatin interactions from megabase
      scale DNA sequence
  deepcage:
    description: Predicts chromatin accessible regions genome-wide by integrating sequence information
      and transcription factor binding statuses using a deep convolutional neural network
    was: Incorporating transcription factors in genome-wide prediction of chromatin accessibility.
  deepcyps:
    description: Predicts inhibitory activity of molecules against five cytochrome P450 isoforms using
      a deep learning model
    was: A deep learning platform for enhanced cytochrome P450 activity prediction.
  deepd2v:
    description: Predicts transcription factor binding sites from DNA sequence using a hybrid deep learning
      framework with word2vec-based k-mer representation
    was: A Novel Deep Learning-Based Framework for Predicting Transcription Factor Binding Sites from
      Combined DNA Sequence.
  deepfun:
    description: Predicts functional impacts of non-coding sequence variants at single nucleotide resolution
      using deep learning on epigenomic annotations
    was: DeepFun is a deep learning based approach to predict the functional impacts of sequence alterations
      at single nucleotide resolution.
  deepg4:
    description: Predicts active G-quadruplexes from DNA sequences using a convolutional neural network
    was: DeepG4 is a deep learning model developed to predict the probability of DNA sequences to form
      active G-Guadruplexes (found both in vitro and in vivo). DeepG4 is built in keras+tensorflow and
      is wrapped in an R package.
  deepgengrep:
    description: Predicts multiple genomic signals and regions from DNA sequences using hybrid neural
      networks
    was: A general deep learning-based predictor for multiple genomic signals and regions.
  deepgmap:
    description: Trains and compares deep learning models to predict gene regulatory regions from double-strand
      genome sequences
    was: DeepGMAP is a Deep learning-based Genotype MAPping platform to predict them. It can train different
      architectures of neural networks with epigenomic data, and "map" potential gene regulatory regions
      on a genome.
  deepgrn:
    description: Predicts transcription factor binding sites from DNA sequences and DNase-seq coverage
      using attention-based deep neural networks
    was: DeepGRN is a tool for predicting transcription factor binding site across cell-types using attention-based
      deep neural networks.
  deephlapred:
    description: Predicts non-classical HLA Class I binders using deep learning with sequence representations
    was: Deep learning-based method for non-classical HLA binder prediction.
  deeplncpro:
    description: Identifies long non-coding RNA promoters in human and mouse using an interpretable convolutional
      neural network model
    was: An interpretable convolutional neural network model for identifying long non-coding RNA promoters.
  deeplucia:
    description: Predicts chromatin loops from genomic and epigenomic profiles without requiring CTCF
      binding data
    was: Deep-LUCIA (Deep Learning-based Universal Chromatin Interaction Annotator) is a deep learning
      based model to predict chromatin loops from genomic and epigenomic profile without CTCF signal.
  deepmel:
    description: Identifies orthologous enhancers across distantly related species using deep learning
      on chromatin accessibility data
    was: DeepMEL is a tool that identifies orthologous enhancers across distantly related species, where
      sequence alignment fails, and the model highlights specific nucleotide substitutions that underlie
      enhancer turnover. DeepMEL can be used from the Kipoi database to predict and optimize candidate
      enhancers and to prioritize enhancer mutations.
  deepmotifsyn:
    description: Synthesizes heterodimeric DNA motifs from monomeric motif pairs using a deep-learning-based
      generator and evaluator
    was: DeepMotifSyn is a deep-learning-based model to synthesize heterodimeric motifs from monomeric
      motif pairs.
  deepmp:
    description: Detects DNA base modifications from Nanopore sequencing data using a convolutional neural
      network that combines signals and basecalling errors
    was: Deep learning tool to detect DNA base modifications on Nanopore sequencing data.
  deepmr:
    description: Estimates causal relationships between genomic marks learned by deep learning models
      using Mendelian randomization and in silico mutagenesis
    was: Investigating the causal knowledge of genomic deep learning models.
  deepnd:
    description: Prioritizes gene risk for comorbid neurodevelopmental disorders using multitask learning
      on gene coexpression networks
    was: DeepND is a cross-disorder gene discovery algorithm (Deep Neurodevelopmenal Disorders algorithm)
      It analyzes comorbid neurodevelopmental disorders simultaneously and explicitly learns the shared
      and disorder-specific genetic features using multitask learning. Thus, the predictions for the disorders
      depend on each other's genetic architecture. The proposed DeepND architecture uses graph convolution
      to extract associations between genes from gene coexpression networks that model neurodevelopment.
      This information is processed by a mixture-of-experts model that can self-learn critical neurodevelopmental
      time windows and brain regions for each disorder etiology which makes the model interpretable. We
      provide a genomewide risk ranking for each disorder.
  deeprc:
    description: Integrates transformer-like attention into deep learning for massive multiple instance
      learning to classify immune repertoires
    was: DeepRC is a tool that that integrates transformer-like attention, or equivalently modern Hopfield
      networks, into deep learning architectures for massive MIL such as immune repertoire classification.
  deepregfinder:
    description: Identifies enhancers and promoters from histone mark ChIP-seq data using convolutional
      and recurrent neural networks, classifying them into active and poised states
    was: DeepRegFinder is a deep learning based program used to identify DNA regulatory elements using
      ChIP-seq
  deepropre:
    description: Recognises TATA-box and non-TATA-box promoters using a CNN and bidirectional LSTM with
      attention
    was: DeeProPre, based on convolutional neural network and bidirectional long short-term memory model
      connecting attention mechanism. It is used for the computational recognition of promoters of with
      TATA-box, without TATA-box and mixed data types.
  deepse:
    description: Distinguishes super-enhancers from typical enhancers using only DNA sequence feature
      embeddings
    was: Detecting super-enhancers among typical enhancers using only sequence feature embeddings.
  deepselex:
    description: Infers DNA-binding preferences from HT-SELEX data using multi-class convolutional neural
      networks
    was: DeepSELEX is a tool for inferring DNA-binding preferences from HT-SELEX data using multi-class
      CNNs.
  deeptfactor:
    description: Predicts whether a protein is a transcription factor using a convolutional neural network
    was: DeepTFactor is a deep learning-based tool that predicts whether a protein in question is a transcription
      factor. DeepTFactor uses a convolutional neural network to extract features of a protein. It showed
      high performance in predicting TFs of both eukaryotic and prokaryotic origins,
  deeptools:
    description: Normalizes and visualizes deep-sequencing data with tools for coverage files, heatmaps,
      and summary plots
    was: User-friendly tools for the normalization and visualization of deep-sequencing data.
  deeptss:
    description: Predicts single-nucleotide transcription start sites from CAGE data using a multi-branch
      convolutional neural network
    was: DeepTSS, a novel computational method for processing CAGE samples, that combines genomic signal
      processing (GSP), structural DNA features, evolutionary conservation evidence and raw DNA sequence
      with Deep Learning (DL) to provide single-nucleotide TSS predictions with unprecedented levels of
      performance.
  deepvisp:
    description: Predicts oncogenic virus integration sites in the human genome using a deep convolutional
      neural network with attention architecture
    was: DeepVISP is a deep learning tool for virus site integration prediction and motif discovery.
  deepyy1:
    description: Identifies YY1-mediated chromatin loops from pairs of YY1 motifs using a deep learning
      approach
    was: DeepYY1 is a deep learning approach to identify YY1-mediated chromatin loops.
  deerect-tss:
    description: Annotates transcription start sites across the whole genome using DNA sequences and RNA-seq
      data with a deep-learning method
    was: A novel meta-learning-based method annotates TSS in multiple cell types based on DNA sequences
      and RNA-seq data.
  defcom:
    description: Detects transcription factor footprints containing motifs from DNase-seq or ATAC-seq
      data using supervised learning
    was: SVM-based supervised learning foot-printer for the detection of footprints containing motifs.
  deform-nu:
    description: Predicts nucleosome occupancy and rotational positioning from DNA deformation energy
    was: Deform-nu is a DNA deformation energy-based predictor for nucleosome positioning.
  defuse:
    description: Discovers gene fusions from RNA-Seq data using discordant paired-end alignments and split-read
      analysis
    was: A software package for gene fusion discovery using RNA-Seq data. The software uses clusters of
      discordant paired end alignments to inform a split read alignment analysis for finding fusion boundaries.
  delila-py:
    description: Constructs binding site logos from DNA sequences using the Delila software suite
    was: Delila-PY is a custom pipeline to make it quick and easy to run the Delila software packages
      required to construct a binding site logo while providing the high level of flexibilty and control
      present in the Deilia software.
  depicter-promotor:
    description: Identifies eukaryotic promoters from DNA sequences using cascaded deep capsule neural
      networks
    was: Depicter is a tool for computational identification of eukaryotic promoters based on cascaded
      deep capsule neural networks.
  desso-db:
    description: Provides motif prediction results and online motif finding for ChIP-seq and ATAC-seq
      data using deep learning
    was: A web database for sequence and shape motif analyses and identification.
  destin2:
    description: Integrates peak accessibility, motif deviation, and pseudo-gene activity for dimension
      reduction, clustering, and trajectory inference from single-cell ATAC-seq data
    was: Integrative and cross-modality analysis of single-cell chromatin accessibility data.
  dexter:
    description: Identifies long regulatory elements from eukaryotic genomes using a computational approach
    was: DExTER is a tool dedicated to the identification of LREs and apply it to the analysis of the
      genomes of different eukaryotes including P. falciparum.
  dgw:
    description: Simultaneously aligns and clusters multiple epigenomic marks using Dynamic Time Warping
      to group regions with similar shapes
    was: DGW is an open source software package for simultaneous alignment and clustering of multiple
      epigenomic marks.
  diana-mirgen:
    description: Provides cell-line-specific miRNA gene transcription start sites and transcription factor
      binding sites to study miRNA transcription regulation
    was: Provides accurate cell-line-specific miRNA gene transcription start sites, coupled with genome-wide
      maps of transcription factor binding sites in order to unveil the mechanisms of miRNA transcription
      regulation. The database schema and web interface facilitates user interaction, provides advanced
      queries and innate connection with other DIANA resources for miRNA target identification and pathway
      analysis.
  diane:
    description: Infers and analyzes gene regulatory networks from multi-factorial expression data using
      Random Forests and Mixture Models
    was: DIANE (Dashboard for theInference and Analysis of Networks from Expression data) is a web application
      for inferring and analyzing gene regulatory networks from multi-factorial expression data.
  diffbind:
    description: Computes differentially bound sites from multiple ChIP-seq experiments using affinity
      data, with occupancy analysis and plotting functions
    was: Compute differentially bound sites from multiple ChIP-seq experiments using affinity (quantitative)
      data. Also enables occupancy (overlap) analysis and plotting functions.
  diffbrainnet:
    description: Performs differential expression and prior-knowledge-based differential network analysis
      on transcriptomic data from multiple brain regions
    was: Differential analyses add new insights into the response to glucocorticoids at the level of genes,
      networks and brain regions.
  diffchipl:
    description: Differential peak analysis for ChIP-seq data with biological replicates using limma
    was: A differential peak analysis method for high throughput sequencing data with biological replicates
      based on limma.
  diffreps:
    description: Detects differential chromatin modification sites from ChIP-seq data with or without
      biological replicates using a sliding window approach
    was: This software is developed to find different peaks in ChIP-seq. It scans the whole genome using
      a sliding window, performing millions of statistical tests and report the significant hits. It takes
      into account the biological variations within a group of samples and uses that information to enhance
      the statistical power. Considering biological variation is of high importance, especiallly for in
      vivo brain tissues.
  dimelo-seq:
    description: Maps protein-DNA interactions genome wide using long-read, single-molecule sequencing
    was: A long-read, single-molecule method for mapping protein-DNA interactions genome wide.
  dimont:
    description: Discovers de novo motifs from ChIP-seq, ChIP-exo, and PBM data using a general discriminative
      approach
    was: Dimont is a universal tool for de-novo motif discovery. Dimont has successfully been applied
      to ChIP-seq, ChIP-exo and protein-binding microarray (PBM) data.
  dimpl:
    description: Discovers structured noncoding RNA motifs in bacterial intergenic regions using a computational
      pipeline
    was: A bioinformatics pipeline for the discovery of structured noncoding RNA motifs in bacteria.
  dinamo:
    description: Detects over-represented IUPAC motifs in DNA sequences using an exhaustive algorithm
    was: The DiNAMO software implements an exhaustive algorithm to detect over-represented IUPAC motifs
      in a set of DNA sequences.
  diniro:
    description: Reconstructs transcriptional gene regulatory network modules that differentiate single-cell
      clusters from scRNA-seq data
    was: De-novo reconstruction and identification of transcriptional gene regulatory network modules
      differentiating single-cell clusters.
  dipwmsearch:
    description: Searches sequences for occurrences of dinucleotide position weight matrix motifs using
      an efficient enumeration algorithm
    was: Python package for searching di-PWM motifs.
  dire:
    description: Predicts distant regulatory elements in higher eukaryotic genomes using gene co-expression
      data, comparative genomics and transcription factor binding site information
    was: A web server for predicting distant (outside of proximal promoter regions) regulatory elements
      (DiRE) in higher eukaryotic genomces using gene co-expression data, comparative genomics as well
      as transcription factor binding site information. DiRE allows users to start analysis with raw microarray
      expression data.
  discrover:
    description: Discovers discriminative sequence motifs from nucleic acid sequences using hidden Markov
      models
    was: Discover discriminative sequence motifs.
  dloopcaller:
    description: Predicts genome-wide chromatin loops by integrating accessible chromatin landscapes with
      raw Hi-C contact maps using deep learning
    was: A deep learning approach for predicting genome-wide chromatin loops by integrating accessible
      chromatin landscapes.
  dmchmm:
    description: Identifies differentially methylated CpG sites from bisulfite sequencing data using a
      Hidden Markov Model
    was: It is a novel profiling tool for identifying differentially methylated CpG sites using Hidden
      Markov Model in bisulfite sequencing data.
  dminda:
    description: Identifies and analyzes regulatory DNA motifs from genomic sequences using multiple algorithms
      and phylogenetic footprinting
    was: 'DMINDA: An integrated web server for DNA motif identification and analyses.'
  dmrichr:
    description: Analyzes differentially methylated regions from bisulfite sequencing data, supporting
      non-model organisms with custom genomes
    was: DMRichR is an R package designed for analyzing differentially methylated regions (DMRs) in epigenetic
      research, particularly useful for non-model organisms. It leverages existing algorithms (dmrseq,
      bsseq) and provides tools for data processing, annotation, and visualization.
  dmrscaler:
    description: Identifies regions of differential DNA methylation spanning basepair to multi-megabase
      features using an iterative windowing procedure
    was: A scale-aware method to identify regions of differential DNA methylation spanning basepair to
      multi-megabase features.
  dnabert:
    description: Pre-trains a bidirectional encoder representation to capture global understanding of
      genomic DNA sequences from nucleotide contexts
    was: DNABERT is pre-trained bidirectional encoder representation to capture global and transferrable
      understanding of genomic DNA sequences based on up and downstream nucleotide contexts.
  dnacycp:
    description: Predicts intrinsic DNA cyclizability from sequence using a deep learning model trained
      on loop-seq data
    was: A deep learning tool for DNA cyclizability prediction.
  dnaffinity:
    description: Predicts in vitro transcription factor binding affinities from structural and mechanical
      DNA properties derived from molecular dynamics simulations
    was: A machine-learning approach to predict DNA binding affinities of transcription factors
  dnalongbench:
    description: Benchmark suite evaluating deep learning models on long-range DNA prediction tasks including
      enhancer-target gene interaction and 3D genome organization
    was: DNALONGBENCH is a benchmark suite designed to evaluate long-range DNA prediction tasks, covering
      areas like enhancer-target gene interaction and 3D genome organization. It provides a standardized
      resource for comparing deep learning models that account for long-range dependencies in DNA sequences.
  dnaser:
    description: Performs DNase I footprinting analysis of DNase-seq data in R
    was: DNase I footprinting analysis of DNase-seq data in R
  dnashapedtfbs:
    description: Predicts TFBSs from ChIP-seq data by combining sequence information with DNA shape features
      using gradient boosting classifiers
    was: Tool to train and apply gradient boosting classifiers to predict TFBSs within ChIP-seq data sets
      by combining sequence and DNA shape information. Sequence information is encoded using either classical
      PWMs, TFFMs, or 4-bits. DNA shape features are obtained from the GBshape browser.
  domino_web-server:
    description: Identifies active modules from a gene network and gene activity profile using the DOMINO
      algorithm
    was: The DOMINO web-server for active module identification analysis.
  dorina:
    description: A database of RNA interactions in post-transcriptional regulation, searchable via web
      interface and API
    was: A database of RNA interactions in post-transcriptional regulation.
  dpprom:
    description: Predicts promoters and their types on phage genomes using a two-layer deep learning model
    was: 'DPProm: A two-layer model combined DPProm-1L and DPProm-2L, named DPProm, for predicting promoters
      and their types on the whole genomes of phages.'
  dragon:
    description: Infers regulatory associations from paired multi-omic data using Gaussian Graphical Models
      with layer-specific parameter calibration
    was: DRAGON (Determining Regulatory Associations using Graphical models on multi-Omic Networks), calibrates
      its parameters to achieve an optimal trade-off between the network’s complexity and estimation accuracy,
      while explicitly accounting for the characteristics of each of the assessed omics ‘layers.’
  dreg-pathway:
    description: Detects regulatory DNA sequences from GRO-seq data using a web application and R package
    was: A web application and R package for the detection of regulatory DNA sequences using GRO-seq data.
  drimseq:
    description: Models counts of genomic features with Dirichlet-multinomial distribution for differential
      splicing and sQTL analysis
    was: The package provides two frameworks. One for the differential splicing analysis between different
      conditions and one for the sQTL analysis. Both are based on modeling the counts of genomic features
      (i.e., transcripts, exons or exonic bins) with Dirichlet-multinomial distribution. The package also
      makes available functions for visualization and exploration of the data and results.
  drivergroup:
    description: Detects driver gene groups from gene expression and gene interaction data
    was: DriverGroup is a tool to detect driver gene groups by using gene expression and gene interaction
      data.
  driverpower:
    description: Discovers coding and non-coding cancer driver elements from tumour whole-genome or whole-exome
      somatic mutations using mutational burden and functional impact tests
    was: DriverPower is a tool used to discover potential coding and non-coding cancer driver elements
      from tumour whole-genome or whole-exome somatic mutations.
  drosophila_dnase_i_footprint_database:
    description: Database of transcription factor binding sites curated from literature and DNase I footprints
      for Drosophila melanogaster
    was: Database of transcription factor binding sites created from systematic literature curation and
      genome annotation of DNase I footprints for Drosophila.
  dsac:
    description: Predicts transcription factor binding sites from DNA sequences using a dual-branch network
      that combines convolutional and self-attention features
    was: Cooperation of local features and global representations by a dual-branch network for transcription
      factor binding sites prediction.
  dsbs:
    description: Identifies SNVs and evaluates DNA methylation levels at single-base resolution from double
      strand bisulfite sequencing data
    was: 'A new approach to decode DNA methylome and genomic variants simultaneously from double strand
      bisulfite sequencing.


      DSBS analyzer is a pipeline to analyzing Double Strand Bisulfite Sequencing data, which could simultaneously
      identify SNVs and evaluate DNA methylation levels in a single base resolution.'
  dynugene:
    description: Infers gene regulatory networks from expression data with uncertainty-aware model selection
      and simulation
    was: dynUGENE is an R package for uncertainty-aware gene regulatory network inference, simulation,
      and visualization.
  ePOSSUM:
    description: Analyses the effect of DNA variants on transcription factor binding sites using a Bayes
      classifier
    was: ePOSSUM analyses the effect of DNA variants on transcription factor binding sites
  eagle-enhancer:
    description: Predicts tissue/cell type-specific enhancer-gene interactions using six genomic features
      from enhancers and gene expression data
    was: 'An algorithm that utilizes a small number of genomic features to predict tissue/cell type-specific
      enhancer-gene interactions | Enhancer And Gene Learning Ensemble method | EAGLE: an algorithm that
      utilizes small number of genomic features to predict tissue/cell type specific enhancer-gene interactions
      | EAGLE used all six features only derived from the enhancers and gene expression datasets, without
      providing more information like histone modification, methylation or other enhancer-gene (EG) detection
      datasets'
  easeq:
    description: Explores, visualizes and analyzes ChIP-seq data in an interactive desktop environment
    was: 'Developed for user-friendly exploration, visualization and analysis of genome-wide single-read
      sequencing data.

      Both individual genomic loci and populations of loci can be visualized. The underlying loci can
      then be inspected just by selecting them in the plots.

      It also integrates more than 20 tools for analysis. Finally, it automatically generates legends
      and descriptions of the handling and can store plots together with underlying data and these descriptions
      as a single compact session file.'
  eat-uptf:
    description: Conducts enrichment analysis of upstream transcription factors for a gene set using DAP-seq
      or ChIP-seq data
    was: Enrichment Analysis Tool for Upstream Transcription Factor of a gene set (EAT-UpTF) is a tool
      to conduct enrichment analysis of upstream transcription factor for a gene set of interest.
  eccdb:
    description: Integrates, stores, and analyzes extrachromosomal circular DNA data from multiple species,
      focusing on chromatin contacts and transcriptional regulatory functions
    was: Comprehensive repository for eccDNA-mediated chromatin contacts in multi-species.
  echolocator:
    description: Automated statistical and functional fine-mapping pipeline that identifies, tests enrichment
      in, and visualizes high-confidence causal consensus variants from summary statistics
    was: Automated statistical and functional fine-mapping pipeline with extensive API access to datasets.
  ecocyc:
    description: A curated database of the E. coli genome, transcriptional regulation, transporters, and
      metabolic pathways
    was: A scientific database for the bacterium Escherichia coli K-12 MG1655. This project performs literature-based
      curation of the entire genome, and of transcriptional regulation, transporters, and metabolic pathways.
  ectracker:
    description: Detects cell-type or tissue-specific genes and ectopic expression from scRNA-seq data
      using CellEnrich and TissueEnrich modules
    was: "Tracking and elucidating ectopic expression leveraging large-scale scRNA-seq studies. \nEcTracker\
      \ possesses two distinct modules i.e. CellEnrich and TissueEnrich, to allow detection of cell-type\
      \ or tissue-specific genes in the user-supplemented scRNA-sequencing dataset."
  ehecregnet:
    description: Database and analysis platform for predicted transcriptional regulatory interactions
      in 16 pathogenic E. coli strains, transferred from E. coli K-12
    was: Database and analysis platform for pathogenic E. coli transcriptional gene regulatory networks.
      The database contains the known regulatory network of E. coli K-12 extracted from RegulonDB. In
      addition, it provides inter-species transferred gene regulatory interactions for 16 pathogenic E.
      coli strains.
  element_2023:
    description: Detects and curates core promoter elements and motifs in nucleotide sequences
    was: An enhanced tool for detection and curation of core promoter elements.
  eliater:
    description: Estimates quantitative effects of perturbations on downstream molecules in biomolecular
      networks from observational data
    was: Eliater is a Python package for estimating the effect of a perturbation on a downstream molecule
      in a biomolecular network. It takes a network, observational data, and the perturbation as input
      and provides quantitative effect estimates, as demonstrated by a case study on the Escherichia coli
      transcriptional regulatory network.
  elm:
    description: Predicts short linear functional motifs in eukaryotic protein sequences using logical
      filters to reduce false positives
    was: Tool for predicting eukaryotic protein functional sites that report domains, motifs, and sequence
      patterns based on the input sequence.
  elmer:
    description: Infers regulatory element landscapes and transcription factor networks from DNA methylation
      and gene expression data
    was: This tool is designed to use DNA methylation and gene expression from a large number of samples
      to infer a regulatory element landscape and transcription factor network in primary tissues.
  eltetrado:
    description: Identifies and classifies tetrads and quadruplexes in DNA/RNA 3D structures based on
      secondary structure topology
    was: ElTetrado is a tool for identification and classification of tetrads and quadruplexes in DNA/RNA
      3D structures. The application analyzes base pairing patterns of DNA/RNA 3D structures to find and
      classify tetrads and quadruplexes.
  encode_dcc:
    description: Central repository for ENCODE functional genomics data, providing sequences, alignments,
      signals, and peak calls
    was: It has a goal of cataloguing all the functional elements in the human genome. The ENCODE Data
      Coordination Center (DCC) serves as the central repository for ENCODE data. The DCC contains a collection
      of high-throughput, genome-wide data generated with technologies such as ChIP-Seq, RNA-Seq, DNA
      digestion and others. It includes sequences with quality scores, alignments, signals calculated
      from the alignments, and in most cases, element or peak calls calculated from the signal data.
  engrain:
    description: Recovers large-scale gene regulatory networks from gene expression data using supervised
      ensemble learning
    was: A Supervised Ensemble Learning Method for Recovery of Large-scale Gene Regulatory Networks.
  enhancer-if:
    description: Identifies cell-specific enhancers from the human genome using an integrative machine
      learning framework
    was: Integrative machine learning framework for the identification of cell-specific enhancers from
      the human genome.
  enhancer-lstmatt:
    description: Recognizes enhancers and distinguishes strong from weak enhancers in DNA sequences using
      a Bi-LSTM and attention-based deep learning model
    was: A Bi-LSTM and Attention-Based Deep Learning Method for Enhancer Recognition.
  enhancer_mdlf:
    description: Identifies cell-specific enhancers from DNA sequences using a multi-input deep learning
      framework
    was: A novel deep learning framework for identifying cell-specific enhancers.
  enhanceratlas:
    description: Provides enhancer annotation across 586 tissue/cell types in nine species, integrating
      data from 12 high-throughput methods
    was: 'An updated resource with enhancer annotation in 586 tissue/cell types across nine species.


      an updated resource with typical enhancer annotation in 600 tissue/cell types across nine species.'
  enhffl:
    description: A database of enhancer-mediated feed-forward loops for human and mouse, covering multiple
      loop types across tissues and cell lines
    was: A database of enhancer mediated feed-forward loops for human and mouse.
  enhort:
    description: Relates large sets of genomic positions to annotations using statistical analysis and
      visualization
    was: Enhort is a platform for deep analysis of genomic positions.
  entraf:
    description: Organizes experimentally validated transcription factors in bacterial and archaeal genomes
      with structural, functional, and regulatory information
    was: ENTRAF is a web-based encyclopedia that organizes information about experimentally validated
      transcription factors in bacterial and archaeal genomes. It provides a centralized resource with
      structural, functional, and regulatory information for these proteins.
  ep3:
    description: Identifies the core region of a eukaryotic gene promoter
    was: Identification of the core region of a eukaryotic gene promoter.
  epd:
    description: An annotated collection of eukaryotic POL II promoters with experimentally determined
      transcription start sites
    was: An annotated non-redundant collection of eukaryotic POL II promoters, for which the transcription
      start site has been determined experimentally. Access to promoter sequences is provided by pointers
      to positions in nucleotide sequence entries. The annotation part of an entry includes description
      of the initiation site mapping data, cross-references to other databases, and bibliographic references.
  epdrna:
    description: Identifies DNA-RNA binding sites in disease-related proteins using a predictive model
    was: Model for identifying DNA-RNA binding sites in disease-related proteins.
  epiGeEC:
    description: Compares user epigenomic datasets with thousands of public datasets for genome-wide correlation
    was: epiGenomic Efficient Correlator (epiGeEC) tool to enable genome-wide comparisons of very large
      numbers of public epigenomic datasets.
  epiScanpy:
    description: Analyzes single-cell epigenomic data including DNA methylation and scATAC-seq using multiple
      feature spaces and nearest neighbour graphs
    was: Epigenomics Single Cell Analysis in Python.
  epianno:
    description: Combines SNP, GWAS, and ChIP-seq data to annotate genomic variants on transcription factor
      binding sites
    was: ePIgenomics ANNOtation tool.
  epiannotator:
    description: Performs enrichment analyses on epigenomic data using regularly updated annotations from
      public databases
    was: Enrichment analyses on epigenomic data in a fast and user-friendly way.
  epicarousel:
    description: Identifies metacells from atlas-level single-cell chromatin accessibility data using
      lazy loading and community detection
    was: EpiCarousel is a Python package designed for memory- and time-efficient identification of metacells
      in large-scale single-cell chromatin accessibility data. It utilizes lazy loading, parallel processing,
      and community detection methods to analyze atlas-level datasets.
  epicoloc:
    description: Performs context-dependent colocalization analysis of genomic regions using over 44,000
      integrated epigenomic assays across human tissues and cell types
    was: epiCOLOC is a web-based tool with built-in large-scale and context-dependent epigenomics annotations.
  epicompare_r:
    description: Compares, quality controls and benchmarks epigenomic peak files, producing an interactive
      HTML report
    was: R package for the comparison and quality control of epigenomic peak files.
  epiconv:
    description: Clusters scATAC-seq data and corrects batch effects across multiple datasets
    was: EpiConv is an algorithm of clustering scATAC-seq data and correcting batch effects.
  epigenomix:
    description: Integrates RNA-seq or microarray gene transcription data with ChIP-seq histone modification
      data using Bayesian mixture models to detect genes with differences in both data types
    was: A package for the integrative analysis of RNA-seq or microarray based gene transcription and
      histone modification data obtained by ChIP-seq. The package provides methods for data preprocessing
      and matching as well as methods for fitting bayesian mixture models in order to detect genes with
      differences in both data types.
  epigraph:
    description: Analyzes genome and epigenome datasets by testing genomic region sets for enrichment
      or depletion of multiple attributes and predicting similar regions
    was: Enables biologists to analyze genome and epigenome datasets with powerful statistical and machine
      learning methods. In a typical workflow, the user uploads a set of genomic regions of interest,
      and its searches a large database of (epi-) genomic attributes for significant overlap and correlation
      with the regions in the input dataset. Furthermore, it can predict the status of genomic regions
      that were not included in the input dataset.
  epimolas:
    description: Integrates raw WGBS data processing and downstream analysis via a Galaxy Docker image
      and a web server for genome-wide DNA methylation analysis
    was: EpiMOLAS (Epi-genoMics OnLine Analysis System) is an intuitive web-based framework for genome-wide
      DNA methylation analysis.
  epiregio:
    description: Retrieves and analyzes regulatory elements linked to target genes using epigenomic and
      gene expression data
    was: EpiRegio is a resource of Regulatory EleMents (REMs) associated to protein coding, and non-protein
      coding genes. For a detailed documentation, please read our documentation.
  epiromics:
    description: Integrates multi-omics data to identify and visualize enhancer regions alongside gene
      expression and epigenomic modifications
    was: 'An R package designed to integrate and visualize various levels of epigenomic information, including
      but not limited to: ChIP, Histone, ATAC, and RNA sequencing. EpiRomics is also designed for regulatory
      network analysis in order to identify enhancer and enhanceosome regions from these data.'
  episcore:
    description: Deconvolves bulk tissue DNA methylomes into cell-type proportions using a reference matrix
      built from single-cell RNA-seq data
    was: EPISCORE is a R pacakge for cell type deconvolution of bulk tissue DNA methylomes from single-cell
      RNA-Seq data. It is a computational algorithm that performs virtual microdissection of bulk tissue
      DNA methylation data at single cell-type resolution for any solid tissue. EPISCORE applies a probabilistic
      epigenetic model of gene regulation to a single-cell RNA-seq tissue atlas to generate a tissue-specific
      DNA methylation reference matrix, allowing quantification of cell-type proportions and cell-type-specific
      differential methylation signals in bulk tissue data.
  episegmix:
    description: Segments chromatin states from ChIP-seq data using a hidden Markov model with flexible
      read count distributions and state duration modeling
    was: EpiSegMix is a segmentation tool based on a hidden Markov model with flexible read count distribution
      types and state duration modeling, allowing for a more flexible modeling of both histone signals
      and segment lengths.
  epivia:
    description: Jointly profiles chromatin accessibility and lentiviral integration sites from CAR-T
      cells at population and single-cell levels
    was: EpiVIA is joint profiling of chromatin accessibility and CAR-T integration site analysis at population
      and single-cell levels. EpiVIA parses each read and identifies the chimeric fragments, which are
      further classified into different categories based on how the read pair is aligned to the combined
      reference genome.
  epixplorer:
    description: Predicts, analyzes and visualizes enhancer-promoter interactions using multiple algorithms
      and multi-omics data
    was: A web server for prediction, analysis and visualization of enhancer-promoter interactions.
  epoch:
    description: Reconstructs dynamic gene regulatory networks from single-cell transcriptomics data to
      reveal signaling-induced topology changes
    was: Epoch is an R package for the reconstruction of dynamic regulatory networks reveals signaling-induced
      topology changes associated with germ layer specification.
  eponine:
    description: Detects transcription start sites in mammalian genomic sequence using a probabilistic
      method
    was: Probabilistic method for detecting transcription start sites (TSS) in mammalian genomic sequence,
      with good specificity and excellent positional accuracy.
  eqtlmapt:
    description: Performs fast eQTL mediation analysis with adaptive permutation testing and generalized
      Pareto distribution for multiple testing correction
    was: eQTLMAPT is a fast and accurate eQTL mediation analysis with efficient permutation testing approaches.
      eQTLMAPT implements fast and accurate eQTL mediation analysis with efficient permutation procedures
      to control for multiple testing. eQTLMAPT provides adaptive permutation scheme which prunes the
      permutation process opportunely, and it models the null distribution using generalized Pareto distribution
      (GPD) trained from a few permutations.
  eqtlsingle:
    description: Discovers eQTLs from scRNA-seq data alone by detecting mutations and modeling expression
      with a ZINB model
    was: 'eQTLsingle is an R package for discovering eQTLs only with single cell RNA-seq (scRNA-seq) data,
      without genomic data.


      Discovering single-cell eQTLs from scRNA-seq data only.'
  ermer:
    description: Navigates, analyzes, and visualizes the Escherichia coli regulatory landscape using a
      graph database
    was: 'ERMer: A serverless platform for navigating, analyzing, and visualizing Escherichiacoli regulatory
      landscape through graph database.'
  erna-ido:
    description: Identifies human enhancer RNAs from de novo assembled transcriptomes and provides functional
      annotation via interactome networks
    was: eRNA-IDO is a computational platform for the identification, interactome discovery, and functional
      annotation of human enhancer RNAs. It comprises two modules, eRNA-ID and eRNA-Anno, to facilitate
      research on the biogenesis and functions of eRNAs.
  ernabase:
    description: Catalogues and annotates enhancer RNAs from human and mouse samples with regulatory analyses
    was: Comprehensive database for decoding the regulatory eRNAs in human and mouse.
  es-arcnn:
    description: Identifies enhancer strength from DNA sequences using data augmentation and a residual
      convolutional neural network
    was: ES-ARCNN is a tool for identifying enhancers' strength by using data augmentation and residual
      convolutional neural network
  esatac:
    description: Provides a complete preset pipeline for ATAC-seq data analysis, from raw reads to peak
      calling and footprinting
    was: framework and complete preset pipeline for quantification and analysis of ATAC-seq Reads. It
      covers raw sequencing reads preprocessing (FASTQ files), reads alignment (Rbowtie2), aligned reads
      file operations (SAM, BAM, and BED files), peak calling (F-seq), genome annotations (Motif, GO,
      SNP analysis) and quality control report.
  escdb:
    description: Collects human and mouse embryonic stem cell perturbation and ChIP datasets
    was: Database which collects human and mouse embryonic stem cell related datasets. These datasets
      cover perturbation (both knock-down and overexpression) and chromatin immunoprecipitation (ChIP)
      experiments in embryonic stem (ES) and carcinoma (EC) cell lines. Transcription factor binding data
      comes from various ChIP experiments (ChIP-PET, ChIP-chip, ChIP-seq).
  esearch3d:
    description: Propagates gene expression across 3D chromatin networks to predict active enhancers
    was: Propagating gene expression in chromatin networks to illuminate active enhancers.
  etenlnc:
    description: Identifies and analyzes known and novel lncRNAs to construct regulatory networks
    was: ETENLNC (End-To-End-Novel-NonCoding) is a lncRNA identification and analysis framework
  eucamod:
    description: Integrates genomics, transcriptomics, epigenetics, and variomics data for Eucalyptus
      trees with online analysis tools
    was: EucaMOD is a comprehensive multi-omics database for Eucalyptus trees, integrating genomics, transcriptomics,
      epigenetics, and variomics data. It provides a range of analysis tools and a tutorial page for data
      mining and genetic breeding research.
  eukaryotic_linear_motif:
    description: Annotates and detects eukaryotic linear motifs from protein sequences using a curated
      repository and prediction tool
    was: This computational biology resource mainly focuses on annotation and detection of eukaryotic
      linear motifs (ELMs) by providing both a repository of annotated motif data and an exploratory tool
      for motif prediction.
  evoaug:
    description: Improves generalization and interpretability of genomic deep neural networks with evolution-inspired
      data augmentations
    was: Improving generalization and interpretability of genomic deep neural networks with evolution-inspired
      data augmentations.
  evoaug_tf:
    description: Extends evolution-inspired data augmentations for genomic deep learning from PyTorch
      to TensorFlow
    was: Extending evolution-inspired data augmentations for genomic deep learning to TensorFlow.
  evoprinter:
    description: Discovers conserved DNA sequences shared among three or more orthologous DNAs using alignment
      algorithms
    was: Comparative genomics tool for discovering conserved DNA sequences that are shared among three
      or more orthologous DNAs.
  exodiversity:
    description: Resolves diverse protein-DNA footprints from ChIP-exo or ChIP-nexus data using a model-based
      framework that learns joint distributions over footprints and motifs
    was: ExoDIVERISTY is a tool that can be used to resolve diverse protein-DNA footprints from exonuclease
      based ChIP experiments such as ChIP-exo or ChIP-nexus.
  exomepeak:
    description: Analyses MeRIP-seq data to call peaks and perform differential RNA methylation analysis
      between two conditions
    was: 'The package is developed for the analysis of affinity-based epitranscriptome shortgun sequencing
      data from MeRIP-seq (maA-seq). It was built based on the MATLAB package (Meng, Jia, et al. "Exome-based
      analysis for RNA epigenome sequencing data." Bioinformatics 29.12 (2013): 1565-1567.) with new functions
      for differential analysis of two experimental conditions to unveil the dynamics in post-transcriptional
      regulation of the RNA methylome.'
  expansin-engineering-db:
    description: Integrates sequence, structure and functional data on expansins and their homologues
      from bacteria, fungi and plants
    was: Expansin Engineering Database integrates information on sequence, structure and function of expansins.
  expansion-network:
    description: Infers gene regulatory networks using explicit regulatory modules
    was: 'Automated inference of gene regulatory networks using explicit regulatory modules.


      This GitHub project provides the code for the network inference and model expansion procedures,
      along with all the related scripts used in the paper Automated Inference of Gene Regulatory Networks
      Using Explicit Regulatory Modules (non published).'
  expresso:
    description: Identifies target genes of transcription factors and computes expression correlations
      using curated Arabidopsis ChIP-Seq peak data
    was: identify and explore the binding of transcription factors to their target genes in plants using
      available ChIP-Seq data.
  extractcentralregions:
    description: Extracts central regions from ChIP-seq peaks
    was: Extract central regions of ChIP-seq peaks.
  ezgeno:
    description: Automatically searches network structures and parameters for deep learning models on
      1D genomic data such as sequences and histone modifications
    was: ezGeno is an open source genomics data analysis package based on deep learning for auto tuning
      network structure and building models.
  f-seq:
    description: Generates a continuous tag sequence density estimation from ChIP-seq or DNase-seq data
      to identify transcription factor binding sites or open chromatin regions
    was: F-seq is a software package that generates a continuous tag sequence density estimation based
      on tag sequencing to identify specific sequence features such as transcription factor binding sites
      (ChI-seq) or regions of open chromatin (DNase-seq).
  fabian-variant:
    description: Predicts the effect of DNA variants on transcription factor binding using TFFMs and PWMs
    was: FABIAN-variant uses transcription factor flexible models (TFFMs) and position weight matrices
      (PWMs) to predict the effect of DNA variants on transcription factor binding.
  fact-seq:
    description: Profiles histone modifications in formalin-fixed paraffin-embedded samples with low cell
      numbers using antibody-guided chromatin tagmentation and sequencing
    was: Profiling histone modifications in formalin-fixed paraffin-embedded samples with low cell numbers.
  factorbook:
    description: Provides an updated catalog of transcription factor motifs and candidate regulatory motif
      sites from ChIP-seq and HT-SELEX data
    was: An updated catalog of transcription factor motifs and candidate regulatory motif sites.
  fantabio:
    description: Provides functional annotations of cis-regulatory elements and non-coding RNAs from CAGE
      and perturbation data
    was: fanta.bio is a database providing functional genome annotations, particularly focusing on cis-regulatory
      elements (CREs) and their impact on gene regulation, with a focus on non-coding RNA and chromatin
      interactions.
  fantom:
    description: Provides an integrated view of cap analysis of gene expression and other genome-wide
      data to study transcriptional networks in mammalian cells
    was: The Functional Annotation Of the Mammalian Genome is a database for the transcriptional network
      that regulates macrophage differentiation. Data comes from cap analysis of gene expression, sequencing
      mRNA 5-ends with a second-generation sequencer to quantify promoter activities even in the absence
      of gene annotation. Additional genome-wide experiments complement the setup including short RNA
      sequencing, microarray gene expression profiling on large-scale perturbation experiments.
  fastsk:
    description: Computes gapped k-mer string kernels for sequence analysis using a fast Monte Carlo approximation
    was: FastSK is a tool for fast sequence analysis using gapped string kernels.
  fasttenet:
    description: Reconstructs gene regulatory networks from single-cell RNA sequencing data using a GPU-accelerated
      transfer entropy algorithm
    was: FastTENET is a GPU-accelerated implementation of the TENET algorithm for reconstructing gene
      regulatory networks from single-cell RNA sequencing data. It offers significant performance improvements
      over the original TENET algorithm and is available on GitHub.
  fccac:
    description: Assesses covariance between nucleic acid sequencing datasets using functional canonical
      correlation analysis
    was: An application of functional canonical correlation analysis to assess covariance of nucleic acid
      sequencing datasets such as chromatin immunoprecipitation followed by deep sequencing (ChIP-seq).
  fcngru:
    description: Locates transcription factor binding sites in DNA sequences using a fully convolutional
      network with a gated recurrent unit
    was: Locating Transcription Factor Binding Sites by combing Fully Convolutional Neural Network with
      Gated Recurrent Unit.
  fcscan:
    description: Clusters genomic sites based on user-defined window size, order, orientation, and distance
      criteria from GRanges, data frame, or VCF/BED files
    was: fcScan is a Bioconductor package aiming at clustering genomic features based on a defined window
      size and combination of sites. fcScan for detecting clusters of coordinates with user defined options.
  fgviewer:
    description: Visualizes functional features of human fusion genes at DNA, RNA, protein, and pathogenic
      levels from breakpoint coordinates or WGS data
    was: 'FGviewer is an online visualization tool for functional features of human fusion genes. FGviewer
      is aiming for the effective visualization of the functional features of fusion genes for better
      prioritization of therapeutic target selection. FGviewer provides functional feature annotations
      at four different levels: DNA-, RNA-, protein-, and pathogenic-levels. The same breakpoint line
      across four tiers will classify between FG involving or non-involving zone with multiple types of
      functional features. Those features include fusion mRNA and amino acid sequences based on the user’s
      breakpoint coordinates, swapped gene expression regulatory (i.e., transcription factor or miRNA
      binding sites), protein functional features (i.e., protein domains, protein- protein interactions,
      binding sites of all molecules, secondary structure level feature, etc.), clinically relevant variants,
      etc.'
  figeno:
    description: Generates publication-quality genomic figures with multi-region views, long reads, and
      epigenomic data support
    was: Figeno is a tool for generating publication-quality figures for genomics, focusing on multi-region
      views, long reads, and epigenomic data. It provides both a command-line interface and a graphical
      user interface and is available as a Python package.
  filer:
    description: Provides a harmonized, indexed, searchable collection of over 50,000 functional genomics
      datasets from over 20 sources, enabling querying and annotation of user data
    was: 'Large-scale, harmonized FunctIonaL gEnomics Repository.


      GIGGLE is a genomics search engine that identifies and ranks the significance of shared genomic
      loci between query features and thousands of genome interval files.


      Database with the most comprehensive harmonized, extensible, indexed, searchable human functional
      genomics data collection.


      Functional genomics repository (FILER) is a database developed by NIAGADS with the most comprehensive
      harmonized, extensible, indexed, searchable human functional genomics data collection across >20
      data sources:.'
  filtercontrol:
    description: Filters out peaks present in both ChIP and control datasets
    was: Filter out peaks present both in ChIP and Control dataset.
  find-tfbs:
    description: Identifies functional non-coding variants associated with complex human traits by scanning
      phased whole-genome sequences for transcription factor binding sites in open chromatin maps
    was: find-tfbs is a tool to identify functional non-coding variants associated with complex human
      traits using open chromatin maps and phased whole-genome sequences.
  findit2:
    description: Identifies influential transcription factors and their targets by integrating ChIP-seq,
      ATAC-seq, and RNA-seq data
    was: An R/Bioconductor package to identify influential transcription factor and targets based on multi-omics
      data.
  findpeaks:
    description: Identifies areas of enrichment and transcription factor binding sites from ChIP-seq data,
      and estimates DNA fragment size distributions
    was: The Vancouver Short Read Analysis Package (VSRAP) contains the FindPeaks application for Chip-Seq
      and RNA-Seq analysis, as well as utilities for SNP finding, working with aligned sequence files
      and a nascent database for storing SNPs across multiple libraries.
  findpromoter:
    description: Searches for a promoter motif and optionally an adapter sequence from a source species
      in a target species
    was: Program to search for a promoter motif and optionally, an adapter sequence from a source species
      on a target species.
  finsurf:
    description: Scores non-coding variants in the human genome for functional impact using random forests,
      with optional restriction to disease-gene-linked cis-regulatory elements
    was: 'FINSURF (Functional Identification of Non-coding Sequences Using Random Forests) is a tool designed
      to analyse lists of sequences variants in the human genome.

      It assigns a score to each variant, reflecting its functional importance and therefore its likelihood
      to disrupt the physiology of its carrier. FINSURF scores Single Nucleotide Variants (SNV), insertions
      and deletions. Among SNVs, transitions and transversions are treated separately. Insertions are
      characterised by a score given to each base flanking the insertion point. Deletions are characterised
      by a score at every deleted base. FINSURF can (optionally) use a list of known or suspected disease
      genes, in order to restrict results to variants overlapping cis-regulatory elements linked to these
      genes.


      For a variant of interest, users can generate a graphical representation of "feature contributions
      », showing the relative contributions of genomic, functional or evolutionary information to its
      score.'
  fire:
    description: Discovers and characterizes regulatory motifs using mutual information across genomes
      and data types
    was: A motif discovery and characterization program based on mutual information
  firstef:
    description: Predicts 5' terminal exons and promoters in the human genome using a decision tree of
      discriminant functions
    was: First Exon Finder (FirstEF) is a 5' terminal exon and promoter prediction program. It consists
      of different discriminant functions structured as a decision tree.
  fitom:
    description: Detects binding sites in DNA or RNA sequences by computing binding affinity from user-provided
      binding sequences
    was: Computer program for the detection of binding sites in DNA or RNA sequences. It implements several
      methods described in the literature to compute an approximation of binding affinity for a particular
      site based on a collection of binding sequences provided by the user.
  fits:
    description: Imputes sparse and noisy single-cell open chromatin profiles using a forest of imputation
      trees
    was: 'Forest of imputation trees for recovering true signals in single-cell open chromatin profiles.


      Forest of Imputation Trees (FITs) is a method to impute highly sparse and noisy data-sets from single
      cell epigenome profiling.


      FITs work in two phases. It has been made so to handle very large read-count matrixes and to get
      better imputation. In phase-1 it builds multiple imputation trees and from every tree it extracts
      1 or 2 imputed version of original read-count matrix. One can run phase-1 of FITs in parallel processing
      mode also, where multiple trees can be build using several processors.After phase-1, the phase-2
      part of FITs is used to accumulate the most relevant imputed version for every cell.'
  fivex:
    description: Interactive browser for exploring tissue-specific eQTLs and interpreting trait-associated
      variants
    was: 'An interactive multi-tissue eQTL browser.


      FIVEx: Functional Interpretation and Visualization of Expression.'
  flexflux:
    description: Combines metabolic flux and regulatory network analyses by using regulatory steady-states
      as constraints for flux balance analysis
    was: Combining metabolic flux and regulatory network analyses.
  flnc:
    description: Identifies novel full-length long noncoding RNAs from RNA-seq data using machine learning
      without requiring transcriptional initiation profiles
    was: Machine Learning Improves the Identification of Novel Full-length Long Noncoding RNAs from RNA
      Sequencing Data Without Transcriptional Initiation Profiles.
  flowtime:
    description: Analyses dynamic and steady-state flow cytometry data from fluorescent reporter experiments
      in yeast
    was: This package was developed for analysis of both dynamic and steady state experiments examining
      the function of gene regulatory networks in yeast (strain W303) expressing fluorescent reporter
      proteins using a BD Accuri C6 and SORP cytometers. However, the functions are for the most part
      general and may be adapted for analysis of other organisms using other flow cytometers.
  flyfactorsurvey:
    description: Provides DNA binding specificities and recognition motifs for Drosophila transcription
      factors determined using the bacterial one-hybrid system
    was: A database of DNA binding specificities for Drosophila transcription factors determined using
      the bacterial one-hybrid system. The database provides to recognition motifs and position weight
      matrices for TFs. Search tools and flat file downloads are provided to retrieve binding site information
      for individual TFs, groups of TFs or for all TFs with characterized binding specificities.
  flyode:
    description: Systematically assembles and interactively visualizes gene regulatory networks from literature-curated
      data on Drosophila eye development
    was: Systematic assembly of data on Drosophila melanogaster eye development. It consists of data on
      eye development obtained from the literature, and a web interface for users to interactively display
      these data as a gene regulatory network.
  flyrnai:
    description: Tracks production of RNAi reagents and screen results for Drosophila cells
    was: Database of Dorsophila RNA interference (RNAi) Screening Center.
  flyterminalia:
    description: A database of transcription factor expression patterns in Drosophila melanogaster male
      pupal terminalia
    was: A database of gene expression patterns in the Drosophila terminalia. An Atlas of Transcription
      Factors Expressed in Male Pupal Terminalia of Drosophila melanogaster.
  flytf:
    description: Database of computationally predicted and experimentally verified site-specific transcription
      factors in Drosophila melanogaster
    was: Database of computationally predicted and/or experimentally verified site-specific transcription
      factors (TFs) in the fruit fly Drosophila melanogaster. This database contains information on the
      manual curation of 1052 FlyBase identifiers, which are putative site-specific transcription factors,
      based on FlyBase/Gene Ontology annotation or the DBD Transcription Factor Database.
  fmsclusterfinder:
    description: Detects and identifies clusters of sequential motifs with varying characteristics inside
      genomic sequences
    was: A new tool for detection and identification of clusters of sequential motifs with varying characteristics
      inside genomic sequences.
  footer:
    description: Analyses homologous mammalian promoter sequences for transcription factor binding sites
      using position-specific scoring matrices from TRANSFAC
    was: Analyse a pair of homologous mammalian DNA sequences (i.e. human and mouse/rat) for high probability
      binding sites of known transcription factors. A set of Position-Specific Scoring Matrices (PSSM)
      has been carefully constructed from mammalian transcription factor binding sites deposited in TRANSFAC
      database.
  forge2:
    description: Identifies tissue- and cell type-specific regulatory signals from GWAS SNPs using an
      expanded atlas of regulatory element annotations including DNase I hotspots, histone marks, and
      chromatin states
    was: FORGE2 uses an expanded atlas of cell type-specific regulatory element annotations, including
      DNase I hotspots, five histone mark categories and 15 hidden Markov model (HMM) chromatin states,
      to identify tissue- and cell type-specific signals.
  fugu-sg:
    description: Provides a complete draft sequence, annotations, comparative genomics, and tools for
      the fugu genome
    was: Lots of information on fugu including complete draft sequence, annotations, comparative vertebrate
      genomics, phylogenies, publications, and information about the fugu genome project; has some very
      useful tools including annotation tools, an Ensembl mirror, and BLAST.
  funchip:
    description: Preprocesses and smooths ChIP-seq peaks, then classifies them by shape using a k-mean
      alignment algorithm
    was: Preprocessing and smoothing of ChIP-Seq peaks and efficient implementation of the k-mean alignment
      algorithm to classify them.
  funcisnp:
    description: Integrates GWAS, 1000 Genomes, and chromatin features to identify functional SNPs in
      coding or non-coding regions
    was: It integrates information from GWAS, 1000genomes and chromatin feature to identify functional
      SNP in coding or non-coding regions.
  funpart:
    description: Partitions heterogeneous cell populations into functionally distinct subpopulations and
      identifies modules of functionally relevant genes for each from single-cell data
    was: FunPart is a computational tool that partitions heterogeneous cell populations into functionally
      distinct subpopulations and simultaneously identifies modules of functionally relevant set of genes
      for each of them.
  funsip:
    description: Predicts functional sites such as splice sites, translation start sites, and stop codons
      in DNA sequences using an ab initio classification approach
    was: A modular and extensible classifier for the prediction of functional sites in DNA.
  fxr:
    description: Performs meta-analysis and consolidation of FXR ChIP-seq data across species and conditions
      to create a unified binding atlas
    was: Meta-analysis and Consolidation of Farnesoid X Receptor Chromatin Immunoprecipitation Sequencing
      Data Across Different Species and Conditions.
  g4snvhunter:
    description: Identifies genomic sequences with G4-forming propensity and screens SNVs for potential
      to destabilize G4 structures using the G4Hunter algorithm
    was: G4SNVHunter is an R/Bioconductor package designed to identify genomic sequences with G4-forming
      propensity and to screen single nucleotide variants (SNVs) for their potential to destabilize G4
      structures. It leverages the G4Hunter algorithm and is used to investigate how genetic variants
      might influence biological functions by impacting G4 formation.
  gadem:
    description: Discovers de novo DNA motifs from large ChIP-seq datasets using a genetic algorithm and
      expectation-maximization
    was: Unbiased de novo motif discovery tool implementing an expectation-maximization (EM) algorithm.
  gcapc:
    description: Calls peaks from ChIP-seq data while accounting for GC bias using generalized linear
      mixture models
    was: Peak calling for ChIP-seq data with consideration of potential GC bias in sequencing reads. GC
      bias is first estimated with generalized linear mixture models using effective GC strategy, then
      applied into peak significance estimation.
  gcmodeller:
    description: Models and analyzes genomics data with CAD-based design for systems biology
    was: 'GCModeller: genomics CAD(Computer Assistant Design) Modeller System'
  gcsenet:
    description: Predicts miRNA-disease associations using an ensemble of GCN, CNN and SENet on a heterogeneous
      graph of diseases, genes and miRNAs
    was: GCSENet is a novel learning-based framework for miRNA-disease association identification via
      graph convolutional neural networks, convolutional neural networks, Squeeze-and-Excitation Networks(SENet).
  gcup:
    description: Predicts HIV-1 coreceptor usage from next-generation sequencing data using GPU acceleration
    was: Rapid GPU-based HIV-1 coreceptor usage prediction for next-generation sequencing.
  gdesigner:
    description: Designs synthetic gRNAs for CRISPRi applications from FASTA-formatted DNA sequences
    was: gDesigner is a Python pipeline for designing synthetic gRNAs for CRISPRi applications. The pipeline
      takes an input list of DNA sequences in FASTA format, and after various screening steps, returns
      a list of orthogonal gRNAs.
  geees:
    description: Infers cell-specific gene-enhancer interactions from multi-modal single-cell transcriptome
      and chromatin accessibility data
    was: GEEES is a computational tool for inferring cell-specific gene-enhancer interactions from multi-modal
      single-cell data, evaluating performance against benchmark datasets and providing enhanced cell
      representation learning.
  genavos:
    description: Models and analyzes cancer gene regulatory networks from gene expression time series
      using delayed nonlinear variable order fractional systems
    was: 'A New Tool for Modelling and Analyzing Cancer Gene Regulatory Networks Using Delayed Nonlinear
      Variable Order Fractional System.


      Gene Regulatory Network Analysis by Variable Fractional Order Systems.'
  geneci:
    description: Uses an evolutionary algorithm to determine the optimal ensemble of machine learning
      techniques for inferring gene regulatory networks from expression data
    was: GENECI (GEne NEtwork Consensus Inference) is a software package whose main functionality consists
      of an evolutionary algorithm to determine the optimal ensemble of machine learning techniques for
      genetic network inference based on the confidence levels and topological characteristics of its
      results.
  genedmrs:
    description: Detects differentially methylated regions based on genes, CpG islands and their interactions
      from methylation data
    was: 'an R package for Gene-based Differentially Methylated Regions analysis.


      Gene-based differentially methylated regions analysis.


      GeneDMRs is an R package to detect the differentially methylated regions based on genes (DMG), gene
      body (DMP, DME, DMI), CpG islands and gene body interacted with CpG island features (e.g., DMG/DMP/DME/DMI_CpG
      island and DMG/DMP/DME/DMI_CpG island shore).'
  genefatt:
    description: Computes attractors in synchronous and asynchronous Boolean network models of genetic
      regulatory networks
    was: Tool that can compute all attractors in synchronous dynamic models and asynchronous dynamic models.
      It is helpful for biologist to deep understand the genetic regulatory networks.
  genelink_scRNAseq:
    description: Predicts gene regulatory interactions from scRNA-seq data using a graph attention network
      and gene linkage topology
    was: A supervised GRN inference framework, GENELink, to predict potential interactions from scRNA-seq
      data and gene linkage topology.
  genenetfinder:
    description: Infers dynamic gene regulatory interactions and their temporal order from time-series
      gene expression data using R1 and R2 scores
    was: Software to qualitatively infer dynamic gene regulatory interactions from gene expression data.
      From the time-series data of gene expression, the software identifies not only gene regulatory interactions
      but also the temporal aspects of the regulatory interactions using two types of scores, R1 and R2.
      As for the temporal aspect of gene regulatory relations, it identifies the order of the gene regulatory
      relations and the pace of the relations.
  genenetworkbuilder:
    description: Discovers direct or indirect targets of transcription factors by integrating ChIP-chip
      or ChIP-seq with microarray or RNA-seq expression data to generate regulatory networks
    was: Appliation for discovering direct or indirect targets of transcription factors using ChIP-chip
      or ChIP-seq, and microarray or RNA-seq gene expression data. Inputting a list of genes of potential
      targets of one TF from ChIP-chip or ChIP-seq, and the gene expression results, this tool generates
      a regulatory network of the TF.
  genepath:
    description: Automates construction of genetic networks from mutant data using expert-defined patterns
    was: Tool for automated construction of genetic networks and proposal of genetic experiments from
      mutant data.
  geneprof:
    description: Analyses RNA-seq and ChIP-seq data through a web-based graphical interface with integrated
      database
    was: Web-based, graphical software suite and database resource for high-throughput-sequencing experiments
      (RNA-seq and ChIP-seq).
  geneset2mirna:
    description: Identifies miRNA regulatory activity within an input gene list by outputting miRNA-regulatory
      models
    was: GeneSet2miRNA is a web based tool for identification of miRNA regulatory activity within an input
      gene list. A list of miRNA regulatory models is output.
  genetrank:
    description: Prioritizes genes from single-cell analyses for their role in drug pharmacodynamics using
      random walks with restarts and absorbing states on a protein interaction network
    was: 'Gene prioritization based on random walks with restarts and absorbing states, to define gene
      sets regulating drug pharmacodynamics from single-cell analyses.


      Reranked gene lists. Our final product is the set of top genes defined by (Def. def-genetrank),
      possibly accumulated over several values of the restart rate (Def. eq-topkler).'
  genextender:
    description: Annotates histone modification ChIP-seq peaks with genes by extending gene boundaries
      to incorporate cis-regulatory elements
    was: This tool annotates a histone modification ChIP-seq peak input file with functionally important
      genomic features (e.g., genes associated with peaks) based on optimization calculations. It extends
      the boundaries of every gene in a genome by some distance in DNA base pairs, incorporating cis-regulatory
      elements (CREs), such as enhancers and promoters, as well as downstream elements that are important
      to the function of the gene relative to an epigenetic histone modification ChIP-seq dataset.
  genezilla:
    description: Predicts protein-coding genes in eukaryotic DNA using interpolated Markov models and
      maximal dependence decomposition
    was: Highly reconfigurable gene finder written in C++. Graph-theoretic representations of the high
      scoring open reading frames are provided, allowing for exploration of sub-optimal gene models. It
      utilizes Interpolated Markov Models (IMMs), Maximal Dependence Decomposition (MDD), and includes
      states for signal peptides, branch points, TATA boxes, CAP sites, and will soon model CpG islands
      as well.
  genie3:
    description: Infers gene regulatory networks from expression data using tree-based ensemble methods
      Random Forests or Extra-Trees
    was: Algorithm for the inference of gene regulatory networks from expression data. It decomposes the
      prediction of a regulatory network between p genes into p different regression problems. In each
      of the regression problems, the expression pattern of one of the genes (target gene) is predicted
      from the expression patterns of all the other genes (input genes), using tree-based ensemble methods
      Random Forests or Extra-Trees.
  genogam:
    description: Models ChIP-Seq read counts as smooth functions using generalized additive models for
      base-level and region-wise differential occupancy analysis
    was: This package allows statistical analysis of genome-wide data with smooth functions using generalized
      additive models based on the implementation from the R-package 'mgcv'. It provides methods for the
      statistical analysis of ChIP-Seq data including inference of protein occupancy, and pointwise and
      region-wise differential analysis. Scaling of generalized additive model fitting to whole chromosomes
      is achieved by parallelization over overlapping genomic intervals.
  genome_surveyor:
    description: Discovers and analyzes cis-regulatory elements and transcription factor binding targets
      in Drosophila using motif-based predictions
    was: Tool for discovery and analysis of cis-regulatory elements and transcription factors in Drosphila
      built on the GBrowse genome browser.
  genomepaint:
    description: Explores coding and non-coding variants in cancer through interactive visualization
    was: Exploration of Coding and Non-coding Variants in Cancer Using GenomePaint.
  genomesidekick:
    description: Analyzes and visualizes RNA-seq, ATAC-seq, and ChIP-seq data through an interactive graphical
      interface
    was: The genomeSidekick data analysis tool is a simple and efficient application that allows users
      to analyze and visualize RNA-seq and ATAC-seq data without having to learn the nitty gritty bioinformatics.
      This document will provide a comprehensive overview of the functions and capabilities of each tab
      within the application. For your convenience, the app can be used both online as a website or locally
      run in your RStudio. If you run into any problems while using the app in RStudio, refer to the Troubleshooting
      section to see some common errors and solutions that may occur.
  genometrafac:
    description: Detects transcription factor binding site clusters in conserved non-coding regions of
      gene orthologs between two genomes
    was: Comparative genomics based resource for initial characterization of gene models and the identification
      of putative cis-regulatory regions of RefSeq gene orthologs.
  genomictools:
    description: Analyzes and manipulates high-throughput sequencing data such as RNA-seq and ChIP-seq
      with a command-line set of tools and C++ API
    was: GenomicTools is a platform for the analysis and manipulation of high-throughput sequencing data
      such as RNA-seq and ChIP-seq.
  genosa:
    description: Reconstructs quantitative gene regulatory networks from microarray data and connectivity
      information using a global optimization algorithm
    was: Several tools to perform reconstruction of gene regulatory networks from microarray data and
      connectivity information.
  genova:
    description: Analyses and visualises chromosome conformation capture data, including compartment and
      insulation score analysis, with annotated heatmaps and aggregate signal plots
    was: 'Here, we present GENome Organisation Visual Analytics (GENOVA): a software suite to perform
      in-depth analyses on various levels of genome organisation, using Hi-C data. GENOVA facilitates
      the comparison between multiple datasets and supports the majority of mapping-pipelines.


      The increase in interest for Hi-C methods in the chromatin community has led to a need for more
      user-friendly and powerful analysis methods. The few currently available software packages for Hi-C
      do not allow a researcher to quickly summarize and visualize their data. An easy to use software
      package, which can generate a comprehensive set of publication-quality plots, would allow researchers
      to swiftly go from raw Hi-C data to interpretable results.'
  getintrons:
    description: Extracts introns from a set of transcripts
    was: Get the introns of a set of transcripts.
  ggea:
    description: Detects consistently and coherently enriched gene sets using directed gene regulatory
      networks
    was: Intuitive method to detect consistently and coherently enriched gene sets, based on prior knowledge
      derived from directed gene regulatory networks.
  ggmotif:
    description: Extracts and visualizes motifs from MEME output files, integrating with phylogenetic
      data in R
    was: An R Package for the extraction and visualization of motifs from MEME software.
  gibbs-motif-sampler:
    description: Finds motifs and their optimum width in DNA sequences via Gibbs sampling
    was: Finds motifs and the optimum width via Gibbs sampling.
  gibbs_motif_sampler:
    description: Identifies conserved motifs in DNA or protein sequences, such as transcription factor
      binding sites
    was: Gibbs Motif Sampler allows you to identify motifs, conserved regions, in DNA or protein sequences.  This
      tool can be applied for the detection of transcription factor binding sites (TFBS).
  gidetector:
    description: Detects genomic islands in prokaryotic genomes using decision-tree based ensemble classifiers
      trained on multiple genome features
    was: Software that is used to detect genomic islands in prokaryotic genomes. It collects prokaryotic
      genome data from public websites based on users’ specification, analyzes genome features using multiple
      sources, including embedded third-party software Alien_hunter and REPuter, and predict genomic islands
      based on our trained models, which are decision-tree based ensemble classifiers.
  gimmemotifs:
    description: Predicts motifs de novo from ChIP-seq data using an ensemble of tools and clusters them
      by WIC similarity
    was: GimmeMotifs is a de novo motif prediction pipeline, especially suited for ChIP-seq datasets.
      It incorporates several existing motif prediction algorithms in an ensemble method to predict motifs
      and clusters these motifs using the WIC similarity scoring metric.
  ginsim:
    description: Models and simulates genetic regulatory networks using a logical formalism
    was: Computer tool for the modeling and simulation of genetic regulatory networks.
  glassgo:
    description: Finds sRNA homologs from scratch using iterative BLAST searches, pairwise identity filtering,
      and structure-based clustering
    was: GLobal Automated sRNA Search go, combines iterative BLAST searches, pairwise identity filtering,
      and structure based clustering in an automated prediction pipeline to find sRNA homologs from scratch.
      The web server provides predefined parameter sets for a non-expert usage as well as enables a manual
      setup of the query parameters. The returned GLASSgo result is in FASTA format, whereby the first
      entry represents the input sequence.
  gleaner:
    description: Integrates and visualizes transcriptomic and epigenomic data for human and mouse germline
      cycles
    was: GLEANER is a web server for GermLine cycle Expression ANalysis and Epigenetics Roadmap visualization.
      GLEANER provides a comprehensive collection of the transcriptome, DNA methylome, chromatin accessibility,
      and H3K4me3, H3K27me3, and H3K9me3 histone modification characteristics in human and mouse germline
      cycles.
  globalmit:
    description: Learns globally optimal dynamic Bayesian network structures from gene expression data
      using the mutual information test criterion
    was: Learning Globally Optimal Dynamic Bayesian Network with the Mutual Information Test (MIT) Criterion
  glytoucan:
    description: Assigns globally unique accession numbers to glycan structures at any resolution level
    was: 'The international glycan repository GlyTouCan version 3.0.


      GlyTouCan is the international glycan structure repository. This repository is a freely available,
      uncurated registry for glycan structures that assigns globally unique accession numbers to any glycan
      independent of the level of information provided by the experimental method used to identify the
      structure(s). Any glycan structure, ranging in resolution from monosaccharide composition to fully
      defined structures can be registered as long as there are no inconsistencies in the structure.'
  gm_gcn:
    description: Predicts cancer driver genes by embedding a gene-miRNA regulatory network with a graph
      convolutional model
    was: Prediction of cancer driver genes based on gene-miRNA regulatory network with graph convolutional
      model
  gna:
    description: Models and simulates genetic regulatory networks using regulatory interactions and gene
      expression data
    was: Computer tool for the qualitative modeling and simulation of genetic regulatory networks. It
      assists you in constructing a model of a genetic regulatory network using knowledge about regulatory
      interactions in combination with gene expression data. Moreover, it allows you to simulate the qualitative
      behavior of the network in response to external perturbations.
  gnet2:
    description: Constructs gene regulatory networks from transcriptomic data using a probabilistic graphical
      model
    was: 'An R package for constructing gene regulatory networks from transcriptomic data.


      Gene regulatory network modeling tool (GNET2).


      GNET2 has been developed and used by the Bioinformatics, Data Mining and Machine Learning Laboratory
      (BDM) . Help from every community member is very valuable to make the package better for everyone.
      Checkout the Lab Page.'
  gniplr:
    description: Infers gene regulatory networks from time-series or non-time-series gene expression data
      using projection and lagged regression
    was: 'Inference of gene regulatory networks using pseudo-time series data.


      GNIPLR (gene networks inference based on projection and lagged regression) is a method for constructing
      gene regulatory network.'
  gnocis:
    description: Combines DNA sequence feature sets with machine learning methods for genome-wide prediction
      of cis-regulatory elements
    was: Gnocis, a Python package that streamlines the analysis and the modelling of CRE sequences by
      providing extensible APIs and implementing the glue required for combining feature sets and models
      for genome-wide prediction.
  goegcn:
    description: Classifies breast cancer subtypes from RNA-Seq data using weighted differentially expressed
      genes and gene coexpression network enrichment
    was: 'RNA-Seq-Based Breast Cancer Subtypes Classification Using Machine Learning Approaches.


      Paper: RNA-Seq-based breast cancer subtype classification using machine learning approaches.'
  gopeaks:
    description: Calls peaks from CUT&TAG/CUT&RUN histone modification data using a sliding window approach
    was: GoPeaks is a peak caller designed for CUT&TAG/CUT&RUN sequencing data. GoPeaks by default works
      best with narrow peaks such as H3K4me3 and transcription factors. However, broad epigenetic marks
      like H3K27Ac/H3K4me1 require different the step, slide, and minwidth parameters. We encourage users
      to explore the parameters of GoPeaks to analyze their data.
  gothic:
    description: Detects significant distal genomic interactions from Hi-C data using a cumulative binomial
      test
    was: This is a Hi-C analysis package using a cumulative binomial test to detect interactions between
      distal genomic loci that have significantly more reads than expected by chance in Hi-C experiments.
      It takes mapped paired NGS reads as input and gives back the list of significant interactions for
      a given bin size in the genome.
  gpminer:
    description: Identifies promoter regions and annotates regulatory features such as CpG islands and
      TF binding sites in mammalian gene sequences
    was: Integrated system for identifying promoter regions and annotating regulatory features in user-input
      sequences.
  gpro:
    description: Designs promoters using a generative AI-empowered toolkit with training, optimization,
      and evaluation pipelines
    was: Generative AI-empowered toolkit for promoter design.
  gps:
    description: Predicts protein-DNA interaction events at high spatial resolution from ChIP-seq data
      using a complexity penalized mixture model
    was: High spatial resolution peak detection algorithm for ChIP-seq data.
  gpsa:
    description: A database of transcriptomic data from human cell line gene perturbations, with a tool
      to identify causal perturbations from differential expression data
    was: GPSAdb 2.0 is a comprehensive database providing transcriptomic data from gene perturbations
      in human cell lines, enabling exploration of gene function and regulatory networks.
  gpsmatch:
    description: Compares ChIP-seq peak similarity between transcriptional regulators using Jaccard index
      with statistical significance testing
    was: An R Package for Comparing Genomic-binding Profile Similarity among Transcriptional Regulators
      using Customizable Databases.
  gpumotif:
    description: Accelerates motif scanning and de novo motif finding using GPU parallelization and a
      fragmentation technique to hide data transfer time
    was: GPU-accelerated ultra-fast and energy-efficient motif analysis program.
  gpuzoo:
    description: Estimates gene regulatory networks using GPU-accelerated calculations for faster, cheaper
      inference
    was: Cost-effective estimation of gene regulatory networks using the Graphics Processing Unit.
  grafimo:
    description: Scans pangenome variation graphs for transcription factor motif occurrences using Position
      Weight Matrices, accounting for SNPs, indels, and structural variants
    was: 'GRAph-based Finding of Individual Motif Occurrences.


      GRAFIMO (GRAph-based Finding of Individual Motif Occurrences) is a command-line tool that extends
      the traditional Position Weight Matrix (PWM) scanning procedure to VGs. GRAFIMO can search the occurrences
      of a given PWM in many genomes in a single run, accounting for the effects that SNPs, indels and
      potentially any structural variation (handled by VG) have on found potential motif occurrences.
      As result, GRAFIMO produces a report containing the statistically significant motif candidates found,
      reporting their frequency within the haplotypes embedded in the scanned VG and if they contain genomic
      variants or belong to the reference genome sequence.'
  grand-database:
    description: Provides a database of gene regulatory network models across human conditions with tools
      for enrichment analysis and drug matching
    was: GRAND is a collection of gene regulatory networks derived from human tissues, cancer, cell lines,
      and small molecule drugs. These networks are bipartite graphs linking either transcription factors
      (TFs) or miRNAs to their target genes. GRAND includes an integrated webserver to test for enrichment
      of a list of TFs in a set of libraries as well as a tool (CLUEreg) to find compounds that reverse/exacerbate
      a gene or TF regulatory profile.
  granie:
    description: Reconstructs cell-type-specific enhancer-mediated gene regulatory networks from chromatin
      accessibility and RNA-seq data
    was: R package for reconstruction cell type specific gene regulatory networks including enhancers
      using chromatin accessibility and RNA-seq data.
  granpa:
    description: Assesses the biological relevance of TF-gene regulatory networks by predicting cell-type-specific
      differential expression
    was: R package for assessing the biological relevance of any TF-Gene GRNs using a machine learning
      framework to predict cell-type specific differential expression.
  graphreg:
    description: Predicts gene expression from epigenomic data or DNA sequence using graph attention networks
      and 3D chromatin interactions
    was: Chromatin interaction-aware gene regulatory modeling with graph attention networks.
  graphsim:
    description: Simulates gene expression data from graph structures of biological pathways using igraph
      networks
    was: 'An R package for simulating gene expression data from graph structures of biological pathways.


      Simulate Expression Data from ''igraph'' Networks.'
  graphsite:
    description: Predicts protein-DNA binding sites from sequence using graph transformer and AlphaFold2-predicted
      structures
    was: GraphSite is a novel framework for sequence-based protein-DNA binding site prediction using graph
      transformer and predicted protein structures from AlphaFold2.
  graphtgi:
    description: Predicts transcription factor-target gene interactions using a graph attention-based
      autoencoder model on known interaction networks and gene features
    was: An attention-based graph embedding model for predicting TF-target gene interactions.
  greap:
    description: Performs enrichment analysis and annotation of human genomic regions using over 85,000
      reference sets across 11 data types
    was: A comprehensive enrichment analysis software for human genomic regions.
  great:
    description: Assigns biological functions to non-coding genomic regions by analyzing annotations of
      nearby genes
    was: Predicts functions of cis-regulatory regions. Many coding genes are well annotated with their
      biological functions. Non-coding regions typically lack such annotation. It assigns biological meaning
      to a set of non-coding genomic regions by analyzing the annotations of the nearby genes.
  green-db:
    description: Annotates and prioritizes non-coding regulatory variants from whole-genome sequencing
      data using a database of 2.4 million regulatory elements
    was: 'A framework for the annotation and prioritization of non-coding regulatory variants in whole-genome
      sequencing.


      Genomic Regulatory Elements ENcyclopedia.


      This is the home of the GREEN-DB and companion tools (GREEN-VARAN).


      Genomic Regulatory Elements ENcyclopedia Database A collection of ~2.4M regulatory regions in the
      human genome, with information about controlled genes, tissues of activity and associated phenotypes.
      GREEN-DB is available for free for academic usage in a Zenodo repository.'
  greenscreen:
    description: Removes artifactual signals and enriches for true peaks from ChIP-seq and other genomic
      datasets using a simple filtering method
    was: A simple method to remove artifactual signals and enrich for true peaks in genomic datasets including
      ChIP-seq data.
  greg:
    description: Explores and visualizes regulatory networks of transcription factors, ncRNAs, and chromatin
      interactions from a graph database
    was: 'GREG-studying transcriptional regulation using integrative graph databases.


      Scripts related to GREG (Gene Regulation Graph Database) and its papers. Use GREG at: http://www.moralab.science/GREG/.


      (The Gene Regulation Graph Database).'
  gregor:
    description: Evaluates global enrichment of trait-associated variants in experimentally annotated
      epigenomic regulatory features
    was: Tool built to evaluate global enrichment of trait-associated variants in experimentally annotated
      epigenomic regulatory features.
  grelu:
    description: Provides a software framework for DNA sequence modeling and design, enabling pipelines
      for preprocessing, modeling, evaluation, interpretation, variant effect prediction, and regulatory
      element design
    was: gReLU is a software framework for DNA sequence modeling and design, enabling pipelines including
      data preprocessing, modeling, evaluation, interpretation, variant effect prediction, and regulatory
      element design.  It provides tools for advanced sequence modeling using deep learning approaches.
  grema:
    description: Infers emulated gene regulatory networks with confidence levels using an evolutionary
      modelling algorithm to handle underdetermined problems
    was: 'Modelling of emulated gene regulatory networks with confidence levels based on evolutionary
      intelligence to cope with the underdetermined problem.


      GREMA (Gene networks Reconstruction using Evolutionary Modelling Algorithm) is a program for inferring
      a novel type of gene regulatory network (GRN) with confidence levels for every inferred regulation,
      which is emulated GRN (eGRN). The higher the confidence level, the more accurate the inferred regulation.
      GREMA gradually determines the regulations of an eGRN with confidence levels in descending order
      using either an S-system or a Hill function-based ordinary differential equation model. It makes
      use of an evolutionary modelling algorithm (EMA) that is based on evolutionary intelligence, including
      both crowd wisdom and an evolutionary strategy, to cope with the underdetermined problem. EMA uses
      an intelligent genetic algorithm to solve the large-scale parameter optimisation problem.'
  grenadine:
    description: Infers gene regulatory networks from gene expression data using 18 machine learning methods
      and preprocessing techniques
    was: A Data-Driven Python Library to Infer Gene Regulatory Networks from Gene Expression Data.
  grenits:
    description: Infers gene regulatory networks from time-series expression data using Dynamic Bayesian
      Networks and Gibbs Variable Selection
    was: 'The package offers four network inference statistical models using Dynamic Bayesian Networks
      and Gibbs Variable Selection: a linear interaction model, two linear interaction models with added
      experimental noise (Gaussian and Student distributed) for the case where replicates are available
      and a non-linear interaction model.'
  greylistchip:
    description: Identifies and removes reads from high-signal input regions that cause spurious peaks
      in ChIP-seq experiments
    was: Identify regions of ChIP experiments with high signal in the input, that lead to spurious peaks
      during peak calling. Remove reads aligning to these regions prior to peak calling, for cleaner ChIP
      analysis.
  grgmf:
    description: Predicts links in biomedical bipartite networks using a graph regularized generalized
      matrix factorization model
    was: 'A graph regularized generalized matrix factorization model for predicting links in biomedical
      bipartite networks.


      This code is the implementation of GRGMF, which is both CPU and CUDA compatible(CUDA is preferred).'
  grgnn:
    description: Infers gene regulatory networks from gene expression data using supervised and semi-supervised
      graph neural networks
    was: 'Inductive Inference of Gene Regulatory Network Using Supervised and Semi-supervised Graph Neural
      Networks.


      GRGNN -- Gene Regulatory Graph Neural Network.


      Gene regulatory graph neural network (GRGNN): an end-to-end approach to reconstruct GRNs from scratch
      utilizing the gene expression data, in both a supervised and a semi-supervised framework.'
  grinch:
    description: Simultaneously smooths and detects topological domains from sparse Hi-C contact count
      matrices using constrained matrix factorization
    was: GRiNCH (Graph-Regularized NMF and Clustering for Hi-C) is a tool for simultaneous smoothing and
      detection of topological units of genome organization from sparse chromatin contact count matrices
      with matrix factorization.
  grins:
    description: Simulates gene regulatory network dynamics using RACIPE and Boolean Ising formalism with
      GPU acceleration
    was: GRiNS is a Python library for simulating gene regulatory network dynamics, integrating parameter-agnostic
      simulation frameworks like RACIPE and Boolean Ising formalism to enable efficient and scalable simulations.
  grisli:
    description: Infers gene regulatory networks from single-cell RNA-seq data using linear differential
      equations and velocity inference
    was: 'Gene regulation inference from single-cell RNA-seq data with linear differential equations and
      velocity inference.


      Gene Regulation Inference for Single-cell with LInear differential equations and velocity inference.


      Single-cell RNA sequencing (scRNA-seq) offers new possibilities to infer gene regulation networks
      (GRN) for biological processes involving a notion of time, such as cell differentiation or cell
      cycles.'
  grn-transformer:
    description: Reconstructs single-cell gene regulatory networks by leveraging bulk-cell transcriptomic
      data with a weakly supervised axial transformer
    was: Boosting single-cell gene regulatory network reconstruction via bulk-cell transcriptomic data.
  grnbenchmark:
    description: Benchmarks directed gene regulatory network inference methods using simulated datasets
      with multiple noise levels
    was: A web server for benchmarking directed gene regulatory network inference methods.
  grndb:
    description: Explores and visualizes predicted transcription factor-target gene regulatory networks
      from single-cell and bulk RNA-seq data across human and mouse conditions
    was: 'Decoding the gene regulatory networks in diverse human and mouse conditions.


      Gene Regulatory Network database.


      Gene regulatory networks are crucial for understanding the mechanism of gene expression regulation
      and expression heterogeneity. GRNdb is a freely accessible and user-friendly database for conveniently
      exploring and visualizing the predicted regulatory networks formed by transcription factors (TFs)
      and downstream target genes (termed regulons) based on large-scale RNA-seq data as well as the known
      TF-target relationships for various human and mouse conditions.'
  grnsight:
    description: Visualizes small- to medium-scale gene regulatory networks from Excel adjacency matrices,
      SIF, or GraphML files with automatic layout for weighted or unweighted graphs
    was: Web application and service for visualizing small- to medium-scale models of gene regulatory
      networks. It automatically lays out either an unweighted or weighted network graph based on an Excel
      input spreadsheet containing an adjacency matrix where regulators are named in the columns and target
      genes in the rows. It is best-suited for visualizing networks of fewer than 35 nodes and 70 edges
      and has general applicability.
  grnular:
    description: Reconstructs gene regulatory networks from single-cell RNA-seq data using an unrolled
      deep learning architecture
    was: 'Gene Regulatory Network reconstruction using Unrolled algorithm from Single Cell RNA-Sequencing
      data.


      Gene Regulatory Network reconstruction using Unrolled algorithms (Paper link and BibTex: TBD).


      Explore the notebook folder for a quick overview of the GRNUlar algorithm ran on jupyter notebook.'
  groovdb:
    description: A curated database of ligand-inducible transcription factors with sequence, ligand, and
      operator data for building genetic circuits
    was: A database of ligand-inducible transcription factors.
  grrann:
    description: Predicts phenotypes from gene expression data using a biological network-regularized
      artificial neural network
    was: A biological network-based regularized artificial neural network model for robust phenotype prediction
      from gene expression data.
  gse:
    description: Stores, visualizes, and analyzes ChIP-based transcription factor binding and gene expression
      data
    was: Database for storing, visualizing, and analyzing ChIP-based transcription factor binding data
      and gene expression data.
  gtftools:
    description: Calculates gene features including splice sites, independent introns, TSS-flanking regions,
      UTRs, and isoform lengths from ENSEMBL or GENCODE GTF files
    was: A software package for analyzing various features of gene models.
  gtrd:
    description: Integrates ChIP-seq, ChIP-exo, DNase-seq, MNase-seq, ATAC-seq and RNA-seq data to provide
      an integrated view of transcription regulation
    was: 'An integrated view of transcription regulation.


      ChIP-seq experiment information were collected in semi-automated way from literature, GEO and ENCODE.


      Raw ChIP-seq data in the form of fastq and SRA files were fetched from ENCODE and SRA databases.


      Clusters for the same TF revealed by different peak calling methods were joined into metaclusters.
      Metaclusters represent non-redundant set of transcription factor binding sites. The clustering algorithm
      used in GTRD is described in the main GTRD paper [6].'
  guidingnet:
    description: Predicts DNMT genome-wide binding by integrating gene expression, chromatin accessibility,
      sequence, and protein interaction data with network regularization
    was: 'revealing transcriptional cofactor and predicting binding for DNA methyltransferase by network
      regularization.


      GuidingNet is a method to reveal transcriptional cofactor and predict binding for DNA methyltransferase
      by network regularization.'
  gwas3d:
    description: Computes the probability of genetic variants affecting regulatory pathways by integrating
      chromatin state, functional genomics, sequence motifs, and conservation from GWAS data or variant
      lists
    was: GWAS3D web server computes the probability of genetics variants affecting regulatory pathways
      and underlying disease/trait associations by integrating chromatin state, functional genomics, sequence
      motif, and conservation information when given GWAS data or variant list. GWAS3D also provides comprehensive
      annotations and visualizations to help users interpreting the results.
  gwas4d:
    description: Evaluates GWAS signals and identifies context-specific regulatory variants using epigenomes,
      motif, and Hi-C data
    was: 'Systematically evaluates GWAS signals and identifies context-specific regulatory variants. The
      updated web server includes six major features: (i) updates the regulatory variant prioritization
      method with our new algorithm; (ii) incorporates 127 tissue/cell type-specific epigenomes data;
      (iii) integrates motifs of 1480 transcriptional regulators from 13 public resources; (iv) uniformly
      processes Hi-C data and generates significant interactions at 5 kb resolution across 60 tissues/cell
      types; (v) adds comprehensive non-coding variant functional annotations; (vi) equips a highly interactive
      visualization function for SNP-target interaction.'
  h4hichip-peaks:
    description: Calls enriched peak regions from HiChIP data using re-ligation sites for loop anchor
      discovery
    was: 'a HiChIP peak calling algorithm.


      This package can be used to find enriched peak regions from HiChIP datasets that can then be used
      as an input to available loop calling tools or to do differential peak analysis.'
  hTFtarget:
    description: Integrates ChIP-seq data to predict human transcription factor-target gene regulations
      and binding sites
    was: 'A comprehensive database for regulations of human transcription factors and their targets.


      Transcription factors (TFs) as key regulators could modulate the expression of target genes by binding
      to specific DNA sequences of their promoter(s) or enhancer(s)'
  haforest:
    description: Identifies haploinsufficient genes from epigenomic data using a deep forest model with
      multiscale scanning and cascade forest structure
    was: 'Identification of haploinsufficient genes from epigenomic data using deep forest.


      This tool is using HaForest algorithm to identify haploinsufficient genes.'
  haystack:
    description: Identifies hotspots of epigenetic variability, cell-type specific cis-regulatory elements,
      and associated transcription factors from epigenetic data
    was: Epigenetic Variability and Transcription Factor Motifs Analysis Pipeline.
  hba-deals:
    description: Simultaneously identifies differential expression and splicing from RNA-seq data using
      hierarchical Bayesian analysis
    was: 'Accurate and simultaneous identification of differential expression and splicing using hierarchical
      Bayesian analysis.


      Hierarchical Bayesian Analysis of Differential Expression and ALternative Splicing (HBA-DEALS).'
  heat_seq:
    description: Compares user-provided ChIP-seq, RNA-seq and CAGE experiments to public data using interactive
      correlation heatmaps at genome scale
    was: Web-tool that allows genome scale comparison of high throughput experiments (ChIP-seq, RNA-seq
      and CAGE) provided by a user, to the data in the public domain.
  heatmaps:
    description: Plots heatmaps of genome-wide data across genomic intervals, such as ChIP-seq signals
      at peaks or across promoters
    was: This package provides functions for plotting heatmaps of genome-wide data across genomic intervals,
      such as ChIP-seq signals at peaks or across promoters. Many functions are also provided for investigating
      sequence features.
  hematlas:
    description: Integrates multi-omics hematopoiesis data from humans, mice, zebrafish, and in vitro
      systems for interactive exploration and cross-species analysis
    was: HemAtlas is a multi-omics hematopoiesis database designed for mapping hematopoiesis across species
      and developmental stages. It integrates data from humans, mice, zebrafish, and HSPC in vitro culture
      systems, offering interactive exploration and visualization capabilities.
  hera:
    description: Provides expression, trait associations, regulators, and target genes for enhancer RNAs
      across 54 human tissues
    was: 'an atlas of enhancer RNAs across human tissues.


      The H uman e nhancer R NA A tlas (HeRA) provides the expression Landscape of enhancer RNA (eRNA)
      across 54 human tissues. An eRNA is a type of non-coding RNA transcribed from the enhancer region
      of DNA and plays important roles in shaping complex human traits and diseases. In this data portal,
      we provide four modules to explore eRNAs: Expression , associated Traits , potential Regulators
      , and potential Target Genes across human tissues.'
  hfaim:
    description: Identifies Atg8-interacting motifs in protein sequences using additional sequence constraints
      for high-fidelity genome-wide prediction
    was: A reliable bioinformatics approach for in silico genome-wide identification of autophagy-associated
      atg8-interacting motifs in various organisms.
  hgetgi:
    description: Predicts transcription factor-target gene interactions using a heterogeneous graph embedding
      model with random walk and skip-gram
    was: A heterogeneous graph embedding model for predicting interactions between transcription factor
      and target gene.
  hgv_pass:
    description: Detects transcription factor binding sites from ChIP data using a varying threshold method
      with multiple supporting tracks
    was: A tool that detects significant transcription factor binding sites from ChIP data.
  hhcdb:
    description: Archives human heterochromatin regions defined by histone modifications with genomic
      annotations and visualization
    was: Database of human heterochromatin regions.
  hichipdb:
    description: Provides annotated HiChIP regulatory interactions across cell types, tissues, and organs
      with GWAS SNP annotations
    was: A comprehensive database of HiChIP regulatory interactions.
  hiloop:
    description: Identifies, visualizes, and analyzes high-feedback loops in gene regulatory networks
      from large biological networks
    was: Identification, visualization, statistical analysis and mathematical modeling of high-feedback
      loops in gene regulatory networks.
  hint:
    description: Integrates DNase hypersensitivity and histone modification data with a hidden Markov
      model to detect active transcription factor binding sites
    was: HMM-based Identification of TF Footprints
  hippie:
    description: Analyzes Hi-C paired-end reads to predict enhancer–target gene interactions from mapping
      through quality control and interaction characterization
    was: Workflow for analyzing Hi-C paired-end reads in FASTQ format and predict enhancer–target gene
      interactions. HIPPIE streamlines the entire processing phase including reads mapping, quality control
      and enhancer–target gene prediction as well as characterizing the interactions.
  histonehmm:
    description: Analyses ChIP-seq data of histone modifications with broad genomic footprints using a
      bivariate Hidden Markov Model to call modified and differentially modified regions
    was: Analyse ChIP-seq data of histone modifications with broad genomic footprints like H3K27me3. It
      allows for calling modified regions in single samples as well as for calling differentially modified
      regions in a comparison of two samples.
  histrader:
    description: Identifies nucleosome free regions within histone modification peaks from ChIP-seq data
      to reduce DNA sequence length for motif analyses
    was: 'A Tool to Identify Nucleosome Free Regions from ChIP-Seq of Histone Post-Translational Modifications.


      A Tool to Identify Nucleosome Free Regions from ChIP-Seq Against Histone Modifications.


      USAGE: perl HISTRADER.pl --bedGraph ChIP.bedGraph --peaks ChIP.bed.'
  hlungdb:
    description: Integrates lung cancer-related genes, proteins, miRNAs, and clinical information with
      transcription factor-binding motifs, promoters, and SNP sites
    was: Database with the integration of the lung cancer-related genes, proteins and miRNAs together
      with the corresponding clinical information. Currently, 2585 genes and 212 miRNA have been collected
      with the experimental evidences involved in the different stages of lung carcinogenesis through
      text mining. The results from analysis of transcription factor-binding motifs, the promoters and
      the SNP sites for each gene are also included. Genes with epigenetic regulation were also included.
  hmcan:
    description: Detects histone modifications in cancer ChIP-seq data using a Hidden Markov Model with
      copy number, GC bias and noise correction
    was: 'Hidden Markov Model based tool that is developed to detect histone modification in cancer ChIP-seq
      data. It applies three correction steps to the data: copy number correction, GC bias correction
      and noise level correction.'
  hmrfbayeshic:
    description: Calls long-range chromatin interactions from Hi-C contact frequency matrices using a
      hidden Markov random field-based Bayesian method
    was: Hidden Markov random field based Bayesian peak caller to identify long range chromatin interactions
      from Hi-C data.
  hocomoco:
    description: Provides transcription factor binding models as position weight matrices for human and
      mouse, derived from ChIP-Seq data
    was: HOmo sapiens transcription factor COmprehensive MOdel COllection contains transcription factor
      (TF) binding models (motifs) as position weight matrices for human and mouse transcription factors.
  homer:
    description: Discovers regulatory motifs enriched in one set of sequences relative to another using
      ZOOPS scoring and hypergeometric calculations
    was: HOMER contains a novel motif discovery algorithm that was designed for regulatory element analysis
      in genomics applications (DNA only, no protein).  It is a differential motif discovery algorithm,
      which means that it takes two sets of sequences and tries to identify the regulatory elements that
      are specifically enriched in on set relative to the other.  It uses ZOOPS scoring (zero or one occurrence
      per sequence) coupled with the hypergeometric enrichment calculations (or binomial) to determine
      motif enrichment.  HOMER also tries its best to account for sequenced bias in the dataset.  It was
      designed with ChIP-Seq and promoter analysis in mind, but can be applied to pretty much any nucleic
      acids motif finding problem.
  hot_scan:
    description: Detects genomic regions unusually rich in a given pattern using scan statistics
    was: Free software to detect genomic regions unusually rich (hotspot) in a given pattern via scan
      statistics.
  hotnet:
    description: Finds significantly altered subnetworks in a large gene interaction network using a diffusion
      process and multiple hypothesis testing
    was: Algorithm for finding significanlty altered subnetworks in a large gene interaction network.
  hpeak:
    description: Identifies protein-interacting genomic regions from ChIP-seq data using a hidden Markov
      model-based peak-finding algorithm
    was: Hidden Markov model (HMM)-based Peak-finding algorithm for analyzing ChIP-seq data to identify
      protein-interacting genomic regions.
  hreg-cncc:
    description: Reconstructs a regulatory network in human cranial neural crest cells and annotates genetic
      variants in a developmental context
    was: hReg-CNCC reconstructs a regulatory network in human cranial neural crest cells and annotates
      variants in a developmental context.
  hrtbldb:
    description: A database of hormone receptor binding regions from in vivo ChIP experiments and in silico
      predicted binding motifs
    was: The Hormone Receptor Target Binding Loci, HRTBLDb database contains hormone receptor binding
      regions (binding loci) from in vivo ChIP-based high-throughput experiments as well as in silico,
      computationally predicted, binding motifs and cis-regulatory modules for the co-occurring transcription
      factor binding motifs, which are within a binding locus. It also contains individual binding sites
      whose regulatory action has been verified by in vitro experiments.
  hsmotifdiscover:
    description: Identifies motifs in sequences composed of non-single-letter elements by converting them
      to single-letter codes and using a modified Gibbs-sampling algorithm
    was: Identification of motifs in sequences composed of non-single-letter elements.
  hthmotif:
    description: Identifies transcription factor binding sites in prokaryotic genomes using a sequence-based
      method that groups TFs by critical residues and finds motifs in promoter regions
    was: HTHmotif is a novel sequence-based method for identifying transcription factor binding sites
      in prokaryotic genomes
  htseqtools:
    description: Provides quality assessment, processing and visualization tools for high-throughput sequencing
      data, with emphasis on ChIP-seq and RNA-seq
    was: We provide efficient, easy-to-use tools for High-Throughput Sequencing (ChIP-seq, RNAseq etc.).
      These include MDS plots (analogues to PCA), detecting inefficient immuno-precipitation or over-amplification
      artifacts, tools to identify and test for genomic regions with large accumulation of reads, and
      visualization of coverage profiles.
  human-ires-atlas:
    description: Integrates putative IRES elements and translation initiation-related features for studying
      cap-independent translation initiation in humans
    was: Human IRES Atlas is an integrative platform for studying IRES-driven translational regulation
      in humans.
  human-scatac-corpus:
    description: Provides a comprehensive database of over 5.4 million human scATAC-seq cells from 35
      datasets in multiple aligned formats for epigenomic research and method benchmarking
    was: Human-scATAC-Corpus is a comprehensive database of over 5.4 million human scATAC-seq cells from
      35 datasets, providing data in multiple formats for epigenomic research and method benchmarking.
  hyperchip:
    description: Identifies hypervariable ChIP-seq or ATAC-seq signals across samples using scaled variances
      that account for mean-variance dependence
    was: HyperChIP for calling hypervariable ChIP-seq signals across samples
  iDHS-DMCAC:
    description: Identifies DNase I hypersensitive sites using a balanced dinucleotide-based detrending
      moving-average cross-correlation coefficient
    was: Identifying DNase I hypersensitive sites with balanced dinucleotide-based detrending moving-average
      cross-correlation coefficient.
  iEnhancer-ECNN:
    description: Identifies enhancers and classifies their strength from DNA sequences using ensembles
      of convolutional neural networks
    was: 'Identifying enhancers and their strength using ensembles of convolutional neural networks.


      BACKGROUND:Enhancers are non-coding DNA fragments which are crucial in gene regulation (e.g. transcription
      and translation). Having high locational variation and free scattering in 98% of non-encoding genomes,
      enhancer identification is, therefore, more complicated than other genetic factors. To address this
      biological issue, several in silico studies have been done to identify and classify enhancer sequences
      among a myriad of DNA sequences using computational advances. Although recent studies have come
      up with improved performance, shortfalls in these learning models still remain. To overcome limitations
      of existing learning models, we introduce iEnhancer-ECNN, an efficient prediction framework using
      one-hot encoding and k-mers for data transformation and ensembles of convolutional neural networks
      for model construction, to identify enhancers and classify their strength.'
  iMARGI:
    description: Maps RNA-chromatin interactions by sequencing using the iMARGI protocol
    was: 'Mapping RNA-chromatin interactions by sequencing with iMARGI.


      Overview — iMARGI Pipeline 1.1 documentation.'
  iPro70-FMWin:
    description: Identifies Sigma70 promoters using multiple windowing and minimal features
    was: Identification of Sigma70 promoters using multiple windowing and minimal features.
  ianimal:
    description: Integrates and provides access to genome, transcriptome, and epigenome data across 21
      animal species
    was: A cross-species omics knowledgebase for animals.
  iaseq:
    description: Fits a correlation motif model to multiple RNA-seq or ChIP-seq studies to improve detection
      of allele-specific events and describe correlation patterns across studies
    was: It fits correlation motif model to multiple RNAseq or ChIPseq studies to improve detection of
      allele-specific events and describe correlation patterns across studies.
  ibm_pattern_discovery:
    description: Web server offering tools for pattern discovery in DNA, protein sequences, and text,
      plus alignment, gene discovery, and protein annotation
    was: Extensive server possessing a wide range of tools for pattern discovery in DNA and protein sequences
      as well as in text. Tools for multiple sequence alignment, gene discovery, protein annotation, and
      other applications also exist on this server. A detailed help page is provided for all tools.
  iceberg:
    description: Database of integrative and conjugative elements found in bacteria, with search and analysis
      tools
    was: Web-based resource for integrative and conjugative elements (ICEs) found in bacteria.
  icgec:
    description: Estimates epigenetic conservation of genes between two cell types using integrated signal
      from multiple histone modifications
    was: 'A comparative method for measuring epigenetic conservation of genes via the integrated signal
      from multiple histone modifications between cell types.


      Iterative Comparison of Gene Epigenetic Circumstance (ICGEC).


      Function: This script is to simultaneously estimate the epigenetic conservation of genes and the
      conservation of histone modifications between two cell lines or two conditions. It was purely written
      by R.'
  ichip:
    description: Identifies enriched genomic regions in ChIP-chip data using a hidden Ising model
    was: This package uses hidden Ising models to identify enriched genomic regions in ChIP-chip data.  It
      can be used to analyze the data from multiple platforms (e.g., Affymetrix, Agilent, and NimbleGen),
      and the data with single to multiple replicates.
  ichromo:
    description: Unsupervised analysis of chromosome movements from live imaging time-series data, including
      segmentation, motif discovery, and causality assessment
    was: Application for Unsupervised Analysis of Chromosome Movements in Meiosis.
  icis_i-cardio:
    description: Analyzes cardiovascular-related cis-regulatory elements from human and mouse epigenetic
      datasets with six analysis tools
    was: A comprehensive analysis platform for cardiovascular-relavant cis-regulation in human and mouse.
  icm_web:
    description: Assesses nucleosome stability and folds DNA sequences into chromatin templates using
      energy models and experimental footprints
    was: The Interactive Chromatin Modeling (ICM) web server is an interactive tool that allows users
      to rapidly assess nucleosome stability and fold sequences of DNA into putative chromatin templates.
  icn:
    description: Extracts interconnected communities from gene co-expression networks where subsets of
      genes correlate across communities
    was: 'Extracting interconnected communities in gene Co-expression networks.


      This is an implementation of ICN detection for gene co-expression network (GCN) in Matlab. In constrast
      to the community structure, we consider a pair of communities be interconnected if a subset of genes
      from one community is correlated with a subset of genes from another community. Please refer to
      the paper "Extracting Interconnected Communities in Gene co-expression Networks" for details.'
  icodon:
    description: Designs synonymous codon substitutions to customize mRNA stability and expression in
      vertebrate coding sequences
    was: iCodon is a tool for ideal codon design for customized gene expression.
  icr:
    description: Predicts conserved regulatory binding sites from ungapped multiple sequence alignments
      across related prokaryotic genomes
    was: Predict regulatory binding sites based on conservation across multiple species. The user provides
      an ungapped multiple sequence alignment representing the regulatory binding site. It reports back
      with predicted binding sites that are conserved and highlights the downstream co-regulated genes.
  icsf:
    description: Identifies conserved structural features at sequentially degenerate locations in transcription
      factor binding sites using base-pair step parameters from DNA crystal structures
    was: Identify conserved structural features at sequentially degenerate locations in transcription
      factor binding sites. ICSF uses base-pair step parameters obtained from a collection of high-resolution
      DNA crystal structures to discover structural conservation that exists in the sequentially degenerate
      areas within a binding site and produce profiles of the structural features along the entire site.
  icyp-mfe:
    description: Identifies human cytochrome P450 inhibitors using multitask learning and molecular fingerprint-embedded
      encoding
    was: Identifying Human Cytochrome P450 Inhibitors Using Multitask Learning and Molecular Fingerprint-Embedded
      Encoding.
  iddn:
    description: Infers trans-omics differential dependency networks to identify rewired molecules driving
      phenotypic transitions from multi-omics data
    was: iDDN is a Python package for integrative differential dependency network inference, enabling
      robust multi-omics network analysis to identify differentially wired molecules responsible for phenotypic
      transitions. It provides a user guide and is available on GitHub.
  idhs-deep:
    description: Predicts DNase I hypersensitive sites from DNA sequences using a deep neural network
    was: iDHS-Deep is an integrated tool for predicting DNase I hypersensitive sites by deep neural network.
  idirect:
    description: Infers direct dependencies in association networks from gene expression or microbial
      community data using copula-based transitivity
    was: iDIRECT (Inference of Direct and Indirect Relationships with Effective Copula-based Transitivity),
      for quantitatively inferring direct dependencies in association networks
  idna-abf:
    description: Predicts DNA methylations from genomic sequences using a multi-scale deep biological
      language learning model
    was: Multi-scale deep biological language learning model for the interpretable prediction of DNA methylations.
  idr2d:
    description: Identifies reproducible genomic interactions from chromatin interaction data such as
      ChIA-PET, HiChIP and Hi-C
    was: 'IDR2D identifies reproducible genomic interactions.


      Chromatin interaction data from protocols such as ChIA-PET, HiChIP and Hi-C provide valuable insights
      into genome organization and gene regulation, but can include spurious interactions that do not
      reflect underlying genome biology. We introduce an extension of the Irreproducible Discovery Rate
      (IDR) method called IDR2D that identifies replicable interactions shared by chromatin interaction
      experiments. IDR2D provides a principled set of interactions and eliminates artifacts from single
      experiments. The method is available as a Bioconductor package for the R community, as well as an
      online service at https: idr2d.mit.edu'
  ienhancer-dcla:
    description: Predicts enhancers and their strength from DNA sequences using a deep learning framework
      with word2vec, CNN, BiLSTM, and attention
    was: A prediction method based on deep learning is proposed to identify enhancers and enhancer strength,
      called iEnhancer-DCLA
  ienhancer-kl:
    description: Predicts enhancers and classifies them as strong or weak from DNA sequences using KL
      divergence-enhanced feature extraction and LASSO
    was: 'A novel two-layer predictor for identifying enhancer by position specific of nucleotide composition.


      An enhancer is a short region of DNA with the ability to recruit transcription factors and their
      complexes, thus increasing the likelihood of the transcription possibility. Considering the importance
      of enhancers, the enhancer identification was popular in computational biology. In this paper, we
      propose a two-layer enhancer predictor, called iEnhancer-KL. Kullback-Leibler (KL) divergence is
      taken into consideration to improve feature extraction method PSTNP. Furthermore, LASSO is used
      to reduce the dimension of features to get better prediction performance. Finally, the selected
      features are tested on several machine learning models to find the best model with great performance'
  ienhancer-rd:
    description: Identifies enhancers and predicts their strength from DNA sequences using RKPK features
      and deep neural networks
    was: iEnhancer-RD:Identification of enhancers and their strength using RKPK features and deep neural
      networks
  iflnc:
    description: Identifies full-length long noncoding RNAs from RNA-seq data using machine learning models
    was: Flnc is software that can accurately identify full-length long noncoding RNAs (lncRNAs) from
      human RNA-seq data. lncRNAs are linear transcripts of more than 200 nucleotides that do not encode
      proteins.
  iform:
    description: Scans DNA sequences for transcription factor binding sites by integrating multiple motif
      discovery programs with Fisher's combined probability test
    was: Incorporating Find Occurrence of Regulatory Motifs.
  ihmnbs:
    description: Identifies which of seven histone modifications a DNA sequence binds to using joint deep
      learning of multiple binding sites
    was: Identifying modifications on DNA-bound histones with joint deep learning of multiple binding
      sites in DNA sequence.
  imaging-amaretto:
    description: Interrogates multiomics regulatory networks for relevance to radiography and histopathology
      imaging biomarkers of clinical outcomes
    was: 'An Imaging Genomics Software Tool to Interrogate Multiomics Networks for Relevance to Radiography
      and Histopathology Imaging Biomarkers of Clinical Outcomes.


      Imaging-AMARETTO: tools for interpreting multi-omics networks for relevance to radiographic and
      histopathology imaging-derived biomarkers of clinical outcomes.


      The *AMARETTO framework for network biology and medicine: linking diseases, drivers, targets and
      drugs via graph-based fusion of multi-omics, clinical, imaging and perturbation data.


      NIH NCI CBIIT ITCR Cancer Data Science Pulse Blog.


      Regulatory Network Inference and Driver Gene Evaluation using Integrative Multi-Omics Analysis and
      Penalized Regression.


      Integrating an increasing number of available multi-omics cancer data remains one of the main challenges
      to improve our understanding of cancer.'
  imi-driver:
    description: Integrates multi-omics data into eight biological networks to identify cancer driver
      genes using Multi-view Collaborative Network Embedding
    was: IMI-driver is a model that integrates multi-omics data into eight biological networks to identify
      cancer driver genes. It applies Multi-view Collaborative Network Embedding and has outperformed
      other methods when tested on 29 cancer types from TCGA.
  imitatedb:
    description: Catalogues domain and motif mimicry candidates from experimentally validated host-pathogen
      protein-protein interactions
    was: ImitateDB is a comprehensive database for information about molecular mimicry candidates represented
      as DMPs and MMPs for each experimentally validated unique host pathogen protein-protein interaction.
  imodulondb:
    description: A knowledgebase of microbial transcriptional regulation derived from independent component
      analysis of bacterial transcriptomes
    was: 'A knowledgebase of microbial transcriptional regulation derived from machine learning.


      Independent Component Analysis of Bacterial Transcriptomes.


      iModulonDB is maintained by the Systems Biology Research Group at the University of California,
      San Diego.'
  imotifbreakr:
    description: Scans genetic variants, including indels, against transcription factor position weight
      matrices to predict binding site disruptions, with evidence from DNA-binding sequencing databases
    was: motifbreakR is a Bioconductor package that scans genetic variants against position weight matrices
      of transcription factors to predict potential disruptions in binding sites. It includes an R/Shiny
      graphical user interface and leverages DNA-binding sequencing datasets for evidence-based predictions.
  improving_reliability_methylation:
    description: Decodes bacterial methylomes from Nanopore sequencing data using a Nextflow pipeline
      for methylation motif detection
    was: ont-methylation is a Nextflow pipeline for decoding bacterial methylomes using Nanopore sequencing
      data. It streamlines methylation motif detection and is publicly available for further use.
  impulsede2:
    description: Performs differential expression analysis on longitudinal count data from sequencing
      experiments using an impulse model with negative binomial noise
    was: It is a differential expression algorithm for longitudinal count data sets which arise in sequencing
      experiments such as RNA-seq, ChIP-seq, ATAC-seq and DNaseI-seq. It is based on a negative binomial
      noise model with dispersion trend smoothing by DESeq2 and uses the impulse model to constrain the
      mean expression trajectory of each gene.
  inclusive:
    description: Analyses microarray gene expression data and discovers cis-regulatory sequence elements
      using probabilistic models and Gibbs sampling
    was: Set of tools for the analysis of gene expression data and the discovery of cis-regulatory sequence
      elements.
  inferloop:
    description: Infers chromatin loop strength from single-cell chromatin accessibility data using a
      perturbation-based metric
    was: Leveraging single-cell chromatin accessibility for the signal of chromatin loop.
  infima:
    description: Identifies effector genes of human GWAS variants by integrating multi-omics model organism
      data
    was: INFIMA leverages multi-omics model organism data to identify effector genes of human GWAS variants.
  ingeneue:
    description: Constructs, simulates, and explores ordinary differential equation models of gene regulatory
      networks
    was: Software tool for constructing, simulating, and exploring models of gene regulatory networks.
      It is an open source, extensible Java application that allows users to rapidly build ordinary differential
      equation models of a gene regulatory network without requiring extensive programming or mathematical
      skills.
  inpherno-chip:
    description: Reconstructs phenotype-relevant gene regulatory networks from RNA-seq, ChIP-seq, and
      phenotypic labels using a probabilistic graphical model
    was: InPheRNo-ChIP is a computational framework for reconstructing phenotype-relevant gene regulatory
      networks associated with endoderm development. It integrates RNA-seq, transcription factor (TF)-specific
      ChIP-seq, and phenotypic labels to infer GRNs.
  insect:
    description: Predicts cis-regulatory modules from genomic sequence data via a web server
    was: Easy-to-use and powerful web server for biologists analysing genomic sequence data for in silico
      cis-regulatory modules prediction and analysis.
  inserm-remap:
    description: Provides manually curated catalogs of regulatory regions from integrative analysis of
      DNA-binding sequencing experiments across four species
    was: ReMap is a large scale integrative analysis of DNA-binding experiments for Homo sapiens, Mus
      musculus, Drosophila melanogaster and Arabidopsis thaliana transcriptional regulators. The catalogues
      are the results of the manual curation of ChIP-seq, ChIP-exo, DAP-seq from public sources (GEO,
      ENCODE, ENA). ReMap (https://remap.univ-amu.fr) aims to provide manually curated, high-quality catalogs
      of regulatory regions resulting from a large-scale integrative analysis of DNA-binding experiments
      in Human, Mouse, Fly and Arabidopsis thaliana for hundreds of transcription factors and regulators.
      In this 2022 update, we have uniformly processed >11 000 DNA-binding sequencing datasets from public
      sources across four species. The four regulatory catalogs are browsable through track hubs at UCSC,
      Ensembl and NCBI genome browsers.
  insistc:
    description: Classifies single-cell types by incorporating gene regulatory network structure information
      from scRNA-seq data
    was: Incorporating Network Structure Information for Single-Cell Type Classification.
  intad:
    description: Detects correlated expression of enhancers and genes within topologically associated
      domains using ChIP-seq and RNA-seq data
    was: The package is focused on the detection of correlation between expressed genes and selected epigenomic
      signals i.e. enhancers obtained from ChIP-seq data within topologically associated domains (TADs).
      Various parameters can be controlled to investigate the influence of external factors and visualization
      plots are available for each analysis step.
  interface_cengenorg:
    description: Explores and analyzes gene expression atlases of the C. elegans nervous system during
      post-embryonic development
    was: CeNGEN is a web application and resource providing gene expression atlases of the C. elegans
      nervous system, with a focus on post-embryonic development. It allows users to explore and analyze
      gene expression data, connectomic information, and related molecular determinants.
  interferome:
    description: Collects and integrates interferon-regulated genes from expression data with annotation,
      ontology, orthologues, tissue expression and regulatory information
    was: Open access database of types I, II and III Interferon regulated genes collected from analysing
      expression data sets of cells treated with IFNs. This database integrates expression information
      with annotation, ontology, orthologue sequences from 37 species, tissue expression patterns and
      gene regulatory information.
  intomics_framework:
    description: Infers regulatory networks from gene expression, copy number variation, DNA methylation,
      and biological prior knowledge using Bayesian networks
    was: 'IntOMICS: an efficient integrative framework based on Bayesian networks systematically analyses
      gene expression, copy number variation, DNA methylation, and biological prior knowledge to infer
      regulatory networks.'
  inuc-pseknc:
    description: Predicts nucleosome positioning in H. sapiens, C. elegans and D. melanogaster from DNA
      sequences using pseudo k-tuple nucleotide composition
    was: This web-server was developed to predict nucleosome occupancy of H. sapiens, C. elegan and D.
      melanogaster.
  ioda:
    description: Integrates and analyzes mRNA, miRNA, and ChIP-seq data for cancer pathway consistency
    was: 'An integrated tool for analysis of cancer pathway consistency from heterogeneous multi-omics
      data.


      iODA, short for integrative Omics Data Analysis, is an evidence-based bioinformatics model and software
      tool for omics data analysis.


      iODA is a graphical user interface (GUI) local tool with the aim of integrating and analyzing data
      sets including mRNA, microRNA (miRNA), and protein–DNA interaction (chromatin immunoprecipitation
      followed by high-throughput sequencing, ChIP-Seq) for pathway consistency (Figure 1).'
  ippd:
    description: Extracts isotopic peak patterns from raw mass spectra by fitting template basis functions
      using non-negative least squares or least absolute deviation regression
    was: The package provides functionality to extract isotopic peak patterns from raw mass spectra. This
      is done by fitting a large set of template basis functions to the raw spectrum using either nonnegative
      least squares or least absolute deviation fittting. The package offers a flexible function which
      tries to estimate model parameters in a way tailored to the peak shapes in the data. The package
      also provides functionality to process LCMS runs.
  ipredict:
    description: Predicts gene expression and identifies transcription factor binding motifs from plant
      stress response data using a k-mer pipeline
    was: PREDICT is a web tool that utilizes a k-mer pipeline to predict gene expression and identify
      transcription factor binding motifs in plants under stress conditions. It improves gene expression
      prediction models and facilitates understanding of the cis-regulatory code in plant adaptation.
  ipro-gan:
    description: Identifies promoters and their strength using generative adversarial learning
    was: A novel model based on generative adversarial learning for identifying promoters and their strength
  ipro-wael:
    description: Identifies promoters in multiple species using a weighted average ensemble learning model
    was: A framework for identifying promoters in multiple species.
  ipro54-pseknc:
    description: Identifies σ54 promoters in prokaryotic genomes using pseudo k-tuple nucleotide composition
    was: 'Sequence-based predictor for identifying

      σ54 promoters with pseudo k-tuple nucleotide composition.'
  iprom-sigma54:
    description: Predicts σ54 promoters in prokaryotic genomes using a convolutional neural network
    was: CNN base prediction tool for σ54 Promoters.
  iprom-zea:
    description: Identifies plant promoters and classifies them as TATA or TATA-less using a convolutional
      neural network
    was: A two-layer model to identify plant promoters and their types using convolutional neural network.
  iprom_phage:
    description: Identifies phage promoters and classifies them as phage or host using a convolutional
      neural network
    was: A two-layer model to identify phage promoters and their types using a convolutional neural network.
  ipromoter-5mc:
    description: Predicts 5-methylcytosine sites in genome-wide DNA promoters using a fusion decision
      predictor based on deep neural networks
    was: 'A Novel Fusion Decision Predictor for the Identification of 5-Methylcytosine Sites in Genome-Wide
      DNA Promoters.


      This prediction tool was built on the basis of known promoter methylation of human small cell lung
      cancer cell coefficients. The primary goal was to predict all promoter 5mC sites in human small
      cell lung cancer cell lines.



      This prediction website is based on known human small cell lung cancer cell coefficients based on
      sites with significant promoter methylation levels. The main goal is to achieve the prediction of
      all 5mC promoters in human small cell lung cancer cell lines.Experimental data download.'
  ipromoter-seqvec:
    description: Identifies TATA and non-TATA promoters in human and mouse genomes using bidirectional
      LSTM and sequence-embedded features
    was: Identifying promoters using bidirectional long short-term memory and sequence-embedded features.
  ireceptor:
    description: Queries and analyzes antibody/B-cell and T-cell receptor repertoire data across federated
      repositories
    was: iReceptor is a data discovery platform that facilitates the curation, analysis and sharing of
      antibody/B-cell and T-cell receptor repertoires (Adaptive Immune Receptor Repertoire or AIRR-seq
      data) and related subject and sample metadata from multiple studies across many labs and institutions.
  iregnet:
    description: Analyzes upstream regulatory networks for genes or genomic regions in Arabidopsis using
      ChIP-seq and DAP-seq data
    was: An integrative Regulatory Network analysis tool for Arabidopsis thaliana.
  irena:
    description: Reconstructs gene regulatory networks by integrating scRNA-seq and ATAC-seq data, with
      network modularization and transcription factor enrichment
    was: IReNA (Integrated Regulatory Network Analysis) is an R package to perform regulatory network
      analysis. IReNA contains two methods to reconstruct gene regulatory networks. The first is using
      single-cell RNA sequencing (scRNA-seq) data alone. The second is integrating scRNA-seq data and
      chromatin accessibility profiles from Assay for Transposase Accessible Chromatin using sequencing
      (ATAC-seq). IReNA performs modular regulatory network to reveal key transcription factors and significant
      regulatory relationships among modules, providing biological insights on regulatory mechanisms.
  irespred:
    description: Predicts internal ribosome entry sites in viral and cellular sequences using a support
      vector machine
    was: Support Vector Machine (SVM) based computational tool to predict the presence of Internal Ribosome
      Entry Site (IRES) in viral and cellular sequences.
  iris3:
    description: Infers cell-type-specific regulons from single-cell RNA-Seq data for human and mouse
    was: 'Integrated cell-type-specific regulon inference server from single-cell RNA-Seq.


      The underlying regulatory mechanisms that induce the identity of cell types or physiological states
      are normally uncovered in the single-cell RNA-Sequencing (scRNA-Seq) analyses.


      Here we propose IRIS3 (Integrated Cell-type-specific Regulon Inference Server from Single-cell RNA-Seq)
      as the first-of-its-kind web server for CTS-R inference in human and mouse.


      integrated cell type specific Regulon inference from single-cell rna seq.'
  iscdnase-seq:
    description: Profiles genome-wide DNase I hypersensitive sites in single cells using a multiplex indexing
      strategy
    was: iscDNase-seq is scripts for a multiplex indexing approach for the detection of DNase I hypersensitive
      sites in single cells.
  ischip:
    description: Simulates ChIP-seq data from known binding templates using Illumina and other sequencing
      platform protocols
    was: 'Novel ChIP-seq simulating program with superior versatility.


      In Silico ChIP-seq is a fast realistic ChIP-seq simulator.


      The modelling of the chromatin immunoprecipitaion followed by next generation sequencing process
      is based primarily on Illumina protocol. In addition, extra flexibility is implemented for the isChIP’s
      options to be straightforwardly re-formulated in other formats, such as Ion Torrent, Roche454, etc.'
  iseq:
    description: Identifies IP-enriched genomic regions from ChIP-seq data using Bayesian hidden Ising
      models
    was: This package uses Bayesian hidden Ising models to identify IP-enriched genomic regions from ChIP-seq
      data. It can be used to analyze ChIP-seq data with and without controls and replicates.
  isma:
    description: Enumerates all instances of a predefined subgraph in a large network using optimized
      search trees
    was: Index-based Subgraph Matching Algorithm. Fast subgraph enumeration in large networks using optimized
      search trees.
  ismara:
    description: Models genome-wide expression or chromatin data to infer key transcription regulators,
      their activities, and targets using regulatory motif annotations
    was: Models genome-wide expression data in terms of our genome-wide annotations of regulatory sites.
      For a given expression data-set it infers the key transcription regulators, their sample-dependent
      activities, and their genome-wide targets.
  ismara_client:
    description: Pre-processes RNA-seq or ChIP-seq data locally for automated ISMARA analysis via a web
      server
    was: Integrated System for Motif Activity Response Analysis client . Locally pre-process expression
      or ChIP-seq data before upload it to the ISMARA web server.
  ispace-log:
    description: Infers gene-gene networks from high-dimensional expression data using SPACE model with
      log penalty
    was: A approach to inferring gene-gene net-works using SPACE model with log penalty.
  itar:
    description: Identifies transcription factor target genes from ChIP-seq or ChIP-chip data using a
      refined probabilistic method with Gaussian mixture model p-value estimation
    was: A web server for identifying target genes of transcription factors using ChIP-seq or ChIP-chip
      data.
  itihi:
    description: Detects peaks and decomposes signals from spectroscopic data using a graphical interface
    was: Tihi Toolkit is an open-source, multiplatform software for peak detection and signal decomposition,
      designed to provide accessible tools for spectral data analysis. It offers a user-friendly GUI and
      supports various spectroscopic techniques, aiming to replace costly commercial alternatives.
  ivea:
    description: Predicts enhancer-gene regulatory interactions by estimating promoter and enhancer activities
      using variational Bayesian inference from transcriptional, chromatin accessibility, and chromatin
      contact data
    was: IVEA is a computational method that predicts enhancer-gene regulatory interactions by estimating
      promoter and enhancer activities using variational Bayesian inference. The code is available on
      GitHub and used publicly available datasets.
  iwtomics:
    description: Tests for differences in omics data between two groups of genomic regions at multiple
      locations and scales using functional data analysis
    was: Implementation of the Interval-Wise Testing (IWT) for omics data. This inferential procedure
      tests for differences in "Omics" data between two groups of genomic regions (or between a group
      of genomic regions and a reference center of symmetry), and does not require fixing location and
      scale at the outset.
  jamm:
    description: Integrates biological replicates and accurately determines enrichment site widths from
      NGS datasets via mixture model clustering
    was: Peak finder for NGS datasets that can integrate replicates and assign peak boundaries accurately.
  janggu:
    description: Provides dataset objects and utilities for deep learning on genomics data, including
      prediction and visualization
    was: 'Deep learning for genomics using Janggu.


      Janggu - Deep learning for Genomics.


      Janggu is a python package that facilitates deep learning in the context of genomics. The package
      is freely available under a GPL-3.0 license.'
  jaspar:
    description: Provides manually curated transcription factor binding profiles as position frequency
      matrices for six taxonomic groups
    was: JASPAR is a high-quality, open-access database that provides manually curated, non-redundant
      transcription factor (TF) binding profiles for six taxonomic groups (fungi, insecta, nematoda, plantae,
      urochordata, vertebrata). These profiles are stored as position frequency matrices (PFMs), which
      can be transformed into models to predict TF binding sites (TFBS) in DNA sequences. The database
      collects motifs both internally, analyzing sequences using a custom motif discovery pipeline, and
      externally from publications and other resources. All selected motifs are manually curated for quality
      and supporting evidence. JASPAR now offers a tool for TFBS enrichment analysis in user-provided
      genomic regions. Data is accessible through the JASPAR website, its RESTful API, Bioconductor, or
      the Python package pyJASPAR.
  jaspar_api:
    description: Programmatically accesses curated transcription factor binding profiles from the JASPAR
      database via a RESTful API returning data in multiple formats
    was: JASPAR is a widely used open-access database containing curated, non-redundant transcription
      factor binding profiles. The JASPAR RESTful API enhances accessibility by enabling users to programmatically
      access the database by most programming languages.The API uses the Representational State Transfer
      (REST) architecture to provide data in multiple formats (JSON, JSONP, JASPAR, MEME, PFM, TRANSFAC,
      BED, and YAML). The JASPAR API is user-friendly, offering a browsable interface designed for bioinformatics
      tool developers.
  jaspar_ws:
    description: Provides a RESTful API to access transcription factor binding site profiles from the
      JASPAR database
    was: Previously, a web service interface to the JASPAR database containing profiles of transcription
      factor binding sites. The SOAP API has been replaced with the JASPAR RESTful API.
  jaspardb:
    description: Provides a RESTful API to access transcription factor binding site profiles from the
      JASPAR database
    was: Previously, a web service interface to the JASPAR database containing profiles of transcription
      factor binding sites. The SOAP API has been replaced with the JASPAR RESTful API.
  jaspscan:
    description: Scans DNA sequences for transcription factor binding sites
    was: Scan DNA sequences for transcription factors.
  jfuzzymachine:
    description: Elucidates mechanistic relationships among biological molecules using a fuzzy logic approach
      with multistaged hyperparallel optimization
    was: 'A Multistaged Hyperparallel Optimization of the Fuzzy-Logic Mechanistic Model of Molecular Regulation.


      Elucidating mechanistic relationships among intracellular macromolecules is fundamental to understanding
      the molecular basis of normal and diseased processes. The classical fuzzy logic approach employs
      varying degrees of truth to describe relationships between interacting molecules. jFuzzyMachine
      implements the fuzzy logic approach to elucidate mechanistic relationships among biological molecules
      and makes more readily available the fuzzy logic inference approach in a freely available tool.'
  joda:
    description: Computes gene deregulation scores from regulator knockdown expression data and signaling
      pathway knowledge
    was: This package implements three steps of an algorithm called JODA, which computes gene deregulation
      scores. For each gene, its deregulation score reflects how strongly an effect of a certain regulator's
      perturbation on this gene differs between two different cell populations. The algorithm utilizes
      regulator knockdown expression data as well as knowledge about signaling pathways in which the regulators
      are involved (formalized in a simple matrix model).
  jpredictor:
    description: Predicts cis-regulatory elements by searching for clusters of short motifs and weighting
      them using positive and negative training sets
    was: Cis-regulatory elements using short motifs that are known to bind regulatory proteins.  Predictions
      are made by searching for clusters of these motifs, and weighting these clusters by applying a positive
      or negative training sets to score the sequence.
  juxtapose:
    description: Compares gene co-expression networks across species, tissues, or conditions using a gene-embedding
      approach
    was: Juxtapose is a Python tool that can be used to compare gene co-expression networks (GCNs). Juxtapose,
      together with different similarity measures, can be utilized for comparative transcriptomics between
      a set of organisms.
  kapac:
    description: Infers regulatory sequence motifs implicated in 3' end processing changes from RNA sequencing
      data
    was: Allows to infer regulatory sequence motifs implicated in 3’ end processing changes.
  kas_analyzer:
    description: Analyzes KAS-seq and spKAS-seq data for transcription metrics, SST enhancers, R-loop
      mapping, and differential RNA polymerase activity
    was: Novel computational framework for exploring kas-seq data.
  kboost:
    description: Infers gene regulatory networks from gene expression data using kernel PCA regression,
      boosting and Bayesian model averaging
    was: KBoost is a R package to infer gene regulatory networks from gene expression data. It has been
      benchmarked using three datasets. It builds several models unsing kernel principal components regression
      and boosting and from them estimates the probability that each transcription factor regulates a
      gene.
  key_pathway_miner:
    description: Extracts maximal connected subnetworks from biological networks where most genes are
      similarly expressed in most cases, controlling outlier counts with two parameters
    was: Extracts all maximal connected sub-networks that contain the genes that are differentially expressed.
      The exact quantities are modeled with two easy-to-interpret parameters (K, L) that allows the user
      to control the number of outliers (not dysregulated genes/cases) in the solutions. We developed
      two slightly varying models (INES and GLONE) that fall into the class of NP-Hard optimization problems.
  kimi:
    description: Identifies sequence motifs from molecular sequences with controlled false discovery rate
      using knockoff inference
    was: 'Knockoff Inference for Motif Identification from molecular sequences with controlled false discovery
      rate.


      KIMI: R package based on Knockoff Inference for Motif Identification from molecular sequences with
      controlled false discovery rate.'
  kismeth:
    description: Analyzes bisulfite sequencing data and designs bisulfite primers, considering cytosine
      methylation in any sequence context
    was: Web-based tool for bisulfite sequencing analysis
  kmer-svm:
    description: Identifies predictive combinations of short transcription factor binding sites from genomic
      data using a support vector machine with kmer sequence features
    was: Web server uses a support vector machine with kmer sequence features to identify predictive combinations
      of short transcription factor binding sites which determine the tissue specificity of genomic assays.
  kplogo:
    description: Detects and visualizes position-specific ultra-short motifs from aligned sequences using
      a probability-based approach
    was: Probability-based logo tool for integrated detection and visualization of position-specific ultra-short
      motifs from a set of aligned sequences.
  lanceotron:
    description: Calls peaks from ATAC-seq, ChIP-seq, and DNase-seq data using deep learning image recognition
    was: 'A deep learning peak caller for ATAC-seq, ChIP-seq, and DNase-seq.


      LanceOtron is a machine learning, genomic data extraction and analysis tool trained for ATAC-seq,
      ChIP-seq, and DNase-seq peak calling. A freely available and fully-featured webtool version, utilising
      the graphical user interface MLV and hosted at the MRC WIMM Centre of Computational Biology, University
      of Oxford, can be found at LanceOtron.molbiol.ox.ac.uk.'
  lap:
    description: Flags chemical liability motifs in antibody sequences by germline, therapeutic, and surface
      accessibility criteria
    was: Liability antibody profiler by sequence & structural mapping of natural and therapeutic antibodies.
  lasagna-search:
    description: Searches for transcription factor binding sites using the LASAGNA algorithm, with automatic
      promoter retrieval and UCSC Genome Browser visualization
    was: Length-Aware Site Alignment Guided by Nucleotide Association algorithm for Transcription Factor
      Binding Site alignment. Search include (i) acceptance of unaligned variable-length TFBSs, (ii) a
      collection of 1726 TF models, (iii) automatic promoter sequence retrieval, (iv) visualization in
      the UCSC Genome Browser, and (v) gene regulatory network inference and visualization based on binding
      specificities.
  lasergene:
    description: Comprehensive DNA and protein sequence analysis suite for sequence assembly, SNP detection,
      virtual cloning, and primer design
    was: Comprehensive DNA and protein sequence analysis software suite comprised of seven applications
      which include functions ranging from sequence assembly and SNP detection, to automated virtual cloning
      and primer design.
  lbfextract:
    description: Extracts features from circulating cell-free DNA data to infer transcription factor activity
      and enable biomarker discovery
    was: LBFextract is a Python package designed for feature extraction from circulating cell-free DNA
      (cfDNA) data, facilitating the integration of preprocessing and postprocessing steps and enabling
      biomarker discovery by inferring transcription factor activity. It provides a comprehensive suite
      of tools to streamline liquid biopsy data analysis.
  lemone:
    description: Learns module networks from gene expression data to predict regulatory relationships
    was: A software package for Learning Module Networks from gene expression data.
  les:
    description: Estimates Loci of Enhanced Significance in tiling microarray data to identify regions
      of regulation such as differential transcription or ChIP-chip
    was: This package estimates Loci of Enhanced Significance (LES) in tiling microarray data. These are
      regions of regulation such as found in differential transcription, CHiP-chip, or DNA modification
      analysis. The package provides a universal framework suitable for identifying differential effects
      in tiling microarray data sets, and is independent of the underlying statistics at the level of
      single probes.
  ligap:
    description: Integrates and visualizes multiple lineages over whole time-course profiles to identify
      differentially regulated dynamic transcriptome signatures
    was: Allows integrative analysis and visualization of multiple lineages over whole time-course profiles.
  limbnet:
    description: Simulates spatial patterns of gene networks in limb development from imaging data via
      a web platform
    was: LimbNET is a web-based platform for simulating spatial patterns of gene networks in limb development.
      It allows users to view existing simulations, create new ones from imaging data, and construct computational
      models.
  linnorm:
    description: Transforms RNA-seq, scRNA-seq, and ChIP-seq count data for parametric tests, with pipelines
      for clustering, differential expression, and network analysis
    was: 'R package for the analysis of RNA-seq, scRNA-seq, ChIP-seq count data or any large-scale count
      data. It transforms such datasets for parametric tests. Also the following pipelines are implemented:
      1. Cell subpopluation analysis and visualization using PCA clustering, 2. Differential expression
      analysis or differential peak detection using limma, 3. Highly variable gene discovery and visualization,
      4. Gene correlation network analysis and visualization. 5. Hierarchical clustering and plotting.'
  liquorice:
    description: Calculates bias-corrected coverage signatures from aligned whole-genome sequencing data
      to detect epigenetic signatures in liquid biopsies
    was: Detection of epigenetic signatures in liquid biopsies based on whole-genome sequencing data.
  lircentral:
    description: Curated database of experimentally validated LIR motifs that bind Atg8 homologs
    was: 'Manually curated online database of experimentally validated functional LIR motifs.

      LIRcentral contains information about manually curated entries of LIR-motifs that have been experimentally
      tested for their ability to bind Atg8 homologs, often in a biologically relevant context.'
  lisa:
    description: Infers transcriptional regulators from gene sets by integrating public chromatin accessibility
      and ChIP-seq data
    was: 'Inferring transcriptional regulators through integrative modeling of public chromatin accessibility
      and ChIP-seq data.


      Web version and documentation is hosted at http://lisa.cistrome.org. For large scale gene set analysis,
      we recommend user to install local version.'
  lise:
    description: Predicts small molecule binding sites on proteins using geometric motifs from ligand-interacting
      protein surface atoms
    was: LISE is a web server for a novel method of predicting small molecule binding sites on proteins.
  lncecell:
    description: Provides predicted lncRNA-associated ceRNA networks at single-cell resolution for cancer
      cells
    was: A comprehensive database of predicted lncRNA-associated ceRNA networks at single-cell resolution.
  lnclocformer:
    description: Predicts multi-label lncRNA subcellular localization from sequences using a Transformer
      with localization-specific attention
    was: Transformer-based deep learning model for multi-label lncRNA subcellular localization prediction
      by using localization-specific attention mechanism.
  lncrna:
    description: Annotates nuclear long non-coding RNAs using Hi-C data to identify target genes and regulatory
      factors, with results in an interactive web portal
    was: FANTOM-ZENBU provides an annotation of nuclear long non-coding RNAs based on chromatin interactions
      and Hi-C data, identifying potential target genes and regulatory factors. The results are accessible
      through an interactive visualization web portal.
  lncrnadb:
    description: Database of functionally characterized long noncoding RNAs and regulatory mRNAs with
      sequence, expression, and functional annotations
    was: Database containing a comprehensive list of long noncoding RNAs (lncRNAs) that have been shown
      to have, or to be associated with, biological functions in eukaryotes, as well as messenger RNAs
      that have regulatory roles. Each entry contains referenced information about the RNA, including
      sequences, structural information, genomic context, expression, subcellular localization, conservation,
      functional evidence and other relevant information.
  lncsea:
    description: Provides human lncRNA reference sets and enrichment analysis for user-submitted lncRNA
      lists
    was: 'A platform for long non-coding RNA related sets and enrichment analysis.


      Welcome to LncSEA a comprehensive human lncRNA sets resource and enrichment analysis platform.'
  logicnet:
    description: Reconstructs gene regulatory networks and identifies logical interactions from continuous
      gene expression data using probabilistic logic
    was: Probabilistic continuous logics in reconstructing gene regulatory networks.
  logo:
    description: Interprets non-coding genome regions at base resolution using a self-attention-based
      pre-trained language model
    was: Integrating convolution and self-attention improves language model of human genome for interpreting
      non-coding regions at base-resolution.
  logomotif:
    description: Provides a database of characterized and predicted transcription factor binding site
      profiles for Actinobacteria, with position weight matrices and hidden Markov models
    was: A comprehensive database of transcription factor binding site profiles in Actinobacteria.
  lolaweb:
    description: Tests genomic region sets for enrichment against a database of region sets with interactive
      visualisation
    was: Interactive genomic locus overlap enrichment analysis.
  lpnet:
    description: Infers signaling and gene networks from steady-state or time-series perturbation data
      using linear programming
    was: This tool aims at infering biological networks, in particular signaling and gene networks. For
      that it takes perturbation data, either steady-state or time-series, as input and generates an LP
      model which allows the inference of signaling networks. For parameter identification either leave-one-out
      cross-validation or stratified n-fold cross-validation can be used.
  lrloop:
    description: Predicts feedback loops in cell–cell communication from bulk and single-cell RNA-seq
      data using bi-directional ligand-receptor interactions
    was: LRLoop is a full-featured R package for analyzing LR-Loops from bulk & single-cell RNA-seq data.
  lrmotifs:
    description: Discovers DNA sequence motifs using logistic regression and rigorous hypothesis testing
    was: LRMotifs is a novel method of DNA sequence motif discovery based on logistic regression and rigorous
      hypothesis testing.
  lstrap-cloud:
    description: Builds co-expression networks from RNA-seq data streamed from ENA using Google Colaboratory
    was: 'A User-friendly Cloud Computing Pipeline to Infer Co-functional and Regulatory Networks.


      Large-Scale Transcriptome Analysis Pipeline on Cloud.


      If you use LSTrAP-Cloud in your research, please cite:.


      This repository is built upon wirriamm/CoNeGC.


      LSTrAP-Cloud is a pipeline designed for building co-expression networks from RNA-seq data (fastq
      files from ENA) on Goolge Colaboratory (Colab). Leveraging on the user-friendliness of the Colab
      interface, LSTrAP-Cloud allows users to analyse large scale transcriptome data without having to
      access the linux terminal, making it accessible to both bioinformaticians and biologist. To get
      started, we have provided a tutorial based on example data found here. While the pipeline was designed
      for plants, we have also made the script compatible with non-plant organisms.'
  m5upred:
    description: Predicts RNA 5-methyluridine sites from primary sequences using support vector machines
    was: 'A Web Server for the Prediction of RNA 5-Methyluridine Sites from Sequences.


      As one of the widely occurring RNA modifications, 5-methyluridine (m5U) has recently been shown
      to play critical roles in various biological functions and disease pathogenesis, such as, under
      stress response and during breast cancer development.'
  m6ampred:
    description: Identifies RNA N6,2'-O-dimethyladenosine (m6Am) sites from sequence-derived information
    was: Identifying RNA N6, 2'-O-dimethyladenosine (m<sup>6</sup>A<sub>m</sub>) sites based on sequence-derived
      information.
  m7ghub:
    description: A database and web server for internal mRNA m7G sites, including a predictor and mutation
      impact assessment
    was: 'Deciphering the location, regulation and pathogenesis of internal mRNA N7-methylguanosine (m7G)
      sites in human.


      Search by RsID, Gene, Region or Disease:.


      Links MeT-DB Whistle DRUM DRRMSDB.


      A database for the disease-associated genetic variants that may affect m7G sites.'
  macpet:
    description: Identifies binding sites from ChIA-PET data using 2D mixture models with skewed generalized
      students-t distributions
    was: It can be used for binding site analysis for ChIA-PET data. MACPET reads ChIA-PET data in BAM
      or SAM format and separates the data into Self-ligated, Intra- and Inter-chromosomal PETs. Furthermore,
      MACPET breaks the genome into regions and applies 2D mixture models for identifying candidate peaks/binding
      sites using skewed generalized students-t distributions (SGT). It then uses a local poisson model
      for finding significant binding sites.
  macs:
    description: Calls peaks from ChIP-seq data by empirically modeling tag shift size and using a dynamic
      Poisson distribution to capture local biases
    was: Model-based Analysis of ChIP-seq data.
  maga:
    description: Detects differentially conserved positions in multiple sequence alignments from user-defined
      groups of sequences
    was: 'A Supervised Method to Detect Motifs From Annotated Groups in Alignments.


      Motifs from Annotated Groups in Alignments.


      MAGA is a new simpler way to infer information from alignments. Based on a regular procedure usually
      done visually by experts, it looks for group-conserved residues in an alignment. Provided an alignment
      in FASTA format and a way to group the sequences in it, MAGA seeks to access an unexplored layer
      of information difficult to appreciate visually when many sequences are aligned, even for a trained
      bioinformatician.'
  maggie:
    description: Identifies DNA sequence motifs mediating transcription factor binding and function by
      associating motif mutations with epigenomic features across diverse genotypes
    was: 'Leveraging genetic variation to identify DNA sequence motifs mediating transcription factor
      binding and function.


      MAGGIE provides a framework for identifying DNA sequence motifs mediating transcription factor binding
      and function. By leveraging measurements and genetic variation information from different genotypes
      (human individuals, animal strains, or alleles), MAGGIE associates the mutation of DNA sequence
      motif with various types of epigenomic features, including but not limited to transcription factor
      binding, open chromatin, histone modification, and stimulus response of regulatory elements.'
  magia2:
    description: Integrates miRNA target predictions with miRNA and gene expression data to reconstruct
      post-transcriptional regulatory networks
    was: Web tool for the integrative analysis of in silico target prediction, and reconstruction of post-transcriptional
      regulatory and mixed regulatory networks from miRNA and gene expression data.
  magic_encode:
    description: Predicts transcription factors and cofactors driving gene sets using ENCODE ChIP-seq
      data without binary target classification
    was: 'A tool for predicting transcription factors and cofactors driving gene sets using ENCODE data.


      The manuscript accompanying this script is: MAGIC: A tool for predicting transcription factors and
      cofactors driving gene sets using ENCODE data. Roopra, A. 2020 PLoS Computational Biology.'
  magma_motif:
    description: Discovers conserved regulatory motifs from multiple genome alignments using efficient
      clustering
    was: Fast, sensitive tool for whole regulome motif-finding in eukaryotic genomes
  makestatschipseq:
    description: Creates a PNG file showing the distribution of peak heights from ChIP and control samples
    was: Create a .png file with distribution of peaks heights for ChIP and Control sample.
  maketssdist:
    description: Gets peak distribution around transcription start sites
    was: Get peak distribution around TSS.
  malax:
    description: Performs association testing of bisulfite-sequencing methylation data using a Laplace
      approximation to model multiple variance components
    was: Association testing of bisulfite sequencing methylation data via a Laplace approximation.
  malboost:
    description: Constructs gene regulatory networks from transcriptomic data in Plasmodium falciparum
      via a web interface
    was: A web-based application for gene regulatory network analysis in Plasmodium falciparum.
  manorm:
    description: Compares ChIP-seq data sets quantitatively to identify differential binding of transcription
      factors and epigenetic modifications
    was: Simple and effective method for quantitative comparison of ChIP-Seq data sets describing transcription
      factor binding sites and epigenetic modifications.
  manorm_2:
    description: Compares groups of ChIP-seq samples to identify differential binding sites using a hierarchical
      normalization and empirical Bayes framework
    was: 'MAnorm2 for quantitatively comparing groups of ChIP-seq samples.


      To pre-process a set of ChIP-seq samples.


      MAnorm2_utils is designed to coordinate with MAnorm2, an R package for differential analysis with
      ChIP-seq signals between two or more groups of replicate samples. MAnorm2_utils is primarily used
      for processing a set of ChIP-seq samples into a regular table recording the read abundances and
      enrichment states of a list of genomic bins in each of these samples.'
  mapanalyzer:
    description: Curates a database of microtubule-associated proteins and predicts novel MAPs using machine
      learning and homology searching
    was: MAP (Microtubule-associated Proteins) analysis tool.
  mapperdb:
    description: Contains predicted transcription factor binding sites in promoters of human, mouse and
      Drosophila genes using probabilistic models
    was: Contains putative Transcription Factor Binding Sites (TFBSs) located in the upstream sequences
      of genes from the human, mouse and D.melanogaster genomes.
  maresnet:
    description: Predicts transcription factor binding sites from ChIP-seq data using multi-scale attention
      and residual networks
    was: Predicting transcription factor binding sites by combining multi-scale bottom-up and top-down
      attention and residual network.
  marge:
    description: Predicts regulated genes and cis-regulatory regions from H3K27ac ChIP-seq profiles using
      a compendium-based framework
    was: 'It is a robust methodology that leverages a comprehensive library of genome-wide H3K27ac ChIP-seq
      profiles to predict key regulated genes and cis-regulatory regions in human or mouse. The framework
      has three main functions: MARGE-potential, MARGE-express, and MARGE-cistrome.'
  match:
    description: Searches for putative transcription factor binding sites in DNA sequences using a weight
      matrix approach
    was: Weight matrix-based tool which searches for putative transcription factor binding sites (TFBS)
      in DNA sequences. Registration at the site is free and is required to use it.
  matcha:
    description: Analyzes multi-way chromatin interaction data using hypergraph representation learning
      to denoise and make de novo predictions
    was: 'Probing multi-way chromatin interaction with hypergraph representation learning.


      This is the implementation of the algorithm MATCHA for analyzing multi-way chromatin interaction
      data via hypergraph representation learning.'
  matrix-clustering:
    description: Clusters position-specific scoring matrices into motif families by hierarchical clustering,
      producing trees with branch motifs
    was: Taking as input one or several sets of position-specific scoring matrices, this program applies
      hierarchical clustering to identify clusters of similar motifs. It produces a set of trees (one
      per cluster) and builds branch motifs at each node of each tree by merging the matrices of all descendent
      nodes.
  maxatac:
    description: Predicts genome-wide transcription-factor binding sites from ATAC-seq data using deep
      neural networks
    was: Genome-scale transcription-factor binding prediction from ATAC-seq with deep neural networks.
  maxhic:
    description: Estimates chromatin interaction frequency and identifies statistically significant interactions
      in Hi-C and capture Hi-C data using a negative binomial model
    was: 'Robust estimation of chromatin interaction frequency in Hi-C and capture Hi-C experiments.


      MaxHiC is a background correcting model for General and Capture Hi-C experiments that assigns significance
      to the recorded interactions. You can become more familiar with MaxHiC by reading the paper or the
      short summary presented in the About MaxHiC section that gives you enough information to understand
      the tool''s arguments.'
  mbamethyl:
    description: Reconstructs DNA methylation values from raw microarray data by smoothing related-by-location
      values and removing probe affinity effects
    was: This package provides a function for reconstructing DNA methylation values from raw measurements.
      It iteratively implements the group fused lars to smooth related-by-location methylation values
      and the constrained least squares to remove probe affinity effect across multiple sequences.
  mcl:
    description: Clusters biological networks using the Markov Cluster algorithm
    was: MCL is a clustering algorithm widely used in bioinformatics and gaining traction in other fields.
  mcland:
    description: Models and visualizes Waddington's epigenetic landscape from gene regulatory networks
      using Monte Carlo simulations
    was: MCLand is a Python-based software tool with a graphical user interface for modeling and visualizing
      Waddington's epigenetic landscape using Monte Carlo simulations. It allows users to explore gene
      regulatory networks and quantify landscape characteristics.
  mcpromoter:
    description: Predicts eukaryotic DNA transcription start sites using joint modeling of DNA sequence
      and physical properties
    was: The Markov Chain Promoter Prediction Server (McPromoter) uses statistics to predict eukaryotic
      DNA transcription start sites.
  mcsea:
    description: Identifies differentially methylated regions from Illumina 450K and EPIC array data,
      especially for subtle methylation differences
    was: Identification of diferentially methylated regions (DMRs) in predefined regions (promoters, CpG
      islands...) from the human genome using Illumina's 450K or EPIC microarray data. Provides methods
      to rank CpG probes based on linear models and includes plotting functions.
  mdag:
    description: Infers regulatory networks from mixed observational data containing both continuous and
      categorical variables using a directed acyclic graph
    was: 'Inferring Regulatory Networks From Mixed Observational Data Using Directed Acyclic Graphs.


      Inferring Causal Network from Mixed Observational Data Using a Directed Acyclic Graph.


      Learning a mixed directed acyclic graph based on both continuous and categorical data.'
  mdscan:
    description: Pinpoints protein-DNA interaction sites at base-pair level from ChIP-array data using
      word enumeration and weight matrix updating
    was: Server designed to pinpoint protein-DNA interaction sites at the base pair level.  Uses ChIP-array
      data, word enumeration and position-specific weight matrix updating  to search for motifs representing
      these interaction sites.
  meconcord:
    description: Quantifies local DNA methylation concordance across reads and CpG sites to distinguish
      distinct methylation patterns
    was: A new metric to quantitatively characterize DNA methylation heterogeneity across reads and CpG
      sites.
  medea:
    description: Identifies lineage-specific transcription factor motifs from chromatin accessibility
      data using motif enrichment in differential elements of accessibility
    was: 'Analysis of transcription factor binding motifs in accessible chromatin.


      MEDEA identifies lineage-specifying transcription factors (TFs) from chromatin accessibility assays
      by:.'
  medusa_motif:
    description: Learns regulatory programs that predict differential expression by integrating promoter
      sequence, mRNA expression, and transcription factor occupancy data
    was: Integrative method for learning motif models of transcription factor binding sites by incorporating
      promoter sequence and gene expression data. We use a modern large-margin machine learning approach,
      based on boosting, to enable feature selection from the high-dimensional search space of candidate
      binding sequences while avoiding overfitting.
  meirlop:
    description: Improves score-based motif enrichment by controlling for sequence bias covariates using
      logistic regression
    was: 'Improving score-based motif enrichment by incorporating sequence bias covariates.


      Motif Enrichment In Ranked Lists Of Peaks.


      This project analyzes the relative enrichment of transcription factor binding motifs found in peaks
      at the top or bottom of a given ranking/score. It does this by calculating motif enrichment using
      a logistic regression model that describes the likelihood of a motif being present in sequences
      with higher/lower scores, while accounting for the effect of multiple covariates. The design is
      based on MOODS and statsmodels.


      To get started using MEIRLOP, see our documentation, which gives you a quick idea of what goes into
      and out of MEIRLOP so you can use it for your own experiments. For a full usage example that downloads
      and generates all the data it needs on the fly, see our walkthrough, which recreates commands and
      output for the section "MEIRLOP identifies enriched TF binding motifs in DNase I Hypersensitive
      Sites" from the MEIRLOP manuscript.'
  melinaii:
    description: Runs multiple motif prediction tools simultaneously and compares their results to find
      potential DNA motifs in promoter regions
    was: Run multiple motif prediction tools (Consensus, MEME, Gibbs Sampler, MDScan, Weeder) simultaneously.
      Graphical results can be used to compare predictions of potential DNA motifs (such as transcription
      factor binding sites, TFBS) in promoter regions.
  meme_suite:
    description: Discovers and analyzes sequence motifs with or without gaps, searches DNA and protein
      databases, compares motifs, and associates them with Gene Ontology terms
    was: Unified portal for discovery and analysis of sequence motifs (e.g. DNA binding sites, protein
      interaction domains). Motifs with/without gaps may be discovered, searched for in DNA and protein
      databases, compared to other motifs and analyzed for putative function by association with gene
      ontology terms. MEME is a tool designed for discovering and searching for DNA motifs such as transcription
      factor binding sites (TFBS) or protein domains.
  memes:
    description: Provides an R interface to the MEME Suite for motif analysis on DNA, RNA, and protein
      sequences
    was: 'memes is an R interface to the MEME Suite family of tools, which provides several utilities
      for performing motif analysis on DNA, RNA, and protein sequences. memes works by detecting a local
      install of the MEME suite, running the commands, then importing the results directly into R.


      A docker container for motif analysis in R using the memes packge. Currently, this container is
      build from the development branch of bioconductor_docker_meme, which builds a bioconductor docker
      image + the most current MEME Suite version. This container additionally contains an install of
      the most recent {memes} package along with all dependencies. It can be used to test out {memes}
      or to perform containerized data analysis.


      This repository contains all analysis code associated with the paper ''Memes: an R interface to
      the MEME Suite''.


      motif matching, comparison, and de novo discovery using the MEME Suite.'
  mepp:
    description: Quantifies positional enrichment profiles of motifs relative to anchor points like transcription
      start sites in DNA sequences
    was: Motif Enrichment Positional Profiling (MEPP) quantifies a positional profile of motif enrichment
      along the length of DNA sequences centered on e.g. transcription start sites or transcription factor
      binding motifs.
  meripseqpipe:
    description: An integrated Nextflow pipeline for analyzing MeRIP-seq data from basic processing to
      downstream analysis with visualization reports
    was: An integrated analysis pipeline for MeRIP-seq data based on Nextflow.
  met:
    description: Identifies overrepresented transcription factor motifs in regulatory regions of user-defined
      gene sets for multiple metazoan species
    was: The Motif Enrichment Tool (MET) takes user-defined gene sets and identifies significantly associated
      sets of genes that share a regulatory motif. The tool is available for a number of model organisms
      (human, mouse, zebrafinch, stickleback, fruitfly, etc). It incorporates transcription factor DNA-specificity
      motifs taken from literature curation, bacterial one-hybrid assays, high-throughput SELEX experiments,
      and protein binding microarrays.
  meta-base:
    description: Integrates genomic metadata from multiple public repositories using a structured transformation
      pipeline
    was: META-BASE is a big repository of genomic datasets homogenized with the Genomic Data Model format,
      including Encode, TCGA, Roadmap Epigenomics, 1000 Genomes and others.
  meta-meme:
    description: Creates a hidden Markov model of a motif from MEME output and searches sequence databases
      for matches
    was: Creates hidden Markov model of motif from MEME output and searches sequence database for matches
      to this motif.
  metaboverse:
    description: Explores and contextualizes metabolic data by automatically searching metabolic networks
      for regulatory patterns
    was: 'Automated exploration and contextualization of metabolic data.


      Visualizing and Analyzing Metabolic Networks.


      Integrating multi- or single-omic metabolic data upon the metabolic network can be challenging for
      a variety of reasons. Metaboverse seeks to simplify this task for users by providing a simple, user-friendly
      interface for layering their data on a dynamic representation of the metabolic network and automatically
      searching the network for interesting regulatory or other patterns. Additionally, Metaboverse provides
      several tools to enable the contextualization of metabolic data:.'
  metachrom:
    description: Predicts variant effects on epigenomic profiles at single-nucleotide resolution using
      deep transfer learning from reference chromatin data
    was: 'Predicting Epigenomic Functions of Genetic Variants in the Context of Neurodevelopment via Deep
      Transfer Learning.



      MetaChrom is a transfer learning framework that takes advantage of both an extensive compendium
      of publicly available chromatin profiles data, and epigenomic profiles of cell types related to
      specific phenotypes of interest. It''s capable of predicting the genomic variant effect on epigenomic
      profiles with single-nucleotide resolution. Please see paper for details.'
  metaldetector:
    description: Identifies CYS and HIS involved in transition metal protein binding sites and predicts
      binding site geometry from protein sequence
    was: MetalDetector identifies CYS and HIS involved in transition metal protein binding sites beginning
      with protein sequence alone. The geometry of the metal binding site is also predicted.
  metalogo:
    description: Generates multiple aligned sequence logos from clustered sequence groups to reveal heterogeneity
    was: MetaLogo is a tool for making sequence logos. It can take multiple sequences as input, automatically
      identify the homogeneity and heterogeneity among sequences and cluster them into different groups
      given any wanted resolution, finally output multiple aligned sequence logos in one figure. Grouping
      can also be specified by users, such as grouping by lengths, grouping by sample Id, etc. Compared
      to conventional sequence logo generator, MetaLogo can display the total sequence population in a
      more detailed, dynamic and informative view.
  metare:
    description: Discovers cis-regulatory elements enriched in promoters of differentially expressed genes
      from multiple transcriptome datasets
    was: 'R package for motif discovery via meta-analysis of microarrays and RNA-Seq.


      metaRE R Package for Meta-analysis of Transcriptome Data to Identify the Cis-regulatory Code behind
      the Transcriptional Reprogramming.'
  metaron:
    description: Predicts operons from metagenomic and whole-genome data using gene co-directionality,
      intergenic distance, and promoters
    was: 'A pipeline for prediction of Metagenome and whole-genome opeRons.


      MetaRon (Metagenomic opeRon prediction pipeline) is a computational workflow for the prediction
      of operons from metagenomic data. The pipeline predicts metagenomic operons without any any functional
      or experimental data. It comes with options to process the metagenomic data starting from filtered
      raw reads, which includes: assembly into scaffolds via IDBA, data manipulation, gene prediction
      via prodigal and lastly operon prediction based on gene''s co-directionality, intergenic distance
      (IGD) and promoters.'
  metbp:
    description: Detects metal ions binding to RNA base pairs from PDB or mmCIF files
    was: A Software Tool for Detection of Interaction between Metal Ion-RNA Base Pairs.
  methget:
    description: Correlates genome-wide DNA methylation with gene expression using CG, CHG, and CHH methylation
      from user-provided bisulfite sequencing data
    was: 'Beb-based bioinformatics software for correlating genome-wide DNA methylation and gene expression.


      A web-based bioinformatics software for correlating DNA methylation and gene expression. The web
      user-interface can be accessed through https://paoyang.ipmb.sinica.edu.tw/Software.html .


      Correlation analyses of genome-wide DNA methylation and gene expression.


      Ordinal association analyses with genes ranked by gene expression level.'
  methhaplo:
    description: Identifies DNA methylation haplotype regions from WGBS data using allele-specific methylation
      and SNPs, optionally integrating Hi-C data
    was: 'Combining allele-specific DNA methylation and SNPs for haplotype region identification.


      DNA methylation is an important epigenetic modification that plays a critical role in most eukaryotic
      organisms.'
  methmarker:
    description: Designs and optimizes DNA methylation assays for COBRA, bisulfite SNuPE, bisulfite pyrosequencing,
      MethyLight, and MSP from differentially methylated regions
    was: Design of DNA methylation assays for COBRA, bisulfite SNuPE, bisulfite pyrosequencing, MethyLight
      and MSP. It also implements a systematic workflow for design, optimization and (computational) validation
      of DNA methylation biomarkers. This workflow starts from a preselected differentially methylated
      region (DMR) and results in an optimized DNA methylation assay that is ready to be tested in a large-scale
      clinical trial.
  methmotif:
    description: Integrates transcription factor binding site motifs with DNA methylation profiles to
      analyze methylation-sensitive TFs and their dimerization partners
    was: MethMotif Toolkit integrates transcription factor binding site motifs with DNA methylation profiles,
      offering tools like TFregulomeR and Forked-TF for analyzing methylation-sensitive transcription
      factors and their dimerization partners.
  methodical:
    description: Identifies genomic regions where DNA methylation is correlated with transcription by
      combining RNA-seq and WGBS data
    was: methodical is a Bioconductor package that identifies genomic regions where DNA methylation is
      correlated with transcription, revealing transcript-proximal methylation-associated regulatory sites
      (TMRs). It combines RNA-seq and whole genome bisulfite sequencing (WGBS) data to refine regulatory
      logic in normal and tumor tissues.
  methreg:
    description: Estimates the regulatory potential of DNA methylation on gene transcription using matched
      methylation and expression data with transcription factor binding information
    was: 'Estimating the regulatory potential of DNA methylation in gene transcription.


      Assessing the regulatory potential of DNA methylation regions or sites on gene transcription.


      Epigenome-wide association studies (EWAS) detects a large number of DNA methylation differences,
      often hundreds of differentially methylated regions and thousands of CpGs, that are significantly
      associated with a disease, many are located in non-coding regions.'
  methyl-eqtl:
    description: Identifies methylation-expression quantitative trait loci for each gene and tissue type
      using sequential penalized regression
    was: Methylation-eQTL analysis in cancer research
  methylationtoactivity:
    description: Infers promoter activities from DNA methylation patterns using convolutional neural networks
      trained on histone mark enrichment
    was: 'A deep-learning framework that reveals promoter activity landscapes from DNA methylomes in individual
      tumors.


      Although genome-wide DNA methylomes have demonstrated their clinical value as reliable biomarkers
      for tumor detection, subtyping, and classification, their direct biological impacts at the individual
      gene level remain elusive. Here we present MethylationToActivity (M2A), a machine learning framework
      that uses convolutional neural networks to infer promoter activities based on H3K4me3 and H3K27ac
      enrichment, from DNA methylation patterns for individual genes. Using publicly available datasets
      in real-world test scenarios, we demonstrate that M2A is highly accurate and robust in revealing
      promoter activity landscapes in various pediatric and adult cancers, including both solid and hematologic
      malignant neoplasms'
  methylcoder:
    description: Generates per-base methylation data from bisulfite-treated reads, outputting methylation
      context and levels in text and binary formats
    was: Pipeline for fast, simple processing of BiSulfite-treated reads into methylation data. Includes
      scripts for analysis and visualization. In addition to a binary output, the direct output of methylcoder
      is a text file that indicates per-nucleotide methylation context (CG/CHG/CHH) and methylation levels
      (both coverage and C-T conversions)
  methyldackel:
    description: Extracts methylation calls from BS-seq experiments
    was: A (mostly) universal methylation extractor for BS-seq experiments.
  methylomedb:
    description: Database of genome-wide DNA methylation profiles of human and mouse brains at single-CpG
      resolution
    was: Database of DNA methylation profiles of human and mouse brains.
  methylpipe:
    description: Analyses base-resolution DNA methylation data in CpG and non-CpG contexts from bisulfite
      sequencing experiments
    was: Memory efficient analysis of base resolution DNA methylation data in both the CpG and non-CpG
      sequence context. Integration of DNA methylation data derived from any methodology providing base-
      or low-resolution data.
  methylscaper:
    description: Jointly visualizes DNA methylation and nucleosome occupancy from single-molecule and
      single-cell data using weighted principal component analysis
    was: 'An R/Shiny app for joint visualization of DNA methylation and nucleosome occupancy in single-molecule
      and single-cell data.


      methylscaper is a Shiny app for visualizing methylation data. Install the package with.'
  methylseekr:
    description: Identifies active regulatory regions from bisulfite-sequencing data by detecting transcription
      factor footprints in DNA methylation patterns
    was: This is a package for the discovery of regulatory regions from Bis-seq data.
  methylviewer:
    description: Analyses bisulfite sequencing and MAPit data by querying cytosine methylation at up to
      four user-defined motifs
    was: This tool was developed from CpGviewer such that the program can now analyse up to four different
      methylation sites such as CpG, GpC, CpNpG or any four user defined sites. If a non-native DNA methylase
      is used to modify chromatin-bound DNA, the methylation pattern can be used to identify the binding
      sites of DNA-binding proteins.
  mgraph:
    description: Reconstructs genetic regulatory networks from DNA microarray data using graphical Gaussian
      models and quantifies treatment effects with graphical log-linear models
    was: MGraph is a probabilistic graphical models for reconstruction of genetic regulatory networks
      using DNA microarray.
  miRNAmotif:
    description: Searches miRNA precursors for sequence motifs recognized by RNA-binding proteins to predict
      pre-miRNA–protein interactions
    was: Tool for the Prediction of Pre-miRNA⁻Protein Interactions.
  microfootprinter:
    description: Identifies conserved motifs in regulatory regions of prokaryotic genomes using phylogenetic
      footprinting
    was: Identify the conserved motifs in regulatory regions of prokaryotic genomes using the phylogenetic
      footprinting program FootPrinter.
  microinspector:
    description: Detects miRNA binding sites in a user-defined RNA sequence by searching against known
      miRNA databases
    was: Tool that detects miRNA (microRNA) binding sites in your input sequence by searching against
      databases of known miRNA binding sites.
  microsalmon:
    description: Provides a searchable resource of predicted microRNA targets and 3'UTR cis-regulatory
      elements in the Atlantic salmon full-length transcriptome
    was: A Comprehensive, Searchable Resource of Predicted MicroRNA Targets and 3'UTR Cis-Regulatory Elements
      in the Full-Length Sequenced Atlantic Salmon Transcriptome.
  micsa:
    description: Predicts transcription factor binding sites from ChIP-seq data by combining positional
      information with motif occurrences
    was: Combines positional information with information on motif occurrences to better predict binding
      sites of transcription factors (TFs)
  mindy:
    description: Identifies multivariate statistical dependencies between a transcription factor and its
      targets conditional on a modulator gene
    was: A new information theoretic method to identify multivariate statistical dependencies between
      a transcription factor and one or more of its targets, conditional on the presence (or absence)
      of a candidate modulator gene.
  mini-ex:
    description: Infers cell-type-specific gene regulatory networks from single-cell transcriptomic data
      by integrating TF motif information to filter regulons in plants
    was: We developed MINI-EX (Motif-Informed Network Inference based on single-cell EXpression data),
      an integrative approach to infer cell-type-specific networks in plants. MINI-EX uses single-cell
      transcriptomic data to define expression-based networks and integrates TF motif information to filter
      the inferred regulons, resulting in networks with increased accuracy.
  miprip:
    description: Predicts gene regulatory networks from transcriptome data using mixed integer linear
      programming
    was: 'Modelling TERT regulation across 19 different cancer types based on the MIPRIP 2.0 gene regulatory
      network approach.


      MIPRIP: The Mixed Integer linear Programming based Regulatory Interaction Predictor.'
  mira_single-cell:
    description: Models gene regulation from single-cell multiomics data by jointly analyzing expression
      and chromatin accessibility
    was: Multimodal models for Integrated Regulatory Analysis, or MIRA, is a python package for analyzing
      the dynamic processes of gene regulation using single-cell multiomics datasets.
  mirage:
    description: Infers miRNA regulation of target genes from gene expression profiles
    was: The package contains functions for inferece of target gene regulation by miRNA, based on only
      target gene expression profile.
  mirconnx:
    description: Infers, displays and parses mRNA and microRNA gene regulatory networks from sequence
      and expression data for human and mouse
    was: Web server for inferring, displaying and parsing mRNA and microRNA gene regulatory networks.
      It combines sequence information with gene expression data analysis to create a disease specific,
      genome wide regulatory network. Only supports human and mouse.
  mireya:
    description: Detects miRNA-gene-enhancer trios from expression data to identify miRNA-directed gene
      activation
    was: MIREyA (MIRnas functioning through Enhancer Activation) is a computational approach to detect
      miRNA-directed gene activation. It is a pipeline for detection of miRNAs and their gene targets
      up-regulated through triggering their enhancer in the provided expression
  mirffldb:
    description: Provides human miRNA-transcription factor-target gene coregulatory networks and associated
      feed-forward loops with interactive visualization
    was: 'An integrated resource for human miRNA-Transcription Factor-Target Gene coregulatory networks
      and associated Feed Forward Loops.


      Defence Institute of Physiology and Allied Science.


      miRNA and Transcription Factors (TFs) are fundamental transcriptional and post-transcriptional regulators
      of the gene expression respectively, controlling important biological processes.'
  mirfold:
    description: Searches for miRNA-like folding in sequences surrounding putative miRNAs, optimized on
      plant miRNAs
    was: Searches for a good miRNA-like folding in the sequence surrounding a putative miRNA. It was optimized
      on plant miRNAs.
  miringo:
    description: Predicts GO terms indirectly targeted by human microRNAs via transcription factor regulation
    was: 'Prediction of biological processes indirectly targeted by human microRNAs.


      miRinGO: Prediction of GO terms indirectly targeted by human microRNAs.


      This R Shiny application can be used to predict Gene Ontology (GO) terms indirectly targeted by
      human microRNAs. In contrast to direct targets which are predicted to have binding sites, indirect
      targets are regulated transcriptionally through transcription factors (TFs).'
  mirstart_20:
    description: Annotates miRNA transcription start sites and identifies tissue-specific TF-miRNA interactions
      using a deep learning-based model
    was: miRStart 2.0 is a tool for annotating miRNA transcription start sites (TSSs) and identifying
      tissue-specific TF-miRNA interactions using a deep learning-based model. It integrates over 4500
      high-throughput datasets and provides network visualizations to facilitate miRNA regulatory insights.
  mirsynergy:
    description: Detects synergistic miRNA regulatory modules by overlapping neighbourhood expansion from
      miRNA target and expression data
    was: Detect synergistic miRNA regulatory modules by overlapping neighbourhood expansion.
  mirvestigator:
    description: Identifies miRNAs likely to regulate co-expressed genes by searching for overrepresented
      motifs in 3' UTRs and comparing to miRBase seeds using a hidden Markov model
    was: miRvestigator is a web based tool to identify miRNAs mediating co-regulation of gene expression
      patterns observed in transcriptome profilng data. The miRvestigator takes as input a list of co-expressed
      genes and returns the most likely miRNA regulating the genes. It searches for an over-represented
      sequence motif in the 3' UTRs of the genes using Weeder and compares the motif to all unique miRNA
      seed sequences in miRBase using our custom built miRvestigator hidden Markov model (HMM).
  mitsu:
    description: Discovers transcription factor binding site motifs using stochastic EM with an unconstrained
      likelihood approximation
    was: Command line application for the discovery of transcription factor binding site (TFBS) motifs.
  mixNBHMM:
    description: Detects and classifies short and broad differential epigenomic enrichment across multiple
      conditions from ChIP-seq, ATAC-seq, or DNase-seq data using a hidden Markov model with a mixture
      of negative binomials
    was: 'Efficient Detection and Classification of Epigenomic Changes Under Multiple Conditions.


      Differential Peak Calling via Hidden Markov Model With Mixture of Negative Binomial Distributions.


      mixNBHMM is an R package for the detection of genomic regions exhibiting short and broad differential
      enrichment under multi-replicate, multi-condition settings. It is applicable to data from ChIP-seq,
      ATAC-seq, DNase-seq, and related experiments. mixNBHMM detects these regions using a three-state
      hidden Markov model (HMM) with a finite mixture of negative binomials as emission distribution in
      the HMM’s differential state. The HMM framework is particularly suitable for the detection of differential
      broad peaks and the mixture model allows the classification of differential combinatorial patterns
      of enrichment across conditions. Code to replicate the results from the mixNBHMM paper is available
      at https://github.com/plbaldoni/mixNBHMMPaper'
  mixchip:
    description: Identifies cell type specific TF binding sites from heterogeneous ChIP-seq data using
      a probabilistic method
    was: Probabilistic method for identifying cell type specific TF binding sites from heterogeneous chromatin
      immunoprecipitation sequencing (ChIP-seq) data.
  mkt:
    description: Detects signatures of natural selection by comparing different classes of DNA sites using
      standard and generalized McDonald-Kreitman tests
    was: Standard and Generalized McDonald-Kreitman Test (MKT) is a web tool for the molecular level detection
      of signatures of natural selection.
  mmdiff2:
    description: Detects statistically significant differences between read enrichment profiles in ChIP-seq
      samples using kernel methods
    was: This package detects statistically significant differences between read enrichment profiles in
      different ChIP-Seq samples. To take advantage of shape differences it uses Kernel methods (Maximum
      Mean Discrepancy, MMD).
  moan:
    description: Discovers regulatory motifs in promoters using a large negative set to improve discriminatory
      power
    was: Discriminative pattern finder capable of using a very large negative set to greatly improve its
      predictive power. It is capable of handling sequences that are not repeat masked given that the
      negative set is a representative sample of promoters from the organism examined.
  mobilomefinder:
    description: Discovers bacterial genomic islands by integrating microarray comparative genomic hybridization
      data and tRNA site analysis
    was: Tool for high-throughput genomic island discovery.
  mocca:
    description: Models DNA cis-regulatory element sequences using motif occurrence combinatorics with
      SVM and Random Forest methods
    was: MOCCA (Motif Occurrence Combinatorics Classification Algorithms) is a suite for modelling DNA
      cis-regulatory element (CRE) sequences.
  moccs:
    description: Clarifies DNA-binding motif ambiguity from ChIP-seq data
    was: Method for for clarifying DNA-binding motif ambiguity.
  mochiview:
    description: Integrates genome browsing with DNA motif visualization and analysis for large genomic
      data sets
    was: Hybrid genome browser and motif visualization/analysis/management desktop software.
  mod_tools:
    description: Discovers conserved sequence and structure motifs in nucleotide sequences from co-regulated
      or homologous genes using Weeder, WeederH, and RNAProfile
    was: 'Tools for Motif Discovery (MoD) in nucleotide sequences that includes: Weeder, a program for
      detecting transcription factor binding sites (TFBS) in coregulated genes, WeederH, a tool for detecting
      TFBS and regulatory regions from homologous genes, and RNA profile, a tool for secondary structure
      motif discovery in RNA sequences.'
  modalyser:
    description: Identifies disease module hub regulators and reduces modules to most disease-associated
      genes from transcriptomics data
    was: MODalyseR is a software for identifying disease module regulators and reducing modules to the
      most disease associated genes.
  modent:
    description: Reconstructs logical gene regulatory networks from expression data using an entropy-based
      approach to avoid discretization errors
    was: Computational tool that reconstructs gene regulatory networks from high throughput experimental
      data.
  moder2:
    description: Discovers monomeric and dimeric binding motifs using first-order Markov modeling from
      DNA sequences
    was: 'First-order Markov modeling and discovery of monomeric and dimeric binding motifs.


      MODER2 is implemented in C++ and has been tested in Linux platform. As the only external dependency,
      the MODER2 requires the Boost library, which is normally installed on Linux machines. Relatively
      recent version should be used.'
  modle:
    description: Simulates realistic genome-wide contact patterns from DNA loop extrusion in minutes using
      stochastic modeling
    was: MoDLE is a computational tool for fast, stochastic modeling of molecular contacts from DNA loop
      extrusion capable of simulating realistic contact patterns genome wide in a few minutes.
  modsubnetbiomident:
    description: Infers functions of longevity genes from modular subnetwork biomarkers of Caenorhabditis
      elegans aging
    was: Inferring the functions of longevity genes with modular subnetwork biomarkers of Caenorhabditis
      elegans aging. A method where the biomarkers are networks of genes selected based on age-dependent
      activity and a graph-theoretic property called modularity. These modular biomarkers are applied
      to assign novel aging-related functions to poorly characterized longevity genes.
  modularboost:
    description: Infers gene regulatory networks from expression data by decomposing into modules and
      inferring intra- and inter-modular interactions
    was: ModularBoost is an efficient network inference algorithm based on module decomposition.
  moduledigger:
    description: Detects cis-regulatory modules from transcription factor binding site data using itemset
      mining
    was: An itemset mining framework for the detection of cis-regulatory modules.
  modulemaster:
    description: Finds cis-regulatory modules in sets of co-expressed genes using transcription factor
      binding and multivariate functional relationships
    was: Novel application for finding cis-regulatory modules (CRMs) in sets of co-expressed genes. The
      application comes with a newly developed method which not only considers transcription factor binding
      information but also multivariate functional relationships between regulators and target genes to
      improve the detection of CRMs.
  moma:
    description: Segments and tracks cells from phase-contrast images using device geometry, with a leveraged-editing
      curation interface for single-click error correction
    was: Takes specific advantage of the geometry of the device to accurately segment and track cells
      using only phase-contrast images, and further provides a curation user interface with leveraged-editing,
      meaning that a set of related errors are often fixed with a single click.
  monet_R:
    description: Explores transomic interactions by tracing SNP-gene-metabolite relationships from multi-omic
      data using an integrated network
    was: MoNET is an R package providing network analysis of -omics findings. It is built on top of an
      integrated network, including metabolite-protein interactions, protein interactions and relationships
      between genetic variations and transcription factor binding sites.
  monkey:
    description: Identifies conserved transcription-factor binding sites in multiple sequence alignments
      using probabilistic models of factor specificity and binding-site evolution
    was: MONKEY is a set of programs designed to search alignments of non-coding DNA sequence for matches
      to matrices representing the sequence specificity of transcription factors.
  moods:
    description: Matches position weight matrices against DNA sequences using fast online algorithms
    was: A suite of algorithms for matching position weight matrices (PWM) against DNA sequences. It features
      advanced matrix matching algorithms implemented in C++ that can be used to scan hundreds of matrices
      against chromosome-sized sequences in few seconds. MOODS can also process high-order PWMs with dependencies
      between adjacent positions and sequence variants such as SNPs, insertions and deletions.
  moonlight2r:
    description: Identifies cancer driver genes by integrating gene expression and DNA methylation data
    was: Moonlight2R is a Bioconductor package designed to identify cancer driver genes by integrating
      gene expression and DNA methylation data, enhancing insights into cancer mechanisms and providing
      potential therapeutic targets.
  moonlightr:
    description: Infers gene regulatory networks from TCGA expression data and scores biological processes
      to identify candidate cancer driver genes
    was: The understanding of cancer mechanism requires the identification of genes playing a role in
      the development of the pathology and the characterization of their role. We present an R/bioconductor
      package which returns a list of candidate driver genes for specific cancer types based on TCGA expression
      data. First infers gene regulatory networks and then carries out a functional enrichment analysis
      to score the importance of well-known biological processes with respect to the studied cancer type.
  mosaics:
    description: Fits a statistical framework for analyzing one-sample or two-sample ChIP-seq data of
      transcription factor binding and histone modification
    was: This package provides functions for fitting MOSAiCS-HMM, an statistical framework to analyze
      one-sample or two-sample ChIP-seq data of transcription factor binding and histone modification.
  mosdi:
    description: Computes motif statistics and exact motif discovery using probabilistic arithmetic automata
    was: Contains a lot of sequence analysis algorithms, including methods for motif statistics, exact
      motif discovery, analysis of pattern matching algorithms, etc.
  most-motif:
    description: Finds de novo motifs from ChIP-seq data by extracting distribution features of nearby
      epigenomic markers such as histone modification or nucleosome occupancy
    was: MOST+ is a fast MOTIF finding tool(MOtif finding by Suffix tree and heterogeneous Tags). It extracts
      distribution features of nearby epigenomic markers, like histone modification or nucleosome occupancy,
      to help de novo find motif, thus rendering a higher level of accuracy on characterizing motif (cross-validated
      by ChIP-seq data) and more co-factors.
  motif-raptor:
    description: Integrates sequence-based predictive models, chromatin accessibility, gene expression
      and GWAS summary statistics to prioritize causal transcription factor regulators affected by genetic
      variants
    was: 'A Cell Type-Specific and Transcription Factor Centric Approach for Post-GWAS Prioritization
      of Causal Regulators.


      We present Motif-Raptor, a TF-centric computational tool that integrates sequence-based predic-tive
      models, chromatin accessibility, gene expression datasets and GWAS summary statistics to systematically
      investigate how TF function is affected by genetic variants.


      Genome-wide association studies (GWAS) have identified thousands of common trait-associated genetic
      variants but interpretation of their function remains challenging.'
  motif_prob:
    description: Quantifies motif occurrences in biological sequences using an exact formula with progressive
      approximation
    was: Fast and exact quantification of motif occurrences in biological sequences.
  motif_scraper:
    description: Finds matches to degenerate nucleotide motifs in FASTA files using multiprocessor searches
    was: Tool for finding matches to degenerate sequence motifs in FASTA files.
  motifcatcher:
    description: Determines and evaluates biologically significant motifs via a MATLAB GUI platform
    was: a MATLAB GUI platform for determination and evaluation of biologically significant motifs
  motifcut:
    description: Finds DNA regulatory motifs by searching for maximum density subgraphs in a k-mer similarity
      graph
    was: DNA motif-finding algorithm using a Maximum Density Subgraph.
  motifdetector:
    description: Finds motifs in multiple DNA sequences using a randomized algorithm for seeds and an
      improved EM algorithm for local search
    was: Designed to find motifs in multiple DNA sequences.The software uses the randomized algorithm
      to find good seeds and uses the improved EM algorithm to do local search.
  motifeR:
    description: Identifies and visualizes statistically significant protein post-translational modification
      motifs from large datasets
    was: 'An Integrated Web Software for Identification and Visualization of Protein Posttranslational
      Modification Motifs.


      This is an R package for motifeR software.


      Shisheng Wang, Yue Cai, Jingqiu Cheng, Wenxue Li, Yansheng Liu and Hao Yang. "motifeR: An Integrated
      Web Software for Identification and Visualization of Protein Post‐Translational Modification Motifs."
      Proteomics (2019): 201900245. (DOI: 10.1002/pmic.201900245)'
  motifgenie:
    description: Searches transcription factor binding motifs in shared regions from multiple ChIP-Seq
      experiments
    was: MotifGenie is a Python command line tool for searching transcription factor binding motif sequences
      in merged ChIP-Seq binding sites. First, MotifGenie analyzes multiple ChIP-Seq samples simultaneously
      to identify shared binding regions for a locus of interest, then, searches the binding motif sequence
      of a given transcription factor in these shared binding regions.
  motiflab:
    description: Integrates motif discovery tools and diverse genomic data to identify transcription factor
      binding sites and cis-regulatory modules
    was: 'General workbench for analyzing regulatory sequence regions and discovering transcription factor
      binding sites and cis-regulatory modules. It can improve performance of binding site predictions
      by allowing users to integrate several motif discovery tools, as well as different types of data:
      phylogenetic conservation, epigenetic marks, DNase hypersensitive sites, ChIP-Seq data, positional
      binding preferences of transcription factors, TF-TF interactions, TF-expression and target gene
      expression.'
  motifpeeker:
    description: Benchmarks epigenomic profiling methods by analyzing motif enrichment and generating
      an HTML report
    was: MotifPeeker is an R package designed to benchmark epigenomic profiling methods by analyzing motif
      enrichment. It generates an HTML report summarizing general metrics, known motif enrichment, and
      de-novo motif discovery, and is available on Bioconductor with a Docker image for ease of use.
  motifregressor:
    description: Discovers sequence motifs upstream of genes that undergo expression changes by combining
      matrix-based motif finding with oligomer motif-expression regression analysis
    was: MOTIFREGRESSOR for discovering sequence motifs upstream of genes that undergo expression changes
      in a given condition. The method combines the advantages of matrix-based motif finding and oligomer
      motif-expression regression analysis, resulting in high sensitivity and specificity. MOTIF REGRESSOR
      is particularly effective in discovering expression-mediating motifs of medium to long width with
      multiple degenerate positions.
  motifrg:
    description: Discovers differential motifs between two sequence datasets using regression methods,
      scalable to large ChIP-seq data
    was: Tools for discriminative motif discovery using regression methods.
  motifsearch:
    description: Searches for transcription factor binding sites using criteria such as p-value or false-positive
      rate from negative examples
    was: Motif Search allows you to specify several different criteria when searching for sites, such
      as a p-value or an approximate false-positive rate given a set of negative examples.
  motifsim:
    description: Detects similarity in single or multiple DNA motif datasets
    was: Detecting similarity in a single or multiple DNA motif datasets.
  motifsuite:
    description: Streamlines probabilistic motif detection with post-processing procedures for prioritizing
      output
    was: Probabilistic motif detection.
  motifviz:
    description: Detects overrepresented transcription factor binding motifs via a web interface to four
      motif discovery programs
    was: 'MotifViz is a tool for detecting overrepresented transcription factor binding motifs.  Four
      motif discovery programs are accessible from the MotifViz web interface: Clover, Rover, Motifish
      and Possum.'
  motimul:
    description: Discovers significant sequence motifs from DNA sequences using multiple testing correction
      with Tarone's method
    was: 'A significant discriminative sequence motif discovery algorithm with multiple testing correction.


      sudo apt-get install libgmp3-dev.


      Or see this URL. Notice that the build option "--enable-cxx" is necessary for configuration like
      this:.


      Execute MotiMul without distinguishing a sequence and its complementary strand if you use it for
      DNA sequences. -v.'
  motiv:
    description: Compares a set of motifs to a database using STAMP and visualizes motifs, distributions,
      and modules
    was: This package makes use of STAMP for comparing a set of motifs to a given database (e.g. JASPAR).
      It can also be used to visualize motifs, motif distributions, modules and filter motifs.
  motto:
    description: Converts position weight matrices into wildcard-style consensus sequences with minimum
      information loss
    was: 'Representing Motifs in Consensus Sequences with Minimum Information Loss.


      Represent motifs in consensus sequences.


      -- representing motifs in consensus sequences with minimum information loss.


      git clone https://github.com/MichaelMW/motto.git.'
  mouse_genome_informatics:
    description: Integrates genetic, genomic, and biological data for the laboratory mouse to support
      human health and disease research
    was: MGI (Mouse Genome Informatics) is a knowledgebase providing integrated genetic, genomic, and
      biological data for the laboratory mouse to facilitate research on human health and disease. It
      serves as a central resource, integrating data from multiple databases and providing access to FAIR-compliant
      data.
  mpra:
    description: Provides data management, count preprocessing, and differential analysis for massively
      parallel reporter assays using linear models
    was: Tools for data management, count preprocessing, and differential analysis in massively parallel
      report assays (MPRA).
  mpra_design_tools:
    description: Interactive design of MPRA constructs with power analysis and automated sequence generation
      from VCF files
    was: Interactive MPRA experimental design encompassing both power analysis and design of constructs.
  mpralib:
    description: Processes and analyzes Massively Parallel Reporter Assay data from raw sequencing reads
      to counts
    was: MPRAlib and MPRAsnakeflow are computational tools for uniform processing and analysis of data
      from Massively Parallel Reporter Assays (MPRAs). They provide standardized formats and robust analysis
      pipelines to improve data integration, reproducibility, and meta-analyses across studies.
  mpromdb:
    description: Curated database annotating gene promoters identified from ChIP-seq data, searchable
      by gene, tissue, and filterable by promoter properties
    was: Curated database to annotate gene promoters identified from ChIP-seq results. Users can search
      the database based on gene id/symbol, or by specific tissue/cell type and filter results based on
      any combination of tissue/cell specificity, Known/Novel, CpG/NonCpG, and protein-coding/non-coding
      gene promoters. Also integrated is a GBrowse genome browser for visualization of ChIP-seq profiles
      and to display the annotations.
  mpvnn:
    description: Predicts cancer-specific survival risk from gene expression data using a visible neural
      network that incorporates pathway knowledge and gene mutation data to model disrupted signal flow
    was: Mutated Pathway Visible Neural Network (MPVNN) architecture, designed using prior signaling pathway
      knowledge and random replacement of known pathway edges using gene mutation data simulating signal
      flow disruption.
  mqtl.nmr:
    description: Performs mQTL analysis on 1H NMR data with preprocessing including normalisation, peak
      alignment, and dimensionality reduction
    was: Provides a complete mQTL analysis pipeline for 1H NMR data. Distinctive features include normalisation
      using most-used approaches, peak alignment using RSPA approach, dimensionality reduction using SRV
      and binning approaches, and mQTL analysis for animal and human cohorts.
  mscdpb:
    description: Predicts DNA-protein binding from ChIP-seq data using multi-scale complementary features
      and Chou's 5-step rule
    was: mscDPB is a tool that uses Chou's 5-step rule to predict DNA-protein binding with nulti-scale
      complementary feature.
  mscentipede:
    description: Infers transcription factor binding sites from chromatin accessibility data using a model
      that accounts for heterogeneity across genomic sites and replicates
    was: Algorithm for accurately inferring transcription factor binding sites using chromatin accessibility
      data.
  msdb_h:
    description: Integrates and visualizes human musculoskeletal NGS data for cross-sample and cross-omics
      analysis, including differential expression and gene regulatory networks
    was: An integrated expression atlas of human musculoskeletal system.
  msifinder:
    description: Detects microsatellite instability status from genome sequencing data using a random
      forest classifier
    was: MSIFinder is a python package for detecting Microsatellite instability (MSI) status using random
      forest classifier. Microsatellite instability (MSI) is a common genomic alteration in colorectal
      cancer, endometrial carcinoma, and other solid tumors. MSI is characterized by a high degree of
      polymorphism in microsatellite lengths owing to the deficiency in the mismatch repair system. Based
      on the degree, MSI can be classified as microsatellite instability-high (MSI-H) and microsatellite
      stable (MSS). MSI is a predictive biomarker for immunotherapy efficacy in advanced/metastatic solid
      tumors, especially in colorectal cancer patients. Several computational approaches based on target
      panel sequencing data have been used to detect MSI; however, they are considerably affected by the
      sequencing depth and panel size.
  msisensor-pro:
    description: Detects microsatellite instability from tumor-only WGS, WES, or panel sequencing data
      using a multinomial distribution model
    was: 'Fast, accurate and matched-normal-sample-free detection of microsatellite instability.


      MSIsensor-pro is an updated version of msisensor. MSIsensor-pro evaluates Microsatellite Instability
      (MSI) for cancer patients with next generation sequencing data. It accepts the whole genome sequencing,
      whole exome sequencing and target region (panel) sequencing data as input. MSIsensor-pro introduces
      a multinomial distribution model to quantify polymerase slippages for each tumor sample and a discriminative
      sites selection method to enable MSI detection without matched normal samples.'
  mspc:
    description: Combines p-values of overlapping peaks from ChIP-seq replicates to evaluate significance
      with user-defined thresholds
    was: 'Given a set of peaks from (biological or technical) replicates, this tool combines the p-values
      of overlapping enriched regions: users can choose a threshold on the combined significance of overlapping
      peaks and set a minimum number of replicates where the overlapping peaks should be present.'
  mugvre:
    description: Integrates genomics tools for 3D/4D chromatin dynamics analyses in a cloud-based virtual
      research environment
    was: The MuG Virtual Research Environment is an analysis platform for 3D/4D genomics analyses. It
      integrates genomics tools for chromatin dynamics data.
  mulan:
    description: Performs local multiple DNA sequence alignments and identifies evolutionarily conserved
      transcription factor binding sites across multiple species
    was: Performs local multiple DNA sequence alignments of finished and draft-quality sequences. It identifies
      transcription factor binding sites evolutionarily conserved across multiple species.
  mulnet:
    description: Reconstructs intra- and intercellular signaling networks from bulk and single-cell RNA-seq
      data using a multilayer network framework
    was: MulNet is a framework that reconstructs intra- and intercellular signaling networks from bulk
      and single-cell RNA-seq data, enabling high-resolution analysis of complex biological interactions.
      The code and dataset are publicly available.
  multi_locus_view:
    description: Analyses and visualises multiple genomic locations from NGS data with integrated filtering
      and annotation
    was: 'An Extensible Web Based Tool for the Analysis of Genomic Data.


      Multi Locus View (MLV) is a web based tool for analysing and visualising Next Generation Sequencing
      data sets. By allowing intuitive filtering and visualisation of multiple genomic locations, it allows
      the user to quickly drill down and annotate regions of interest. A Public version can be accessed
      here.'
  multibind:
    description: Performs multiple alignment of protein binding sites from protein-small molecule complexes
      to recognize common physico-chemical binding patterns
    was: Multiple Alignment of Protein Binding Sites (MultiBind) is a prediction tool for protein binding
      sites. Users input a set of protein-small molecule complexes and MultiBind predicts the common physio-chemical
      patterns responsible for protein binding.
  multiomix:
    description: Infers cancer genomic and epigenomic events associated with gene expression modulation
      from multi-omics data
    was: A cloud-based platform to infer cancer genomic and epigenomic events associated with gene expression
      modulation.
  multioviz:
    description: Performs in silico hypothesis testing of gene regulatory networks via a web application
      and R package
    was: Multioviz is a platform for in silico perturbation and interrogation of gene regulatory networks,
      designed to bridge the gap between high-dimensional computation and wet-lab experimentation. Users
      can perform hypothesis testing using a web application and an associated R package.
  multipsq:
    description: Analyses multiplex-pyrograms from pyrosequencing reactions for SNP-based pathogen typing
    was: MultiPSQ expedites the analysis and evaluation of multiplex-pyrograms, generated from multiplex
      pyrosequencing
  musera:
    description: Combines evidence from enriched regions across multiple ChIP-seq or DNase-seq replicates
      to increase statistical significance and provides quantitative evaluations and graphical displays
    was: MuSERA (Multiple Sample Enriched Region Assessment) is a broadly useful stand-alone tool for
      both interactive and batch analysis of combined evidence from enriched regions in multiple ChIP-seq
      or DNase-seq sample replicates, with a user-friendly graphical interface.
  mustache:
    description: Detects chromatin loops from Hi-C and Micro-C contact maps using scale-space representation
    was: 'Multi-scale Detection of Chromatin Loops from Hi-C and Micro-C Maps using Scale-Space Representation.


      Mustache (Multi-scale Detection of Chromatin Loops from Hi-C and Micro-C Maps using Scale-Space
      Representation) is a tool by Abbas Roayaei Ardakany, Halil Tuvan Gezer, Stefano Lonardi and Ferhat
      Ay (ferhatay@lji.org).'
  mustard:
    description: Identifies small non-coding RNA genomic loci using a multi-branch convolutional neural
      network trained on user-defined genomic regions
    was: 'Multi-branch Convolutional Neural Network for Identification of Small Non-coding RNA genomic
      loci.


      MuStARD - autoMated SmAll Rna Detection.'
  mutalisk:
    description: Correlates somatic mutations with genomic, transcriptional and epigenomic features to
      understand mutational processes
    was: MUTation AnaLyIS toolKit. Comprehensive analysis of somatic DNA mutations with genome regulation
      elements and DNA sequence contexts.
  mutviz_2.0:
    description: Analyzes and visualizes mutation enrichments and mutational signature contributions in
      user-provided genomic regions across cancer types
    was: Analysis and Visualization of Mutation Enrichments for Selected Genomic Regions and Cancer Types
  mybs:
    description: Maps transcription factor binding sites in yeast by integrating ChIP-chip data and position
      weight matrices from multiple databases
    was: MYBS (Mining Yeast Binding Sites) is a tool for mapping Transcription factors (TFs) and their
      binding sites (TFBSs) that integrates both experimentally verified (ChIP-chip data) and predicted
      position weight matrixes (PWMs) from several databases.
  myprosle:
    description: Summarizes individual patient transcriptomes into gene modules to predict clinical outcomes
      in SLE
    was: MyPROSLE was developed with the aim of bringing molecular information from patients to clinical
      practice. For this, we have created a new methodology to summarize the transcriptome of individual
      patients in a series of biological functions or gene-modules, which were later used to predict up
      to a total of 111 different clinical outcomes, including clinical manifestations, laboratory measurements,
      cytokine levels, autoantibodies, cell percentages, nearby disease flares and response to drugs.
  nadfinder:
    description: Identifies nucleolus-associated domains from NAD-seq data with chromosome-level local
      baseline correction
    was: This Bioconductor package has been developed for bioinformatic analysis of the NAD-seq data,
      including normalization, smoothing, peak calling, peak trimming and annotation.
  nae:
    description: Evaluates gene regulatory network activity from dynamic expression data using regularized
      constraint programming
    was: Evaluating gene regulatory network activity from dynamic expression data by regularized constraint
      programming.
  nallo:
    description: Analyses PacBio and ONT long-reads to detect genetic variants, assemble genomes, report
      CpG methylation, and rank variants by functional impact
    was: 'Nallo is a bioinformatics analysis pipeline for long-reads from both PacBio and (targeted) ONT-data,
      focused on rare-disease. The pipeline detects a wide range of genetic variants, performs genome
      assembly,

      and reports CpG methylation. It also enables annotation and ranking of variants based on their predicted
      functional

      consequences.'
  narrowpeaks:
    description: Applies functional principal component analysis to ChIP-seq peak regions for differential
      variation analysis across multiple samples with replicates
    was: The package applies a functional version of principal component analysis to postprocess data
      in wiggle track format, commonly produced by generic ChIP-seq peak callers, by applying FPCA over
      a set of read-enriched regions (ChIP-seq peaks) and to analyse differential variation between multiple
      ChIP-seq samples with replicates.
  nasap:
    description: Profiles nascent RNA from sequencing data with quality control and regulatory network
      analysis
    was: Nascent RNA profiling data analysis platform.
  navise:
    description: Processes genome-wide epigenomics sequencing data into a final report of predicted superenhancers
      with interactive navigation
    was: User-friendly streamlined tool which performs a fully-automated parallel processing of genome-wide
      epigenomics data from sequencing files into a final report, built with a comprehensive set of annotated
      files that are navigated through a graphic user interface.
  nbbc:
    description: Explores and visualizes non-B DNA motif burden in cancer genomes using gene-, signature-
      and site-level metrics
    was: Non-B DNA burden explorer in cancer.
  nbia:
    description: Transforms meta-analysis of multiple expression datasets into pathway analysis problems
      using network topology
    was: 'A network-based integrative analysis framework.


      With the explosion of high-throughput data, effective integrative analyses are needed to decipher
      the knowledge accumulated in biological databases. Existing meta-analysis approaches in systems
      biology often focus on hypothesis testing and neglect real expression changes, i.e. effect sizes,
      across independent studies. In addition, most integrative tools completely ignore the topological
      order of gene regulatory networks that hold key characteristics in understanding biological processes.
      Here we introduce a novel meta-analysis framework, Network-Based Integrative Analysis (NBIA), that
      transforms the challenging meta-analysis problem into a set of standard pathway analysis problems
      that have been solved efficiently'
  ncbi_epigenomics:
    description: Provides processed and mapped whole-genome epigenetic data tracks for browsing and download
    was: Resource for whole-genome epigenetic data sets. Raw data is processed and mapped to genomic coordinates
      to generate 'tracks' that are a visual representation of the data. These data tracks can be viewed
      using popular genome browsers or downloaded for local analysis. This resource also provides the
      user with a unique interface that allows for intuitive browsing and searching of data sets based
      on biological attributes.
  ncpro-ml:
    description: Identifies non-coding RNA promoters in human and mouse using sequence encoding schemes
    was: 'An integrated computational tool for identifying non-coding RNA promoters in multiple species.


      The promoter is located near the transcription start sites and regulates transcription initiation
      of the gene. Accurate identification of promoters is essential for understanding the mechanism of
      gene regulation. Since experimental methods are costly and ineffective, developing efficient and
      accurate computational tools to identify promoters are necessary. Although a series of methods have
      been proposed for identifying promoters, none of them is able to identify the promoters of non-coding
      RNA (ncRNA). In the present work, a new method called ncPro-ML was proposed to identify the promoter
      of ncRNA in Homo sapiens and Mus musculus, in which different kinds of sequence encoding schemes
      were used to convert DNA sequences into feature vectors. To test the length effect, for each species,
      datasets including sequences with different lengths were built'
  ncrna:
    description: A database of non-translatable RNA transcripts that lack protein-coding capacity, excluding
      housekeeping RNAs, microRNAs and snoRNAs
    was: Non-translatable RNA transcripts that appear to work at the RNA level.
  neat-seq:
    description: Simultaneously profiles intra-nuclear proteins, chromatin accessibility and gene expression
      in single cells
    was: Simultaneous profiling of intra-nuclear proteins, chromatin accessibility and gene expression
      in single cells.
  nebula:
    description: Analyzes ChIP-seq data through a Galaxy-based web service with peak calling, motif discovery,
      and genomic annotation
    was: Web service powered by Galaxy which allows users (Bioinformaticians as far as Biologists) to
      analyze their ChIP-seq data.
  necare:
    description: Predicts cancer-specific protein-protein interactions using a relational graph convolutional
      network with knowledge-based features
    was: 'Network-based cancer gene relationship prediction method reveals perturbations in the cancer
      gene network.


      NEtwork-based CAncer gene RElationship prediciton.


      NECARE is a network-based algrithom which use Relational Graph Convolutional Network (R-GCN) to
      predict genes inetraction in cancer.


      The feature NECARE used include:1) knowledge-based feature OPA2Vec; 2)cancer specific feature which
      means mutation and expression profile of each gene from TCGA.'
  neco:
    description: Generates node embeddings from multiplex heterogeneous gene-phenotype networks using
      random walk with restart
    was: 'A node embedding algorithm for multiplex heterogeneous networks.


      NECo is a node embedding tool that utilizes multiplex heterogeneous gene phenotype network. NECo
      allows multi-layer gene and phenotype networks. NECo generates gene embeddings using Gene-Gene,
      Gene-Phenotype, Phenotype-Gene and Phenotype-Phenotype neibhorhood spaces, using the random walk
      with restart rankings as node sequences.'
  nemo_archive:
    description: A BRAIN Initiative repository for single-cell transcriptomic and epigenomic data from
      the mammalian brain
    was: A BRAIN Initiative resource for single-cell transcriptomic and epigenomic data from the mammalian
      brain.
  netactivity:
    description: Computes gene set activity scores from bulk RNA-seq and microarray data using sparsely-connected
      autoencoders
    was: NetActivity is a Bioconductor package that computes gene set activity scores from previously
      trained sparsely-connected autoencoders. It enables the combination of bulk RNA-seq and microarray
      datasets for meta-analyses.
  netprophet:
    description: Maps transcription factor networks from gene expression data using a data-light algorithm
      that combines multiple approaches, TF binding domain similarity, and inferred DNA binding specificities
    was: Mapping transcription factor networks by exploiting scalable data resources.
  netseekr:
    description: Analyzes RNA-Seq time series data to infer correlation and regulatory networks and perform
      differential expression analysis
    was: A network analysis pipeline for RNA-Seq time series data.
  nettime:
    description: Predicts cell-type-specific transcription factor binding sites with base-pair resolution
      using a multitask learning framework
    was: Improving Multitask Transcription Factor Binding Site Prediction with Base-pair Resolution.
  netvenn:
    description: Compares and analyzes gene lists by combining Venn diagrams with interactome network
      data and functional enrichment
    was: NetVenn is a network-based web platform for the comparison and analysis of gene lists by combining
      Venn diagram and gene set enrichment.
  netview:
    description: Explores human and mouse gene regulatory networks by querying with a gene identifier
      and subnetwork boundaries, returning interactions, enriched GO terms, and a graphical representation
    was: Free web tool that allow end users to explore the human and mouse gene regulatory networks. Users
      can query the system by providing a gene identifier and the boundaries of the subnetwork being explored.
      The system provides the list of interactions, the enriched Gene Ontology Terms together with a graphical
      representation of the subnetwork.
  network_of_cancer_genes:
    description: Collects and integrates data on human genes mutated in cancer, providing information
      on duplicability, orthology, evolutionary appearance and network properties
    was: The Network of Cancer Genes collects and integrates data on 736 human genes that are mutated
      in various types of cancer. For each gene, it provides information on duplicability, orthology,
      evolutionary appearance and topological properties of the encoded protein in a comprehensive version
      of the human protein-protein interaction network.
  netzoo:
    description: Corrects persistent batch effects in correlation networks by estimating a batch-corrected
      gene co-expression matrix using the COBRA method
    was: netZoo is a software package for higher-order correction of persistent batch effects in correlation
      networks. It implements the COBRA method to estimate a batch-corrected gene co-expression matrix,
      allowing control for continuous and categorical covariates.
  netzoor:
    description: Infers genotype-specific gene regulatory networks from genotype, eQTL, TF motif, gene
      expression, and PPI data using message passing
    was: 'Predicting genotype-specific gene regulatory networks.


      netZooR netZooPy netZooM netZooC.


      netZoo{R,Py,M,C} is a network biology package for the reconstruction and analysis of gene regulatory
      networks. If you use netZoo, please cite us using the following format:.'
  nf-core-atacseq:
    description: Analyses ATAC-seq data using a community-curated bioinformatics pipeline
    was: nfcore/atacseq is a bioinformatics analysis pipeline used for ATAC-seq data.
  nf-core-cageseq:
    description: Analyses CAGE-seq sequencing data to identify transcription start sites and regulatory
      elements
    was: nf-core/cageseq is a bioinformatics analysis pipeline used for CAGE-seq sequencing data.
  nf-core-chipseq:
    description: Analyzes ChIP-seq data through a community-curated bioinformatics pipeline
    was: nf-core/chipseq is a bioinformatics analysis pipeline used for Chromatin ImmunopreciPitation
      sequencing (ChIP-seq) data.
  nf-core-methylseq:
    description: Pre-processes, aligns and quality-controls bisulfite sequencing data from FastQ inputs
    was: nf-core/methylseq is a bioinformatics analysis pipeline used for Methylation (Bisulfite) sequencing
      data. It pre-processes raw data from FastQ inputs, aligns the reads and performs extensive quality-control
      on the results.
  nglyalign:
    description: Aligns highly divergent HIV envelope sequences using N-linked glycosylation site constraints
    was: 'An automated library building tool to align highly divergent HIV envelope sequences.


      Verify that version 9.8 (R2020a) of the MATLAB Runtime is installed.


      NGlyAlignApp_v1.exe -MCRInstaller.exe Note: if end users are unable to download the MATLAB Runtime
      using the instructions in the previous section, include it when building your component by clicking
      the "Runtime included in package" link in the Deployment Tool. -This readme file.'
  ngphubinh:
    description: Classifies adaptor proteins from PSSM profiles using recurrent neural networks
    was: 'Classification of adaptor proteins using recurrent neural networks and PSSM profiles.


      Adaptor proteins are carrier proteins that play a crucial role in signal transduction.


      We collected all the proteins from UniProt with GO molecular function annotations related to adaptor
      proteins.'
  ngs-integrator:
    description: Integrates multiple genome-wide NGS data tracks using minimum Bayes factors from sequence
      read densities
    was: 'An efficient tool for combining multiple NGS data tracks using minimum Bayes'' factors.


      NGS Integrator Tool (NGS-Integrator) is a Java-based tool that integrates multiple genome-wide NGS
      data via the minimum Bayes'' Factor from density of sequence reads mapped on the genome. To integrate
      multiple NGS data, homogeneous replicates or heterogeneous NGS data can be integrated into the single
      data track based on the complements of the minimum Bayes factor (cMBF) (range: 0-1) calculated from
      signal-to-background noise ratios as a function of genomic position.


      NGS-Integrator is a Java-based commandline tool that integrates multiple genome-wide NGS data via
      the minimum Bayes'' Factor from density of sequence reads mapped on the genome.'
  ngs-qc_generator:
    description: Infers quality indicators from the distribution of sequenced reads in ChIP-seq and enrichment-related
      NGS datasets for comparative analysis
    was: Comparative analysis between ChIP-seq and other enrichment-related NGS datasets requires prior
      characterization of their degree of technical similarity. The Galaxy tool NGS-QC Generator is a
      computational-based approach that infers quality indicators from the distribution of sequenced reads
      associated to a particular NGS profile. Such information is then used for comparative purposes and
      for defining strategies to improve the quality of sample-derived datasets.
  ngsmethdb:
    description: Stores and retrieves single-cytosine-resolution DNA methylation data from next-generation
      sequencing, with a browser interface for querying methylation states across tissues and chromosomal
      regions
    was: Database that contains methylation data derived from next-generation sequencing (NGS). Two cytosine
      methylation contexts (CpG and CAG/CTG) are considered. Through a browser interface, the user can
      search for methylation states in a set of tissues, retrieve methylation values for a set of tissues
      in a given chromosomal region, or display the methylation of promoters among different tissues.
      The database is currently populated with human, mouse and Arabidopsis data.
  niacs:
    description: Infers causal regulatory networks from time series gene expression data while correcting
      for link loss due to regulator interference
    was: Implements a method for deffining causal networks corrected for the problem of interference between
      dynamically similar regulators within the context of a sparse linear auto-regression model.
  nimbus:
    description: Identifies mutational hotspots from cancer whole-genome sequences using a negative binomial
      regression model that accounts for mutation rate heterogeneity and genomic confounding factors
    was: 'A Negative Binomial Regression based Integrative Method for Mutation Burden Analysis.


      Identifying highly mutated regions is a key way that scientists can use on population scale sequencing
      to discover key genomic regions associated with complex diseases such as cancer.'
  nimce:
    description: Infers gene regulatory networks from time-series expression data using multi time delays
      causal entropy
    was: 'a gene regulatory network inference approach based on multi time delays causal entropy.


      NIMCE is a network inference method based on information-theoretic to reconstruct GRNs.'
  nimefi:
    description: Infers gene regulatory networks from gene expression data by combining multiple ensemble
      feature importance algorithms
    was: Gene regulatory network inference using multiple ensemble feature importance algorithms.
  nlrexpress:
    description: Predicts CC, TIR, NBS, and LRR motifs in plant Nod-like receptor sequences using machine
      learning
    was: Bundle of machine learning motif predictors-Reveals motif stability underlying plant Nod-like
      receptors diversity.
  nobai:
    description: Searches for evolutionary history embedded in the structure of functional RNA molecules
    was: Facilitates the search for the evolutionary history embedded in the structure of functional RNA
      molecules.
  noisyr:
    description: Quantifies and removes technical noise from high-throughput sequencing count matrices
      or BAM files using sample-specific signal/noise thresholds
    was: Quantifies and removes technical noise from high-throughput sequencing data. Two approaches are
      used, one based on the count matrix, and one using the alignment BAM files directly. Contains several
      options for every step of the process, as well as tools to quality check and assess the stability
      of output.
  non-b_db:
    description: Integrates annotations and predictions of non-B DNA-forming motifs, including Z-DNA,
      quadruplexes, and repeats, across mammalian genomes
    was: It is a non-canonical (non-B) structure database database integrating annotations and analysis
      of non-B DNA-forming sequence motifs. The database provides alternative DNA structure predictions,
      including Z-DNA motifs, quadruplex-forming motifs, inverted repeats, mirror repeats and direct repeats
      and their associated subsets of cruciforms, triplex and slipped structures, respectively.
  nopeak:
    description: Discovers binding motifs from ChIP-Seq data by evaluating k-mer read distributions without
      peak calling
    was: 'k-mer based motif discovery in ChIP-Seq data without peak calling.


      NoPeak: Binding Motif Discovery from ChIP-Seq Data without Peak calling.


      Binding motif discovery through Chromatin immunoprecipitation with high-throughput DNA sequencing
      (ChIP-Seq) data is an important tool for understanding regulatory processes.


      The NoPeak Software uses the integration profile of k-mers based on mapped reads.'
  normr:
    description: Normalizes ChIP-seq read counts and calls enriched or depleted regions using a binomial
      mixture model with a robust background estimate
    was: Robust normalization and difference calling procedures for ChIP-seq and alike data. Read counts
      are modeled jointly as a binomial mixture model with a user-specified number of components. A fitted
      background estimate accounts for the effect of enrichment in certain regions and, therefore, represents
      an appropriate null hypothesis. This robust background is used to identify significantly enriched
      or depleted regions.
  nplb:
    description: Characterizes diverse promoter architectures directly from genome-wide transcription
      start sites without relying on known promoter elements
    was: Efficient, organism-independent method for characterizing such diverse architectures directly
      from experimentally identified genome-wide TSSs, without relying on known promoter elements.
  nps:
    description: Identifies positioned nucleosomes and their histone modification profiles from nucleosome-resolution
      ChIP-seq data
    was: Identify nucleosome positions given histone-modification ChIP-seq or nucleosome sequencing at
      the nucleosome level.
  nt-seq:
    description: Maps N6-methyladenine, N4-methylcytosine, and 5-methylcytosine simultaneously from bacterial
      genomes
    was: A chemical-based sequencing method for genomic methylome profiling.
  ntw:
    description: Predicts gene-gene interaction networks and identifies direct transcriptional targets
      from gene expression data using an ODE-based method
    was: This package predicts the gene-gene interaction network and identifies the direct transcriptional
      targets of the perturbation using an ODE (Ordinary Differential Equation) based method.
  nucleoatac:
    description: Calls nucleosome positions from ATAC-seq data using a structured fragment-length fingerprint
    was: 'Structured nucleosome fingerprints enable high-resolution mapping of chromatin architecture
      within regulatory regions.


      This package is no longer being actively maintained; feel free to post issues that others in the
      community may respond to, but this package will likely not be updated further. Additionally, if
      anyone wants to maintain a fork of the package or has developed an alternative package for similar
      purposes, would be happy to link to that repo here.


      2025 Python Packaging Survey is now live!.


      Please cite our paper at Genome Research if you use this tool in your research.


      New Authentication Rolling Out - We''re upgrading our sign-in process to give you one account across
      all Anaconda products! Browser users will see a refreshed sign-in flow, while CLI users will experience
      no changes.


      Home: http://nucleoatac.readthedocs.io/en/latest/.


      Documentation can be found at http://nucleoatac.readthedocs.org/en/latest/.


      Python package for calling nucleosomes using ATAC-Seq data.'
  nucleomap:
    description: Identifies nucleosome positions from ultra-high resolution chromatin contact maps by
      integrating read density, contact distances, and binding preferences
    was: A computational tool for identifying nucleosomes in ultra-high resolution contact maps.
  nucleosim:
    description: Generates synthetic nucleosome maps with forward and reverse reads using Normal, Student,
      or Uniform distributions
    was: 'This package can generate a synthetic map with reads covering the nucleosome regions as well
      as a synthetic map with forward and reverse reads emulating next-generation sequencing. The user
      has choice between three different distributions for the read positioning: Normal, Student and Uniform.'
  nucleosome_prediction:
    description: Predicts nucleosome positions on a genome from DNA sequence preferences
    was: Prediction of Nucleosomes Positions on the Genome
  nucmap_20:
    description: Provides genome-wide nucleosome positioning maps across species with querying, visualization,
      enrichment, and comparative analysis
    was: NucMap is a database providing genome-wide nucleosome positioning maps across various species,
      offering services for querying, visualization, enrichment, and comparative analysis. It integrates
      omics data, including RNA-seq and ChIP-seq, to facilitate the interpretation of nucleosome positioning.
  nucome:
    description: Filters and provides qualified nucleosome organization landscapes across human and mouse
      cell types
    was: A comprehensive database of nucleosome organization referenced landscapes in mammalian genomes.
  nucposdb:
    description: Curates published nucleosome positioning datasets in vivo and cell-free DNA sequencing
      data
    was: A database of nucleosome positioning in vivo and nucleosomics of cell-free DNA.
  nucwave:
    description: Generates nucleosome occupation maps from genome-wide sequencing data
    was: Bioinformatic tool that generates nucleosome occupation maps.
  nupop:
    description: Predicts nucleosome positioning and occupancy from DNA sequences using a duration hidden
      Markov model
    was: R package for Nucleosome Positioning Prediction. This package is built upon a duration hidden
      Markov model proposed in Xi et al, 2010; Wang et al, 2008. The core of the package was written in
      Fotran. In addition to the R package, a stand-alone Fortran software tool is also available.
  nxsensor:
    description: Finds potential nucleosome-free regions in DNA sequences and computes an accessibility
      score
    was: Finds potential nucleosome-free regions of DNA sequences. It can be used to assess the likelihood
      of nucleosome formation in regions involved in gene regulation and other aspects of chromatin function.
  occupeak:
    description: Calls peaks from ChIP-seq data using a background model based on overlapping single reads,
      avoiding the need for input control datasets
    was: ChIP-Seq Peak Calling Based on Internal Background Modelling.
  ocean-c:
    description: Maps open chromatin interactions genome-wide by integrating FAIRE-seq and Hi-C data
    was: Mapping hubs of open chromatin interactions across the genome reveals gene regulatory networks.
  odin:
    description: Detects and analyses differential peaks in pairs of ChIP-seq data using an HMM-based
      approach
    was: ODIN is an HMM-based approach to detect and analyse differential peaks in pairs of ChIP-seq data.
  oipcq:
    description: Infers gene regulatory networks using quantile-based thresholds for conditional independence
      tests, addressing order dependency
    was: 'An Order Independent Algorithm for Inferring Gene Regulatory Network Using Quantile Value for
      Conditional Independent Tests.


      These codes and outputs are related to "An Order Independent Algorithm for Inferring Gene Regulatory
      Network Using Quantile Value for Conditional Independent Tests".


      OIPCQ requires the functions of cmi and Compare, and OIPCQ2 requires the functions of cmi and MI2
      and Compare.'
  oktoberfest:
    description: Generates and rescores spectral libraries using Prosit-based peptide property predictions
    was: Open-source spectral library generation and rescoring pipeline based on Prosit.
  oligo-analysis:
    description: Computes k-mer frequencies and statistics to discover over- or under-represented motifs
      in nucleic or amino acid sequences
    was: Compute k-mer frequencies (oligonucleotides or oligopeptides) and various statistics to discover
      exceptional motifs (over-represented or under-represented). Typical applications include discovery
      of transcription factor binding motifs, restriction sites in bacterial genomes, RNA termination
      and polyadenylation signals, detection of motifs associated with replication origins, analysis of
      oligopeptide frequencies in protein sequences.
  onco.io:
    description: Explores cancer-related gene regulatory networks by integrating manually curated molecular
      interactions from literature
    was: 'An integrated knowledge database and network analysis tool for exploring complex gene regulatory
      networks involved in cancer.

      The database content is based on the manually curated annotation of experimentally verified molecular
      interactions described in the literature and includes microRNAs, lncRNAs, mRNAs, signaling proteins
      and transcription factors interactions.'
  oncoenrichr:
    description: Interrogates human gene lists for cancer relevance using prior knowledge on tumor associations,
      druggability, and regulatory interactions
    was: 'oncoEnrichR is an R package for functional interrogation of human genesets in the context of
      cancer. The package leverages an extensive amount of prior molecular knowledge for geneset interpretation
      along multiple dimensions.


      oncoEnrichR is primarily intended for exploratory analysis and prioritization of a gene list from
      high-throughput cancer biology experiments, e.g. genetic screens (siRNA/CRISPR), protein proximity
      labeling, or transcriptomics (differential expression). The tool queries a number of high-quality
      data resources in order to assemble useful gene annotations and analyses in an interactive report.'
  onesc:
    description: Simulates cell state transitions from scRNA-seq data using stochastic differential equations
      governed by a core transcription factor regulatory network
    was: OneSC is a computational platform for recapitulating cell state transitions using stochastic
      differential equations governed by a regulatory network of core transcription factors. It uses scRNA-seq
      data to infer and simulate cell fate trajectories, enabling in silico perturbation experiments.
  ont-cappable-seq:
    description: Maps transcription start and termination sites, units, and regulators from long-read
      microbial transcriptomics data for bacteriophages
    was: ONT-cappable-seq is a long-read microbial transcriptomics approach used to reveal the transcriptional
      architecture of bacteriophages infecting Pseudomonas aeruginosa. The tool maps transcription start
      and termination sites, units, and regulators and is made available through a GitHub repository.
  openannotate:
    description: Annotates chromatin accessibility of genomic regions from preprocessed human and mouse
      profiles
    was: OpenAnnotate is a web server to annotate the chromatin accessibility of genomic regions. The
      construction of the OpenAnnotate backend requires great efforts and can hardly be deployed on an
      ordinary server or workstation. Briefly, in order to construct the OpenAnnotate backend, one needs
      1) elaborate chromatin accessibility data preprocessing for high-frequency data read operation,
      2) sophisticated multithreaded program tailored to the preprocessed data, and 3) high-performance
      computer to maximize the program efficiency.
  opossum:
    description: Detects over-represented transcription factor binding sites in promoters of co-expressed
      gene sets using conserved TFBSs and statistical methods
    was: oPOSSUM is a web-based system for the detection of over-represented transcription factor binding
      sites in the promoters of sets of genes.
  orange_network:
    description: Generates and analyses networks with clustering and database access within the Orange
      data mining framework
    was: A network analysis extension for a data mining software Orange. Network add-on includes components
      for network generation, network analysis, clustering and access to SNAP network database. All features
      can be combined with powerful visualizations, bioinformatics tools and data mining techniques from
      the core Orange data mining framework.
  oreganno:
    description: Curates experimentally identified DNA regulatory regions, transcription factor binding
      sites and regulatory variants from literature
    was: Collection of literature-curated regulatory regions, transcription factor binding sites (TFBS)
      and regulatory mutations.
  orio:
    description: Integrates NGS datasets by computing read coverage at user-specified genomic features
      and clustering them
    was: Online Resource for Integrative Omics- a web-based platform for rapid integration of next generation
      sequencing data..
  osconet:
    description: Infers oscillatory gene networks from snapshot single-cell RNA-seq data using a bootstrap-based
      method
    was: 'Inferring oscillatory gene networks.


      Bootstrap-based OscoNet method: Method to infer sinusoidal oscillations in single cell data.


      This software reproduces the approach presented in ''OscoNet: inferring oscillatory gene networks''
      by Luisa Cutillo, Alexis Boukouvalas, Elli Marinopoulou, Nancy Papalopulu & Magnus Rattray.'
  owas:
    description: Prioritizes GWAS signals by aggregating predictions of chromosome accessibility in personal
      genomes
    was: OWAS is an R implementation of a computational approach, Openness Weighted Association Studies(OWAS),
      which leverages and aggregates predictions of chromosome accessibility in personal genomes to prioritize
      GWAS signals.
  p-match:
    description: Identifies transcription factor binding sites in DNA sequences by combining pattern matching
      and weight matrix approaches
    was: Transcription factor binding site identification tool that increases its accuracy by combining
      weight matrix and pattern matching approaches. Registration at the site is free and is required.
  p-scan:
    description: Quantifies peaks from cDNA microarray data using statistical comparative analysis
    was: Software of Peak quantification using Statistical Comparative ANalysis.
  p2rp:
    description: Identifies and annotates transcription factors and two-component system proteins in prokaryotic
      amino acid or genomic DNA sequences
    was: Web server which provide a platform for regulatory protein (RP) prediction. The program can perform
      several types of analyses depending on the type of request, and provide detailed annotation of each
      RP gene including classification, sequence features, as well as functional domains. Data can be
      outputted for download in a variety of specified formats.
  p53mutagene:
    description: Validates hypotheses about p53 mutational effects on gene regulation using clinical expression
      data from breast, colon and lung cancers
    was: First online tool for statistical validation of hypotheses regarding the effect of p53 mutational
      status on gene regulation in cancer.
  p6ma:
    description: Identifies DNA N6-methyladenine sites by integrating sequence-based features with an
      XGBoost classifier
    was: 'Identification of DNA N6-methyladenine sites by integration of sequence features.


      p6mA is a N^6-methyladenine predictor which is trained by multiple species'' data. There are 6 built-in
      models and you can choose a proper one. If your data is some species not included in the 4 species
      (O. sativa, C. elegans, D. melanogaster and H. sapiens), you can choose the Compre or Compre2 model.
      Compre model is trained by comprehensive samples without redunction of dedundancy and Compre2 model
      is trained by non-redundant comprehensive dataset.'
  pafway:
    description: Estimates pairwise associations between functional annotations in biological networks
      and pathways
    was: Pairwise associations between functional annotations in biological networks and pathways.
  pallas:
    description: Infers gene regulatory networks from noisy time series gene expression data using penalized
      maximum likelihood and particle swarm optimization
    was: 'Penalized mAximum LikeLihood and pArticle Swarms for Inference of Gene Regulatory Networks from
      Time Series Data.


      A Python package for inference of gene regulatory networks from noisy gene expression data.'
  panda:
    description: Integrates protein-protein interaction, gene expression, and sequence motif data via
      message-passing to reconstruct genome-wide, condition-specific regulatory networks
    was: Message-passing model using multiple sources of information to predict regulatory relationships,
      and used it to integrate protein-protein interaction, gene expression, and sequence motif data to
      reconstruct genome-wide, condition-specific regulatory networks in yeast.
  panda_associations:
    description: Predicts direct and indirect transcription factor binding events from expression profiles,
      protein-protein interactions and recognition motifs
    was: PAnDA is an algorithm for the prediction of direct and indirect TF binding events.
  panoromics:
    description: Contextualizes genomic variations in personal cancer genomes using clinical evidence
      and interactome mapping for 26 tumor types
    was: 'The massive molecular profiling of thousands of cancer patients has led to the identification
      of many tumor type specific driver genes. However, only a few (or none) of them are present in each
      individual tumor and, to enable precision oncology, we need to interpret the alterations found in
      a single patient. Cancer PanorOmics (http://panoromics.irbbarcelona.org) is a web-based resource
      to contextualize genomic variations detected in a personal cancer genome within the body of clinical
      and scientific evidence available       for 26 tumor types, offering complementary cohort and patient-centric views. Additionally, it explores
      the cellular environment of mutations by mapping them on the human interactome and providing quasiatomic
      structural details, whenever available. This ‘PanorOmic’ molecular view of individual tumors should
      contribute to the identification of actionable alterations ultimately guiding the clinical decision-making
      process.'
  pap:
    description: Identifies potential transcriptional regulators for co-expressed genes and regulatory
      targets of transcription factors in mammalian genomes
    was: Identify potential transcriptional regulators for sets of co-expressed genes and identify potential
      regulatory targets of transcription factors.
  papaml:
    description: Explores selection pressure on protein-coding sequences by parallelizing PAML analyses
      and detecting negatively selected sites
    was: An Improved Computational Tool to Explore Selection Pressure on Protein-Coding Sequences.
  paperfly:
    description: Reconstructs binding sites and their context from ChIP-seq data without a reference genome
      using a de Bruijn graph-based heuristic
    was: Partial assembly-based peak finder for ab initio binding site reconstruction.
  parmigene:
    description: Estimates mutual information from k-nearest neighbour distances and reconstructs gene
      regulatory networks in parallel
    was: The package provides a parallel estimation of the mutual information based on entropy estimates
      from k-nearest neighbours distances and algorithms for the reconstruction of gene regulatory networks.
  parseq:
    description: Reconstructs microbial transcription landscapes from RNA-Seq read counts using a state-space
      model
    was: Statistical approach for transcription landscape reconstruction at a basepair resolution from
      RNA Seq read counts.
  pathext:
    description: Identifies differentially active paths from omics-integrated biological networks, even
      with a single sample or no control
    was: 'PathExt is a general framework for path-based mining of omics-integrated biological networks.


      We provide a computational tool - PathExt, which identifies differentially active paths when a control
      is available, and most active paths otherwise, in an omics-integrated biological network. The sub-network
      comprising such paths, referred to as the TopNet, captures the most relevant genes and processes
      underlying the specific biological context. The TopNet forms a well-connected graph, reflecting
      the tight orchestration in biological systems. Two key advantages of PathExt are (i) it can extract
      characteristic genes and pathways even when only a single sample is available, and (ii) it can be
      used to study a system even in the absence of an appropriate control.'
  pathwayvote:
    description: Performs robust pathway enrichment analysis of DNA methylation data using a voting-based
      framework that integrates CpG-gene regulatory information and eQTM data
    was: PathwayVote is an R package for robust pathway enrichment analysis of DNA methylation data. It
      utilizes a voting-based framework that integrates CpG-gene regulatory information and addresses
      probe bias to identify consistently enriched pathways.
  patscanui:
    description: Provides a drag-and-drop web interface for building complex patterns to search DNA and
      protein sequences with PatScan
    was: Highly interactive web interface to the powerful generic pattern search tool PatScan. The complex
      PatScan-patterns are created in a drag-and-drop aware interface allowing researchers to do rapid
      prototyping of the often complicated patterns useful to identifying features of interest.
  patternchrome:
    description: Extracts predictive histone modification patterns from promoter regions using Particle
      Swarm Optimization to predict gene expression
    was: PatternChrome is a software resource utilizing Particle Swarm Optimization to extract predictive
      histone modification patterns for gene expression prediction. The tool achieves high accuracy and
      provides insights into the effect of histone modifications on transcription regulation.
  paxtoolsr:
    description: Provides R functions to access, query, and manipulate BioPAX pathway data from Pathway
      Commons
    was: 'The package provides a set of R functions for interacting with BioPAX OWL files using Paxtools
      and the querying Pathway Commons (PC) molecular interaction database that are hosted by the Computational
      Biology Center at Memorial Sloan-Kettering Cancer Center (MSKCC). Pathway Commons databases include:
      BIND, BioGRID, CORUM, CTD, DIP, DrugBank, HPRD, HumanCyc, IntAct, KEGG, MirTarBase, Panther, PhosphoSitePlus,
      Reactome, RECON, TRANSFAC.'
  pazar:
    description: Open access database of transcription factor and regulatory sequence annotation with
      web interface and programming tools for data submission and extraction
    was: Open access and open source database of transcription factor and regulatory sequence annotation
      with associated web interface and programming tools designed to submit and query data related to
      the regulation of gene expression.
  pbsword:
    description: Searches for geometrically similar protein-protein binding sites from a large-scale database
      using visual word representations
    was: Web server designed for efficient and accurate comparisons and searches of geometrically similar
      protein-protein binding sites from a large-scale database.
  pcagopromoter:
    description: Interprets genome-wide expression data by applying PCA followed by functional and regulatory
      analysis using GO terms and predicted transcription factor binding sites
    was: This package contains functions to ease the analyses of DNA micro arrays. It utilizes principal
      component analysis as the initial multivariate analysis, followed by functional interpretation of
      the principal component dimensions with overrepresentation analysis for GO terms and regulatory
      interpretations using overrepresentation analysis of predicted transcription factor binding sites
      with the primo algorithm.
  pcgima:
    description: Predicts position-defined CpG islands and analyses their methylation, gene expression
      and functional associations in the human genome
    was: Developing the web server for human position-defined CpG islands methylation analysis.
  pda-pred:
    description: Predicts binding affinity of protein-DNA complexes using machine learning and structural
      features
    was: Predicting the binding affinity of protein-DNA complexes using machine learning techniques and
      structural features.
  pdgpcs:
    description: Predicts personalized cancer driver genes by integrating gene expression, mutation, and
      pathway data with a prize-collecting Steiner tree model
    was: PDGPCS is a driver genes prediction method; PDGPCS uesd gene expression data, gene mutation data
      and pathway data to predict driver genes.
  pdriver:
    description: Discovers personalised coding and miRNA cancer drivers by constructing patient-specific
      gene networks
    was: 'A novel method for unravelling personalised coding and miRNA cancer drivers.


      pDriver: A novel method for unravelling personalised coding and miNRA cancer drivers.'
  peaKO:
    description: Discovers transcription factor binding motifs from paired wild-type and knockout ChIP-seq
      BAM files
    was: 'Motif elucidation in ChIP-seq datasets with a knockout control | PeaKO discovers motifs in ChIP-seq
      datasets with knockout controls. PeaKO takes in paired wild-type/knockout BAM files in addition
      to several reference files, as input. It returns a file of ranked motifs (see our paper for more
      details) | PeaKO finding transcription factor binding motifs using knockout controls | Denisko D,
      Viner C, Hoffman MM. Motif elucidation in ChIP-seq datasets with a knockout control. BioRxiv 10.1101/721720
      [Preprint]. 2019. Available from: https://doi.org/10.1101/721720 | PeaKO identifies motifs relevant
      to ChIP-seq experiments by combining two differential analysis approaches. It often improves elucidation
      of the target motif over other methods and highlights the benefits of knockout controls'
  peakC:
    description: Benchmarks 4C-seq pipelines using real and simulated data
    was: Benchmarking of 4C-seq pipelines based on real and simulated data.
  peakachu:
    description: Predicts chromatin loops from genome-wide contact maps using a Random Forest classification
      framework
    was: A supervised learning framework for chromatin loop detection in genome-wide contact maps. It
      can be used to visualize Hi-C, ChIA-PET, HiCHiP, PLAC-Seq, Capture Hi-C data.
  peakcalling_findpeaks:
    description: Identifies areas of enrichment and transcription factor binding sites from ChIP-seq data
    was: Peak Finder/Analysis application for the ChIP-Seq.
  peakhood:
    description: Extracts the most likely site context (transcript or genomic) for each CLIP-seq peak
      region using read information and genomic annotations
    was: Peakhood is a tool that takes a set of CLIP-seq peak regions, and for each region individually
      extracts the most likely site context (transcript or genomic).
  peakranger:
    description: Calls peaks from ChIP-seq data for both punctate and broad sites, resolving closely-spaced
      peaks
    was: A multi-purpose, ultrafast ChIP Seq peak caller
  peaks2utr:
    description: Annotates 3' untranslated regions from aligned sequencing reads and canonical annotation
      using UTR enrichment of single-cell technologies
    was: Tool that annotates 3' untranslated regions (UTR) for a given set of aligned sequencing reads
      in BAM format, and canonical annotation in GFF or GTF format.
  peaksat:
    description: Estimates target read depth for ChIP-seq experiments by analyzing peak saturation curves
    was: An R package for ChIP-seq peak saturation analysis.
  peakseq:
    description: Identifies and ranks peak regions in ChIP-seq experiments relative to controls
    was: PeakSeq is a program for identifying and ranking peak regions in ChIP-Seq experiments.
  peakzilla:
    description: Identifies closely spaced transcription factor binding sites from ChIP-seq data at high
      resolution
    was: Identify transcription factor binding sites from ChIP-seq data at high resolution.
  pegr:
    description: Manages metadata, workflows, reporting, and visualization for epigenomic and genomic
      sequencing experiments
    was: Platform for Epigenomic and Genomic Research (PEGR) is a web service platform that logs metadata
      for samples and sequencing experiment, manages the data processing workflows, and provides reporting
      and visualization.
  pegs:
    description: Calculates enrichment of gene sets from peak data at multiple genomic distances and within
      topologically associated domains
    was: PEGS (Peak-set Enrichment of Gene-Sets) is a Python bioinformatics utility for calculating enrichments
      of gene cluster enrichments from peak data at different genomic distances.
  pepatac:
    description: Processes ATAC-seq data by trimming adapters, mapping reads, calling peaks, and creating
      bigwig tracks and TSS enrichment files
    was: 'An optimized ATAC-seq pipeline with serial alignments.


      PEPATAC is a pipeline designed to process ATAC-seq data. For more information see: http://pepatac.databio.org/.


      PEPATAC is an ATAC-seq pipeline. It trims adapters, maps reads, calls peaks, and creates bigwig
      tracks, TSS enrichment files, and other outputs. It is optimized on unique features of ATAC-seq
      data to be fast and accurate and provides several unique analytical approaches.


      An open structure and toolkit for organizing large-scale, sample-intensive biological research projects.


      PEP, or Portable Encapsulated Projects, is a community effort to make sample metadata reusable.
      PEPs decouple metadata from analysis-'
  pepr:
    description: Identifies consistent or differential binding sites from ChIP-Seq experiments with biological
      replicates using a negative binomial model
    was: Analysis pipeline for ChIP-Seq experiments with biological replicates, written and available
      as python scripts.
  perfumes:
    description: Identifies over-represented RNA 3D motifs from sequences with binary experimental measurements
      using BayesPairing2
    was: Pipeline to extract RNA functional motifs and exposed structures.
  peril:
    description: Analyzes RNA-seq and MPRA data to identify enhancer activity in lincRNA loci and assess
      long-range gene regulation
    was: 'Enhancers in the Peril lincRNA locus regulate distant but not local genes.


      All code used in the RNAseq and MPRA analysis for "Enhancers in the Peril lincRNA locus regulate
      distant but not local genes".'
  periodicdna:
    description: Identifies periodic occurrences of k-mers in DNA sequences, typically in regulatory elements
    was: 'an R/Bioconductor package to investigate k-mer periodicity in DNA.


      Set of tools to identify periodic occurrences of k-mers in DNA sequences.


      This R package helps the user identify k-mers (e.g. di- or tri-nucleotides) present periodically
      in a set of genomic loci (typically regulatory elements). The functions of this package provide
      a straightforward approach to find periodic occurrences of k-mers in DNA sequences, such as regulatory
      elements. It is not aimed at identifying motifs separated by a conserved distance; for this type
      of analysis, please visit MEME website.


      Alignment, Coverage, DataImport, MotifAnnotation, MotifDiscovery, SequenceMatching, Sequencing,
      Software.


      This R package helps the user identify k-mers (e.g. di- or tri-nucleotides) present periodically
      in a set of genomic loci (typically regulatory elements).'
  perturbnet:
    description: Learns gene networks that modulate the influence of genetic variants on clinical phenotypes
      using SNP perturbations
    was: 'Learning gene networks underlying clinical phenotypes using SNP perturbation.


      Software for Learning Gene Networks Underlying Clinical Phenotypes Using SNP Perturbations.


      Run the following command to install the software.


      Depending on the MacOSX version and default compiler, the location of some of the library #include
      statements in Mega-sCGGM and also those in Eigen for Fast-sCGGM need to change. Just always using
      the llvm/clang compiler installed via homebrew puts the libraries in the same place. For this, you
      will first need to install Homebrew, and then use it to install llvm:.'
  pfbnet:
    description: Infers gene regulatory networks from time-series expression data using boosting and prior
      information fusion
    was: 'PFBNet: Prior fused boosting method for gene regulatory network inference.


      we present a novel method, namely prior fused boosting network inference method (PFBNet), to infer
      GRNs from time-series expression data by using the non-linear model of Boosting and the prior information
      (e.g., the knockout data) fusion scheme. The experiments on the benchmark datasets from DREAM challenge
      as well as the E.coli datasets show that PFBNet achieves significantly better performance than other
      state-of-the-art methods (HiDi, iRafNet and BiXGBoost).'
  pftools:
    description: Builds, calibrates, and searches biological sequences with generalized profiles that
      include position-specific scores for insertions and deletions
    was: The pftools are a collection of programs to build, calibrate, and search biological sequences
      with generalized profiles. Generalized profiles are an extension of position specific scoring matrices
      by including position specific scores for insertions and deletions. They correspond to a matrix
      representation of a multiple sequence alignment that can be used to search distant homologous sequences
      and precisely align sequences to the model.
  pgltools:
    description: Manipulates Hi-C peak and other chromatin interaction data using a paired-genomic-loci
      file standard
    was: Manipulation of Hi-C peak and other chromatin interaction data.
  phaeoepiview:
    description: Visualizes epigenome data and transcripts on an updated reference genome of Phaeodactylum
      tricornutum
    was: Epigenome browser of the newly assembled genome of the model diatom Phaeodactylum tricornutum.
  phantompeakqualtools:
    description: Computes enrichment and quality measures for ChIP-seq, DNase-seq, FAIRE-seq, and MNase-seq
      data and estimates fragment length or tag shift values
    was: This package computes quick but highly informative enrichment and quality measures for ChIP-seq/DNase-seq/FAIRE-seq/MNase-seq
      data. It can also be used to obtain robust estimates of the predominant fragment length or characteristic
      tag shift values in these assays.
  phasetank:
    description: Systematically characterizes phasiRNAs and their regulatory cascades from plant genomic
      sequences
    was: Software to systemically characterize phasiRNAs (Phase siRNAs)/tasiRNAs and their regulatory
      cascades ‘miRNA/phasiRNA  -> PHAS gene -> phasiRNAs -> target genes’ in plants.
  phire:
    description: Discovers conserved regulatory elements in bacteriophage genomes using a deterministic
      string-based search
    was: Phage In silico Regulatory Elements (PHIRE) is a standalone program in Visual Basic which performs
      a string-based search on bacteriophage genome sequences discovering and extracting blocks displaying
      sequence similarity corresponding to conserved regulatory elements contained within these genomes.
  phisite:
    description: Collects experimentally confirmed or predicted regulatory elements from bacteriophages
    was: Database of gene regulation in bacteriophages. It collects experimentally confirmed or predicted
      regulatory elements (promoters, operators, terminators and attachment sites) from bacteriophages
      belonging to Siphoviridae, Myoviridae and Podoviridae families. The database is manually curated,
      the data are collected mainly form scientific papers, cross-referenced with other database resources
      (EMBL, UniProt, NCBI taxonomy database, NCBI Genome, ICTVdb, PubMed Central).
  phyloconverge:
    description: Identifies rate-accelerated conserved noncoding elements from genomic sequences using
      a phylogenetic method for local convergence analysis
    was: phyloConverge is a phylogenetic method for scalable, fine-grained local convergence analysis
      of genomic elements, identifying rate-accelerated conserved noncoding elements (CNEs) and revealing
      patterns in convergent evolution of regulatory elements.
  phyloctcflooping:
    description: Compares distances between convergent and divergent CTCF motifs to study 3D genome evolution
      from genomic sequence
    was: Scripts for Studying 3D genome evolution using genomic sequence by comparing the distances between
      convergent and divergent CTCF motifs.
  phylonet:
    description: Predicts conserved motifs and gene clusters from multiple evolutionarily related genomes
      without additional regulatory data
    was: 'PhyloNet (Phylogenetic Regulatory Network) is a motif discovery program.  It represents a very
      new paradigm for motif discovery: based on sequences of several evolutionarily related genomes,
      PhyloNet predicts a near complete set of conserved motifs of the organism of interest,as well as
      gene clusters that share these motifs, without reliance of additional data such as gene regulation.'
  phylopgm:
    description: Aggregates predictions from orthologous regions to boost regulatory function prediction
      accuracy on human sequences
    was: Boosting regulatory function prediction accuracy using evolutionary information.
  phyloscan:
    description: Locates transcription factor binding sites by combining cross-species conservation and
      site clustering in promoter regions using aligned or unaligned orthologous sequences
    was: Web server that locates transcription regulating binding sites by exploiting binding site evolutionary
      conservation and repeats in promoter regions. Mixed aligned and unaligned sequence data may be used.
  physbinder:
    description: Predicts transcription factor binding sites from DNA sequences using biophysical properties
    was: Biophysical identification of transcription factor binding sites.
  pics:
    description: Identifies transcription factor binding sites from ChIP-seq data using a Bayesian hierarchical
      t-mixture model with fragment length priors and mappability profiles
    was: Probabilistic inference of ChIP-Seq using an empirical Bayes mixture model approach.
  pidna:
    description: Predicts protein–DNA interactions by applying an atomic-level knowledge-based scoring
      function to in silico mutated complex structures
    was: PiDNA web server predicts the interaction between a protein and a single DNA sequence by applying
      an atomic level knowledge based scoring function on numerous in silico mutated complex structures.
  pincage:
    description: Probabilistically integrates RNA-seq expression and 450K methylation data to identify
      perturbed genes and classify cancer samples
    was: Method that uses probabilistic integration of cancer genomics data for combined evaluation of
      RNA-seq gene expression and 450K array DNA methylation measurements of promoters as well as gene
      bodies.
  pines:
    description: Predicts functional impact of noncoding variants by integrating epigenetic annotations
      weighted by phenotype relevance
    was: 'Phenotype-informed tissue weighting improves prediction of pathogenic noncoding variants.


      PINES (Phenotype-Informed Noncoding Element Scoring).


      Functional characterization of the noncoding genome is essential for the biological understanding
      of gene regulation and disease.'
  ping:
    description: Predicts nucleosome positions from MNase-Seq, sonicated ChIP-Seq, and MNase-ChIP-Seq
      data using a probabilistic mixture model
    was: Probabilistic inference of ChIP-Seq using an empirical Bayes mixture model approach.
  pipmaker:
    description: Aligns two long genomic DNA sequences to identify conserved segments and produces percent
      identity plots
    was: Compute alignments of similar regions in two DNA sequences.  MultiPipMaker allows the user to
      see relationships among more than two sequences.
  pique:
    description: Finds peaks from high coverage bacterial and archaeal ChIP-seq data
    was: 'A efficient peak finder for high coverage ChIP-seq experiments, written in Python.

      The pique package is a high efficiency peak finder for ChIP-seq.'
  placeback:
    description: Predicts optimal insertion sites for transcription factor binding sites into native yeast
      promoters using a neural network framework
    was: This tool enables in silico design of synthetic promoters in yeast . It predicts optimal insertion
      sites for transcription factor binding sites (TFBSs) into native promoters with no prior experimental
      characterization of any of the sequences.
  plant_snp_tata_z-tester:
    description: Estimates the impact of proximal promoter mutations on plant gene expression using Tikhonov's
      regularization
    was: A Web Service That Unequivocally Estimates the Impact of Proximal Promoter Mutations on Plant
      Gene Expression.
  plantcare:
    description: Database of plant cis-acting regulatory elements with tools for in silico promoter sequence
      analysis
    was: Database of plant cis-acting regulatory elements and a portal to tools for in silico analysis
      of promoter sequences.
  plantdeepsea:
    description: Predicts regulatory effects of genomic variants on chromatin accessibility in multiple
      plant tissues using deep learning models
    was: PlantDeepSEA is a webserver based on deep learning models of chromatin accessibility for multiple
      plant species. It can predict the impact of genomic variants on chromatin accessibility in multiple
      tissues. Therefore, it can be used to prioritize genomic variants and discover high-impact cis-regulatory
      sites within a sequence.
  plantfunco:
    description: Integrates functional genomics data to compute cross-species conservation scores and
      chromatin states for plant genomes
    was: Integrative functional genomics database reveals clues into duplicates divergence evolution.
  plantnatsdb:
    description: Annotates and discovers natural antisense transcripts across 69 plant species by integrating
      genomic and small RNA sequencing data
    was: Natural Antisense Transcripts (NATs), a kind of regulatory RNAs, occur prevalently in plant genomes
      and play significant roles in physiological and/or pathological processes. Plant Natural Antisense
      Transcripts DataBase is a platform for annotating and discovering NATs by integrating various data
      sources.
  plantpan:
    description: Detects transcription factor binding sites, CpG islands, and tandem repeats in plant
      promoter sequences
    was: Database-assisted system for recognizing combinatorial cis-regulatory elements with distance
      constraint in plant co-expressed genes.
  planttfcat:
    description: Identifies and categorizes plant transcription factors, transcriptional regulators, and
      chromatin regulators from protein and nucleic acid sequences using InterProScan domain patterns
    was: An online plant transcription factor and transcriptional regulator categorization and analysis
      tool.
  planttfdb:
    description: Identifies and catalogs transcription factors and transcriptional regulators from sequenced
      plant genomes, with cross-species orthology links
    was: Plant Transcription Factor Database (PlantTFDB) is database that attempts to identify a comprehensive
      set of plant genes coding for transcription factors. A web interface to the database allows users
      to browse by species, search using a sequence identifier, or query using BLAST.
  planttfdb_2.0:
    description: Provides detailed annotation, multiple sequence alignments, and phylogenetic trees for
      plant transcription factors from 49 species
    was: The PlantTFDB 2.0 plant transcription factor (TF) database contains detailed annotation including
      general information, domain feature, gene ontology, expression pattern and ortholog groups, as well
      as cross references to various databases and literature citations for these TFs. Multiple sequence
      alignments and phylogenetic trees for each family can be shown as Weblogo pictures or downloaded
      as text files.
  plntfdb:
    description: Provides putatively complete sets of transcription factors and transcriptional regulators
      from sequenced plant genomes with domain architectures and cross-links
    was: The Plant Transcription Factor Database is an integrative database that provides putatively complete
      sets of transcription factors (TFs) and other transcriptional regulators (TRs) in plant species
      whose genomes have been completely sequenced and annotated. TF or TR gene entries include information
      of expressed sequence tags, 3D protein structures of homologous proteins, domain architecture and
      cross-links to other computational resources online.
  plot2do:
    description: Creates 2D occupancy plots to evaluate MNase-seq, MNase-ChIP-seq, and other fragment-based
      sequencing data quality and nucleosome distribution
    was: 'Creating 2D Occupancy Plots Using plot2DO.


      Micrococcal nuclease digestion followed by deep sequencing (MNase-seq) is the most used method to
      investigate nucleosome organization on a genome-wide scale. We present plot2DO, a flexible tool
      for evaluating the quality of MNase-seq and MNase-ChIP-seq data, and for visualizing the distribution
      of nucleosomes near the functional regions of the genome. Apart from MNase-seq data analysis, plot2DO
      was also used to investigate DNA fragments obtained in other types of experiments, such as ChIP-seq,
      ATAC-seq, and chemical cleavage mapping. In principle, plot2DO can be used to analyze the amount
      of DNA that is obtained from different regions of the genome, and the corresponding distribution
      of fragment sizes for each region, independent of the protocol that is used to generate the short
      DNA fragments.'
  pmsearch:
    description: Searches DNA sequences with Position Frequency Matrices to predict transcription factor
      binding sites
    was: Tool that utilizes Position Weight Matrices to search for putative Transcription Factor Binding
      Sites. PMSearch takes Position Frequency Matrices (PFMs) and DNA sequences to initiate a prediction
      task. The user may upload motifs/matrices (Position Frequency Matrices, PFM or Position Weight Matrices,
      PWM) or retrieve PFMs from our local dataset as input.
  pobo:
    description: Summarizes, verifies and screens predetermined cis-element motifs in promoter sequences
      using bootstrapping to detect over- or underrepresented motifs
    was: POBO is a tool to summarize, verify and screen predetermined cis-element motifs from a set of
      sequences. POBO reports the results in as understandable format as possible for biologists.
  pocketannotate:
    description: Annotates query proteins at the binding site level by identifying putative ligand-binding
      sites and matching them against a database of known binding sites
    was: PocketAnnotate performs binding site level annotation of query proteins.
  poco:
    description: Searches promoter sets from co-expressed genes for over-represented nucleotide patterns
      using bootstrapping and ANOVA
    was: POCO searches a set of promoters from co-expressed genes for nucleotide patterns that are over-represented.
  polobag:
    description: Infers signed gene regulatory networks with edge directions and cycles from expression
      data using polynomial Lasso bagging
    was: 'Polynomial Lasso Bagging for signed gene regulatory network inference from expression data.


      POLYNOMIAL LASSO BAGGING ALGORITHM FOR SIGNED GENE REGULATORY NETWORK INFERENCE.


      Code : The Python file PoLoBag.py can be run in Python 3.x (for Python 2.x just change the part
      for writing output to file at the end). Here degree d = 2 in the algorithm. Before running change
      the infilename parameter as per your static gene expression filename. The output will be a sorted
      edge list. The first column denotes regulator, the second column denotes target gene and the third
      column is a signed edge weight. The weights are normalized to have a maximum absolute value of 1.
      Edges with non-zero weights are sorted in the output list based on the absolute value of these weights.'
  polya-dg:
    description: Identifies cross-species poly(A) signals from DNA sequences using deep learning without
      target species data
    was: A deep-learning-based domain generalization method to identify cross-species Poly(A) signal without
      prior knowledge from target species.
  polyapeak:
    description: Ranks ChIP-seq peaks by incorporating peak shape information using a Bayesian hierarchical
      model
    was: R package for ranking ChIP-seq peaks with shape information. polyaPeak uses a Bayesian hierarchical
      model to incorporate the peak shapes in the ranking. The shapes are described by a mixture of multivariate
      Polya distributions. Real data analyses show that polyaPeak outperforms several popular peak calling
      software including MACS, CisGenome and PICS.
  polygraph:
    description: Assesses synthetic regulatory DNA elements based on diversity, motif composition, and
      similarity to endogenous sequences
    was: Polygraph is a Python framework for systematically assessing synthetic regulatory DNA elements,
      based on features like diversity, motif composition, and similarity to endogenous sequences. It
      is designed to facilitate the design of regulatory elements for gene and cell therapy.
  portia:
    description: Infers gene regulatory networks from expression data using robust precision matrix estimation
    was: Fast and accurate inference of Gene Regulatory Networks through robust precision matrix estimation.
  possum:
    description: A database of similar protein-ligand binding and putative pockets discovered by all-pairs
      similarity search of known and potential binding sites in the PDB
    was: A database of similar protien-ligand binding and putative pockets. Using a novel algorithm, we
      conducted a large-scale all-pairs search for known and potential binding sites in the Protein Data
      bank, and discovered over 14 million similar pairs of binding sites.
  possum-cis:
    description: Predicts cis-elements in DNA sequences by calculating log-likelihood ratio scores against
      position-specific scoring matrices
    was: Predict cis-elements in DNA sequences using the standard method of Position Specific Scoring
      Matrices. It measures the resemblance of every sequence fragment to the chosen cis-element matrices
      by calculating log-likelihood ratio scores (base e), and returns high-scoring sequence fragments.
  poxo:
    description: Discovers transcription factor binding sites from co-expressed genes through functional
      evaluation, sequence retrieval, pattern discovery and verification
    was: POXO is a series of tools that can be used to discover, search and verify possible regulatory
      cis-element(s) from set(s) co-expressed genes.
  pparg:
    description: Integrates single-cell and bulk RNA-seq data to identify a PPARG regulon predicting immunotherapy
      response across cancers
    was: PPARG is a tool for integrated analysis of single-cell and bulk RNA sequencing data, focusing
      on myeloid cell-related regulons and predicting neoadjuvant immunotherapy response. It includes
      a website providing a discovery tool and resource value for researchers.
  ppd:
    description: Provides a manually curated collection of experimentally verified prokaryotic promoters
    was: 'PPD-Prokaryotic Promoter Database: A Manually Curated Database for Experimentally Verified Prokaryotic
      Promoters.'
  ppgr:
    description: Integrates genomic, gene regulation and functional data from 60 perennial plant species
      with multi-omics search and analysis tools
    was: Comprehensive perennial plant genomes and regulation database.
  ppnet:
    description: Identifies functional association networks from phylogenetic profiling of prokaryotic
      genomes
    was: Identifying functional association networks by phylogenetic profiling of prokaryotic genomes.
  pppbenchmark:
    description: Benchmarks promoter prediction programs using a multi-faceted evaluation strategy
    was: Promoter prediction program evaluation.
  precise:
    description: Predicts cis-acting regulatory elements in DNA upstream sequences using empirical motif
      frequency tables
    was: 'Predict regulatory cis-acting elements through DNA sequences. This tool aimed at advanced mining
      of specific biological data: sequence data of DNA sequences that lie upstream of regions with known
      coding function.'
  precisetad:
    description: Predicts TAD boundaries at base-pair resolution using a transfer learning framework trained
      on genome annotation data
    was: 'A machine learning framework for precise 3D domain boundary prediction at base-level resolution.


      preciseTAD: A machine learning framework for precise TAD boundary prediction.


      preciseTAD provides functions to predict the location of boundaries of topologically associated
      domains (TADs) and chromatin loops at base-level resolution.'
  predector:
    description: Searches for cis-regulatory elements in bacterial genomes based on orientation and distance
      from gene starts
    was: Tool designed for biologists, its main function is to search for the cis-elements (nucleotides)
      that regulate the genes for a bacteria specie, assuming that one usually consider that a cis sequence
      regulates a gene if it is oriented in the same direction and if it is localized in a user-specified
      interval regarding to the beginning of the gene.
  predictf:
    description: Predicts bacterial transcription factors from metagenomic and metatranscriptomic data
      using a two-step pipeline
    was: 'PredicTF is a tool to predict bacterial transcription factors in complex microbial communities.


      Transcription Factors (TFs) are proteins controlling the rate of genetic information, regulating
      cellular gene expression.'
  predictivenetworks:
    description: Infers causal gene interaction networks from prior knowledge and gene expression data
      using regression and information-theoretic techniques
    was: The regression-based network inference algorithm creates a graph of gene interactions in which
      cycles may be present (but no self-loops). Based on information-theoretic techniques, a causal gene
      interaction network is inferred from both prior knowledge (interactions extracted from biomedical
      literature and structured biological databases) and gene expression data. A prediction model is
      fitted for each gene, given its parents, enabling assessment of the predictive ability of the network
      model.
  predictprotein_open:
    description: Predicts protein structural and functional features from sequence, including secondary
      structure, solvent accessibility, transmembrane helices, and subcellular localization
    was: Prediction of various aspects of protein structure and function. A user may submit a query to
      the server without registration.
  predictregulon:
    description: Predicts binding sites and operons for a regulatory protein in a prokaryotic genome from
      a multiple sequence alignment
    was: Tool that, for a given regulatory protein and prokaryotic genome, predicts binding sites and
      operons. The user selects a prokaryote genome and provides an ungapped multiple sequence alignment
      representing the binding site. The tool reports back with predicted binding sites and downstream
      co-regulated genes.
  predrem:
    description: Provides predicted DNA regulatory motifs and motif modules from DNase I hypersensitive
      sites across 349 human cell and tissue samples
    was: Database of Dna REgulatory Motifs and motifs modules predicted from DNase I hypersensitive sites
      in 349 human cell and tissue samples.
  presrat:
    description: Identifies bacterial small-RNA sequences and their mRNA targets, predicts binding regions,
      and builds 3D models of sRNA-mRNA duplexes
    was: 'A server for identification of bacterial small-RNA sequences and their targets with probable
      binding region.


      Predicting small RNAs and their Targets.


      Here, we present a webserver, PresRAT which aims to identify novel sRNA and its target genes.


      PresRAT aims to predict potential bacterial sRNA and the potential target of that sRNA against a
      bacterial genome containing mRNA sequences. With an added advantage PresRAT can build and perform
      molecular dynamics simulation on 3D models these sRNA and sRNA-mRNA bound duplex regions.


      Bacterial small-RNAs (sRNA) are RNAs of varied length (40 to 500 nucleotide long) mostly encoded
      in the intergenic regions of bacterial chromosomes. Most sRNAs act as regulatory elements by base
      pairing with the 5'' untranslated region of mRNA transcripts.These sRNAs play important roles in
      gene regulation by modifying the stability and expression of the target transcript.'
  pri-cat:
    description: Manages and analyzes plant ChIP-seq experiments, focusing on Arabidopsis, with storage,
      visualization, and Galaxy-based secondary analysis
    was: PRI-CAT is a web-based workflow tool for the management and analysis of plant ChIP-seq experiments,
      with focus on Arabidopsis. Secondary analysis can be performed with the aid of GALAXY.
  primaryAnnotation:
    description: Infers transcriptional start and termination sites from nascent transcript sequencing
      data to generate data-driven primary transcript annotations
    was: 'Defining data-driven primary transcript annotations with primaryTranscriptAnnotation in R |
      This package was developed for two purposes: (1) to generate data-driven transcript annotations
      based on nascent transcript sequencing data, and (2) to annotate de novo identified transcriptional
      units (e.g., genes and enhancers) based on existing annotations such as those from (1). The code
      for this package was employed in analyses underlying our manuscript in preparation: Transcriptional
      mechanisms and gene regulatory networks underlying early adipogenesis (this note will be updated
      upon publication) | primaryTranscriptAnnotation-vignette.pdf | See the vignette and user manual:'
  primirtss:
    description: Identifies cell-specific microRNA transcription start sites by integrating H3K4me3 and
      Pol II ChIP-seq data with conservation and sequence features
    was: 'an R package for identifying cell-specific microRNA transcription start sites.


      Prediction of pri-miRNA Transcription Start Site.


      A fast, convenient tool to identify the TSSs of miRNAs by integrating the data of H3K4me3 and Pol
      II as well as combining the conservation level and sequence feature, provided within both command-line
      and graphical interfaces, which achieves a better performance than the previous non-cell-specific
      methods on miRNA TSSs.


      High throughput sequencing, like ChIP-seq, has gradually become an essential and versatile approach
      for us to identify and understand genomes and their transcriptional processes.


      Identifying human miRNA transcriptional start sites (TSSs) plays a significant role in understanding
      the transcriptional regulation of miRNA.


      GeneRegulation, Genetics, ImmunoOncology, Preprocessing, RNASeq, Sequencing, Software, Transcription.'
  primo-multiomics:
    description: Integrates multiple GWAS and omics QTL summary statistics to elucidate molecular mechanisms
      of trait-associated SNPs and detect pleiotropy
    was: 'integration of multiple GWAS and omics QTL summary statistics for elucidation of molecular mechanisms
      of trait-associated SNPs and detection of pleiotropy in complex traits.


      Primo: Package in R for Integrative Multi-Omics association analysis.


      The goal of Primo is to provide computationally efficient tools to integrate data across phenotypes,
      cell/tissue types, populations or sources when performing joint analysis of multi-omics data.'
  prismexp:
    description: Predicts gene annotations from stratified gene-gene co-expression matrices using RNA-seq
      data
    was: Gene annotation prediction from stratified gene-gene co-expression matrices.
  prmd:
    description: Integrates plant RNA modification data from 20 species with visualization and functional
      analysis tools
    was: Integrated database for plant RNA modifications. It contains 20 plant species and provides an
      intuitive interface to display the information. PRMD provides visualization and functional analysis
      tools, such as RMlevelDiff, RMplantVar, RNAmodNet and Blast to perform different analyses, and mRNAbrowse,
      RNAlollipop, JBrowse and Integrative Genomics Viewer (IGV) to visually display the analysis and
      statistical results.
  probc:
    description: Jointly models epigenome and transcriptome effects to decompose Hi-C and Micro-C interactions
      by known chromatin marks
    was: Joint modeling of epigenome and transcriptome effects in 3D genome.
  proberating:
    description: Infers binding profiles for unexplored nucleic acid-binding proteins from sequence data
      using a deep learning recommender system
    was: 'a recommender system to infer binding profiles for nucleic acid-binding proteins.


      the interaction between proteins and nucleic acids plays a crucial role in gene regulation and cell
      function. Determining the binding preferences of nucleic acid-binding proteins (NBPs), namely RNA-binding
      proteins (RBPs) and transcription factors (TFs), is the key to decipher the protein-nucleic acids
      interaction code. Today, available NBP binding data from in vivo or in vitro experiments are still
      limited, which leaves a large portion of NBPs uncovered. Unfortunately, existing computational methods
      that model the NBP binding preferences are mostly protein specific: they need the experimental data
      for a specific protein in interest, and thus only focus on experimentally characterized NBPs'
  probis:
    description: Detects protein binding sites based on local structural alignments against the PDB
    was: Web server which detects protein binding sites based on local structural alignments. Algorithms
      have been parallelized to allow for faster computing against the PDB. Pre-calculated protein similarity
      profiles for over 29,000 non-redundant proteins are also available.
  probis-ligands:
    description: Predicts ligands for a protein structure by transposing ligands from similar binding
      sites in the Protein Data Bank
    was: ProBiS is a web server for predicting ligands by similarity in binding sites.
  prochipdb:
    description: A database of curated ChIP-seq/-exo binding sites and genome viewers for prokaryotic
      transcription factors
    was: A PROkaryotic Chromatin ImmunoPrecipitation DataBase
  prodface:
    description: Characterizes protein-DNA interfaces from PDB structures by computing physicochemical,
      geometric, and conservation parameters
    was: Web-tool for the analysis of Protein-DNA structures (experimental structures, models, MD snapshots,
      docked structures etc.).
  prodonet:
    description: Maps prokaryotic genes to regulatory and metabolic networks, detecting shared operons,
      co-expressed genes, and joint regulators from a gene list
    was: A web-based application for the mapping of prokaryotic genes and the corresponding proteins to
      common gene regulatory and metabolic networks. Users input a list of genes from which shared operons,
      co-expressed genes and shared regulators are detected. Common metabolic pathways are then viewed
      on KEGG maps.
  prodoric:
    description: Collects prokaryotic transcription factor binding sites with visualization and pattern-based
      search tools
    was: The most comprehensive database for gene regulation and gene expression in prokaryotes.
  profilescoredist:
    description: Regularizes position count matrices and computes score distributions for sequence motifs
    was: Regularization and score distributions for position count matrices.
  progeny:
    description: Infers pathway activity from gene expression using a linear model derived from perturbation
      experiments
    was: This package provides a function to infer pathway activity from gene expression using PROGENy.
      It contains the linear model we inferred in the publication "Perturbation-response genes reveal
      signaling footprints in cancer gene expression".
  promateus:
    description: Extends ProMate to predict protein binding sites with user-suggested features
    was: ProMateus extends ProMate, a protein binding site predictor, and allows the user to suggest new
      features that might improve the prediction of the binding site locations.
  promfd:
    description: Recognizes vertebrate RNA polymerase II promoters in DNA sequences using string patterns
      and IMD matrices
    was: Computer program to recognize vertebrate RNA polymerase II promoters.
  promh:
    description: Predicts transcription start sites, TATA boxes, and transcription factor binding sites
      in promoter regions using pairs of orthologous sequences
    was: Predicts transcription start sites (TSS), TATA boxes, and transcription factor binding sites
      (TFBS) in promoter regions using pairs of orthologous sequences.
  promintools:
    description: Compares two sets of protein sequences for global properties and motif content, with
      application to biomineralization proteins
    was: 'Shedding light on proteins of unknown function in biomineralization with user friendly tools
      illustrated using mollusc shell matrix protein sequences.


      This is the project page for ProminTools: a collection of bioinformatic tools for the analysis of
      protein seqeunces thought to be involved in biomineralization.'
  promoser:
    description: Extracts proximal promoter sequences from mammalian genomes by mapping mRNA and EST sequences
      to find transcription start sites
    was: Server which aims to extract proximal promoter sequences from mammalian genomes.  Does so by
      mapping mRNA and EST sequences and tracking overlapping alignments to find the transcription start
      site.
  promotech:
    description: Predicts bacterial promoters across a wide range of species using machine learning
    was: Machine-learning-based general bacterial promoter prediction tool.
  promoter:
    description: Predicts transcription start sites of vertebrate Pol II promoters from DNA sequences
      using neural networks and genetic algorithms
    was: Prediction of transcription start sites of vertebrate Pol II promoters in DNA sequences.
  promotercad:
    description: Designs synthetic promoters with altered transcriptional regulation using expression
      and motif data from Arabidopsis thaliana
    was: PromoterCAD is a web server for designing synthetic promoters in plants with altered transcriptional
      regulation. PromoterCAD uses published high-throughput expression and motif data from Arabidopsis
      thaliana to guide DNA design.
  promoterplot:
    description: Finds similarities between groups of promoters from TransFac search output using pattern
      recognition of conserved triplet models
    was: Takes the output from a TransFac search as input, and finds similarities between groups of promoters
      in an attempt to simplify the results of transcription factor searches. FASTA/Affymetrix IDs can
      also be used as input for a local installation of the tool.
  prompredict:
    description: Identifies promoter regions in genomic DNA by measuring stability differences between
      neighboring regions
    was: Tool to identify promoter regions in genomic DNA sequence, based on difference in stability between
      neighboring regions.
  promzea:
    description: Discovers de novo motifs underlying co-regulated genes in maize, Arabidopsis or rice
      by combining and filtering results from multiple motif-finding programs
    was: Perl-based application to discover de novo motifs underlying co-regulated genes in maize, Arabidopsis
      or rice.
  propr:
    description: Identifies proportionally abundant features from compositional data using three measures
      of proportionality
    was: Identifying Proportionally Abundant Features Using Compositional Data Analysis.
  prosom:
    description: Predicts core promoters from DNA sequences using unsupervised clustering of physical
      properties
    was: Promoter prediction program based on unsupervised clustering of physical properties of DNA.
  pscan-chip:
    description: Scans ChIP-Seq regions for motif enrichment and positional bias using JASPAR or TRANSFAC
      matrices
    was: PscanChIP is a web server that, starting from a collection of genomic regions derived from a
      ChIP-Seq experiment, scans them using motif descriptors like JASPAR or TRANSFAC position-specific
      frequency matrices, or descriptors uploaded by users, and it evaluates both motif enrichment and
      positional bias within the regions according to different measures and criteria.
  pscanchip:
    description: Scans ChIP-Seq genomic regions with motif descriptors to evaluate motif enrichment and
      positional bias
    was: Web server that, starting from a collection of genomic regions derived from a ChIP-Seq experiment,
      scans them using motif descriptors like JASPAR or TRANSFAC position-specific frequency matrices,
      or descriptors uploaded by users, and it evaluates both motif enrichment and positional bias within
      the regions according to different measures and criteria.
  psrobot:
    description: Predicts stem-loop small RNA precursors and their targets from plant small RNA sequences
      using a modified Smith-Waterman algorithm
    was: psRobot is a web-based tool for plant small RNA meta-analysis. psRobot computes stem-loop small
      RNA prediction, which aligns user uploaded sequences to the selected genome, extracts their predicted
      precursors, and predicts whether the precursors can fold into stem-loop shaped secondary structure.
      psRobot also computes small RNA target prediction, which predict the possible targets of user provided
      small RNA sequences from the selected transcript library.
  pthgrn:
    description: Unravels post-translational hierarchical gene regulatory networks by integrating PPI,
      ChIP-seq and gene expression data
    was: Web server for unraveling post-translational hierarchical gene regulatory networks using PPI,
      ChIP-seq and gene expression data.
  ptnet:
    description: Simulates miRNA-mediated post-transcriptional gene regulation using a graph-based learning
      model
    was: PTNet is a graph-based learning model which simulates the miRNAs (microRNAs) that regulate gene
      expression post-transcriptionally in silico.
  pupasview:
    description: Selects relevant SNPs within a gene using filters for validation status, frequency, and
      functional properties like pathological effects and disrupted transcription factor binding sites
    was: Interactive web-based SNP analysis tool that allows for the selection of relevant SNPs within
      a gene, based on different characteristics of the SNP itself, such as validation status, type, frequency/population
      data and putative functional properties (pathological SNPs, SNPs disrupting potential transcription
      factor binding sites, intron/exon boundaries;.).
  pwmenrich:
    description: Performs PWM enrichment analysis and scanning of known DNA motifs using Biostrings
    was: A toolkit of high-level functions for DNA motif scanning and enrichment analysis built upon Biostrings.
      The main functionality is PWM enrichment analysis of already known PWMs (e.g. from databases such
      as MotifDb), but the package also implements high-level functions for PWM scanning and visualisation.
      The package does not perform "de novo" motif discovery, but is instead focused on using motifs that
      are either experimentally derived or computationally constructed by other tools.
  pwmscan:
    description: Scans entire genomes for matches to a position-specific weight matrix
    was: Fast tool for scanning entire genomes with a position-specific weight matrix.
  pwrEWAS:
    description: Estimates statistical power for two-group EWAS comparisons of DNA methylation using a
      simulation-based approach
    was: Computationally efficient tool to estimate power in EWAS as a function of sample and effect size
      for two-group comparisons of DNAm.
  pyPINTS:
    description: Identifies nascent transcript starts from sequencing data to map active enhancers
    was: Peak Identifier for Nascent Transcript Starts
  pycallingcards:
    description: Visualizes, analyzes, and interprets Calling Cards data with peak callers for transcription
      factor binding sites
    was: Integrated environment for visualizing, analyzing, and interpreting Calling Cards data.
  pymegabase:
    description: Predicts cell-type-specific structural annotations of chromosomes from epigenomic data
    was: Predicting cell-type-specific structural annotations of chromosomes using the epigenome.
  pypanda:
    description: Reconstructs gene regulatory networks from multi-omics data using message-passing
    was: A Python package for gene regulatory network reconstruction.
  pyprobound:
    description: Benchmarks and builds DNA binding affinity models from allele-specific and allele-agnostic
      transcription factor binding data using a biophysically interpretable machine learning framework
    was: PyProBound is a software resource for benchmarking and building DNA binding affinity models,
      particularly focused on allele-specific transcription factor binding data. It facilitates de novo
      inference of high-quality models and motif discovery.
  pyscnet:
    description: Reconstructs and analyzes gene regulatory networks from single-cell RNA-Seq data, with
      cell- or trajectory-specific GRNs and co-expression module detection
    was: 'A tool for reconstructing and analyzing gene regulatory network from single-cell RNA-Seq data.


      Dashboard is available now for creating your own GRNs. Cell specific GRNs and network analysis results
      can be saved as a pickle object and upload onto PySCNet-Dashboard. It provides parameter settings
      and allows for parameter adjustment and GRNs customization.'
  pyspade:
    description: Analyzes single-cell perturbation data from CRISPRi screens to identify differential
      gene expression and enhancer regulatory networks in breast cancer
    was: pySpade is a Python package that analyzes single-cell perturbation datasets, specifically designed
      to identify differential gene expression and understand enhancer regulatory networks in breast cancer.
      It facilitates analysis of CRISPRi screens and generates hits tables and Manhattan plots.
  pyviper:
    description: Performs rank-based enrichment analysis of single-cell RNASeq data to assess protein
      activity using multiple algorithms
    was: pyVIPER is a Python package for rank-based enrichment analysis of single-cell RNASeq data, designed
      for speed and scalability. It enables VIPER-based protein activity analysis and supports multiple
      enrichment algorithms.
  q:
    description: Calls ChIP-seq and ChIP-nexus peaks by assessing quadratic enrichment and saturation
      of 5' read ends
    was: Saturation-based ChIP-seq and ChIP-nexus caller. Q works with the irreproducible discovery rate
      (IDR) procedure. Q can be run with or without data from a control experiment.
  qbed:
    description: Visualizes point process data, such as transposon calling cards, as a track on the WashU
      Epigenome Browser
    was: 'a novel genome browser visualization for point processes.


      Transposon calling cards is a genomic assay for identifying transcription factor binding sites in
      both bulk and single cell experiments. Here we describe the qBED format, an open, text-based standard
      for encoding and analyzing calling card data. In parallel, we introduce the qBED track on the WashU
      Epigenome Browser, a novel visualization that enables researchers to inspect calling card data in
      their genomic context. Finally, through examples, we demonstrate that qBED files can be used to
      visualize non-calling card datasets, such as CADD scores and GWAS eQTL hits, and may have broad
      utility to the genomics community'
  qdrip:
    description: Quantifies RNA-DNA hybrid formation genome-wide using synthetic internal standards and
      strand-specific sequencing
    was: 'a method to quantitatively assess RNA-DNA hybrid formation genome-wide.


      R-loops are dynamic, co-transcriptional nucleic acid structures that facilitate physiological processes
      but can also cause DNA damage in certain contexts. Perturbations of transcription or R-loop resolution
      are expected to change their genomic distribution. Next-generation sequencing approaches to map
      RNA-DNA hybrids, a component of R-loops, have so far not allowed quantitative comparisons between
      such conditions. Here, we describe quantitative differential DNA-RNA immunoprecipitation (qDRIP),
      a method combining synthetic RNA-DNA-hybrid internal standards with high-resolution, strand-specific
      sequencing. We show that qDRIP avoids biases inherent to read-count normalization by accurately
      profiling signal in regions unaffected by transcription inhibition in human cells, and by facilitating
      accurate differential peak calling between conditions'
  qhistone:
    description: Predicts histone modifications and synergistic protein interactions from Arabidopsis
      ChIP-seq data using machine learning
    was: QHistone is a web-based database for predicting protein synergistic effects and studying regulatory
      activity in Arabidopsis thaliana using epigenome profiling. It employs machine learning to analyze
      ChIP-seq data and predict histone modifications.
  qpms9:
    description: Parallel exact algorithm for quorum planted motif search in DNA and protein sequences
    was: Parallel exact qPMS (quorum Planted Motif Search) algorithm that offers significant runtime improvements
      on DNA and protein datasets.
  qpromoters:
    description: Predicts promoter strength from nucleotide sequence in Saccharomyces cerevisiae
    was: QPromoters is a tool for sequence based prediction of promoter strength in Saccharomyces cerevisiae.
  qsea:
    description: Models and quantifies absolute methylation levels from MeDIP-seq data using a Bayesian
      statistical model
    was: Tool developed as the successor of the MEDIPS package for analyzing data derived from methylated
      DNA immunoprecipitation (MeDIP) experiments followed by sequencing (MeDIP-seq). However, it provides
      several functionalities for the analysis of other kinds of quantitative sequencing data (e.g. ChIP-seq,
      MBD-seq, CMS-seq and others) including calculation of differential enrichment between groups of
      samples.
  qseq:
    description: Aligns and analyses RNA-seq, ChIP-seq, and miRNA data from next-generation sequencing
    was: DNASTAR's Next-Gen application for RNA-seq, ChIP-seq, and miRNA alignment and analysis.
  quaqc:
    description: Performs ATAC-seq-specific quality control and read filtering with low memory overhead
    was: quaqc is a command-line tool for efficient and quick ATAC-seq quality control and read filtering.
      It allows for processing individual samples or handling thousands in parallel, with interactive
      program execution via the helper R package quaqcr.
  quest:
    description: Identifies transcription factor binding sites from ChIP-seq data using a kernel density
      estimator
    was: Kernel Density Estimator-based package for analysis of massively parallel sequencing data from
      chromatin immunoprecipitations (ChIP-seq or ChIPseq).
  quma:
    description: Aligns, visualizes and quantifies CpG methylation from bisulfite sequencing data using
      user-defined quality cutoffs
    was: Quantification tool for Methylation Analysis (QUMA) is a web-based bisulfite sequencing analysis
      tool for CpG methylation analysis. Following user input of PCR target genomic sequence and raw bisulfite
      sequences, alignment, visualization and quantification of the bisulfite sequence data is rapid.
      Users can also control the quality of aligned sequences by changing cutoff paramteres.
  r-loop:
    description: Performs quality control and meta-analysis of R-loop mapping data to define consensus
      R-loop regions
    was: Quality-controlled R-loop meta-analysis reveals the characteristics of R-loop consensus regions.
  r-loopbase:
    description: Integrates genomics and literature data to provide a reference set of human R-loop zones
      and a curated list of R-loop regulatory proteins
    was: A knowledgebase for genome-wide R-loop formation and regulation.
  r3cpet:
    description: Infers protein complexes maintaining chromatin interactions from ChIA-PET, transcription
      factor binding, and protein interaction data using a hierarchical Dirichlet process
    was: The package provides a method to infer the set of proteins that are more probably to work together
      to maintain chormatin interaction given a ChIA-PET experiment results.
  rSeqTU-A:
    description: Predicts bacterial transcription units from RNA-seq data using random forest feature
      selection and support vector machine models
    was: Machine learning based R package for prediction of bacterial transcription units.
  racipe:
    description: Models gene regulatory circuits by randomizing kinetic parameters to identify robust
      dynamical features from network topology
    was: Computational tool for modeling gene regulatory circuits using randomization.
  racoon_clip:
    description: Analyzes iCLIP and eCLIP data to extract RNA binding signal at single-nucleotide resolution
    was: racoon_clip is a pipeline for analyzing iCLIP and eCLIP data to extract RNA binding signal at
      single-nucleotide resolution. It is a command-line tool that outputs a conclusive summary report
      with visualizations and statistics.
  ramen:
    description: Identifies variably methylated loci from microarray DNA methylation data and models their
      genetic, environmental, additive or interactive contributions
    was: 'Regional Association of Methylome variability with the Exposome and geNome (RAMEN) is an R package
      whose goal is to identify genome-wide Variable Methylated Loci (VML) from microarray DNA methylation
      data; then, using genomic and exposomic data, it can identify which model out of the following explains
      best the DNA methylation variability at each VML: genetic (G), environmental (E), additive (G+E)
      or interactive (GxE).'
  raptgen:
    description: Generates aptamer sequences using a variational autoencoder with a profile hidden Markov
      model decoder
    was: A variational autoencoder with profile hidden Markov model for generative aptamer discovery.
  rbioapi:
    description: Provides a unified R interface to biological web services APIs such as Enrichr, JASPAR,
      and STRING
    was: "User-Friendly R Interface to Biologic Web Services' API.\n\nCurrently fully supports Enrichr,\
      \ JASPAR, miEAA, PANTHER, Reactome, STRING, and UniProt! The goal of rbioapi is to provide a user-friendly\
      \ and consistent interface to biological databases and services. In a way that insulates the user\
      \ from the technicalities of using web services API and creates a unified and easy-to-use interface\
      \ to biological and medical web services. \n\nThis is an ongoing project; New databases and services\
      \ will be added periodically. Feel free to suggest any databases or services you often use."
  rcade:
    description: Integrates ChIP-seq data with differential expression data via a Bayesian framework to
      identify transcription factor target genes
    was: This tool integrates ChIP-seq data with differential expression summary data through a Bayesian
      framework. A key application is identifing the genes targeted by a transcription factor of interest
      (that is, we collect genes that are associated with a ChIP-seq peak, and analyze the differential
      expression under some perturbation related to that TF).
  rcade-recognition:
    description: Combines predictions from a DNA recognition code of C2H2-ZFs with ChIP-seq data to identify
      genuine DNA binding preferences of C2H2-ZF proteins
    was: Recognition Code-Assisted Discovery of regulatory Elements combines predictions from a DNA recognition
      code of C2H2-ZFs with ChIP-seq data to identify models that represent the genuine DNA binding prefer-ences
      of C2H2-ZF proteins.
  rcistarget:
    description: Identifies transcription factor binding motifs over-represented on a gene list using
      genome-wide cross-species rankings
    was: It identifies transcription factor binding motifs (TFBS) over-represented on a gene list. In
      a first step, it selects DNA motifs that are significantly over-represented in the surroundings
      of the transcription start site (TSS) of the genes in the gene-set. This is achieved by using a
      database that contains genome-wide cross-species rankings for each motif.
  rdb2c2:
    description: Predicts residue-residue pairing in β strands from protein sequences using a residual
      neural network
    was: 'an improved method to identify the residue-residue pairing in β strands.


      stand-alone software package for RDB2C2. You can also download the full model package from our website:
      http://structpred.life.tsinghua.edu.cn/Software.html.


      A fully featured admin theme which can be used to build CRM, CMS, etc.'
  re-goa:
    description: Annotates non-coding regulatory elements with Gene Ontology terms using heterogeneous
      network embedding
    was: A tool for non-coding genomic regions functional enrichment analysis based on Regulatory Elements
      Gene Ontology Annotation (RE-GOA). Resources for RE-GOA in mouse and human are availible.
  readout:
    description: Calculates direct and indirect readout energy Z-scores to estimate sequence specificity
      of protein-DNA complexes from 3D structures
    was: Server for the calculation of direct and indirect readout energy Z-scores which estimate the
      degree of sequence specificity of the protein-DNA complex. It can be useful for checking the quality
      of protein-DNA interactions in three dimensional (3D) structures.
  readretro_web:
    description: Predicts plant natural product retrosynthesis pathways using a machine learning model
      integrated into a web platform
    was: READRetro is a user-friendly web platform that integrates a machine learning model for predicting
      plant natural product biosynthesis, bridging the gap between advanced retrosynthesis and practical
      research workflows. The platform provides a fast and responsive user experience and is freely accessible.
  recappable-seq:
    description: Identifies transcription start sites from all RNA polymerases at single-nucleotide resolution
      using enzymatic cap exchange
    was: Comprehensive determination of transcription start sites derived from all RNA polymerases using
      ReCappable-seq.
  recognicer:
    description: Identifies multi-scale broad domains from ChIP-seq data using recursive coarse-graining
    was: An algorithm for identifying multi-scale broad peaks from ChIP-seq data
  recon:
    description: Calculates the probability of nucleosome formation along a DNA sequence using discriminant
      analysis
    was: Tool for calculating the probability of nucleosome formation along a DNA sequence input by the
      user.
  redfly:
    description: Provides experimentally validated cis-regulatory modules and transcription factor binding
      sites from Drosophila
    was: The REDfly database of Drosophila transcriptional cis-regulatory elements provides experimentally
      validated cis-regulatory modules and transcription factor binding sites. The user interface is designed
      for access by both causal and power users and is intended as a tool for facilitating computational
      as well as experimental studies of transcriptional regulation.
  reduce:
    description: Identifies transcription factor binding sites from microarray data using motif-based
      regression
    was: Uses a motif-based regression method for the identification of TFBS (transcription factor binding
      sites) from microarray data in yeast, worm and fly. A free registration is required.
  refTSS:
    description: Provides an annotated reference dataset of transcription start sites for human and mouse
      genomes
    was: Annotated reference dataset for transcriptional start sites (TSS) in human and mouse.
  reganalyst:
    description: Integrates MoPP, MyPatternFinder and MycoRegDB for regulatory motif discovery and pattern
      detection in mycobacterial sequences
    was: Web server that integrates MoPP (Motif Prediction Program), MyPatternFinder and MycoRegDB (mycobacterial
      promoter and regulatory elements database).
  regcnn:
    description: Identifies cis-regulatory modules genome-wide by integrating local patterns in epigenetic
      marks and transcription factor binding motifs
    was: Identifying Drosophila genome-wide cis-regulatory modules via integrating the local patterns
      between epigenetic marks and TF binding motifs
  regeneration_roadmap:
    description: Compiles and explores regeneration-related gene expression and regulation data from multi-omics
      studies across species and tissues
    was: 'Regeneration Roadmap aims to compile large datasets for gene expression and regulation created
      by a broad spectrum of high-throughput omics technologies. This one-stop service provides user-friendly
      functionalities to explore annotated regeneration-related changes in gene expression, as well as
      raw data downloads from these multi-omics studies. The current implementation includes five modules:
      Regeneration-related genes, Transcriptomics, Single-cell Transcriptomics, Epigenomics and Pharmacogenomics.'
  regenomics:
    description: Analyzes plant regeneration-associated transcriptomes via gene-expression dynamics, co-expression
      networks, regulatory networks, and single-cell profiles
    was: A web-based application for plant REGENeration-associated transcriptOMICS analyses.
  regenrich:
    description: Identifies key transcriptional regulators from gene expression data by combining differential
      expression, network inference, and enrichment analysis
    was: RegEnrich gene regulator enrichment analysis reveals a key role of the ETS transcription factor
      family in interferon signaling.
  regprecise:
    description: Captures, visualizes and analyzes predicted transcription factor regulons in prokaryotes
      reconstructed by comparative genomics
    was: The database was developed for capturing, visualization and analysis of predicted transcription
      factor regulons in prokaryotes that were reconstructed and manually curated by utilizing the comparative
      genomic approach.
  regshape:
    description: Predicts whether an oligonucleotide sequence is a transcription factor binding site using
      DNA shape features
    was: This R package  provides a classifier for predicting whether a given oligonucleotide sequence
      (of length l bp, where l would typically vary from six to as high as 25 bp) is, or is not, a transcription
      factor (TF) binding site.
  regsnps-asb:
    description: Identifies allele-specific transcription factor binding from ATAC-seq data using a generalized
      linear model
    was: 'A Computational Framework for Identifying Allele-Specific Transcription Factor Binding From
      ATAC-seq Data.


      Expression quantitative trait loci (eQTL) analysis is useful for identifying genetic variants correlated
      with gene expression, however, it cannot distinguish between causal and nearby non-functional variants.
      Because the majority of disease-associated SNPs are located in regulatory regions, they can impact
      allele-specific binding (ASB) of transcription factors and result in differential expression of
      the target gene alleles. In this study, our aim was to identify functional single-nucleotide polymorphisms
      (SNPs) that alter transcriptional regulation and thus, potentially impact cellular function. Here,
      we present regSNPs-ASB, a generalized linear model-based approach to identify regulatory SNPs that
      are located in transcription factor binding sites'
  regulomepa:
    description: A database of transcriptional regulatory interactions between transcription factors,
      sigma factors and target genes in Pseudomonas aeruginosa PAO1
    was: 'a database of transcriptional regulatory interactions in Pseudomonas aeruginosa PAO1.


      regulatory network P. aeruginosa.'
  regulondb:
    description: Database of transcriptional regulation in Escherichia coli K-12, integrating signal transduction,
      transcription factors, and binding sites
    was: It is a reference database of Escherichia coli K-12. Transcriptional regulation is now part of
      a unit that initiates with the signal and continues with the signal transduction to the core of
      regulation, modifying expression of the affected target genes responsible for the response. It has
      summaries for every transcription factor (TF) and TF-binding sites with internal symmetry.
  regulus:
    description: Infers signed transcriptional regulatory networks from gene expression, regulatory region
      activity, and TF binding data using logical consistency checks
    was: Transcriptional regulatory networks inference tool based on Semantic Web technologies.
  regutools:
    description: Provides an R interface for extracting and processing regulatory network data from RegulonDB
    was: 'Programmatic access to bacterial regulatory networks with regutools.


      The goal of regutools is to provide an R interface for extracting and processing data from RegulonDB.
      This package was created as a collaboration by members of the Community of Bioinformatics Software
      Developers (CDSB in Spanish).


      regutools: an R package for data extraction from RegulonDB.


      RegulonDB has collected, harmonized and centralized data from hundreds of experiments for nearly
      two decades and is considered a point of reference for transcriptional regulation in Escherichia
      coli K12.'
  regvar:
    description: Prioritizes tissue-specific noncoding regulatory variants using a deep neural network
      that integrates sequential, epigenetic and evolutionary profiles
    was: Regvar is a deep neural network-based computational server for prioritizing tissue-specific noncoding
      regulatory variants. RegVar integrates the sequential, epigenetic and evolutionary profiles of single
      nucleotide polymorphisms (SNPs) and their potential target genes in 17 human tissues, and gives
      tissue-specific predictions of regulatory probabilities of the provided SNPs on provided genes.
  relics:
    description: Discovers functional sequences from tiling CRISPR screens using a Bayesian hierarchical
      model
    was: 'Discovering functional sequences with RELICS.


      RELICS ✨: Regulatory Element Location Identification in CRISPR screens.


      RELICS is an analysis method for discovering functional sequences from tiling CRISPR screens. The
      current version (v.2.0) of RELICS uses a Bayesian hierarchical model and considers the overlapping
      effects of multiple guides, can jointly analyze multiple pools per replicate, and estimates the
      number of functional sequences supported by the data.'
  remm_score:
    description: Scores human genome positions for regulatory probability using a machine learning framework
      trained on Mendelian disease variants
    was: 'ReMM score is a tool that scores the positions in the human genome in terms of their regulatory
      probability.


      We use curated regulatory variants involved in Mendelian disease and contrast them with proxy-neutral
      variants that survived natural selection in a machine learning framework. We use an algorithm for
      highly imbalanced data, called hyperSMURF, to differentiate deleterious from neutral variants.'
  remodiscovery:
    description: Infers transcriptional module networks by integrating ChIP-chip, motif, and microarray
      data
    was: Inferring transcriptional module networks from ChIP-chip-, motif- and microarray data.
  remus-disease:
    description: Prioritizes regulatory regions and variants from whole-genome sequencing data for monogenic
      diseases using tissue-specific activity filters
    was: Remus is a web application for prioritization of regulatory regions and variants in monogenic
      diseases.
  renato:
    description: Identifies over-represented transcription factors and miRNAs from gene lists using regulatory
      network analysis
    was: Network-based analysis web tool for the interpretation and visualization of transcriptional and
      post-transcriptional regulatory information, designed to identify common regulatory elements in
      a list of genes. Itmaps these genes to the regulatory network, extracts the corresponding regulatory
      connections and evaluate each regulator for significant over-representation in the list. Ranked
      gene lists can also be analysed.
  repentools:
    description: Performs genome-wide repeat element enrichment analysis from ChIP-seq and similar chromatin
      pulldown data, producing tabular and graphical outputs
    was: RepEnTools is a software package for genome-wide repeat element enrichment analysis of ChIP-seq
      and similar chromatin pulldown experiments, bundling various software with carefully chosen and
      validated settings to provide a complete solution from raw input files to tabular and graphical
      outputs.
  rephine-drug:
    description: Identifies drug response-related transcriptional regulators by modeling correlation patterns
      from pharmacogenomic and ChIP-seq data
    was: RePhine is a method for identification of drug response related transcriptional regulators by
      modeling correlation patterns of targets. RePhine takes in pharmacogenomics data containing gene
      expression, copy number, mutation status, cancer type information and pharmacological profiles for
      estimation of associations between genes expression and drug response. It also takes in ChIP-seq
      data for target inference.
  repitools:
    description: Summarizes and visualizes epigenomic data across promoters and quantifies methylation
      with BayMeth
    was: Tools for the analysis of enrichment-based epigenomic data. Features include summarization and
      visualization of epigenomic data across promoters according to gene expression context, finding
      regions of differential methylation/binding, BayMeth for quantifying methylation etc.
  responsenet:
    description: Reveals signaling and regulatory networks linking genetic and transcriptomic screening
      data via a minimum-cost flow optimization
    was: Network optimization approach for revealing signaling and regulatory networks linking genetic
      and transcriptomic screening data. Users upload weighted lists of proteins and genes. 2.0 version
      enhances the functionality by offering a human interactome of proteins, genes and micro-RNAs, and
      better output visualization.
  retrieve_matrix:
    description: Retrieves a position-specific scoring matrix for a transcription factor binding motif
      from the Regulatory Sequence Analysis Tools
    was: Retrieve from the Regulatory sequence Analysis Tools a position-specific scoring matrix describing
      a transcription factor binding motif
  revana:
    description: Aggregates and visually represents regulatory variants from cancer genomes in a gene-centric
      manner using whole-genome and RNA sequencing data
    was: A comprehensive tool for regulatory variant analysis and visualization of cancer genomes.
  revup:
    description: Scores regulatory variants for their causative role in rare diseases using public databases
      and user input
    was: Online scoring system for regulatory variants implicated in rare diseases.
  rg4-seeker:
    description: Identifies novel and non-canonical rG4 motifs from rG4-seq experiments using tailored
      noise models
    was: rG4-seeker enables high-confidence identification of novel and non-canonical rG4 motifs from
      rG4-seq experiments.
  rgadem:
    description: Discovers de novo motifs from large-scale genomic sequence data using an R implementation
      of GADEM
    was: Efficient de novo motif discovery tool for large-scale genomic sequence data. It is an open-source
      R package, which is based on the GADEM software.
  rgpdb:
    description: Provides root-associated genes and promoter sequences for maize, soybean, and sorghum
    was: Database of Root Genes and Promoters in Maize, Soybean, and Sorghum.
  rhizobindingsites:
    description: Provides motif-gene-associated conserved sequences from upstream regulatory regions of
      nitrogen-fixing bacteria using a footprint discovery approach
    was: 'Database of DNA-Binding Motifs in Nitrogen-Fixing Bacteria Inferred Using a Footprint Discovery
      Approach.


      The RhizoBindingSites database is a computer-assisted framework providing motif-gene-associated
      conserved sequences potentially implicated in transcriptional regulation in nine symbiotic species.'
  riborex:
    description: Identifies genes with differential translation efficiency from Ribo-seq and matched RNA-seq
      data
    was: Fast and flexible identification of differential translation from Ribo-seq data.
  ringo:
    description: Analyses ChIP-chip data from two-color microarrays for quality, visualization, and enriched
      region detection
    was: The package facilitates primary analysis of ChIP-chip data. Its main functionalities are data
      read-in, quality assessment, data visualisation and identification of genomic regions showing enrichment
      in ChIP-chip. It has functions to deal with two-color nucleotide microarrays from NimbleGen used
      in ChIP-chip projects, but also contains more general functions for ChIP-chip data analysis, given
      that the data is supplied as RGList or ExpressionSet. It employs functions from various other packages.
  ripseeker:
    description: Infers and discriminates RIP peaks from RIP-seq alignments using a two-state HMM with
      negative binomial emission probability
    was: Infers and discriminates RIP peaks from RIP-seq alignments using two-state HMM with negative
      binomial emission probability. While this tool is specifically tailored for RIP-seq data analysis,
      it also provides a suite of bioinformatics tools integrated within this self-contained software
      package comprehensively addressing issues ranging from post-alignments processing to visualization
      and annotation.
  rispice:
    description: Prioritizes non-coding rice variants by integrating predicted chromatin effects from
      a fine-tuned DNA language model
    was: RiSPICE (Rice SNP Prioritization Integrating Chromatin Effects) is a computational framework
      for prioritizing non-coding rice variants by integrating predicted chromatin effects from a fine-tuned
      DNA language model.
  river:
    description: Estimates the probability that a variant has regulatory impact in an individual by jointly
      analyzing personal genome and transcriptome data with a Bayesian model
    was: An implementation of a probabilistic modeling framework that jointly analyzes personal genome
      and transcriptome data to estimate the probability that a variant has regulatory impact in that
      individual. It is based on a generative model that assumes that genomic annotations, such as the
      location of a variant with respect to regulatory elements, determine the prior probability that
      variant is a functional regulatory variant, which is an unobserved variable.
  rjmcmcnucleosomes:
    description: Performs nucleosome positioning from genome-wide profiling data using a Multinomial-Dirichlet
      prior in a t-mixture with reversible jump estimation
    was: This package does nucleosome positioning using informative Multinomial-Dirichlet prior in a t-mixture
      with reversible jump estimation of nucleosome positions for genome-wide profiling.
  rlbase:
    description: Explores and analyzes R-loop mapping data from hundreds of public datasets and user-supplied
      data
    was: Exploration and analysis of R-loop mapping data with RLBase.
  rldock:
    description: Predicts binding sites and poses for ligand-RNA interactions
    was: 'RLDOCK method for predicting RNA-small molecule binding modes.


      RLDOCK is a source-availabe program for predicting the binding site and binding pose for ligand-RNA
      binding.'
  rm2target:
    description: Hosts regulatory relationships between writers, erasers and readers of RNA modifications
      and their target genes for nine RNA modifications in human and mouse
    was: A comprehensive database for targets of writers, erasers and readers of RNA modifications.
  rmat:
    description: Parses and merges Affymetrix BPMAP and CEL tiling array files, normalizes arrays using
      sequence-specific models, and detects enriched regions from ChIP-chip experiments
    was: This package is an R version of the package MAT and contains functions to parse and merge Affymetrix
      BPMAP and CEL tiling array files (using C++ based Fusion SDK and BioConductor package affxparser),
      normalize tiling arrays using sequence specific models, detect enriched regions from ChIP-chip experiments.
  rmotif:
    description: Discovers and analyzes regulatory motifs in promoter sequences to study their effects
      on mRNA transcription
    was: Tools for the discovery of de-novo, fully, or partially characterized regulatory motifs including
      transcription factor binding sites (TFBS).
  rna-targeting:
    description: Predicts CasRx guide efficiency for human and mouse RefSeq genes and enables custom sequence
      input for guide design
    was: 'Here, we have predicted CasRx guide efficiency for all human and mouse RefSeq genes.

      We have also enabled custom sequence input for CasRx guide design.'
  rna_analyzer:
    description: Screens RNA sequences for known structural motifs and functional elements using consensus
      templates and folding analysis
    was: Searches for known structures and identifies RNA motifs in your input sequence.
  rnabindr:
    description: Identifies and displays RNA-binding residues in known complexes and predicts them in
      proteins of unknown structure using a Naive Bayes classifier
    was: A server for analyzing and predicting RNA binding sites in proteins.
  rnbeads:
    description: Analyzes DNA methylation data from any single-CpG-resolution protocol
    was: An R package for comprehensive analysis of DNA methylation data obtained with any experimental
      protocol that provides single-CpG resolution.
  robocop:
    description: Integrates nucleotide sequence and chromatin accessibility data to compute genome-wide
      probabilistic occupancy of nucleosomes and transcription factors
    was: Multivariate state space model that integrates nucleotide sequence and chromatin accessibility
      data (currently uses only with MNase-seq or ATAC-seq) to compute genome-wide probabilistic occupancy
      landscape of nucleosomes and transciption factors (collectively known as DNA-binding factors or
      DBFs).
  rpmcmc:
    description: Discovers diverse motifs from large sequence sets using a repulsive parallel MCMC algorithm
    was: A parallel MCMC algorithm for discovering diverse motifs from large sequence sets.
  rsat:
    description: Detects regulatory signals in non-coding sequences through pattern discovery, matching,
      and sequence retrieval tools
    was: Regulatory Sequence Analysis Tools (RSAT) is a software suite combining specialised tools for
      the detection of regulatory signals in non-coding sequences. It includes tools for sequence retrieval,
      pattern discovery, pattern matching, genome-scale pattern matching, feature-map drawing, random
      sequence generation and other utilities. Tools may be accessed separately or connected to other
      tools. As well, the tools are available as web services for integration into programmatic work flows.
  rsat-retrieve-ensembl-seq:
    description: Retrieves upstream, downstream, intronic, exonic, UTR, transcript, mRNA, CDS or gene
      sequences from Ensembl for single or multiple genomes
    was: 'Returns upstream, downstream, intronic, exonic, UTR, transcript, mRNA, CDS or gene sequences
      for a list of genes from the EnsEMBL database.

      Multi-genome queries are supported: automatic retrieval of sequences for all the orthologs of the
      query genes, at a given taxonomical level.'
  rsat_peak-motifs:
    description: Combines motif discovery algorithms to extract transcription factor binding motifs from
      ChIP-seq or ChIP-X peak collections
    was: A workflow combining a series of time- and memory-efficient motif analysis tools to extract motifs
      from full-size collections of peaks as generated by ChIP-seq, ChIP-chip or other ChIP-X technologies.
  rseg_chipseq:
    description: Identifies boundaries of epigenomic domains from ChIP-Seq data for diffusive histone
      modifications, incorporating a control sample and enabling differential analysis between two samples
    was: Analyzes ChIP-Seq data, especially for identifying genomic regions and their boundaries marked
      by diffusive histone modification markers, such as H3K36me3 and H3K27me3. It can be used to find
      regions with differential histone modifications patterns, either comparsion between two cell types
      or between two kinds of histone modifications.
  rsnet:
    description: Infers gene regulatory networks by silencing redundant interactions and enhancing network
      structure from gene expression data
    was: Inferring gene regulatory networks by a redundancy silencing and network enhancement technique.
  rsnp_guide:
    description: Documents the influence of mutations in regulatory gene regions on transcription factor
      binding to DNA
    was: A system of databases documenting the influence of mutations in regulatory gene regions.
  rtnduals:
    description: Searches for statistically significant co-regulatory loops between regulon pairs by comparing
      shared targets to infer dual regulons
    was: RTNduals is a tool that searches for possible co-regulatory loops between regulon pairs generated
      by the RTN package. It compares the shared targets in order to infer 'dual regulons', a new concept
      that tests whether regulon pairs agree on the predicted downstream effects.
  rtnsurvival:
    description: Integrates regulon activity profiles from the RTN package with survival data using two-tailed
      GSEA and Cox regression
    was: It is a tool for integrating regulons generated by the RTN package with survival information.
      For a given regulon, the 2-tailed GSEA approach computes a differential Enrichment Score (dES) for
      each individual sample, and the dES distribution of all samples is then used to assess the survival
      statistics for the cohort.
  rtrm:
    description: Identifies transcriptional regulatory modules by integrating TF binding, gene expression,
      and protein-protein interaction data
    was: Identifies transcriptional regulatory modules (TRMs) from protein-protein interaction networks.
  rtrmui:
    description: Computes transcriptional regulatory modules via a web interface
    was: This package provides a web interface to compute transcriptional regulatory modules with rTRM.
  rvista:
    description: Combines TFBS predictions, sequence comparisons and cluster analysis to identify evolutionarily
      conserved noncoding DNA regions in genomic sequences
    was: This tool combines TFBS predictions, sequence comparisons and cluster analysis to identify noncoding
      DNA regions that are evolutionarily conserved and present in a specific configuration within genomic
      sequences. The newly developed version 2.0 of the tool can process alignments generated by both
      the zPicture and blastz alignment programs or use pre-computed pairwise alignments of several vertebrate
      genomes available from the ECR Browser and GALA database.
  s-mart:
    description: Manages and analyses mapped RNA-Seq data through a graphical interface
    was: This tool manages your RNA-Seq and ChIP-seq data.
  s3v2-ideas:
    description: Normalizes, denoises, and integrates epigenomic bigWig data across cell types for genome
      segmentation or master peak calling
    was: 'a package for normalizing, denoising and integrating epigenomic datasets across different cell
      types.


      In the package, it can first normalize average read counts signal by S3norm ver2 and then use IDEAS
      to either to do genome segmentations or to call master peaks list across multiple datasets. This
      package will use bigWig file as input files.'
  sacsann:
    description: Predicts A/B compartment annotations from genomic sequence features using stacked artificial
      neural networks
    was: 'identifying sequence-based determinants of chromosomal compartments.


      Sequence-based predictor of chromosomal compartments.


      The ''Sequence-based Annotator of Chromosomal Compartments by Stacked Artificial Neural Networks''
      or SACSANN is a machine learning approach to predicting A/B compartment annotations using only features
      derived from a reference genome. SACSANN has been tested on both Linux and MacOS environments.'
  sadmama:
    description: Detects significant variation in binding affinity between two sequence sets using a known
      position weight matrix
    was: Computational detection of significant variation in binding affinity across two sets of sequences.
      The binding sites are modeled as matches to a, possibly gapped, position weight matrix (PWM) which
      is presumed to be known.
  sailer:
    description: Learns low-dimensional latent representations of single-cell ATAC-seq data invariant
      to confounding factors like read depth and batch effects
    was: Scalable and Accurate Invariant Representation Learning for Single-Cell ATAC-Seq Processing and
      Integration.
  sampdi-3d:
    description: Predicts change in protein-DNA binding free energy from mutations in both the protein
      and DNA using gradient boosting decision trees
    was: SAMPDI-3D uses a gradient boosting decision tree machine learning algorithm with features as
      physicochemical properties, structure of mutation site and protein-DNA interactions to predict the
      change of binding free energy.
  samscope:
    description: Lightweight viewer for SAM/BAM files that displays coverage, allele frequency, and ChIP-seq
      polarity across large datasets using OpenGL acceleration
    was: Lightweight SAM/BAM file viewer that makes visually exploring NGS data intuitively. It uses multiple
      layers to simultaneously (or sequentially) view SAM/BAM related features like coverage or allele
      frequency, or ChIP-SEQ features like polarity from as many files as you like. The paging-friendly
      binary file layout makes it feasible to browse data sets far larger than the system's available
      RAM.
  samselect:
    description: Selects a sample sequence set from large DNA datasets to accelerate quorum planted motif
      search
    was: Solver for sample sequence selection from large DNA datasets for quorum planted motif search
  sanpolya:
    description: Identifies polyadenylation signals in human and mouse genomes using a deep neural network
    was: 'a deep learning method for identifying Poly(A) signals.


      Polyadenylation plays a regulatory role in transcription. The recognition of polyadenylation signal
      (PAS) motif sequence is an important step in polyadenylation. In the past few years, some statistical
      machine learning-based and deep learning-based methods have been proposed for PAS identification.
      Although these methods predict PAS with success, there is room for their improvement on PAS identification.'
  sapphire:
    description: Predicts σ70 promoters in Pseudomonas using a neural network classifier
    was: 'a neural network based classifier for σ70 promoter prediction in Pseudomonas.


      Sequence Analyser for the Prediction of Prokaryote Homology Inferred Regulatory Elements.


      For sequences longer than 5k basepairs, it is advisable to download SAPPHIRE and run it locally.'
  satori:
    description: Infers cooperativity between regulatory elements in genomic sequences using a self-attention
      deep learning model
    was: 'A Self-Attention Model for Inferring Cooperativity between Regulatory Features.


      SATORI is a Self-ATtentiOn based deep learning model to capture Regulatory element Interactions
      in genomic sequences. It can be used to infer a global landscape of interactions in a given genomic
      dataset, without a computationally-expensive post-processing step.'
  sbbadger:
    description: Generates synthetic biochemical reaction networks with user-defined degree distributions
      and kinetic formalisms for benchmarking
    was: Biochemical Reaction Networks with Definable Degree Distributions.
  sbsa:
    description: Annotates altered binding motifs and sequences for genomic variants including somatic
      mutations, SNPs, and RNA editing
    was: An online service for somatic binding sequence annotation.
  sc-maestro:
    description: Integrates single-cell RNA-seq and ATAC-seq data with preprocessing, alignment, QC, quantification,
      clustering, differential analysis, and cell-type annotation
    was: 'Integrative analyses of single-cell transcriptome and regulome using MAESTRO.


      MAESTRO(Model-based AnalysEs of Single-cell Transcriptome and RegulOme) is a comprehensive single-cell
      RNA-seq and ATAC-seq analysis suit built using snakemake.


      Benchmark codes used in MAESTRO paper.


      We provided the codes used in evaluating scATAC-seq clustering, automatic cell-type annotation,
      integration between scRNA-seq and scATAC-seq using different methods, and integration evaluation
      using different peak-RP model in this repository.'
  scATAC-pro:
    description: Processes raw FASTQ files into peak-by-cell count matrices and performs downstream analysis
      for single-cell ATAC-seq data
    was: 'a comprehensive workbench for single-cell chromatin accessibility sequencing data.


      single cell ATAC-seq processing pipeline.


      scATAC-pro incorporates two main steps, preprocessing and downstream analysis. The preprocessing
      step takes raw fastq files as input and outputs peak-by-cell count matrix. It consists of demultiplexing,
      adaptor trimming, mapping, peak calling, cell calling, signal generating and quality controlling
      modules. The downstream analysis is comprised of dimension reduction, cell clustering, differential
      accessibility analysis, TF motif enrichment analysis and footprinting analysis. We provide flexible
      options for most of the modules.


      A comprehensive pipeline for single cell ATAC-seq data processing and analysis'
  scATAC-seq:
    description: Benchmarks 10 computational methods for processing and featurizing single-cell ATAC-seq
      data to discriminate cell types
    was: 'Assessment of computational methods for the analysis of single-cell ATAC-seq data.


      ATAC-seq Data Standards and Prototype Processing Pipeline – ENCODE.


      ATAC-seq Data Standards and Prototype Processing Pipeline.


      The Assay for Transposase-Accessible Chromatin followed by sequencing (ATAC-seq) experiment provides
      genome-wide profiles of chromatin accessibility. Briefly, the ATAC-seq method works as follows:
      loaded transposase inserts sequencing primers into open chromatin sites across the genome, and reads
      are then sequenced. The ends of the reads mark open chromatin sites.


      In its current form, the ATAC-seq pipeline is a prototype and will likely undergo substantial change
      within the next year'
  scGraph2Vec:
    description: Embeds genes from single-cell omics data using a deep generative model augmented by a
      graph neural network
    was: a deep generative model for gene embedding augmented by Graph Neural Network and single-cell
      omics data
  scMNase-seq:
    description: Profiles nucleosome position and chromatin accessibility genome-wide in single cells
      using scMNase-seq
    was: 'Genome-wide profiling of nucleosome position and chromatin accessibility in single cells using
      scMNase-seq.


      This repository includes codes for data analysis in scMNase paper'
  scai:
    description: Integrates gene expression and chromatin accessibility or DNA methylation profiles measured
      in the same individual cells using unsupervised iterative learning
    was: scAI is an unsupervised approach for integrative analysis of gene expression and chromatin accessibility
      or DNA methylation proflies measured in the same individual cells.
  scamace:
    description: Jointly clusters single-cell chromatin accessibility, gene expression, and methylation
      data using a model-based approach
    was: scAMACE (integrative Analysis of single-cell Methylation, chromatin ACcessibility, and gene Expression).
      Python implementation (both CPU and GPU version) to a model-based approach to the joint analysis
      of single-cell data on chromatin accessibility, gene expression and methylation.
  scan-atac:
    description: Simulates single-cell ATAC-seq data by down-sampling bulk ATAC-seq experiments with known
      cell-type labels
    was: A scalable and efficient method for simulating single-cell ATAC-seq data from bulk-tissue experiments.
  scan_db:
    description: Integrates and presents single-cell and spatial transcriptome data from the nervous system
      for interactive exploration
    was: SCAN is a neural database that combines single cell transcriptome and spatial transcriptome data.
  scanmot:
    description: Searches for similar sequences by simultaneous matching of multiple motifs with inter-motif
      spacing constraints
    was: SCANMOT is a sequence similarity searching tool that adds the additional constraints of simultaneous
      matching of multiple motifs.
  scapa:
    description: Analyzes alternative polyadenylation patterns from 10x 3' tag single-cell RNA-seq BAM
      files and cell clustering results
    was: Cell-type-specific analysis of alternative polyadenylation using single-cell transcriptomics
      data | This is a package and a shell script for alternative polyadenylation (APA) analysis of 3'
      tag single-cell RNA-seq data | This is a package and a shell script for alternative polyadenylation
      (APA) analysis of 3' tag single-cell RNA-seq data. The shell script "scAPAscript.R" takes as input
      BAM files generated by 10x 3' tag RNA seq pipline and the results of cell clustering
  scapatrap:
    description: Identifies and quantifies alternative polyadenylation sites from 3' tag single-cell RNA-seq
      data without requiring prior genome annotation
    was: 'This is a package and a shell script for alternative polyadenylation (APA) analysis of 3'' tag
      single-cell RNA-seq data. The shell script "scAPAscript.R" takes as input BAM files generated by
      10x 3'' tag RNA seq pipline and the results of cell clustering.


      Alternative polyadenylation (APA) has been indicated to play an important role in regulating mRNA
      stability, translation and localization.


      Fasta and chromosome length files for human (hg19) or (and) mouse (mm10).'
  scapture:
    description: Identifies, evaluates, and quantifies cleavage and polyadenylation sites from 3' tag-based
      single-cell RNA-seq using deep learning
    was: A deep learning-embedded pipeline that captures polyadenylation information from 3 prime tag-based
      RNA-seq of single cells
  scatacpipe:
    description: Performs comprehensive single-cell ATAC-seq analyses including preprocessing, peak calling,
      and downstream interpretation via a Nextflow pipeline
    was: A nextflow pipeline for comprehensive and reproducible analyses of single cell ATAC-seq data.
  scatanno:
    description: Automatically annotates single-cell ATAC-seq data using reference atlases with uncertainty
      scores, without relying on scRNA-seq data
    was: scATAnno is a Python package that automatically annotates single-cell ATAC-seq data using reference
      atlases, integrating query data without relying on scRNA-seq data. It generates reference atlases
      from publicly available datasets and incorporates uncertainty scores to improve annotation accuracy.
  scawmv:
    description: Integrates parallel scRNA-seq and scATAC-seq data from the same cells using adaptively
      weighted multi-view learning to generate low-dimensional representations
    was: An adaptively weighted multi-view learning framework for the integrative analysis of parallel
      scRNA-seq and scATAC-seq data.
  scbasset:
    description: Models single-cell ATAC-seq data using convolutional neural networks to learn sequence
      features
    was: Sequence-based modeling of single-cell ATAC-seq using convolutional neural networks.
  scblood:
    description: Catalogs single-cell ATAC-seq data from blood cells across tissues and diseases with
      search, analysis, and visualization tools
    was: scBlood is a comprehensive database cataloging single-cell accessible chromatin sequencing (scATAC-seq)
      data from blood cells across various tissues and disease types. It provides a user-friendly interface
      for searching, analyzing, and visualizing scATAC-seq data.
  scenhancer:
    description: Provides single-cell enhancer annotation and enhancer-gene interactions across hundreds
      of tissue/cell types in human, mouse, and fly
    was: The database provides single-cell enhancer annotation in three species, including human (hg19),
      mouse (mm9), and fly (dm3).
  scenic:
    description: Reconstructs gene regulatory networks and identifies cell states from single-cell RNA-seq
      data
    was: A computational method for simultaneous gene regulatory network reconstruction and cell-state
      identification from single-cell RNA-seq data.
  scenicplus:
    description: Builds gene regulatory networks from combined or separate single-cell gene expression
      and chromatin accessibility data
    was: SCENIC+ is a python package to build gene regulatory networks (GRNs) using combined or separate
      single-cell gene expression (scRNA-seq) and single-cell chromatin accessibility (scATAC-seq) data.
  scepisearch:
    description: Matches queried single-cell open-chromatin profiles to reference single-cell transcriptomes
      and epigenomes for annotation and classification
    was: Matching queried single-cell open-chromatin profiles to large pools of single-cell transcriptomes
      and epigenomes for reference supported analysis.
  scepitools:
    description: Interrogates analytic tools for single-cell epigenomic data
    was: Database to comprehensively interrogate analytic tools for single-cell epigenomic data.
  scertf:
    description: Catalogs over 1,200 benchmarked position weight matrices for yeast transcription factors,
      enabling identification of transcription factors from input sequences or matrices
    was: ScerTF catalogs over 1,200 position weight matrices (PWMs) for 196 different yeast transcription
      factors. ScerTF is useful for a wide range of problems, such as linking regulatory sites with transcription
      factors, identifying a transcription factor based on a user-input matrix, finding the genes bound/regulated
      by a particular TF, and finding regulatory interactions between transcription factors.
  scgrn:
    description: Catalogs cell type-specific gene regulatory networks inferred from single-cell multi-omics
      data for human and mouse
    was: Comprehensive single-cell gene regulatory network platform of human and mouse.
  scgrnom:
    description: Predicts cell-type disease genes and regulatory networks from single-cell multi-omics
      data
    was: A computational pipeline of integrative multi-omics analyses for predicting cell-type disease
      genes and regulatory networks.
  sci-l3:
    description: Pipeline for single-cell combinatorial indexing with linear amplification, enabling high-throughput
      sequencing of genome conformation, RNA, and chromatin accessibility
    was: sci-L3Pipe is a software pipeline for single-cell combinatorial indexing with linear amplification,
      enabling high-throughput sequencing of various modalities like genome conformation capture and RNA/chromatin
      accessibility. The pipeline builds upon the sci-L3 method, extending it to new applications with
      minimal modifications.
  sciddo:
    description: Detects differential chromatin domains from chromatin state segmentation maps
    was: 'Fast detection of differential chromatin domains with SCIDDO.


      The generation of genome-wide maps of histone modifications using chromatin immunoprecipitation
      sequencing is a standard approach to dissect the complexity of the epigenome. Interpretation and
      differential analysis of histone datasets remains challenging due to regulatory meaningful co-occurrences
      of histone marks and their difference in genomic spread. To ease interpretation, chromatin state
      segmentation maps are a commonly employed abstraction combining individual histone marks. We developed
      the tool SCIDDO as a fast, flexible and statistically sound method for the differential analysis
      of chromatin state segmentation maps. RESULTS:We demonstrate the utility of SCIDDO in a comparative
      analysis that identifies differential chromatin domains (DCD) in various regulatory contexts and
      with only moderate computational resources'
  scimet-cap:
    description: Enables high-throughput single-cell methylation analysis with reduced sequencing burden
      via target enrichment for cell type assignment and DMR calling
    was: sciMET-cap is a software resource enabling high-throughput single-cell methylation analysis with
      a reduced sequencing burden by leveraging target enrichment. It enables cell type assignment and
      genome-wide differentially methylated region (DMR) calling with fewer sequencing reads.
  sciope:
    description: Performs machine-learning-assisted inference and model exploration by large-scale parameter
      sweeps for discrete stochastic models of gene regulatory networks
    was: 'Scalable machine learning-assisted model exploration and inference using Sciope.


      Scalable inference, optimization and parameter exploration (sciope) is a Python 3 package for performing
      machine learning-assisted inference and model exploration by large-scale parameter sweeps. Please
      see the documentation for examples.'
  sclc:
    description: Integrates pharmacogenomic and epigenomic data from major SCLC cell line sources for
      translational research
    was: SCLC CellMiner Cross Database (SclcCellMinerCDB) allows translational researchers to conduct
      analyses across all major SCLC cancer cell line pharmacogenomic data sources from NCI, Sanger GDSC,
      and Broad CCLE/CTRP.
  sclink:
    description: Infers sparse gene co-expression networks from single-cell expression data using statistical
      network modeling
    was: 'Inferring Sparse Gene Co-expression Networks from Single-cell Expression Data.


      scLink: Inferring gene networks from single-cell gene expression data.'
  scmega:
    description: Infers gene regulatory networks from single-cell multi-omic data by integrating modalities,
      associating enhancers to promoters, and analyzing trajectories
    was: Single-cell multi-omic enhancer-based gene regulatory network inference.
  scmethbank:
    description: Provides browse, search, visualization and download of single-cell DNA methylation maps
      for human and mouse
    was: A database of single-cell methylation maps for human and mouse.
  scmlnet:
    description: Constructs inter- and intracellular multilayer signaling networks from single-cell RNA-seq
      data by integrating ligand-receptor interactions, receptor-TF pathways, and TF-target gene interactions
    was: 'Inferring microenvironmental regulation of gene expression from single-cell RNA sequencing data
      using scMLnet with an application to COVID-19.


      scMLnet is an R package developed to construct inter-/intracellular multilayer singaling network
      based on single-cell RNA-seq expression data. scMLnet constructs the multilayer network by integrating
      intercellular pathways (ligand-receptor interactions) and intracellular subnetworks (receptor-TF
      pathways and TF-target gene interactions) based on cell-type specific gene expression, prior network
      information and statistical inference. scMLnet can also visualize the constructed inter-/intracellular
      signaling pathways between the central cell and neighboring cells. scMLnet is implemented using
      R (version 3.6.0) and Python (version 3.7).'
  scmomentum:
    description: Infers gene regulatory networks and reconstructs developmental energy landscapes from
      single-cell RNA-seq data
    was: 'Inference of Cell-Type-Specific Regulatory Networks and Energy Landscapes.


      A method to infer Gene Regulatory Networks (GRNs) and reconstruct developmental energy landscapes
      directly from single-cell RNA-seq data.'
  scnet-genes:
    description: Benchmarks single-cell gene regulatory network inference algorithms based on their reproducibility
      across independent datasets
    was: scNET is a tool for evaluating the reproducibility of single-cell gene regulatory network inference
      algorithms. Here three single-cell network inference algorithms is benchamrk based on their reproducibility,
      i.e. their ability to infer similar networks once applied to two independent datasets from the same
      biological condition.
  scnucmap:
    description: Maps nucleosome landscapes from single-cell MNase-seq data and infers regulatory networks
    was: scNucMap is a computational tool designed to analyze single-cell micrococcal nuclease sequencing
      (scMNase-seq) data for mapping nucleosome landscapes. It demonstrates superior performance in cell
      clustering and regulatory network inference compared to existing methods.
  scoit:
    description: Extracts cell, gene, and omic embeddings from single-cell multiomic tensors using probabilistic
      decomposition
    was: Probabilistic tensor decomposition extracts better latent embeddings from single-cell multiomic
      data.
  scope:
    description: Identifies potential regulatory motifs de novo from sets of coordinately regulated genes
      using a parameter-free ensemble method
    was: Set of programs aimed at identifying novel cis-regulatory elements from groups of upstream sequences.
      It does not have any nuisance parameters so does not require the user to guess what the results
      might be. It is also very robust to noisy data and is still 50% as accurate even in the presence
      of 4-fold noise. It can also identify other genes in the genome that might be coregulated with the
      original gene set.
  scorpion:
    description: Reconstructs comparable gene regulatory networks from single-cell RNA-seq data using
      a message-passing algorithm for population-level comparisons
    was: SCORPION is an R package that reconstructs comparable gene regulatory networks from single-cell
      RNA sequencing data using a message-passing algorithm, enabling population-level comparisons by
      leveraging shared priors.
  scour:
    description: Predicts metabolite-dependent regulatory interactions from metabolic data using a stepwise
      machine learning framework
    was: A stepwise machine learning framework for predicting metabolite-dependent regulatory interactions.
  scplant:
    description: Analyzes plant single-cell transcriptomic data with functions for processing, annotation,
      trajectory inference, cross-species integration, and gene regulatory network construction
    was: A versatile framework for single-cell transcriptomic data analysis in plants.
  scpower:
    description: Designs and performs power analysis for cell type-specific interindividual differential
      expression and eQTL studies using single cell RNA-seq data
    was: scPower is a R package for design and power analysis of cell type specific interindividual DE
      and eQTL studies using single cell RNA-seq. It enables the user to calculate the power for a given
      experimental setup and to choose for a restricted budget the optimal combination of experimental
      parameters which maximizes the power. Necessary experimental priors, e.g. effect sizes and expression
      distributions, can be taken from example data sets, saved in the package, or estimated from new
      data sets. The tool was evaluated with data from different tissues and single cell technologies,
      based on UMI counts and read counts.
  scprisma:
    description: Infers, filters and enhances periodic and linear topological signals from single-cell
      data using spectral template matching
    was: Inference, filtering and enhancement of periodic signals in single-cell data using spectral template
      matching.
  scpsrm:
    description: Searches for clusters of CDK consensus motifs in protein sequences
    was: Cyclin-dependent kinase (CDK) consensus motifs are frequently clustered in CDK substrate proteins.
      This tool contains the scripts used to search for CDK clusters.
  scrat:
    description: Summarizes regulatory activities by features like gene sets and transcription factor
      binding motifs from single-cell regulome data
    was: Single-cell regulome data analysis.
  scregclust:
    description: Reconstructs cellular regulatory programs from single-cell RNA-seq data by dividing target
      genes into modules and predicting key transcription factors and kinases
    was: scregclust is an R package that reconstructs cellular regulatory programs from single-cell RNA
      sequencing (scRNA-seq) data, facilitating the exploration of regulatory programs underlying cell
      plasticity and identifying critical regulators in nervous system cancers.
  scsgl:
    description: Infers signed gene regulatory networks from single-cell RNA-seq data using graph signal
      processing
    was: Graph signal processing based signed graph learning for gene regulatory inference from single
      cell RNA-seq data.
  sctail:
    description: Detects polyadenylation sites from first-strand reads in 3' scRNA-seq data and quantifies
      alternative PAS usage
    was: scTail is a computational method for detecting polyadenylation sites (PAS) using first-strand
      reads in 3' scRNA-seq data, enabling the quantification of alternative PAS usage. It can be combined
      with BRIE2 to discover differential alternative PAS usage in biological processes like cancer and
      development.
  sctenifoldknk:
    description: Performs virtual knockout experiments on single-cell gene regulatory networks using scRNA-seq
      data from wild-type samples
    was: scTenifoldKnk is a machine learning workflow performing virtual knockout experiments on single-cell
      gene regulatory networks. It is a R/MATLAB package to perform virtual knockout experiments on single-cell
      gene regulatory networks. scTenifoldKnk is a machine learning workflow that performs virtual knockout
      experiments using single-cell RNA sequencing (scRNAseq) data from wild-type (WT) control samples
      as input. Constructs a single-cell gene regulatory network (scGRN) and knocks out a target gene
      from the adjacency matrix of the WT scGRN by setting the gene’s outdegree edges to zero. scTenifoldKnk
      then compares the knocked out scGRN with the WT scGRN to identify differentially regulated genes,
      called virtual-knockout perturbed genes, which are used to assess the impact of the gene knockout
      and reveal the gene’s function in the analyzed cells.
  sctenifoldnet:
    description: Constructs and compares single-cell gene regulatory networks from scRNA-seq data using
      principal component regression, tensor decomposition, and manifold alignment
    was: 'a machine learning workflow for constructing and comparing transcriptome-wide gene regulatory
      networks from single-cell data.


      Construct and Compare scGRN from Single-Cell Transcriptomic Data.


      A R/MATLAB package to construct and compare single-cell gene regulatory networks (scGRNs) using
      single-cell RNA-seq (scRNA-seq) data collected from different conditions based on machine learning
      methods. scTenifoldNet uses principal component regression, tensor decomposition, and manifold alignment,
      to accurately identify even subtly shifted gene expression programs.


      A workflow based on machine learning methods to construct and compare single-cell gene regulatory
      networks (scGRN) using single-cell RNA-seq (scRNA-seq) data collected from different conditions.'
  sdda:
    description: Searches for transcription factor binding sites in DNA sequences using a stochastic dictionary
      model that detects multiple motif types, gapped motifs, and optimal motif width
    was: Program that uses a stochastic dictionary model to search for transcription factor binding sites
      (motifs) in DNA sequences. The algorithm is capable of detecting multiple motif sites of multiple
      types, gapped motifs, finding the optimal motif width, and calculating motif significance through
      a MAP score and the Bayes factor using computational methods.
  sea-archive:
    description: Integrates super-enhancers from multiple species and annotates their roles in cell identity
      gene expression regulation
    was: Super-Enhancer Archive. Integrates super-enhancers in multiple species and annotates their potential
      roles in the regulation of cell identity gene expression.
  seanalysis:
    description: Analyzes super-enhancer regulatory networks for human and mouse, including TF regulation,
      pathway analysis, and SNP annotation
    was: Comprehensive super-enhancer regulatory network analysis tool for human and mouse.
  seatac:
    description: Detects differential chromatin accessibility from ATAC-seq data using a conditional variational
      autoencoder model
    was: Tool for exploring the chromatin landscape and the role of pioneer factors.
  sedb_2.0:
    description: Provides a comprehensive resource of super-enhancers with epigenetic annotations for
      human and mouse
    was: A comprehensive super-enhancer database of human and mouse.
  seesawpred:
    description: Predicts cell-fate determinants from transcriptomics data using a gene regulatory network
      model
    was: A Web Application for Predicting Cell-fate Determinants in Cell Differentiation
  segcond:
    description: Predicts putative transcriptional condensate-associated genomic regions by integrating
      multi-omics data including Hi-C
    was: SEGCOND predicts putative transcriptional condensate-associated genomic regions by integrating
      multi-omics data.
  segene:
    description: Identifies links between super enhancers and gene expression across cell types using
      peak-to-gene links analysis
    was: SEgene is a platform designed to identify links between super enhancers and gene expression across
      cell types. It utilizes the peak-to-gene links approach to facilitate the identification of super-enhancers
      functionally linked to transcriptional activity, providing analytical tools for evaluating super-enhancers
      as potential therapeutic targets.
  segtools:
    description: Explores and summarizes genomic segmentations from ChIP-seq or annotation data
    was: Tools for exploratory analysis of genomic segmentations.
  segway:
    description: Segments the genome at 1-bp resolution from multiple functional genomics tracks using
      a dynamic Bayesian network
    was: Novel method for analyzing multiple tracks of functional genomics data which uses a dynamic Bayesian
      network (DBN) model, which enables it to analyze the entire genome at 1-bp resolution even in the
      face of heterogeneous patterns of missing data. This method is the first application of DBN techniques
      to genome-scale data and the first genomic segmentation method designed for use with the maximum
      resolution data available from ChIP-seq experiments without downsampling.
  selansi:
    description: Simulates stochastic gene regulatory networks using a semi-Lagrangian method to approximate
      the Chemical Master Equation
    was: Simulation of stochastic multidimensional Gene Regulatory Networks (GRNs).
  selex:
    description: Quantifies DNA binding specificities from SELEX-seq data
    was: Tools for quantifying DNA binding specificities based on SELEX-seq data.
  semanticbi:
    description: Predicts transcription factor-DNA binding intensities using a CNN-RNN model trained on
      protein binding microarray data
    was: 'Quantifying intensities of transcription factor-DNA binding by learning from an ensemble of
      protein binding microarrays.


      SemanticBI: prediction of DNA-TF binding intensities (trained on DREAM5 PBM data sets).'
  semanticcs:
    description: Learns DNA sequence representations from ChIP-seq datasets to predict transcription factor
      binding specificities
    was: 'Learning useful representations of DNA sequences from ChIP-seq datasets for exploring transcription
      factor binding specificities.


      SemanticCS: prediction of TF-DNA binding probability (trained on ChIP-seq datasets).'
  seme:
    description: Discovers de novo DNA motifs by simultaneously learning sequence, position, and sequence
      rank preferences using expectation maximization without prior knowledge
    was: A de novo motif discovery algorithm  which uses pure probabilistic mixture model to model the
      motif’s binding features and uses expectation maximization (EM) algorithms to simultaneously learn
      the sequence motif, position, and sequence rank preferences without asking for any prior knowledge
      from the user.
  semplme:
    description: Integrates DNA methylation effects into transcription factor binding affinity predictions
      using ChIP-seq and whole genome bisulfite sequencing data
    was: "A tool for integrating DNA methylation effects in transcription factor binding affinity predictions.\n\
      \nImplementation of the SEMplMe algorithm to integrate SEMpl with methylation data.\n A tool for\
      \ integrating DNA methylation effects in transcription factor binding affinity predictions"
  senies:
    description: Predicts enhancers and their strength from DNA sequences using deep learning with DNA
      shape features
    was: SENIES is a deep learning based two-layer predictor for enhancing the identification of enhancers
      and their strength by utilizing DNA shape information beyond two common sequence-derived features,
      namely kmer and one-hot.
  sepira:
    description: Infers sample-specific transcription factor activity from genome-wide expression or DNA
      methylation profiles
    was: Systems EPigenomics Inference of Regulatory Activity is an algorithm that infers sample-specific
      transcription factor activity from the genome-wide expression or DNA methylation profile of the
      sample.
  seprom:
    description: Predicts prokaryotic promoters from DNA sequences using structural and energetic parameters
    was: 'A novel method SEProm for prokaryotic promoter prediction based on DNA structure and energetics.


      Supercomputing Facility for Bioinformatics & Computational Biology, IIT Delhi.


      We are the Providers of Genome Analysis Software , Protein structure prediction tool, In-sillico
      Drug design software, drug discovery, Bioinformatics, Bioinformatics, algorithms for Genome analysis,
      active site directed Drug Design, gene to drug, Bioinformatics and computational Biology facility,
      super computer access, research and development in bioinformatics, computational pathways for life
      sciences in India.'
  seqacademy:
    description: Provides a Jupyter notebook-based educational pipeline for RNA-Seq and ChIP-Seq analysis
      with no prior programming experience required
    was: Jupyter notebook-based educational pipeline for RNA-Seq and epigenomic data analysis. Easy-to-use
      tutorial that outlines the complete RNA-Seq and ChIP-Seq analysis workflow and requires no prior
      programming experience.
  seqbox:
    description: Runs RNA-seq and ChIP-seq analysis pipelines on a consumer mini-PC using Docker containers
      with a graphical interface
    was: Cheap, efficient and reproducible RNAseq/ChIPseq hardware/software solution based on NUC6I7KYK
      mini-PC (an Intel consumer game computer with a fast processor and a high performance SSD disk),
      and Docker container platform.
  seqcode:
    description: Analyzes and visualizes high-throughput sequencing data with quality control, read mapping,
      peak calling, and counting
    was: Productive visualization of high-throughput sequencing data using the SeqCode open portable platform.
  seqlogo:
    description: Plots a sequence logo from a DNA sequence motif's position weight matrix
    was: This tool takes the position weight matrix of a DNA sequence motif and plots the corresponding
      sequence logo as introduced by Schneider and Stephens (1990).
  seqminer:
    description: Compares and integrates multiple ChIP-seq datasets, extracting qualitative and quantitative
      information with visualization and pattern modelling
    was: An integrated platform for ChIP-Seq data interpretation. SeqMINER allows comparison and integration
      of multiple ChIP-seq datasets and extraction of qualitative as well as quantitative information.
      It also allows visualization and modelling of general as well as specific patterns in a given dataset.
  seqpattern:
    description: Visualises oligonucleotide patterns and sequence motif occurrences across sequences centred
      at a common reference point and sorted by a user-defined feature
    was: Visualising oligonucleotide patterns and sequence motifs occurrences across a large set of sequences
      centred at a common reference point and sorted by a user defined feature.
  seqplots:
    description: Plots NGS signal tracks and motif density profiles over user-specified genomic features
      via a GUI or R package
    was: Tool for plotting NGS based experiments' signal tracks, e.g. reads coverage from ChIP-seq, RNA-seq
      and DNA accessibility assays like DNase-seq and MNase-seq, over user specified genomic features,
      e.g. promoters, gene bodies, etc. It can also calculate sequence motif density profiles from a reference
      genome.
  seqsetvis:
    description: Visualizes and analyzes multiple genomic datasets from BED, bigWig, or BAM files
    was: seqsetvis enables the visualization and analysis of multiple genomic datasets. Although seqsetvis
      was designed for the comparison of mulitple ChIP-seq datasets, this package is domain-agnostic and
      allows the processing of multiple genomic coordinate files (bed-like files) and signal files (bigwig
      files or bam pileups).
  seqsim:
    description: Compares promoter regions genome-wide using an optimized Needleman-Wunsch algorithm to
      identify homology clusters and conserved motifs
    was: SEQSIM is a sequence comparison tool leveraging an optimized Needleman-Wunsch algorithm for high-speed
      comparisons of promoter regions. It facilitates genome-wide analysis and identification of homology
      clusters, revealing potential co-regulatory networks and conserved motifs.
  seqsite:
    description: Pinpoints transcription factor binding sites from ChIP-seq data by first detecting binding
      regions and then modeling tag profiles to locate individual sites
    was: SeqSite is an efficient and easy-to-use software tool implementing a novel method for identifying
      and pinpointing transcription factor binding sites. It first detects transcription factor binding
      regions by clustering tags and statistical hypothesis testing, and locates every binding site in
      detected binding regions by modeling the tag profiles. It can pinpoint closely spaced adjacent binding
      sites from ChIP-seq data. This software is coded in C/C++, and supports major computer platforms.
  sequence_in_sequence_finder:
    description: Finds accurate nucleic subsequences within a sequence at whole-chromosome or genome scale
      in seconds
    was: Finds a accurate nucleic subsequences within in a sequence. On whole chromosome / genome levels,
      within seconds.
  sequence_searcher:
    description: Searches protein and DNA sequences for user-specified motifs, supporting FASTA import
      and manual input
    was: Easy-to-use Java tool for searching protein and DNA sequences for user specified sequence motifs.
       The Sequence Searcher can search multiple sequences in a single pass.  The target sequences may
      be imported from your computer in FASTA format or you can manually paste the sequence(s) into a
      text window.
  sergio:
    description: Simulates single-cell gene expression data guided by a user-provided gene regulatory
      network
    was: 'SERGIO (Single-cell ExpRession of Genes In silicO). A Single-Cell Expression Simulator Guided
      by Gene Regulatory Networks.


      SERGIO is a simulator for single-cell expression data guided by gene regulatory networks. A command-line,
      easy-to-use version of SERGIO will be soon uploaded to PyPI. Here is the documentation for using
      SERGIO v1.0.0 as a module in python.'
  setuppromoter:
    description: Builds a FASTA file of promoter region sequences from a reference genome using given
      coordinates
    was: Builds a fasta file of sequences from a reference genome using promoter region coordinates.
  sevenc:
    description: Predicts chromatin looping events from ChIP-seq signals and sequence motifs around CTCF
      binding sites
    was: Chromatin looping is an essential feature of eukaryotic genomes and can bring regulatory sequences,
      such as enhancers or transcription factor binding sites, in the close physical proximity of regulated
      target genes. This package uses protein binding signals from ChIP-seq and sequence motif information
      to predict chromatin looping events.
  sexannodb:
    description: Provides curated data on sex-specific regulations from multi-omics analyses of human
      cancers
    was: SexAnnoDB is a knowledgebase providing curated data on sex-specific regulations derived from
      multi-omics analyses of human cancers. It offers a platform for researchers to explore regulatory
      networks and potential therapeutic targets based on sex.
  sfmap:
    description: Predicts putative splicing factor binding sites in human genomic sequences using the
      COS(WR) algorithm
    was: SFmap is a web server for predicting putative splicing factor (SF) binding sites in genomic data.
      Sequences are input in FASTA format.
  sharenet:
    description: Boosts accuracy of cell type-specific gene regulatory networks by propagating information
      across related cell types
    was: ShareNet is a Bayesian framework for boosting the accuracy of cell type-specific gene regulatory
      associations that can be used with a wide range of general network inference algorithms. It takes
      as input a set of initial network estimates for each cell type in a dataset, computed using a user's
      network inference algorithm of choice, and then outputs a corresponding set of revised networks.
  shinyarchr_uio:
    description: Visualizes single-cell ATAC-seq data through an interactive Shiny web interface built
      on ArchR
    was: ShinyArchR.UiO (ShinyArchR User interface Open) is an user-friendly, integrative, and open-source
      shiny-based web app using R programming for visualization of massive single-cell chromatin accessibility
      data (scATAC-seq) based on ArchR, (Granja et al, 2021).
  siamprom:
    description: Recognizes cyanobacteria promoters using a Siamese network with phantom sampling to generate
      non-promoters and find novel motifs
    was: SiamProm is a tool for recognizing cyanobacteria promoters using a Siamese network-based contrastive
      learning approach, which addresses limitations of existing methods by incorporating phantom sampling
      to generate non-promoters and find novel motifs.
  sicer:
    description: Identifies enriched domains from histone modification ChIP-seq data using a clustering
      approach
    was: A clustering approach for identification of enriched domains from histone modification ChIP-seq
      data.
  sigma70pred:
    description: Predicts sigma70 promoters in prokaryotic genomes using an SVM-based model with dinucleotide
      and trinucleotide features
    was: A highly accurate method for predicting sigma70 promoter in prokaryotic genome.
  signac:
    description: Analyzes single-cell chromatin data as an extension of Seurat
    was: 'Multimodal single-cell chromatin analysis with Signac.


      A New Algorithm for Finding Marker Genes in Single-Cell Transcriptomic Data.


      Signac - A versatile package for Single-cell RNA-Seq analysis.


      We introduce Signac, a versatile R package to facilitate the analysis workflow for single-cell data.
      It helps to find marker genes faster and more accurate, search for cells with similar expression
      profiles, integrate multiple datasets in the BioTuring Browser database (know more about BioTuring
      Browser), etc. For users with a limited computational resource, we provide the helper functions
      to exercise all analyses for the large-scale datasets from disk. Because of its speed and flexibility,
      it can be adapted to any existing R analysis pipeline to help explore single-cell data more efficient.


      Signac is an extension of Seurat for the analysis of single-cell chromatin data.'
  signalink3:
    description: Integrates manually curated signaling pathways with interaction, regulation, and expression
      data for tissue-specific network analysis in humans and model organisms
    was: A multi-layered resource to uncover tissue-specific signaling networks.
  signalspider:
    description: Discovers combinatorial binding patterns of transcription factors from multiple ChIP-Seq
      profiles using a probabilistic model
    was: A probabilistic model for deciphering the combinatorial binding of DNA-binding proteins. The
      model (SignalSpider) aims at modeling and extracting patterns from multiple ChIP-Seq profiles.
  silencerdb:
    description: A comprehensive database of experimentally validated and predicted silencers with standardized
      categorization and annotations
    was: 'a comprehensive database of silencers.


      A deep convolutional neural network for the accurate prediction of silencers.


      Silencers, which were first identified around 30 years ago as sequence-specific elements that induce
      negative effect on the transcription of particular genes, have started to receive growing attention.
      To facilitate the studies of silencers and their potential roles in transcriptional control during
      normal development and disease, we developed this comprehensive database of silencers, SilencerDB.


      For accurate classification of silencers, we propose a CNN-based model named DeepSilencer.


      $ pip install tensorflow-gpu==1.15.2 #pip install tensorflow==1.15.2.'
  simatac:
    description: Generates single-cell ATAC-seq count matrices that resemble real datasets using statistical
      models from 90 cell groups
    was: 'A Single-cell ATAC-seq Simulation Framework.


      simATAC is a framework provided as an R package that generates a single-cell Assay for Transposase-Accessible
      Chromatin sequencing (scATAC-seq) count matrix, highly resembling real scATAC-seq datasets in library
      size, sparsity, and averaged chromatin accessibility signals. simATAC deploys statistical functions
      derived from analyzing 90 real scATAC-seq cell groups to model read distributions. simATAC provides
      a robust and systematic approach to generate in silico scATAC-seq samples with cell labels for a
      comprehensive tool assessment.'
  simbindprofiles:
    description: Identifies common and unique binding regions from genome tiling array data by directly
      comparing binding profiles
    was: This tool identifies common and unique binding regions in genome tiling array data. It does not
      rely on peak calling, but directly compares binding profiles processed on the same array platform.
      It also implements a simple threshold approach, thus allowing retrieval of commonly and differentially
      bound regions between datasets as well as events of compensation and increased binding.
  simic:
    description: Infers gene regulatory networks per cell phenotype from single-cell RNA-seq data using
      similarity constraints to enable comparison across states
    was: 'A Single Cell Gene Regulatory Network Inference method with Similarity Constraints.


      To install SimiC in Python, go to the repository folder, and run:.


      Please make sure that you are using Python 3.x, and the packages in requirements.txt are properly
      installed. If you are using pip then you can run:.


      To run SimiC with Single-cell RNA-seq of a small test example, go to folder exmaple. The test data
      provided here is a subsample of the hepatocypte dataset we used in our paper. The test data contains
      500 cells from 3 different states.'
  similarpeak:
    description: Calculates metrics to quantify similarity between ChIP-Seq profiles
    was: This package calculates metrics which assign a level of similarity between ChIP-Seq profiles.
  simsearch:
    description: Searches for and compares (epi)genomic feature patterns across multiple genome browser
      tracks using a pattern-search algorithm
    was: 'Search and comparison of (epi)genomic feature patterns in multiple genome browser tracks.


      SimSearch is an IGB http://bioviz.org/igb/ plugin to identify and compare occurrences of (epi)genomics
      feature patterns in multiple genome browser tracks.


      It is based on a pattern-search algorithm that provides biologists with the ability, once they identify
      an interesting genomic pattern, to look for similar occurrences in the data, thus facilitating genomic
      data access and use.


      The SimSearch algorithm has been developed through a collaboration between University of Bologna
      and Politecnico di Milano, and is included in the SimSearch App as part of the http://www.bioinformatics.deib.polimi.it/geco/
      project.'
  sincei:
    description: Explores single-cell epigenomic data directly from aligned reads via a command-line interface
    was: sincei is a command-line toolkit for exploring single-cell epigenomic data directly from aligned
      reads. It provides a user-friendly interface and is installable via Bioconda.
  sip:
    description: Calls significant interaction peaks from Hi-C data to identify chromatin loops across
      organisms
    was: 'SIP: Significant Interaction Peak caller.Analysis of Hi-C data using SIP effectively identifies
      loops in organisms from C. elegans to mammals.



      If you want run SIP with mcool file you need to install cooler: https://github.com/mirnylab/cooler
      (version >= 0.8.6) and cooltools: https://github.com/mirnylab/cooltools (version >= 0.3.0) . Not
      working with dev version of cooler and cooltools.'
  sires:
    description: Predicts iron-responsive elements from RNA sequence and structure data using a web server
    was: SIREs is an iron responsive element prediction tool. From input data, SIREs produces structure
      analysis, predicted RNA folds, folding energy data and overall quality flags.
  sirw:
    description: Searches protein and nucleotide databases by combining keyword queries with sequence
      motif patterns
    was: SIRW is a web interface to SIR (Simple Indexing and Retrieval System). It combines the ability
      to search protein/nucleotide databases with keywords and a sequence motif.
  sissrs:
    description: Identifies precise transcription factor binding sites from ChIP-Seq short sequence reads
    was: Produce a list of peakmaxima from aligned positions.
  sitar:
    description: Predicts transcription factor binding sites by scoring motif occurrences against non-randomness
      estimates without requiring alignment
    was: Novel tool for transcription factor binding site prediction.
  sitecon:
    description: Detects conservative conformational and physicochemical properties in transcription factor
      binding site alignments and recognizes potential binding sites
    was: Server for the detection of conformational and physicochemical properties in transcription factor
      binding sites and potential binding sites.
  sitehound-web:
    description: Identifies ligand binding sites in protein structures using carbon and phosphate probes
    was: SITEHOUND-web is a server that identifies ligand binding sites in protein structures. Users input
      a protein structure in PDB format. The program identifies putative ligand binding sites for various
      favorable probe molecules (i.e. carbon probe, phosphate probe) and displays the putative sites in
      interactive 3D representation.
  siteseer:
    description: Maps transcription factor binding sites from TRANSFAC and SCPD databases onto upstream
      regions of single or grouped eukaryotic genes
    was: SiteSeer is a visualization tool for mapping transcription factor binding sites (TFBS) in the
      upstream regions of single or grouped eukaryotic genes.
  skipper:
    description: End-to-end workflow converting unprocessed CLIP-seq reads into annotated binding sites
      using an improved statistical framework
    was: Skipper analysis of RNA-protein interactions highlights depletion of genetic variation in translation
      factor binding sites.
  slncky:
    description: Filters high-quality lncRNAs from reconstructed RNA-seq data and identifies conserved
      lncRNAs using a sensitive noncoding alignment method
    was: Filters a high-quality set of lncRNA from reconstructed RNA-seq data and searches for conserved
      lncRNAs using a sensitive noncoding aligning method.
  smfm:
    description: Identifies and characterizes DNA enhancers from regulatory sequences using a stacked
      multivariate fusion framework with deep learning and ensemble machine learning
    was: Genome-wide identification and characterization of DNA enhancers with a stacked multivariate
      fusion framework.
  snapatac:
    description: Analyzes single cell ATAC-seq datasets to dissect cellular heterogeneity and map trajectories
      of cellular states
    was: SnapATAC (Single Nucleus Analysis Pipeline for ATAC-seq) is a fast, accurate and comprehensive
      method for analyzing single cell ATAC-seq datasets.
  snaphic:
    description: Identifies chromatin loops from single-cell Hi-C data using a computational pipeline
    was: A computational pipeline to identify chromatin loops from single-cell Hi-C data.
  snapper:
    description: Detects methylation motifs from Oxford Nanopore reads using a greedy motif selection
      algorithm
    was: High-sensitive algorithm to detect methylation motifs based on Oxford Nanopore reads.
  snapshot:
    description: Clusters and visualizes candidate cis-regulatory elements based on their epigenetic signals
      during cell differentiation
    was: Package for clustering and visualizing epigenetic history during cell differentiation.
  snoglobe:
    description: Predicts C/D snoRNA RNA targets using a gradient boosting classifier on human transcriptome
      data
    was: The snoGloBe interaction predictor reveals a broad spectrum of C/D snoRNA RNA targets.
  snogps:
    description: Searches for H/ACA snoRNA genes in genomic sequences using a deterministic screening
      algorithm combined with a probabilistic model
    was: snoGPS allows you to search for H/ACA snoRNA (small nucleolar RNA) genes in a genomic sequence
  snowprint:
    description: Predicts DNA-binding sequences of transcription factors using a protein-agnostic approach
      to discover ligand-inducible regulators
    was: Snowprint-UI is a bioinformatics tool for predicting DNA-binding sequences of transcription factors,
      enabling the discovery of ligand-inducible transcriptional regulators for bioengineering applications.
      It utilizes a protein-agnostic approach and has been shown to influence gene expression and produce
      dynamic ranges.
  snp2tfbs:
    description: Identifies regulatory SNPs that disrupt, create or change transcription factor binding
      affinity using position weight matrices and human genome assemblies
    was: The resource is based on a new 'in silico' approach for identifying regulatory variants. The
      transcription factor (TF) binding score is computed in both the reference (hg19) and alternate human
      genome assemblies. The alternate genome assembly is generated by incorporating the alternate allele
      of common genetic variants (AF>=0.001) from the 1000 Genomes Project. Interesting candidate variants
      are those SNPs that disrupt, create or change the TF binding score/affinity between the two genomes.
  snphood:
    description: Investigates and visualises the local neighbourhood of SNPs in NGS data for chromatin
      marks or TF binding sites
    was: This R package investigates and visualizes the local neighborhood of a set of SNPs of interest
      for NGS data such as chromatin marks or TF binding sites from ChIP-Seq or RNA-Seq experiments. It
      comprises a set of easy-to-use functions to extract, normalize and summarize reads for a genomic
      region.
  snpnexus:
    description: Annotates known and novel SNPs, insertions/deletions, and block substitutions with functional
      consequences on transcriptome, proteome, regulatory, and structural variation models
    was: Webserver allows for significance assessment of known and novel SNPs on the major transcriptome,
      proteome, regulatory and structural variation models so to identify phenotypically important variants.
      Other variations have been included like insertions/deletions, block substitutions, etc.
  snpstarrseq:
    description: Screens non-coding variants from GWAS for functional impact on enhancer activity using
      a high-throughput sequencing and bioinformatic approach
    was: Optimized high-throughput screening of non-coding variants identified from genome-wide association
      studies.
  soggi:
    description: Creates aggregate and summary plots of signal or motif occurrence from BAM, bigWig, PWM,
      and other Bioconductor objects
    was: Provides a toolset to create genomic interval aggregate/summary plots of signal or motif occurence
      from BAM and bigWig files as well as PWM, rlelist, GRanges and GAlignments BioConductor objects.
      It allows for normalisation, transformation and arithmetic operation on and between summary plot
      objects as well as grouping and subsetting of plots by GRanges objects and user supplied metadata.
      Plots are created using the GGplot2 libary to allow user defined manipulation of the returned plot
      object.
  spacelog:
    description: Infers gene-gene networks from expression data using log penalty within the SPACE model
    was: 'a novel approach to inferring gene-gene net-works using SPACE model with log penalty.


      We develop SpaceLog that employs log penalty within the framework of an earlier method space (Sparse
      PArtial Correlation Estimation). We show that the SpaceLog has good performance, particularly for
      networks with hubs. The R package is available to download on github.'
  spacer:
    description: Analyzes protein structures to find functional and effector binding sites and shows allosteric
      communication between them
    was: Web server analyzes protein structure, finds potential functional/effector binding sites, and
      shows allosteric communication between the sites.
  spagtl:
    description: Infers context-specific spatial gene regulatory networks from spatial transcriptomics
      data using graph transfer learning
    was: SpaGTL is a Python package for spatial transcriptomics analysis, utilizing graph transfer learning
      to infer context-specific spatial gene regulatory networks. It's pretrained on a large-scale dataset
      and designed for use even with limited data.
  sparkinferno:
    description: Prioritizes causal non-coding variants from GWAS summary statistics by integrating functional
      genomics data across tissues and cell types
    was: A scalable high-throughput pipeline for inferring molecular mechanisms of non-coding genetic
      variants.
  spartan_proteomics:
    description: Links cell-surface receptors to transcription factors by integrating CITE-seq data with
      cis-regulatory information
    was: SPaRTAN (Single-cell Proteomic and RNA based Transcription factor Activity Network) provides
      a mechanistically inspired approach for integrating cell-specific transcriptomic and proteomic data
      with regulatory genomics resources, representing a significant advance in the modeling of cell-specific
      signaling and gene regulatory programs. The cell surface phenotype is well-known to immunologists
      through flow cytometry but signaling downstream of cell surface receptors/co-receptors drives transcriptional
      and chromatin state changes. It is important to connect the “cell surface phenotype” to downstream
      transcriptional programs and resulting transcriptomic phenotypes. SPaRTAN models this flow of information
      with single cell resolution.
  spascer:
    description: Annotates spatial transcriptomics data at single-cell resolution by integrating scRNA-seq
      for cell type deconvolution, spatial cell-cell interactions, and gene pattern analysis
    was: Spatial transcriptomics annotation at single-cell resolution.
  spatzie:
    description: Identifies significant transcription factor motif co-enrichment from enhancer-promoter
      interaction data using statistical analysis
    was: spatzie is an R package for identifying significant transcription factor motif co-enrichment
      from enhancer-promoter interactions. Given a database of DNA sequence motifs representing transcription
      factors and enhancer promoter interaction data, spatzie performs statistical analysis to identify
      co-enriched transcription factors.
  specvar:
    description: Integrates chromatin accessibility and gene expression data into context-specific regulatory
      networks for heritability enrichment analysis with GWAS summary statistics
    was: Heritability enrichment in context-specific regulatory networks improves phenotype-relevant tissue
      identification.
  spidermir:
    description: Integrates miRNA data with gene regulatory networks from GeneMania for network analysis
      and visualization
    was: 'Aims: i) Facilitate the network open-access data retrieval from GeneMania data, ii) prepare
      the data with appropriate gene nomenclature, iii) integration of miRNA data in a specific network,
      iv) provide different standard analyses and v) allow the user to visualize the results. In more
      detail, the package provides multiple methods for query, prepare and download network data, and
      the integration with validated and predicted miRNA data, the use of standard analysis and visualization
      methods.'
  spikchip:
    description: Performs multiple alternative normalization corrections on ChIP-seq data with spike-in
      using a local regression strategy
    was: spikChIP is a computational pipeline to perform multiple alternative normalization corrections
      on ChIP-seq data with spike-in (Raw, Traditional, ChIP-Rx, Tag removal and spikChIP)
  sponge:
    description: Detects competitive endogenous RNA interactions from paired miRNA and gene expression
      data using multiple sensitivity correlation
    was: This package provides methods to efficiently detect competitive endogeneous RNA interactions
      between two genes. Such interactions are mediated by one or several miRNAs such that both gene and
      miRNA expression data for a larger number of samples is needed as input.
  spp:
    description: Analyses ChIP-seq data with R scripts for peak detection and quality assessment
    was: R-scripts for ChIP-seq analysis.
  sratailor:
    description: Converts ChIP-seq SRA files into BigWig format and visualizes reads via a graphical interface
    was: Simple GUI software for visualizing published ChIP-seq raw data.
  srgs:
    description: Infers gene regulatory networks from bulk or single-cell expression data using sparse
      partial least squares-based recursive gene selection
    was: Sparse partial least squares-based recursive gene selection for gene regulatory network inference.
  srna_workflow:
    description: Analyzes plant sRNA sequencing data from raw reads to annotated conserved and novel sequences
    was: Analysis workflow for plant sRNA sequencing data.
  srnatargetdigger:
    description: Bidirectionally identifies sRNA-target pairs and co-regulatory sRNAs from sRNA and degradome
      sequencing data
    was: 'A bioinformatics software for bidirectional identification of sRNA-target pairs with co-regulatory
      sRNAs information.


      Some categories of small RNAs (sRNAs) in plants, such as microRNA (miRNAs), trans-acting small interfering
      RNAs (ta-siRNAs) and small interfering RNAs (siRNAs), often regulate the expressions of target genes
      through cleavage of complementary mRNAs and play an important role in the biological processes such
      as plant development, metabolism and diseases resistance. Identifying the target genes of these
      sRNAs is an important step in our understanding of their functions.'
  ssa:
    description: Discovers and characterizes sequence motifs positionally correlated with functional sites
      like transcription or translation starts
    was: SSA (Signal Search Analysis) is a software package for the analysis of nucleic acid sequence
      motifs that are postionally correlated with a functional site (e.g a transcription or translation
      initiation site).
  ssblazer:
    description: Predicts single-strand break sites at nucleotide resolution from genome-wide sequencing
      data using a deep learning framework
    was: SSBlazer is a deep learning framework for predicting single-strand break (SSB) sites at the nucleotide
      level. It utilizes genome-wide single-strand break sequencing data and provides a scalable and explainable
      model suitable for various species and applications.
  ssvqc:
    description: Performs quality control for enrichment-based NGS assays such as ChIP-seq, CUT&RUN, and
      ATAC-seq
    was: R package for QC of enrichment based NGS assays. ChIP-seq, cut&run, ATAC-seq, etc.
  stackepi:
    description: Identifies cell line-specific enhancer-promoter interactions using a stacking ensemble
      learning strategy
    was: Identification of cell line-specific enhancer-promoter interactions based on stacking ensemble
      learning.
  stamp:
    description: Aligns DNA-binding motifs against databases and builds multiple alignments, familial
      binding profiles and similarity trees
    was: STAMP is a tool for exploring DNA-binding motif similarities by providing resources for motif
      alignment, similarity and database matching.
  stan:
    description: Segments genomes into directed states by integrating strand-specific and non-strand-specific
      data using bidirectional hidden Markov models
    was: Genome segmentation with hidden Markov models has become a useful tool to annotate genomic elements,
      such as promoters and enhancers. The tool implements (bidirectional) hidden Markov models (HMMs)
      using a variety of different probability distributions, which can model a wide range of current
      genomic data. It de novo learns and annotates the genome into a given number of 'genomic states'.
      It also allows for the integration of strand-specific and non-strand-specific data.
  starmir:
    description: Predicts microRNA binding sites on target RNA using logistic models from CLIP data
    was: STarMir is a web server for prediction of microRNA binding sites.
  starrpeaker:
    description: Identifies active regions from STARR-seq data using negative binomial regression to correct
      for sequencing biases
    was: 'uniform processing and accurate identification of STARR-seq active regions.


      conda create -n starrpeaker python=2.7 pybedtools.


      statsmodels (v0.10.1, use v0.10.2 or earlier, new function statsmodels/tools/validation/validation.py
      introduced in v0.11.0 may introduce error in Python 2).


      Preferably, create a conda environment with Python 2.7.


      starrpeaker --prefix <prefix for output files> --chromsize <hg38.chrom.sizes> --blacklist <blacklist_GRCh38.bed>
      --cov <covariate 1: gc content> <covariate 2: mappability> <covariate 3: conservation> --input <input.bam>
      --output <output.bam> --threshold 0.05.'
  statepaintr:
    description: Produces chromatin state segmentations from epigenomic models in standard genome browser
      formats
    was: 'rapid and reproducible chromatin state evaluation for custom genome annotation.


      StatHub - consistent rules-based chromatin state annotations across Roadmap, ENCODE, Blueprint,
      CEEHRC, and DEEP.'
  steinernet:
    description: Integrates transcriptional, proteomic and interactome data to reveal regulatory and signalling
      networks via the prize-collecting Steiner tree problem
    was: Webserver for the integration of transcriptional, proteomic and interactome data to reveal regulatory
      and signalling networks.
  stemnesscore:
    description: Estimates stemness of glioma cells from scATAC-seq data using machine learning
    was: StemnesScoRe is an R package developed to estimate the stemness of glioma cancer cells at single-cell
      resolution, utilizing scATAC-seq data and machine learning techniques to quantify stemness scores.
  strand_ngs:
    description: Aligns, analyzes, visualizes, and manages NGS data with workflows for RNA-Seq, DNA-Seq,
      small RNA-Seq, ChIP-seq, and Methyl-Seq
    was: Software platform for alignment, analysis, visualization, and management of data generated by
      NGS platforms. It supports workflows for RNA-Seq, DNA-Seq, small RNA-Seq, ChIP-seq, and Methyl-Seq
      data analysis.
  stream:
    description: Models transcriptional regulation of a target gene from TF concentrations, binding sites,
      and transcription rates to predict output under different conditions
    was: Bioinformatics application for researchers, who want to model the transcriptional regulation
      of a specific gene and predict its transcriptional output in different situations.
  streme:
    description: Discovers novel sequence motifs in unaligned nucleotide or protein sequences, supporting
      short and long motifs, differential discovery, and large datasets
    was: STREME is accurate and versatile sequence motif discovery tool. The MEME Suite allows you to
      discover novel motifs in collections of unaligned nucleotide or protein sequences, and to perform
      a wide variety of other motif-based analyses. It provides motif discovery algorithms using both
      probabilistic (MEME) and discrete models (STREME), which have complementary strengths. It also allows
      discovery of motifs with arbitrary insertions and deletions (GLAM2). MEME-ChIP performs a comprehensive
      motif-based analysis of ChIP-seq and other large sequence datasets.
  subtiwiki:
    description: Compiles and integrates genomic, mutant fitness, protein structure, and metabolite data
      for Bacillus subtilis
    was: SubtiWiki is a database for the model organism Bacillus subtilis.
  suldex:
    description: Estimates dissociation constants for transcription factor-DNA interactions from high-throughput
      sequencing data using a Bayesian Markov chain Monte Carlo approach
    was: The packages is designed to use high throughput sequencing to simultaneously analyze binding
      dissociation constants for large repertoires of sequences.
  survivalmeth:
    description: Investigates the effect of DNA methylation-related functional elements on prognosis using
      preloaded and user-uploaded methylation profiles from 36 cancers
    was: 'a web server to investigate the effect of DNA methylation-related functional elements on prognosis.


      The functional elements associated with DNA methylation, for example enhancer region, CpG island,
      shore, shelf, promoter, gene body, etc., are discovered to be underlying prognostic markers for
      patients'' survival.Here, we built a web server SurvivalMeth (freely available via a user friendly
      web-server at http://bio-bigdata.hrbmu.edu.cn/survivalmeth/) to investigate the effect of DNA methylation-related
      functional elements on prognosis, and multiple kinds of commonly used functional elements associated
      with DNA methylation are considered.'
  survnet:
    description: Identifies network-based biomarkers that correlate with patient survival data from a
      biological network, molecular profiling, and survival data files
    was: SurvNet is a webserver for identifying network-based biomarkers that most correlate with patient
      survival data. Users provide a biological network file, a molecular profiling file from high-throughput
      experiment and a patient survival data file. Returned is a list of network biomarkers that best
      correlate with the observed patient survival data.
  svm2crm:
    description: Detects cis-regulatory elements from genomic data using SVM implemented in LiblineaR
    was: Detection of cis-regulatory elements using svm implemented in LiblineaR.
  svmatac:
    description: Enhances and imputes peak signals from scATAC-seq data using SVM to classify cell types
    was: svmATAC is a tool for the enhancement and imputation of peak signal enables accurate identification
      of cell type in scATAC-seq.
  svmil2:
    description: Predicts pathogenic effects of non-coding structural variants disrupting TAD boundaries
      using multiple instance learning
    was: 'svMIL2: predicting the pathogenic effect of somatic non-coding structural variants disrupting
      the 3D genome through Multiple Instance Learning.'
  swan:
    description: Predicts regulatory targets of a motif genome-wide using a Hidden Markov Model that compares
      site frequency to the genome-wide average
    was: Software to meant for genome-wide prediction of regulatory targets of a motif using a Hidden
      Markov Model. It differs from Stubb in that instead of asking Does the sequence have more sites
      than expected from a random (background) model of sequences?, it asks the question Does the sequence
      have more sites than the average genome-wide frequency of sites?
  swembl:
    description: Calls peaks from functional genomic data sets
    was: A peak-calling tool package for functinal genomic and other data sets.
  swissregulon:
    description: Database of genome-wide annotations of regulatory motifs, promoters and transcription
      factor binding sites across model organisms
    was: SwissRegulon is a database of genome-wide annotations of regulatory sites. It contains annotations
      for 17 prokaryotes and 3 eukaryotes. The database frontend offers an intuitive interface showing
      genomic information in a clear and comprehensible graphical form.
  synor:
    description: Searches vertebrate genomes for evolutionary conserved modules of transcription factor
      binding sites in a predefined configuration
    was: SynoR searches vertebrate genomes for synonymous regulatory elements.
  systempiper:
    description: Builds and runs automated end-to-end analysis workflows for NGS applications like RNA-Seq,
      ChIP-Seq, VAR-Seq and Ribo-Seq
    was: R package for building and running automated end-to-end analysis workflows for a wide range of
      NGS applications such as RNA-Seq, ChIP-Seq, VAR-Seq and Ribo-Seq. Important features include a uniform
      workflow interface across them, automated report generation, and support for running both R and
      command-line software, such as NGS aligners or peak/variant callers, on local computers or compute
      clusters.
  t-reg_comparator:
    description: Compares a set of position weight matrices against the T-Reg database to detect motif
      similarities and submatrix matches
    was: Tool for the analysis of transcriptional regulation that allows you to compare a set of position
      weight matrices (PWM) against the T-Reg database (a collection of PWMs built from Transfac and Jaspar).
  t-weon:
    description: Generates context-specific gene regulatory networks for D. melanogaster by filtering
      a reference network with knowledge-based rules
    was: Automated generation of context-specific Gene Regulatory Networks with a weighted approach in
      D. melanogaster.
  tREMAP:
    description: Predicts transcription factor target genes using known gene-TF associations and protein-protein
      interaction networks via regularized nonnegative matrix tri-factorization
    was: Target Gene Prediction of Transcription Factor Using a New Neighborhood-regularized Tri-factorization
      One-class Collaborative Filtering Algorithm.
  tacs:
    description: Identifies activation periods of gene regulations from time-series expression profiles
      and a gene regulatory network
    was: "Time Course Analysis of Control strength toward nodes/gene\n    expression on directed graph\
      \ based on Information Criterion."
  tact:
    description: Integrates sequence similarity searches and functional motif predictions to annotate
      transcripts
    was: Automated tool for conducting functional annotation of transcripts that integrates sequence similarity
      searches and functional motif predictions. It was originally developed as an automatic annotation
      pipeline for the Human Full-length cDNA Annotation Invitational (H-Inv) project.
  tadbd:
    description: Detects topologically associated domain boundaries on Hi-C contact matrices using a Haar-based
      algorithm
    was: 'a sensitive and fast method for detection of typologically associated domain boundaries.


      A topologically associated domain (TAD) is a self-interacting genomic block. Detection of TAD boundaries
      on Hi-C contact matrix is one of the most important issues in the analysis of 3D genome architecture
      at TAD level. Here, we present TAD boundary detection (TADBD), a sensitive and fast computational
      method for detection of TAD boundaries on Hi-C contact matrix. This method implements a Haar-based
      algorithm by considering Haar diagonal template, acceleration via a compact integrogram, multi-scale
      aggregation at template size and statistical filtering. In most cases, comparison results from simulated
      and experimental data show that TADBD outperforms the other five methods. In addition, a new R package
      for TADBD is freely available online'
  tadeus2:
    description: Assesses pathogenicity of structural variants disrupting 3D chromatin structure using
      Hi-C data and visualisation
    was: A web server facilitating the clinical diagnosis by pathogenicity assessment of structural variations
      disarranging 3D chromatin structure.
  tadpole:
    description: Identifies and analyzes the entire hierarchy of topologically associated domains in intra-chromosomal
      interaction matrices using principal component analysis and constrained hierarchical clustering
    was: 'Hierarchical chromatin organization detected by TADpole.


      TADpole is a computational tool designed to identify and analyze the entire hierarchy of topologically
      associated domains (TADs) in intra-chromosomal interaction matrices.'
  tadreg:
    description: Identifies TADs, detects differential borders across conditions, and predicts 3D genome
      reorganization after chromosomal rearrangement using a regression framework
    was: A versatile regression framework for TAD identification, differential analysis and rearranged
      3D genome prediction.
  tale-nt:
    description: Designs custom TAL effector repeat arrays and predicts ranked binding sites in genomic
      or promoter sequences
    was: Transcription activator-like (TAL) Effector-Nucleotide Targeter 2.0 (TALE-NT) is a suite of web-based
      tools that allows for custom design of TAL effector repeat arrays for desired targets and prediction
      of TAL effector binding sites.
  talenoffer:
    description: Predicts off-targets of TALENs genome-wide using a novel algorithm
    was: Genome-wide TALEN off-target prediction.
  target_explorer:
    description: Creates custom transcription factor binding site matrices, searches for binding site
      clusters, and identifies target genes from genomic sequences
    was: The tool can be used to create custom matrices to describe transcription factor binding sites
      (TFBS), search for clusters of TFBS, and identify target genes. Free registration is required.
  targetdbpplus:
    description: Identifies DNA-binding proteins from sequence features using weighted convolutional features
      and support vector machine
    was: 'Enhancing the Performance of Identifying DNA-Binding Proteins via Weighted Convolutional Features.


      A DNA-binding protein identification method via using sequence-driven features.'
  targetgene:
    description: Annotates genetic variants to cell-type-specific target genes using multi-omics data
      and GWAS results
    was: Comprehensive database of cell-type-specific target genes for genetic variants.
  targetgenereg:
    description: A web-atlas combining gene expression and transcription factor binding data to determine
      gene responses to p53, ΔNp63, and cell cycle signaling
    was: A comprehensive web-atlas for p53, p63, and cell cycle-dependent gene regulation.
  targetrna:
    description: Identifies mRNA targets of small non-coding RNAs in bacteria using basepair-binding potential
    was: TargetRNA is a web based tool for identifying mRNA targets of small non-coding RNAs in bacterial
      species.
  tarpid:
    description: Curates piRNA-target interactions from published literature with expression, methodology,
      and disease information
    was: Database of putative and validated targets of piRNAs.
  tca:
    description: Identifies age-specific gene signatures by jointly analyzing brain transcriptomes and
      functional connectomes from MRI data
    was: Identifying age-specific gene signatures of the human cerebral cortex with joint analysis of
      transcriptomes and functional connectomes.
  tcof-db:
    description: A database of human transcription factors and co-factors with their protein-protein interactions,
      searchable by identifiers or predefined sets
    was: TcoF is a database that facilitates the exploration of proteins involved in the regulation of
      transcription in humans by binding to regulatory DNA regions (transcription factors) and proteins
      involved in the regulation of transcription in humans by interacting with transcription factors
      and not binding to regulatory DNA regions (transcription co-factors). Proteins can be searched by
      a variety of identifiers or predefined sets of proteins can be viewed.
  tcofbase:
    description: A database of transcription co-factors with ChIP-seq data and enrichment analyses for
      human and mouse
    was: A comprehensive database for decoding the regulatory transcription co-factors in human and mouse.
  tcrconv:
    description: Predicts recognition between T cell receptors and epitopes using a deep learning model
      with contextualized motifs
    was: Predicting recognition between T cell receptors and epitopes using contextualized motifs.
  tcseq:
    description: Clusters and visualizes temporal patterns from epigenomic and transcriptomic time course
      sequencing data
    was: Quantitative and differential analysis of epigenomic and transcriptomic time course sequencing
      data, clustering analysis and visualization of temporal patterns of time course data.
  tdaracne:
    description: Infers gene regulatory networks from time-series expression data using time-delayed mutual
      information
    was: To infer gene networks from time-series measurements is a current challenge into bioinformatics
      research area. In order to detect dependencies between genes at different time delays, we propose
      an approach to infer gene regulatory networks from time-series measurements starting from a well
      known algorithm based on information theory. The proposed algorithm is expected to be useful in
      reconstruction of small biological directed networks from time course data.
  tdthub:
    description: Analyses transcription factor binding sites in plants using pre-computed data from 40
      species and two mapping algorithms
    was: Web server tool for the analysis of transcription factor binding sites in plants.
  te-tss:
    description: Integrates RNA-seq data to identify and explore transposable element-derived transcription
      start sites in human and mouse
    was: Integrated data resource of human and mouse transposable element (TE)-derived transcription start
      site (TSS).
  teiser:
    description: Discovers post-transcriptional regulatory elements governing mRNA stability from sequence
      data
    was: Robust and powerful framework for discovering post-transcriptional regulatory elemenets.
  tejaas:
    description: Finds trans-eQTLs from eQTL data using L2-regularized reverse multiple regression
    was: 'Reverse regression increases power for detecting trans-eQTLs.


      Tejaas is a command line tool to find trans-eQTLs from eQTL data. It is released under the GNU General
      Public License version 3.


      Tejaas is based on the hypothesis that a trans-eQTL should regulate the expression levels of multiple
      genes. In brief, it implements two statistical methods to find trans-eQTLs.'
  tempomage:
    description: Predicts histone marks in open chromatin regions at time-points with missing ChIP-seq
      data by exploiting causal dependencies in time-series
    was: A  deep learning framework that exploits the causal dependency between time-series data to predict
      histone marks in open chromatin regions at time-points with missing ChIP-seq datasets.
  tenet-network:
    description: Reconstructs causal gene regulatory networks from single cell transcriptomic data using
      transfer entropy
    was: 'gene network reconstruction using transfer entropy reveals key regulatory factors from single
      cell transcriptomic data.


      A tool for reconstructing Transfer Entropy-based causal gene NETwork from pseudo-time ordered single
      cell transcriptomic data.'
  ternarynet:
    description: Estimates ternary gene regulatory networks from steady-state gene perturbation data using
      a Bayesian approach
    was: A computational Bayesian approach to ternary gene regulatory network estimation from gene perturbation
      experiments.
  tetrex:
    description: Searches for highly conserved motif regex matches in large biological sequence databases
      using a hierarchical interleaved bloom filter
    was: TetRex is a tool for index-accelerated search of highly conserved motifs in biological sequences,
      utilizing a hierarchical interleaved bloom filter to reduce search space and improve runtime. It's
      designed to efficiently identify regex matches in large datasets.
  tf-marker:
    description: A manually curated database of transcription factors and related markers for specific
      human cell and tissue types
    was: A comprehensive manually curated database for transcription factors and related markers in specific
      cell and tissue types in human.
  tf-prioritizer:
    description: Integrates chromatin accessibility and RNA-seq data to prioritize transcription factors
      using DESeq2, TEPIC, and DYNAMITE
    was: This pipeline gives you a full analysis of nfcore chromatine accessibility data (ChIP-Seq, DNAse-Seq
      or ATAC-Seq and nfcore RNA-seq count data. It performs DESeq2, TEPIC and DYNAMITE including all
      preprocessing and postprocessing steps necessary to transform the data. It also gives you plots
      for deep analysis of the data.
  tf2network:
    description: Predicts transcription factor regulators and gene regulatory networks in Arabidopsis
      using binding site information, co-expression data, and experimental interactions
    was: 'predicting transcription factor regulators and gene regulatory networks in Arabidopsis using
      publicly available binding site information.


      This tool predicts potential regulators for a set of co-expressed or functionally related genes
      in Arabidopsis thaliana. It uses TF binding site information (1793 PWMs corresponding to TFBS for
      916 TFs) and integrates co-expression data and experimental Protein-DNA and Protein-Protein Interactions
      in an interactive visualization.


      Paste input genes below or upload a gene set file to get started. Clicking the demo button will
      start TF2Network with a demo gene set containing genes annotated with circadian rhythm.'
  tf_prioritizer:
    description: Prioritizes condition-specific transcription factors from ATAC, DNase, or ChIP-seq and
      RNA-seq data
    was: Java pipeline to prioritize condition-specific transcription factors.
  tfanalysis:
    description: Predicts transcription factor binding sites from DNase1-seq data and TF motif PSEMs using
      ensemble random forest models
    was: Predicting transcription factor binding using ensemble random forest models | processing and
      analysis of transcription factor binding sites
  tfbind:
    description: Searches transcription factor binding sites, including TATA boxes, GC boxes, CCAAT boxes,
      and TSS, using positional weight matrices and a robust cut-off algorithm
    was: A software for searching transcription factor binding sites (including TATA boxes, GC boxes,
      CCAAT boxes, transcription start sites (TSS)).
  tfbminer:
    description: Mines transcription factor-based biosensors from microbial genomes using a heuristic
      rule-based model of gene organization
    was: User-friendly command line tool for the rapid mining of transcription factor-based biosensors.
  tfbs:
    description: Detects and analyses transcription factor binding sites using specificity profile matrices
      and pattern generators
    was: A set of integrated, object-oriented Perl modules for transcription factor binding site detection
      and analysis. It implements objects representing specificity profile matrices, binding sites and
      sets thereof, pattern generators, and pattern database interfaces.
  tfbscluster:
    description: Identifies clusters of transcription factor binding sites conserved in mammalian genomes
      and retrieves associated SWISS-PROT genes
    was: TFBScluster is a web tool designed to identify clusters of transcription factor binding sites
      (TFBSs) conserved in mammalian and mouse genomes. By entering a specified range of TFBS, you can
      retrieve a list of SWISS-PROT characterized genes to which the clusters are localized.
  tfbsfinder:
    description: Identifies transcription factors and synergistic TF pairs from ChIP and microarray data
      using statistical methods
    was: It is an identification method that utilizes several data sources. A new metric for measuring
      the degree of conservation at a binding site across species and methods for clustering motifs and
      for inferring position weight matrices are proposed. For synthetic data and yeast cell cycle TFs,
      TFBSfinder identifies motifs that are highly similar to known consensuses. Moreover, TFBSfinder
      outperforms well-known methods.
  tfbstools:
    description: Analyzes and manipulates transcription factor binding sites, including matrix conversion
      and scanning sequences for putative TFBSs
    was: Package for the analysis and manipulation of transcription factor binding sites. It includes
      a matrix conversion system between Position Frequency Matrix (PFM), Position Weight Matrix (PWM)
      and Information Content Matrix (ICM). It can also scan putative TFBS from sequence/alignment, query
      the JASPAR database and provide a wrapper of de novo motif discovery software.
  tfcancer:
    description: Manually curated database of transcription factors associated with human cancer, with
      annotations on dysexpression, molecular alteration, regulatory relationships, and cancer pathways
    was: 'TFcancer is a manually curated database of transcription factors associated with human cancer.
      TFcancer features in comprehensive annotations of TFs in human cancers. TFcancer mainly focused
      on the influence of transcription factors on four dimensions in cancer: dysexpression, molecular
      alteration, regulatory relationships between TFs and other genes, last but not least, cancer process
      and signaling pathways. Users can retrieve results by searching specific TF names or cancer types.'
  tfcheckpoint:
    description: Curated compendium of sequence-specific DNA-binding RNA polymerase II transcription factors
      with evidence-based functional annotations
    was: Curated compendium of specific DNA-binding RNA polymerase II transcription factors.
  tfea.chip:
    description: Estimates transcription factor enrichment in gene lists using ChIP-seq datasets
    was: Package to analize transcription factor enrichment in a gene set using data from ChIP-Seq experiments.
  tfebexplorer:
    description: Integrates gene expression changes and binding sites for genes regulated by transcription
      factor EB across species and cell lines
    was: TFEBexplorer is a web tool that provides an integrated platform to study genes regulated by the
      stress-responsive transcription factor EB (TFEB). It integrates multiple datasets, offering insights
      into gene expression changes and experimentally validated binding sites across different species
      and cell lines.
  tfextract:
    description: Processes the TRANSFAC transcription factor database for use by tfscan
    was: Process TRANSFAC transcription factor database for use by tfscan.
  tfhaz:
    description: Identifies DNA zones with high accumulation of transcription factor binding regions using
      two methods
    was: It finds trascription factor (TF) high accumulation DNA zones, i.e., regions along the genome
      where there is a high presence of different transcription factors. Starting from a dataset containing
      the genomic positions of TF binding regions, for each base of the selected chromosome the accumulation
      of TFs is computed. Two different methods for the search of TF high accumulation DNA zones, called
      "binding regions" and "overlaps", are available.
  tflda:
    description: Applies topic models to multiple ChIP-Seq datasets to uncover combinatorial transcriptional
      regulatory modules
    was: Application of topic models to a compendium of ChIP-Seq datasets uncovers recurrent transcriptional
      regulatory modules.
  tflink:
    description: Provides curated transcription factor-target gene interactions and binding sites for
      human and six model organisms
    was: An integrated gateway to access transcription factor-target gene interactions for multiple species.
  tfm-explorer:
    description: Identifies putative transcription factor binding sites in upstream regulatory sequences
      for human, mouse, rat, chicken, and drosophila
    was: Toolbox for the identification of putative transcription factor binding sites within a set of
      upstream regulatory sequences for a given set of genes. Only for human, mouse, rat, chicken and
      drosphila.
  tfmotifview:
    description: Visualizes known transcription factor motif distribution and enrichment in user-provided
      genomic regions using JASPAR database
    was: 'a webserver for the visualization of transcription factor motifs in genomic regions.


      TFmotifView is a web server that allows to study the distribution of known transcription factor
      (TF) motifs in genomic regions. Based on genomic regions of interest and selected TF motifs (settings),
      TFmotifView performs an overlap of the genomic regions with TF motif occurrences from the JASPAR
      database to generate three different outputs: (1) an enrichment table and scatterplot calculating
      the significance of motif occurrences in genomic regions compared to control regions, (2) a genomic
      view of the organisation of TF motifs in each genomic region including an option to export the motif
      positions into the UCSC genome browser, and (3) a metaplot summarising the position of TF motifs
      relative to the center of the regions.'
  tfpred:
    description: Predicts transcription factor preference for methylated versus non-methylated DNA from
      sequence information using SVM and XGBoost
    was: 'Predicting Preference of Transcription Factors for Methylated DNA Using Sequence Information.


      The role of this page is a brief introduction to TFPred.


      TFPred is a webserver for the identification of transcription factors and transcription factors
      that prefer bind to methylated DNA. In the predictors, sequence-based methods were used to represent
      proteins. The support vector machine (SVM) and XGBoost were applied for model construction. For
      the differentiation of transcription factors and non-transcription factors, the accuracy of the
      5-fold cross validation test and independent dataset test was 86.66% and 83.02%, respectively. For
      the classification of transcription factors that prefer methylated DNA and transcription factors
      that prefer non-methylated DNA, the accuracy of the 5-fold cross-validation test and independent
      dataset test was 71.58% and 68.87%, respectively. We hope the webserver could provide convenience
      for Biochemistry scholars.'
  tfscan:
    description: Identifies transcription factor binding sites in DNA sequences
    was: Identify transcription factor binding sites in DNA sequences.
  tfsyntax:
    description: A database of transcription factors binding syntax in mammalian genomes, mapping motif
      location, positional preference, density and colocalization across cells and tissues
    was: A database of transcription factors binding syntax in mammalian genomes.
  tftenricher:
    description: Performs annotation enrichment analysis on downstream genes of user-defined sets of human
      transcription factors
    was: A python toolbox for annotation enrichment analysis of transcription factor target genes.
  tftg:
    description: Integrates ChIP-seq, RNA-seq, motifs, and experimental data to provide human transcription
      factor-target gene resources with search and visualization functions
    was: TFTG is a database providing a comprehensive collection of human transcription factor (TF)-target
      gene resources, integrating data from ChIP-seq, RNA-seq, motifs, and experimental confirmations.
      It offers user-friendly search, analysis, browsing, downloading, and visualization functions to
      facilitate research on TF-target gene regulation.
  tfutils:
    description: Provides utilities for working with transcription factor data
    was: Package to work with TF data.
  threadna:
    description: Predicts DNA mechanics' contribution to sequence selectivity of proteins along whole
      genomes using high-resolution structures of the protein–DNA complex
    was: Predicting DNA mechanics’ contribution to sequence selectivity of proteins along whole genomes.
  tigre:
    description: Infers transcription factor activity and ranks candidate target genes from gene expression
      time series using Gaussian process differential equation models
    was: This package implements our methodology of Gaussian process differential equation models for
      analysis of gene expression time series from single input motif networks. The package can be used
      for inferring unobserved transcription factor (TF) protein concentrations from expression measurements
      of known target genes, or for ranking candidate targets of a TF.
  timelessflex:
    description: Infers time series chromatin state trajectories at promoter-enhancer pairs from Hi-C
      and histone modification data
    was: 'TimelessFlex - A flexible framework for investigating chromatin state trajectories. Inferring
      time series chromatin states for promoter-enhancer pairs based on Hi-C data.

      TimelessFlex is a flexible framework for investigating chromatin state trajectories during linear
      and branched tissue differentiation. This framework adapts and extends Timeless, a Bayesian network
      for co-clustering of multiple histone modifications at promoter and enhancer feature regions. TimelessFlex
      is flexible depending on the available genomic data. The basic required data is ChIP-seq for histone
      modifications with at least three time points and a set of regions of interest.'
  timenexus:
    description: Creates, manages, and visualizes temporal multilayer networks from time-series data,
      and extracts active subnetworks
    was: 'A Novel Cytoscape App to Analyze Time-Series Data Using Temporal MultiLayer Networks (tMLNs).


      Build, manage and visualize temporal multilayer networks, as well as extract active multilayer subnetworks.'
  timeor:
    description: Infers causal regulatory relationships from time series multi-omics data using a web-based
      pipeline
    was: 'a web-based tool to uncover temporal regulatory mechanisms from multi-omics data.


      Trajectory Inference and Mechanism Exploration with Omics in R.


      It''s about time! Click here for a quick video demonstration of the TIMEOR application, and click
      here for a video guide through the tutorial below.


      Analyzing time series differential gene expression and other multi-omics data is computationally
      laborious and full of complex choices for the various types of time series experiment analyses.
      The TIMEOR web-application offers a solution as an interactive and adaptive R-Shiny web interface
      to support reproducibility and the best tools for a given experimental design.'
  timirgen:
    description: Integrates time series miRNA-mRNA differential expression data to identify high-confidence
      interactions influencing signaling pathways
    was: TimiRGeN is a R/Bioconductor package for time series microRNA-mRNA integration and analysis.
      TimiRGeN (Time Incorporated miR-mRNA Generation of Networks) is a novel R package which functionally
      analyses and integrates time course miRNA-mRNA differential expression data. This tool can generate
      small networks within R or export results into cytoscape or pathvisio for more detailed network
      construction and hypothesis generation. This tool is created for researchers that wish to dive deep
      into time series multi-omic datasets. TimiRGeN goes further than many other tools in terms of data
      reduction. Here, potentially hundreds of thousands of potential miRNA-mRNA interactions can be whittled
      down into a handful of high confidence miRNA-mRNA interactions effecting a signalling pathway, across
      a time course.
  ting:
    description: Clusters large-scale T cell receptor repertoires by antigen-specificity using CDR3 β
      sequences
    was: ting is a tool for clustering large scale T cell receptor repertoires by antigen-specificity.
  tipr:
    description: Identifies transcription start sites and their spatial initiation patterns from DNA sequence
      using a machine learning model
    was: A sequence-based machine learning model that identifies TSSs with high accuracy and resolution
      for multiple spatial distribution patterns along the genome, including broadly distributed TSS patterns
      that have previously been difficult to characterize.
  tissuenexus:
    description: Provides 49 human tissue functional gene networks built from curated RNA-seq data with
      search, visualization, and functional analysis
    was: A database of human tissue functional gene networks built with a large compendium of curated
      RNA-seq data.
  tivan-indel:
    description: Predicts non-coding regulatory small insertions and deletions using supervised machine
      learning on genomic annotations and epigenomic profiles
    was: A computational framework for annotating and predicting noncoding regulatory small insertion
      and deletion.
  tmeland:
    description: Quantifies and visualizes Waddington's epigenetic landscape from gene regulatory networks
      inferred from transcriptomic data
    was: An end-to-end pipeline for quantification and visualization of waddington's epigenetic landscape
      based on gene regulatory network.
  tn-core:
    description: Integrates Tn-seq and RNA-seq data to generate gene-centric, context-specific core metabolic
      network reconstructions
    was: 'Functionally Interpreting Transposon-Sequencing Data with Metabolic Network Analysis.


      Tn-Core is Matlab toolbox for generation of gene-centric, context-specific core metabolic network
      reconstructions through integration of experimental Tn-seq and RNA-seq datasets. The last named
      version is version 2.3. As the toolbox will continue to be updated, and to avoid countless version
      numbers, each change will no longer be associated with a new version number. Instead, changes will
      be made in Tn-Core Toolbox version stored in the directory entitled Most-Recent-Version. When using
      this version of the toolbox, the commit number can be used to document the version of the toolbox
      used.


      Transposon-sequencing (TnSeq) and genome-scale constraint-based metabolic modelling are highly complementary
      experimental and in silico approaches.'
  to_ast:
    description: Identifies topologically associated domains from Hi-C contact matrices using graph auto-encoders
      and HDBSCAN clustering
    was: A novel method for identifying topologically associated domains based on graph auto-encoders
      and clustering.
  topicnet:
    description: Applies latent Dirichlet allocation to extract functional topics for genes regulated
      by a transcription factor and quantifies regulatory network rewiring
    was: 'a framework for measuring transcriptional regulatory network change.


      Topicnet uses a method called TopicNet that applies latent Dirichlet allocation to extract functional
      topics for a collection of genes regulated by a given TF'
  topogsa:
    description: Computes and visualizes network topological properties for gene and protein sets in molecular
      interaction networks
    was: Web-application dedicated to the computation and visualization of network topological properties
      for gene and protein sets in molecular interaction networks. Different topological characteristics,
      such as the centrality of nodes in the network or their tendency to form clusters, can be computed
      and compared with those of known cellular pathways and processes (Gene Ontology, BioCarta, KEGG,
      among others).
  topp:
    description: Integrates multi-omics features and clinical data from 68 cancer projects for customized
      prognostic analysis and model construction
    was: Tumor online prognostic analysis platform for prognostic feature selection and clinical patient
      subgroup selection.
  toppcluster:
    description: Compares multiple gene lists by enrichment analysis and generates heatmaps or connectivity
      networks from functional features
    was: ToppCluster is a human/mammalian genomes-centered web server application for comparative enrichment
      and network analysis of multiple gene lists. Features such as Gene Ontology terms, protein interactions,disease
      or disease-associated mammalian phenotypes, promoter cis-elements, miR binding sites, etc. that
      are differentially represented  in the gene lists can be clustered or transformed into high dimensional
      Cytoscape or Gephi -compatible networks.
  toucan_2:
    description: Discovers cis-regulatory elements from coexpressed or coregulated genes by retrieving
      intergenic regions, scoring known binding sites, and detecting over-represented motifs
    was: Regulatory sequence analysis workbench for Metazoan sequences, directly linked with the Ensembl
      database and implementing SOAP clients for diverse alignment and motif detection algorithms.
  toxinpred2:
    description: Designs and predicts toxic and non-toxic proteins using similarity, motif, and machine-learning
      approaches
    was: A webserver for designing and predicting toxic and non-toxic proteins.
  trafac:
    description: Identifies regulatory regions by combining conserved sequence analysis with transcription
      factor binding site analysis
    was: TraFaC (Transcription Factor Binding Site Comparison) is a tool that identifes regulatory regions
      using a comparative sequence analysis approach.
  trans-pco:
    description: Detects trans effects of genetic variants on gene networks using a principal component-based
      multivariate association test
    was: Pipeline to detect trans effects of gene networks (gene module). It combines careful read and
      gene filters with a principal component (PC)-based multivariate association test.
  transcriptr:
    description: Identifies and quantifies de novo continuous transcription regions from ChIP-seq data
      of active TSS histone marks
    was: An R package for identifying and quantifying de novo continuous regions of transcription across
      the genome. The package uses ChIP-seq data of histone modifications that mark active Transcription
      Start Sites (TSSs) to divide closely spaced transcripts into individually transcriped units.
  transfac:
    description: Curates transcription factors, their binding sites, and regulated genes from eukaryotic
      genomes
    was: Transcription Factor Database of eukaryotic cis-acting regulatory DNA elements and trans-acting
      factors; free for non-commercial use.
  transfind:
    description: Predicts transcription factor binding sites in promoter regions of co-regulated gene
      sets
    was: TransFind web server predicts transcription factor binding sites in promoter regions of co-regulated
      gene sets.
  transmir:
    description: Contains experimentally supported transcription factor–miRNA regulatory pairs with organism,
      tumor involvement, and disease annotations
    was: Contains transcription factors and miRNAs along with regulatory pairs. References to the published
      literature (PubMed ID) information about the organism in which the relationship was found, whether
      the TFs and miRNAs are involved with tumors, miRNA function annotation and miRNA-associated disease
      annotation are also included. It provides a user-friendly interface by which interested parties
      can easily retrieve TF-miRNA regulatory pairs by searching for either a miRNA or a TF.
  transmodis:
    description: Identifies direct transcription factor target genes by integrating sequence motif, gene
      expression, and ChIP-chip data
    was: Generalization of MODEM to consider sequence motif and multiple gene expression or ChIP-binding
      experiments to identify TF binding sites.
  transtermhp:
    description: Finds rho-independent transcription terminators in bacterial genomes and assigns confidence
      values
    was: TransTermHP finds rho-independent transcription terminators in bacterial genomes. Each terminator
      found by the program is assigned a confidence value that estimates its probability of being a true
      terminator
  transview:
    description: Generates, accesses and displays read densities from RNA-Seq and ChIP-Seq data
    was: This package provides efficient tools to generate, access and display read densities of sequencing
      based data sets such as from RNA-Seq and ChIP-Seq.
  transynergy:
    description: Predicts synergistic drug combinations and deconvolutes contributing biological pathways
      using a deep neural network with gene dependency and drug-target interaction data
    was: Mechanism-Driven Interpretable Deep Neural Network for the Synergistic Prediction and Pathway
      Deconvolution of Drug Combinations.
  trapp:
    description: Explores protein binding site dynamics and detects transient pockets or sub-pockets from
      user-uploaded structures or trajectories
    was: TRAnsient Pockets in Proteins. Discovery of ligands that bind in transient subpockets in proteins.
      Explore the dynamics of a protein binding site and to detect pockets or sub-pockets that may transiently
      open due to protein internal motion.
  trawlerweb:
    description: Discovers enriched motifs in DNA sequences from NGS experiments to predict transcription
      factor binding site composition
    was: De novo motif discovery tool for next-generation sequencing datasets.
  treegibbssampler:
    description: Identifies motifs by combining overrepresentation and evolutionary conservation without
      requiring pre-aligned orthologous sequences
    was: Software for identifying motifs by simultaneously using the motif overrepresentation property
      and the motif evolutionary conservation property. It identifies motifs without depending on pre-aligned
      orthologous sequences, which makes it useful for the extraction of regulatory elements in multiple
      genomes of both closely related and distant species.
  treegl:
    description: Estimates multiple gene networks for cell types related by a tree-genealogy using l1
      plus total variation penalized logistic regression
    was: Software which builds on the l1 plus total variation penalized logistic regression to effectively
      estimate multiple gene networks corresponding to cell types related by a tree-genealogy, based on
      only a few samples from each cell type.
  trena:
    description: Reconstructs transcriptional regulatory networks using genome-wide TF binding site information
    was: Methods for reconstructing transcriptional regulatory networks, especially in species for which
      genome-wide TF binding site information is available.
  triform:
    description: Finds enriched regions in transcription factor ChIP-seq data using model-free statistics
      and improved peak definition
    was: IT is an R package to find enriched regions in trancription factor ChIP-seq data. The algorithm
      uses model-free statistics to identify peak-like distributions of TF ChIP sequencing reads, taking
      advantage of an improved peak definition in combination with known profile characteristics.
  trigger:
    description: Constructs global linkage maps between genetic markers and gene expression from integrative
      genomic data
    was: This R package provides tools for the statistical analysis of integrative genomic data that involve
      some combination of genotypes and traits. They allow to construct global linkage maps between genetic
      markers and gene expression, analyze multiple-locus linkage for gene expression, quantify the proportion
      of GW variation explained by each locus and identify eQTL hotspots, estimate pair-wise causal gene
      regulatory probabilities and construct gene regulatory networks.
  tripbase:
    description: Identifies human genomic DNA and lncRNA triplexes with false-positive filtering
    was: Database for identifying the human genomic DNA and lncRNA triplexes.
  triplexfpp:
    description: Predicts DNA:RNA triplex-forming lncRNAs and DNA sites using deep learning on experimentally
      verified data
    was: 'TriplexFPP: A deep learning program for DNA:RNA triplex potential prediction.


      TriplexFPP is an integrated program for DNA:RNA triplex prediction. It contains two models: 1) triplex
      lncRNA prediction model, to predict the most likely triplex forming lncRNA in practical, and 2)
      triplex DNA site prediction model, to predict if a DNA site can form triplex in practical. It will
      give researchers useful guidelines to study the DNA:RNA triplex formation. Fig. 1.An overview of
      the architechture and model parameters for TriplexFPP.'
  triplexicon:
    description: Predicts and analyzes RNA:DNA:DNA triplex interactions in human and murine gene regulatory
      elements via a web server
    was: TripLexicon is a database and web server for predicting and analyzing RNA:DNA:DNA triplex interactions,
      particularly focusing on human and murine gene regulatory elements. It utilizes the TriplexAligner
      tool and provides visualizations and analysis options for researchers.
  tritan:
    description: Integrates single-cell transcriptomes, epigenomes, and proteomes via triple non-negative
      matrix factorization to cluster cells, identify signature features, and predict regulatory networks
    was: TriTan is a tool for integrative analysis of single-cell multiomics data, implementing a highly
      efficient factorization algorithm to cluster cells, identify signature features, and predict cell-type-specific
      regulatory networks. It utilizes non-negative matrix factorization to process transcriptomes, epigenomes,
      and proteomes simultaneously.
  trlnc:
    description: Collects and annotates transcriptional regulatory regions of human lncRNAs from H3K27ac
      ChIP-seq, ATAC-seq and DNase-seq data
    was: 'TRInc is a comprehensive database for human transcriptional regulatory information of lncRNAs.


      Long noncoding RNAs (lncRNAs) have been proven to play important roles in transcriptional processes
      and biological functions. With the increasing study of human diseases and biological processes,
      information in human H3K27ac ChIP-seq, ATAC-seq and DNase-seq datasets is accumulating rapidly,
      resulting in an urgent need to collect and process data to identify transcriptional regulatory regions
      of lncRNAs. We therefore developed a comprehensive database for human regulatory information of
      lncRNAs (TRlnc, http: bio.licpathway.net TRlnc), which aimed to collect available resources of transcriptional
      regulatory regions of lncRNAs and to annotate and illustrate their potential roles in the regulation
      of lncRNAs in a cell type-specific manner'
  trviz:
    description: Decomposes, encodes, aligns and visualizes tandem repeat sequences from alleles and motifs
    was: Python library for decomposing and visualizing tandem repeat sequences.
  tscre:
    description: Catalogues tumor-specific cis-regulatory elements from patient histone modification profiles
      across 17 cancer types
    was: Comprehensive database for tumor-specific cis-regulatory elements.
  tsminer:
    description: Constructs time-specific regulatory networks from time-series expression profiles using
      transcription factors and pathway interactions
    was: 'TSMiner is a software program to construct time-specific regulatory networks from time-series
      expression profiles using two groups of genes:

      (1) genes encoding transcription factors (TFs) that are activated or repressed at a specific time;

      (2) genes involved in biological pathways showing significant mutual interactions with these TFs.

      TSMiner provides a network map with extensive interactive visualization operations to help users
      explore the time-specific regulatory networks'
  tsptfbs:
    description: Predicts transcription factor binding sites in plants by transferring Arabidopsis models
      to other species using deep convolutional neural networks
    was: a docker image for Trans-Species Prediction of Transcription Factor Binding Sites in Plants.
  tsrexplorer:
    description: Processes and explores global transcription start site mapping data, detecting TSSs,
      TSRs, and shifts in TSS distribution from BAM, GRanges, or bigWig files
    was: TSRexploreR facilitates processing and exploration of data generated by global transcription
      start site (TSS) mapping technologies such as CAGE and STRIPE-seq. TSSs can be extracted and aggregated
      from mapped reads in BAM/SAM format or pre-aggregated TSSs in GRanges, bigWig, bedGraph, or CTSS
      format can be imported. TSSs can then be normalized and clustered into transcription start regions
      (TSRs), or TSRs detected with other software such as CAGEr can be imported.
  tsser:
    description: Identifies transcription start sites genome-wide from dRNA-seq data using a probabilistic
      framework
    was: Computational pipeline designed to analyze dRNA-seq data to determine transcription start sites
      genome-wide.
  tssfinder:
    description: Predicts transcription start sites in eukaryotic genomes using pre-trained models for
      six organisms
    was: TSSFinder (ab initio prediction of the core promoter in eukaryotes) is a fast and accurate ab
      initio prediction of the core promoter in eukaryotic genomes. TSSFinder is a new software for TSS
      prediction that is faster and with higher accuracy than previously published applications.
  tssnote-cyaprombert:
    description: Predicts promoters in cyanobacteria using BERT models trained on dRNA-seq data
    was: A repo containing supplemental data for TSSNote-CyaPromBERT an integrated pipeline for constructing
      curated promoter prediction tools using SOTA BERT through public dRNA-seq datasets.
  tsspredator:
    description: Detects and classifies transcriptional start sites from RNA-seq data using a comparative
      genome-wide approach
    was: TSSpredator, a Java program for the automated detection and classification of TSS from RNA-seq
      data. TSSpredator reads RNA-seq data in the form of simple wiggle files and performs a genome wide
      comparative prediction of TSS, for example between different growth conditions.
  tssr:
    description: Identifies transcription start sites and characterizes core promoter structures from
      TSS sequencing data
    was: An R package for comprehensive analyses of TSS sequencing data.
  turf:
    description: Prioritizes regulatory variants in non-coding regions of the human genome with tissue-specific
      prediction scores using functional genomics data
    was: TURF (Tissue-specific Unified Regulatory Features) is built on the RegulomeDB framework to prioritize
      regulatory variants in the non-coding regions of the human genome. It leverages information from
      functional genomics assays and provides prediction scores in both generic and tissue-specific/organ-specific
      contexts.
  tuxnet:
    description: Processes raw RNA-seq data and infers gene regulatory networks via a graphical user interface
    was: 'a simple interface to process RNA sequencing data and infer gene regulatory networks.


      A simple graphical user interface for processing RNAseq data and inferring GRNs.


      The use of the MATLAB version of TuxNet requires a 64-bit computer running Mac or Linux with MATLAB
      installed (R2017b or later).


      MATLAB app to process raw RNA sequencing data and infer gene regulatory networks. Published and
      maintained by Sozzani Lab at North Carolina State University.


      To install, run TuxNet-MacStandaloneInstaller.app in the TuxNet-MacStandalone directory. You will
      be prompted to choose a directory where TuxNet will be installed and to install MATLAB Runtime if
      it is not already installed'
  tvar:
    description: Assesses tissue-specific functional effects of non-coding variants using a deep neural
      network trained on eQTLs across 49 human tissues
    was: Assessing Tissue-specific Functional Effects of Non-coding Variants with Deep Learning.
  u-shape3D:
    description: Detects subcellular morphological motifs like blebs, filopodia, and lamellipodia from
      3D microscopy images of cell surfaces
    was: Robust and automated detection of subcellular morphological motifs in 3D microscopy images |
      Detect morphological motifs, such as blebs, filopodia, and lamellipodia, from 3D images of surfaces,
      particularly images of cell surfaces | Software for 3D Morphological Motif Detection | This suite
      of software was designed to detect morphological motifs, such as blebs, filopodia, and lamellipodia,
      from 3D images of surfaces, particularly images of cell surfaces
  umap-dbp:
    description: Predicts DNA-binding proteins using uniform manifold approximation and projection
    was: An Improved DNA-Binding Proteins Prediction Method Based on Uniform Manifold Approximation and
      Projection.
  umi-atac-seq:
    description: Processes UMI-ATAC-seq raw data by removing adapters, extracting UMIs, removing ME sequences,
      and deduplicating with UMIs
    was: 'ATAC-seq with unique molecular identifiers improves quantification and footprinting.


      This pipeline is used for UMI-ATAC-seq raw data processing, including removing the sequencing adapters,
      extracting UMIs from the original FASTQ read1 file, removing ME sequences and using the UMIs to
      remove PCR duplicates.'
  underiicrms:
    description: Compares regulatory sequences using a parameter-free alignment-free statistic based on
      variable-length words
    was: Parameter-free Alignment-free comparison of regulatory sequences (cis-regulatory modules).  Assembly-free
      Genome Comparison based on Next-Generation Sequencing Reads and Variable Length Patterns.
  unibind:
    description: Provides high-confidence transcription factor binding site predictions from uniformly
      processed ChIP-seq data across nine species
    was: 'A map of direct TF-DNA interactions across species.


      UniBind is a comprehensive map of direct interactions between transcription factor (TFs) and DNA.
      High confidence TF binding site predictions were obtained from uniform processing of thousands of
      ChIP-seq data sets using the ChIP-eat software.


      A RESTful API to access the latest version of UniBind database programmatically.


      This API provides an easy-to-use REST web interface to query/retrieve data from the UniBind database.
      The API comes with a human browsable interface and also a programmatic interface which return the
      results in different formats, including json, jsonp, yaml, bed, and also api for a browsable interface.'
  unipath:
    description: Represents single cells using pathway and gene-set enrichment scores from scRNA-seq or
      scATAC-seq profiles
    was: 'a uniform approach for pathway and gene-set based analysis of heterogeneity in single-cell epigenome
      and transcriptome profiles.


      UniPath provides robust statistical methods to represent every single cell using pathway and gene-set
      enrichment scores. It can be used with both single cell RNA-seq and single cell ATAC-seq profile
      with scalability for atlas scale data-sets. UniPath comes with several features like pseudo-temporal
      ordering using pathway scores and unconventional way of enumerating differences between two cell
      populations.'
  uniprobe:
    description: Centralized repository of DNA-binding preferences for proteins from universal protein-binding
      microarray experiments, providing k-mer data and position weight matrices
    was: The Universal PBM Resource for Oligonucleotide-Binding Evaluation database is a centralized repository
      of information on the DNA-binding preferences of proteins as determined by universal protein-binding
      microarray (PBM) technology. Each entry for a protein in UniPROBE provides the quantitative preferences
      for all possible nucleotide sequence variants of length k, as well as position weight matrix (PWM)
      and graphical sequence logo representations of the k-mer data.
  universal_TTSs:
    description: Identifies universal Triplex Target Sites (TTSs) in DNA regions from RNA-chromatin interaction
      data
    was: The code to identify the universal Triplex Target Sites (TTSs) DNA regions
  unpairreg:
    description: Integrates single-cell multi-omics data by regression analysis on unpaired observations
    was: Integration of single-cell multi-omics data by regression analysis on unpaired observations.
  uropa:
    description: Annotates genomic ranges from ChIP-seq, ATAC-seq, or other experiments using configurable
      prioritized queries against reference annotations
    was: Intended for universal genomic range (e.g. peaks) annotation. Based on a configuration file,
      different target features can be prioritized with multiple integrated queries.
  useq:
    description: Collection of tools for analyzing ChIP-seq and RNA-seq data from next-generation sequencing
      platforms with false discovery rate estimations
    was: 'Collection of software tools for for both low and high level analysis of next generation, ultra
      high throughput signature sequencing data from the Solexa, SOLiD, and 454 platforms. Initial emphasis:
      chIP-seq and RNA-Seq with FDR estimations'
  usmpep:
    description: Predicts MHC class I and II binding affinity from peptide sequences using a simple recurrent
      neural network
    was: 'USMPep: Universal Sequence Models for Major Histocompatibility Complex Binding Afﬁnity Prediction.


      USMPep is a simple recurrent neural network for MHC binding afﬁnity prediction. It is competitive
      with state-of-the-art tools for a single model trained from scratch, while ensembling multiple regressors
      and language model pretraining can slightly improve its performance. In our paper we report the
      excellent predictive performance of USMPep on several benchmark datasets.'
  vamos:
    description: Annotates variable-number tandem repeats using repeat composition under different levels
      of motif diversity
    was: Variable-number tandem repeats annotation using efficient motif sets.
  vannoportal:
    description: Integrates genome-wide variant annotations and prediction scores from multiple biological
      domains with interactive visualizations
    was: VannoPortal is a variant annotation database that comprehensively collects and integrates genome-wide
      variant annotations and prediction scores from various biological domains, including allele frequency,
      linkage disequilibrium, evolutionary signature, disease/trait association, pathogenesis, allele
      imbalance, base-wise functional prediction and tissue/cell type-specific functional profile. It
      greatly expands context-dependent variant annotation to incorporate large-scale epigenomic maps
      across human tissues/cell types, and compiles many genome-scale base-wise prediction scores for
      pathogenic/regulatory variant classification beyond protein-coding region. VannoPortal focuses more
      on interpretability of variant annotations using many intuitive visualizations and interactive web
      components.
  varadb:
    description: Annotates and prioritizes non-coding variants from genetic and epigenomic data for human
    was: A comprehensive variation annotation database for human.
  varianttools:
    description: Detects, filters, calls, compares and plots genomic variants
    was: Tools for detecting, filtering, calling, comparing and plotting variants.
  varmole:
    description: Prioritizes disease risk variants and genes by embedding multi-omic networks into a deep
      neural network with drop-connect
    was: 'A biologically drop-connect deep neural network model for prioritizing disease risk variants
      and genes.


      Population studies such as GWAS have identified a variety of genomic variants associated with human
      diseases. To further understand potential mechanisms of disease variants, recent statistical methods
      associate functional omic data (e.g., gene expression) with genotype and phenotype and link variants
      to individual genes. However, how to interpret molecular mechanisms from such associations, especially
      across omics is still challenging. To address this, we develop an interpretable deep learning method,
      Varmole to simultaneously reveal genomic functions and mechanisms while predicting phenotype from
      genotype. In particular, Varmole embeds multi-omic networks into a deep neural network architecture
      and prioritizes variants, genes and regulatory linkages via drop-connect without needing prior feature
      selections.'
  velorama:
    description: Infers causal gene regulatory relationships from RNA velocity data
    was: Causal gene regulatory analysis with RNA velocity reveals an interplay between slow and fast
      transcription factors.
  venas:
    description: Identifies genome-wide associations between enhancers and alternative splicing in human
      and mouse using integrated enhancer and RNA-seq data
    was: Genome-wide identification of associations between enhancer and alternative splicing in human
      and mouse.
  vernal:
    description: Mines fuzzy network motifs from RNA 3D structures using graph representation learning
      and clustering
    was: A Tool for Mining Fuzzy Network Motifs in RNA.
  vgo:
    description: Displays viral genome information including genes, ORFs, and codons, and performs sequence
      motif searches and genome comparisons
    was: Viral Genome Organizer is a genome browser that can be used to display information about a genome,
      its genes, ORFs and start/stop codons. It can also be used to perform a regular expression search,
      a fuzzy motif search and a masslist search, as well as compare genomes with VOCs genome sequence
      database.
  viennngs:
    description: Builds efficient NGS data processing pipelines with modules for file conversion, read
      mapping statistics, RNA normalization, splice junction identification, and UCSC genome browser hub
      construction
    was: Build efficient pipelines for NGS data processing. Extracts and converts features from common
      NGS file formats, computation and evaluation of read mapping statistics, as well as normalization
      of RNA abundance. Moreover, It allows identification and characterization of splice junctions from
      RNA-seq data, parsing and condensing sequence motif data, automated construction of Assembly and
      Track Hubs for the UCSC genome browser, as well as wrapper routines for a set of commonly used NGS
      command line tools.
  virhostlncr:
    description: Explores lncRNAs and their targets in viral infections
    was: A comprehensive database to explore lncRNAs and their targets in viral infections.
  virnatrap:
    description: Identifies viral reads and assembles viral contigs from tumor RNA-seq data using a deep
      learning model
    was: Characterizing the landscape of viral expression in cancer by deep learning.
  virtual_chip-seq:
    description: Predicts transcription factor binding in new cell types by learning associations with
      gene expression and chromatin accessibility
    was: Predicting transcription factor binding by learning from the transcriptome.
  visgremlin:
    description: Detects and visualizes conserved motifs at the atomic level in 3D protein-ligand interfaces
      using graph mining
    was: 'A graph mining based detection and visualization of conserved motifs in 3D protein-ligand interface
      at the atomic level.


      Interactions between proteins and non-proteic small molecule ligands play important roles in biological
      processes of living systems.'
  vista_enhancer_browser:
    description: A database of experimentally validated human and mouse enhancers with tissue-specific
      reporter gene expression patterns
    was: A resource for experimentally validated human and mouse enhancers. Users can retrieve elements
      near single genes of interest, search for enhancers that target reporter gene expression to a particular
      tissue, or download entire collections of enhancers with a defined tissue specificity or conservation
      depth.
  vivarium-collective:
    description: A registry of open-source simulation modules that can be wired together to generate multi-scale
      biological simulations
    was: The Vivarium Collective is a registry for open-source Vivarium-compatible simulation modules.
      These can be wired together to generate novel multi-scale simulations, with the most appropriate
      algorithm for each biological mechanism.
  vombat:
    description: Predicts transcription factor binding sites using variable-order Bayesian network models
    was: Predict transcription factor binding sites (TFBS) and other motifs in sequence data based on
      Variable Order Markov models and variable order Bayesian Trees.
  vsampler:
    description: Samples control variants with matched properties for GWAS enrichment analysis and regulatory
      variant prediction
    was: 'vSampler is both a web-based tool and a local program to support matched control variant sampling.
      Given input variants, vSampler could randomly sample control variants with matched minor allele
      frequency (MAF), distance to closet transcription start site (DTCT), number of nearby genes, number
      of variants in LD, GC content and many other properties. These matched random controls could be
      used to construct null distribution for GWAS enrichment analysis to estimate significance of enrichment
      empirically or serve as negative training/test data for regulatory variant prediction methods.


      vSampler runs significantly faster than existing tools, supports both SNPs and indels and provides
      comprehensive state of art variant annotations as matching properties. A novel data structure and
      algorithm were developed to achieve this performance improvement.'
  vsrnafinder:
    description: Identifies high-confidence viral small RNAs from small RNA-Seq data using peak calling
      and Poisson distribution
    was: A novel method for identifying high-confidence viral small RNAs from small RNA-Seq data.
  vulcan:
    description: Infers transcription factor co-regulators by overlaying patient-derived co-expression
      networks onto ChIP-seq data
    was: VirtUaL ChIP-Seq Analysis through Networks is a package that interrogates gene regulatory networks
      to infer cofactors significantly enriched in a differential binding signature coming from ChIP-Seq
      data.
  w-chipeaks:
    description: Defines peaks from ChIP-chip and ChIP-seq data using probe-based or bin-based enrichment
      thresholds with FDR control
    was: This employs a probe-based or bin-based enrichment threshold to define peaks and applies statistical
      methods to control the false discovery rate for identified peaks.
  w-chipmotifs:
    description: Discovers de novo motifs from ChIP-based high-throughput data using multiple tools and
      bootstrap resampling
    was: Web application tool for de novo motif discovery from ChIP-based high throughput data.
  washu_epigenome_browser:
    description: Visualizes, integrates, and analyzes epigenomic datasets including 1D, 2D, 3D, and 4D
      genomic data in a web browser
    was: WashU Epigenome Browser is a web-based genomic data exploration tool that provides visualization,
      integration, and analysis of epigenomic datasets.
  waveseqr:
    description: Detects punctate and diffuse enrichment regions from ChIP-seq data using the continuous
      wavelet transform
    was: A peak-caller for detecting punctate and diffuse enrichment regions that utilizes the continuous
      wavelet transform framework.
  web-mcot:
    description: Searches for co-occurring motif pairs with spacers and overlaps in ChIP-seq data
    was: Web-MCOT Server for Motif Co-Occurrence Search in ChIP-Seq Data.
  web-thermodyn:
    description: Computes DNA helical stability from nucleotide sequences to predict sites of low stability
      at regulatory regions for transcription and replication
    was: Analyzes DNA sequences and computes the DNA helical stability. This tool can be used to predict
      sites of low helical stability present at regulatory regions for transcription and replication.
  web_weeder:
    description: Identifies conserved motifs likely to be transcription factor binding sites from sets
      of related regulatory DNA sequences
    was: Server which identifies conserved motifs within sets of related regulatory DNA sequences, which
      are likely to be transcription factor binding sites.  The interface will automatically conduct several
      runs using different parameters and output a summary.
  webgmap:
    description: Aligns cDNA sequences to genomes with integrated visualization and mining tools
    was: A web server with a suite of tools for cDNA-genome alignment, visualization and mining. The sequence
      viewer allows for nucleotide positioning, 6-frame translations, sequence reverse complementation
      and imperfect motif detection and alignment. Users can also sort, filter and search for individual
      cDNA sequences or alignments.
  weblogo:
    description: Generates sequence logos from multiple sequence alignments
    was: Web-based application designed to make generate sequence logos.
  webmotifs:
    description: Discovers, scores, clusters and visualizes DNA-sequence motifs using multiple programs
      and Bayesian approaches
    was: WebMOTIFS is a tool for motif discovery, scoring, analysis, and visualization. It allows you
      to use different programs (AlignACE, MDscan, MEME, and Weeder) to search for DNA-sequence motifs,
      and evaluate the results.
  weeder:
    description: Discovers de novo transcription factor binding site motifs in DNA sequences from coregulated
      genes or ChIP-seq data
    was: De novo motif (transcription factor binding sites) discovery in sequences from coregulated genes
      of a single species. This is a new release rewritten to be faster and optimized for large ChIP-Seq
      data.
  weederh:
    description: Identifies conserved transcription factor binding sites in a sequence by comparing it
      to homologs without requiring alignment
    was: Identifies conserved transcription factor binding sites in a given sequence by comparing it to
      one or more homologs.
  wgrn:
    description: Integrates complementary functional datasets to construct a wheat regulatory network
      for trait-associated gene discovery
    was: A wheat integrative regulatory network from large-scale complementary functional datasets enables
      trait-associated gene discovery for crop improvement.
  wiggler:
    description: Produces normalized genome-wide signal coverage tracks from raw read alignment files
      for ChIP-seq, DNase-seq, FAIRE-seq and MNase-seq data, modeling mappability to distinguish missing
      data from true zero signal
    was: Produces normalized genome-wide signal coverage tracks from raw read alignment files. Allows
      pooling of replicate datasets while allowing for replicate and data-type specific read shifting
      and smoothing parameters. It can be used to generate signal density maps for ChIP-seq, DNase-seq,
      FAIRE-seq and MNase-seq data. Wiggler also implicitly models variability in mappability to appropriately
      normalize signal density and distinguish missing data from true zero signal.
  wikigene:
    description: Collects and curates gene regulation data through a community-based wiki approach
    was: Scientific project that follows a community-based approach to collect data about genes and gene
      regulatory events.
  wintf:
    description: Predicts target genes of transcription factors from noisy TF-gene associations and protein-protein
      interaction networks using weighted imputed neighborhood-regularized tri-factorization
    was: 'A New Weighted Imputed Neighborhood-regularized Tri-factorization One-class Collaborative Filtering
      Algorithm.


      Weighted, Imputed, Neighbor-regularized matrix TriFactorization, WINTF.'
  wordspy:
    description: Searches for over-represented and discriminative words in sequences to identify transcription
      factor binding motifs
    was: Allows the user to search for over-represented words in a set of sequences and to search for
      discriminative words using negative sequence data. It employs this functionality as a means to search
      for transcription factor binding motifs.
  wto:
    description: Assesses weighted topological overlap to improve fidelity of gene co-expression networks
    was: 'Assessment of weighted topological overlap (wTO) to improve fidelity of gene co-expression networks.


      For more than a decade, gene expression data sets have been used as basis for the construction of
      co-expression networks used in systems biology investigations, leading to many important discoveries
      in a wide range of subjects spanning human disease to evolution and the development of organisms.
      A commonly encountered challenge in such investigations is first that of detecting, then subsequently
      removing, spurious correlations (i.e. links) in these networks. While access to a large number of
      measurements per gene would reduce this problem, often only a small number of measurements are available.
      The weighted Topological Overlap (wTO) measure, which incorporates information from the shared network-neighborhood
      of a given gene-pair into a single score, is a metric that is frequently used with the implicit
      expectation of producing higher-quality networks'
  x-cnn:
    description: Fine-maps chromatin interactions from Hi-C data by integrating ChIP-seq and DNase-seq
      with a convolutional neural network
    was: X-CNN is a method for fine-mapping chromatin interactions,  e.g. Hi-C, using ChIP-seq and/or
      DNase data.
  x-omics_action_demonstrator_multi-omics_analysis_workflow:
    description: Clusters individuals using Similarity Network Fusion and uncovers latent feature dimensions
      from multi-omics data with unsupervised methods including MOFA and MCA
    was: This multi-omics data analysis workflow was developed as part of a case study investigating shared
      patterns between multi-omics data and childhood externalizing behaviour. The modular Nextflow workflow
      was implemented using FAIR practices. It comprises genome-wide DNA methylation, targeted metabolomics
      and behaviour data pre-processing, and integrative analysis methods. Individuals of a cohort are
      clustered using Similarity Network Fusion (SNF), latent feature dimensions are uncovered using different
      unsupervised methods including Multi-Omics Factor Analysis (MOFA) and Multiple Correspondence Analysis
      (MCA), and correlations between -omics and phenotype dimensions are determined in downstream analyses
      including results visualisation.
  x2k:
    description: Identifies upstream regulators from genome-wide gene expression data by integrating ChIP-seq,
      PWMs, protein interactions, and kinase-substrate reactions
    was: Method to identify upstream regulators likely responsible for observed patterns in genome-wide
      gene expression. By integrating ChIP-seq/chip and position-weight-matrices (PWMs) data, protein-protein
      interactions, and kinase-substrate phosphorylation reactions, it can better identify regulatory
      mechanisms upstream of genome-wide differences in gene expression.
  x2k_web:
    description: Infers upstream regulatory networks of transcription factors, proteins, and kinases from
      differentially expressed gene signatures
    was: Infers upstream regulatory networks from signatures of differentially expressed genes. By combining
      transcription factor enrichment analysis, protein-protein interaction network expansion, with kinase
      enrichment analysis,  produces inferred networks of transcription factors, proteins, and kinases
      predicted to regulate the expression of the inputted gene list.
  xg-m7g:
    description: Predicts N7-methylguanosine sites in transcriptomes using XGBoost and SHAP
    was: 'An Interpretable Prediction Model for Identifying N<sup>7</sup>-Methylguanosine Sites Based
      on XGBoost and SHAP.


      Recent studies have increasingly shown that the chemical modification of mRNA plays an important
      role in the regulation of gene expression. N<sup>7< sup>-methylguanosine (m7G) is a type of positively-charged
      mRNA modification that plays an essential role for efficient gene expression and cell viability.
      However, the research on m7G has received little attention to date. Bioinformatics tools can be
      applied as auxiliary methods to identify m7G sites in transcriptomes. In this study, we develop
      a novel interpretable machine learning-based approach termed XG-m7G for the differentiation of m7G
      sites using the XGBoost algorithm and six different types of sequence-encoding schemes. Both 10-fold
      and jackknife cross-validation tests indicate that XG-m7G outperforms iRNA-m7G'
  xlnc1dcnn:
    description: Distinguishes long non-coding RNAs from protein-coding transcripts using a one-dimensional
      convolutional neural network with prediction explanations
    was: Interpretable Deep Learning Model Reveals Subsequences of Various Functions for Long Non-Coding
      RNA Identification.
  xstreme:
    description: Performs comprehensive motif discovery and enrichment analysis on DNA, RNA, or protein
      sequences using MEME, STREME, and SEA algorithms
    was: XSTREME performs comprehensive motif analysis (including motif discovery) on sequences where
      the motif sites can be anywhere in the sequences (sample output from sequences). The input sequences
      may be of any length, and their lengths may vary.
  xxmotif:
    description: Discovers enriched motifs from nucleotide sequences by directly optimizing the statistical
      significance of position weight matrices
    was: 'Web server that can discover motifs that are enriched in sets of nucleotide sequences provided
      by the user. It uses a new approach for finding enriched motifs: It directly optimizes the statistical
      significance of enrichment for PWMs. It can also score conservation and positional clustering of
      motifs. In several benchmarks on yeast and metazoan sequences, the underlying XXmotif method showed
      better sensitivity and produced PWMs of higher quality than state-of-the-art tools.'
  yeastract:
    description: Curates regulatory associations between transcription factors and target genes in Saccharomyces
      cerevisiae, with tools to identify regulators and regulons
    was: The YEAst Search for Transcriptional Regulators And Consensus Tracking is a curated repository
      of regulatory associations between transcription factors (TF) and target genes in Saccharomyces
      cerevisiae. It includes DISCOVERER and allows the identification of documented or potential transcription
      regulators of a given gene and of documented or potential regulons for each transcription factor.
  yeastract_plus:
    description: Predicts and visualizes gene regulation in non-conventional yeasts using orthologous
      regulatory associations from comparative genomics
    was: YEASTRACT+ combines the existing database information of all yeast species, providing bioinformatics
      tools for the prediction and visualization of gene and genomic regulation based on orthologous regulatory
      associations described for other yeast species, based on comparative genomics.
  ymf_3.0:
    description: Searches for statistically overrepresented motifs to identify transcription factor binding
      sites in multiple organisms
    was: YMF 3.0 (Yeast Motif Finder) is a tool that identifies good candidates for transcription factor
      binding sites by searching for statistically overrepresented motifs.  Multiple organisms are supported
      including human, yeast, worm, plants, and microbes.
  yodel:
    description: Calls peaks from HITS-CLIP data using a heuristic approach to define peak boundaries
    was: Peak caller for HITS-CLIP data.
  ypa:
    description: Collects and integrates nine kinds of promoter features for Saccharomyces cerevisiae,
      including sequences, TSSs, UTRs, TATA boxes, TFBSs, nucleosome occupancy, DNA bendability, TF binding,
      TF knockout expression, and TF-TF interactions
    was: Database that collects promoter features in Saccharomyces cerevisiae. It integrates nine kinds
      of promoter features including promoter sequences, genes transcription boundaries-transcription
      start sites (TSSs), five prime untranslated regions (5’-UTRs) and three prime untranslated regions
      (3’-UTRs), TATA boxes, transcription factor binding sites (TFBSs), nucleosome occupancy, DNA bendability,
      transcription factor (TF) binding, TF knockout expression and TF-TF physical interaction.
  ytlr:
    description: Extracts yeast transcription factor-gene associations from the literature using automated
      text mining
    was: Extracting yeast transcription factor-gene associations from the literature using automated literature
      readers.
