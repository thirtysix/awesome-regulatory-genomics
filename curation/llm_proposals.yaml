descriptions:
  3defdr:
    description: Identifies cell type-specific looping interactions from 5C and Hi-C data using a statistical
      framework
    was: '3DeFDR is a statistical methods for identifying cell type-specific looping interactions in 5C
      and Hi-C data.


      An important unanswered question in chromatin biology is the extent to which long-range looping
      interactions change across developmental models, genetic perturbations, drug treatments, and disease
      states. Computational tools for rigorous assessment of cell type-specific loops across multiple
      biological conditions are needed. We present 3DeFDR, a simple and effective statistical tool for
      classifying dynamic loops across biological conditions from Chromosome-Conformation-Capture-Carbon-Copy
      (5C) and Hi-C data. Our work provides a statistical framework and open-source coding libraries for
      sensitive detection of cell type-specific loops in high-resolution 5C and Hi-C data from multiple
      cellular conditions'
  3dgene:
    description: Database and visualization tool for predicted 3D conformations of active genes in GM12878
      cells using the e-HiP-HoP framework
    was: 3DGene is a database and visualization tool that provides predicted 3D conformations of active
      genes in GM12878 human lymphoblastoid cells, generated using the e-HiP-HoP framework.  The database
      offers interactive visualizations and downloadable simulation data, revealing insights into gene
      structure and regulatory networks.
  3div:
    description: Visualizes chromatin interactions from Hi-C data with options for epigenetic annotation
      and cancer genome rearrangement analysis
    was: '3D-Genome Interaction Viewer & database is a comprehensive resource of 3D genome and 3D cancer
      genome.

      3D genome organization is tightly coupled with gene regulation in various biological processes and
      diseases. 3D Interaction Viewer and Database (3DIV) is a database providing chromatin interaction
      visualization in a variety of options from one-to-all chromatin interaction with epigenetic annotation
      to unique dynamic browsing tools allowing examination of large-scale genomic rearrangement mediated
      impacts in cancer 3D genome.'
  3dpolys-le:
    description: Models the interplay between chromatin and loop extrusion using polymer physics-based
      simulation
    was: An accessible simulation framework to model the interplay between chromatin and loop extrusion.
  3dsnp:
    description: Links noncoding SNPs and small INDELs to 3D interacting genes via chromatin loops
    was: 3DSNP is a database linking noncoding Variants to 3D interacting genes. It is an integrated annotation
      database linking genome-wide noncoding SNPs and small INDELs to 3D interacting genes via chromatin
      loops.
  3dtf:
    description: Calculates positional weight matrices from protein-DNA complex structures to predict
      transcription factor binding specificity
    was: 3D Transcription Factor (3DTF) is a web-server for the analysis of protein-DNA binding sites.
      It calculates the positional weight matrix (PWM), representing the DNA-binding specifity of the
      protein.
  4DGenome:
    description: Curated database of chromatin interaction data from low- and high-throughput assays across
      five organisms
    was: 'Curated database of chromatin interaction data covering five organisms: Homo sapiens, Mus musculus,
      Drosophila melanogaster, Plasmodium falciparum, and Saccharomyces cerevisiae.'
  4d-nucleome-data-portal:
    description: Searches and visualizes curated nucleomics data, including chromosome conformation capture
      and microscopy-based assays
    was: 4D Nucleome Data Portal is a resource for searching and visualizing curated nucleomics data.
      The 4D Nucleome program aims to understand the principles behind the 3D organization of the nucleus
      in space and time (the 4th dimension). The 4DN Data Visualization Workspace allows users to create
      1D or 2D genome displays. Registered users can save and share the displays they create. The Visualization
      Workspace is powered by HiGlass. The 4D Nucleome Data Portal hosts data generated by the 4DN Network
      and other reference nucleomics data sets, and an expanding tool set for open data processing and
      visualization.
  9aaTAD:
    description: Predicts 9aaTAD activation domains in a protein sequence
    was: A web application for predicting 9aaTAD activation domains in a sequence.
  AIKYATAN:
    description: Classifies genome sequences as distal regulatory regions or not using histone modification
      signatures and convolutional learning on GPU
    was: 'mapping distal regulatory elements using convolutional learning on GPU.


      BACKGROUND:The data deluge can leverage sophisticated ML techniques for functionally annotating
      the regulatory non-coding genome. The challenge lies in selecting the appropriate classifier for
      the specific functional annotation problem, within the bounds of the hardware constraints and the
      model''s complexity. In our system AIKYATAN, we annotate distal epigenomic regulatory sites, e.g.,
      enhancers. Specifically, we develop a binary classifier that classifies genome sequences as distal
      regulatory regions or not, given their histone modifications'' combinatorial signatures. This problem
      is challenging because the regulatory regions are distal to the genes, with diverse signatures across
      classes (e.g., enhancers and insulators) and even within each class (e.g., different enhancer sub-classes)'
  APEC:
    description: Clusters single cells by groups of accessible regions with synergistic signal patterns
      from epigenomic data
    was: APEC (Accessibility Pattern based Epigenomic Clustering) - single cell epigenomic clustering
      based on accessibility pattern.
  Anchor_TFBS_prediction:
    description: Predicts transcription factor binding sites across cell types using epigenomic data and
      machine learning
    was: Package for trans-cell type prediction of transcription factor binding sites.
  ApicoTFdb:
    description: Provides a web repository of experimentally validated and computationally predicted transcription
      factors and co-factors across 14 apicomplexan species
    was: The comprehensive web repository of apicomplexan transcription factors and transcription-associated
      co-factors | Despite significant progress in apicomplexan genome sequencing and genomics, the current
      list of experimentally validated transcription factors (TFs) in these genomes is incomplete and
      mainly consists of AP2 family of proteins, with only a limited number of non-AP2 family TFs and
      transcription-associated co-factors (TcoFs). We have performed a systematic bioinformatics-aided
      prediction of TFs and TcoFs in apicomplexan genomes and developed the ApicoTFdb database which consists
      of experimentally validated as well as computationally predicted TFs and TcoFs in 14 apicomplexan
      species. The predicted TFs are manually curated to complement the existing annotations. The current
      version of the database includes 1292 TFs which includes experimentally validated and computationally
      predicted TFs, representing 20 distinct families across 14 apicomplexan species
  AppleMDO:
    description: Integrates apple transcriptomic and epigenomic datasets to search co-expression networks,
      functional modules, chromatin states, and enriched epigenetic marks
    was: 'A Multi-Dimensional Omics Database for Apple Co-Expression Networks and Chromatin States.


      AppleMDO is a multi-dimensional omics database. Users can submit locus IDs to quickly search for
      co-expression networks, functional modules, chromatin states and enriched epigenetic marks. For
      gene lists in search results, gene expression profiling analysis and functional enrichment analysis
      tools are provided to systematically extract biological themes from gene lists. Additionally, the
      basic structural and functional annotations of each gene can be obtained, such as gene families,
      KEGG annotations, GO terms, orthologues in thirteen species and Pfam domains. In addition, some
      functional support toolkits are also provided, such as GO analysis, blast, motif analysis, ID conversion,
      sequence extraction and the UCSC genome browser. We hope that AppleMDO will benefit apple research
      communities and serve as a reference for other fruit trees'
  AtacWorks:
    description: Denoises and calls peaks from low-coverage or low-quality ATAC-seq data using a deep
      convolutional neural network
    was: 'A deep convolutional neural network toolkit for epigenomics.


      SDK for deep learning based processing of Atac-seq data.


      AtacWorks is a deep learning toolkit for track denoising and peak calling from low-coverage or low-quality
      ATAC-Seq data.


      AtacWorks trains a deep neural network to learn a mapping between noisy (low coverage/low quality)
      ATAC-Seq data and matching clean (high coverage/high quality) ATAC-Seq data from the same cell type.
      Once this mapping is learned, the trained model can be applied to improve other noisy ATAC-Seq datasets'
  BINDER:
    description: Integrates coexpression and comparative genomics to infer prokaryotic gene regulatory
      networks
    was: 'Computationally inferring a gene regulatory network for Mycobacterium abscessus | BINDER (BayesIan
      gene regulatory Networks inferreD via gene coExpression and compaRative genomics) is a hybrid approach,
      integrating coexpression and comparative genomics to infer prokaryotic regulons | Code, data and
      results for ''BINDER: computationally inferring a gene regulatory network for Mycobacterium abscessus'''
  BSGatlas:
    description: Integrates multiple annotation resources to create a unified genome and transcriptome
      annotation atlas for Bacillus subtilis with enhanced ncRNA and operon coverage
    was: 'An enhanced annotation of genes and transcripts for the Bacillus subtilis genome with improved
      information access.


      On this website we provide access to our annotation integration efforts for Bacillus subtilis 168.
      We integrated the gene annotations from BsubCyc, Rfam, RefSeq, SubtiWiki, and some additional resources
      (see manuscript for details). Each gene indicates from which reources its annotation stem from,
      and links to the respective resources are provided where applicable. The integration overall improved
      the annotation of non-coding RNAs (ncRNA) in B. subtilis. Based on public transcription start sites
      (TSS) and termination sites (TTS), we created a comprehensive annotation of operons, transcripts,
      and transcriptional units (TU) for 93% of the genes in the genome. We provide the BSGatlas in form
      of a UCSC browser hub, a downloadable GFF3 file, and as a light-weight interactive quick browser
      directly on this side'
  BayesPI-BAR2:
    description: Predicts functional non-coding mutations in cancer patient cohorts by integrating gene
      expression, mutation spatial distribution, and biophysical binding affinity models
    was: Python Package for Predicting Functional Non-coding Mutations in Cancer Patient Cohorts.
  BindSpace:
    description: Embeds DNA sequences and transcription factor labels into a shared space to predict binding
      signals from large-scale sequence data
    was: BindSpace decodes transcription factor binding signals by large-scale sequence embedding | The
      decoding of transcription factor (TF) binding signals in genomic DNA is a fundamental problem. Here
      we present a prediction model called BindSpace that learns to embed DNA sequences and TF labels
      into the same space. By training on binding data from hundreds of TFs and embedding over 1 M DNA
      sequences, BindSpace achieves state-of-the-art multiclass binding prediction performance, in vitro
      and in vivo, and can distinguish between signals of closely related TFs
  BioSwitch:
    description: Detects bistability and multi-steady state behaviour in signalling and gene regulatory
      networks using chemical reaction network theory and global optimization
    was: 'A tool for the detection of bistability and multi-steady state behaviour in signaling and gene
      regulatory networks.


      https://sites.google.com/view/bioswitch.


      BioSwitch is a Matlab software tool for detection of multi-steady state behaviour in biochemical
      reaction networks (specially suited for signaling and gene regulatory networks)'
  C3D:
    description: Predicts 3D genomic interactions between cis-regulatory elements using correlations in
      chromatin accessibility measurements
    was: Cross Cell-type Correlation in DNaseI hypersensitivity (C3D) - tool to predict 3D genomic interactions
      between cis-regulatory elements.
  CARNIVAL:
    description: Infers causal signaling networks from transcriptomics data using integer linear programming
    was: 'contextualizing large signaling networks with CARNIVAL.


      CAusal Reasoning for Network Identification with integer VALue programming in R.


      CARNIVAL is an R-package providing a framework to perform causal reasoning to infer a subset of
      signalling network from transcriptomics data. This work was originally based on Melas et al. with
      a number improved functionalities comparing to the original version. Transcription factors’ (TFs)
      activities and pathway scores from gene expressions can be inferred with our in-house tools DoRothEA
      & PROGENy, respectively. TFs’ activities and signed directed protein-protein interaction networks
      +/- drug targets and pathway scores are then used to derive a series of linear constraints to generate
      integer linear programming (ILP) problems. An ILP solver (CPLEX) is subsequently applied to identify
      the sub-network topology with minimised discrepancies on fitting error and model size'
  CCSeq:
    description: Identifies clusters of transcription factor binding sequences along a chromosome from
      genome annotation files and a cut-off distance
    was: 'Clusters of Colocalized Sequences.


      Abstract 0.1 Motivation Potential transcription factor (TF) complexes may be identified by testing
      whether the binding sequences of individual TF proteins form clusters with each other. These clusters
      may also indicate TF inhibition due to competitive occupancy of enhancer regions. Genome annotation
      data containing the coordinates of enhancer sequences is highly accessible via position-weight matrix
      tools. 0.2 Results An algorithm called CCSeq (Clusters of Colocalized Sequences) was developed for
      identifying clusters of sequences along a one-dimensional line, such as a chromosome, given genome
      annotation files and a cut-off distance as inputs.'
  CFEA:
    description: Provides a database of cell-free DNA epigenome profiles (5mC, 5hmC, nucleosome positioning)
      for human diseases with query, visualization, and download
    was: A cell-free epigenome atlas in human diseases | Search and download the information for the Mutual
      exclusivity. MutExGenome is a database of Mutual Exclusive mutations in mutiple species | Welcome
      to CFEA (Cell-Free Epigenome Atlas) | The cell-free DNA (cfDNA) was shown to be a powerful tool
      for the noninvasive diagnosis of various diseases and accumulating evidence suggests large-scale
      epigenetic alterations such as cfDNA methylation (5mC), cfDNA hydroxymethylation (5hmC) and cfDNA
      nucleosome positioning (NP) can sensitively detect and classify cancers. The CFEA (Cell-Free Epigenome
      Atlas) data portal is the first database dedicated to human cell-free epigenomes
  CGIDLA:
    description: Analyzes CpG island density and lineage-associated underrepresented permutations (LAUPs)
      across 32 species via a web server
    was: Developing the Web Server for CpG Island related Density and LAUPs (Lineage-associated Underrepresented
      Permutations) Study | WA web server for CpG Island study:CpG Island related density and LAUPs (Lineage-associated
      Underrepresented Permutations) analysis
  CHiCP:
    description: Integrative and interactive visualization of promoter capture Hi-C datasets
    was: Web-based tool for the integrative and interactive visualization of promoter capture Hi-C datasets.
  CIE:
    description: Infers active transcriptional regulators from differential gene expression data using
      a causal regulatory network
    was: 'a platform for directional gene set enrichment analysis and inference of active transcriptional
      regulators.


      Causal Inference and Directional Enrichment Methods on Biological Networks.


      Launching Causal Inference Engine...


      CIE is a platform for inference of active transcriptional regulators of differential gene expression.
      CIE provides a user-friendly web-app and an R-package to run inference queries on casual regulatory
      netowrks. Several regulatory networks are provided in the platform, including a TF-gene intraction
      network constructed from ChIP-seq and tissue specific gene expression data, a netowrk based on STRING-DB,
      and curated TF-gene interaction networks such as TRRUST and TRED. The R-package provides functionality
      for custom networks as well.


      Causal Inference Engine: Directional Enrichment Analysis on Biological Networks.'
  CREAM:
    description: Identifies clusters of cis-regulatory elements from chromatin accessibility profiles
      using an unsupervised machine learning approach
    was: 'Identifying clusters of cis-regulatory elements underpinning TAD structures and lineage-specific
      regulatory networks | Clustering of Genomic Regions Analysis Method | Provides a new method for
      identification of clusters of genomic regions within chromosomes. Primarily, it is used for calling
      clusters of cis-regulatory elements (COREs). ''CREAM'' uses genome-wide maps of genomic regions
      in the tissue or cell type of interest, such as those generated from chromatin-based assays including
      DNaseI, ATAC or ChIP-Seq. ''CREAM'' considers proximity of the elements within chromosomes of a
      given sample to identify COREs in the following steps: 1) It identifies window size or the maximum
      allowed distance between the elements within each CORE, 2) It identifies number of elements which
      should be clustered as a CORE, 3) It calls COREs, 4) It filters the COREs with lowest order which
      does not pass the threshold considered in the approach'
  CRUP:
    description: Predicts condition-specific regulatory units of enhancers and their target genes from
      histone modification ChIP-seq data
    was: 'A comprehensive framework to predict condition-specific regulatory units.


      We present the software Condition-specific Regulatory Units Prediction (CRUP) to infer from epigenetic
      marks a list of regulatory units consisting of dynamically changing enhancers with their target
      genes. The workflow consists of a novel pre-trained enhancer predictor that can be reliably applied
      across cell types and species, solely based on histone modification ChIP-seq data. Enhancers are
      subsequently assigned to different conditions and correlated with gene expression to derive regulatory
      units. We thoroughly test and then apply CRUP to a rheumatoid arthritis model, identifying enhancer-gene
      pairs comprising known disease genes as well as new candidate genes.'
  CSI_NGS_Portal:
    description: Automates NGS data analysis and sharing via 16 standard pipelines for DNA, RNA, ChIP,
      RIP, and other sequencing types
    was: 'An Online Platform for Automated NGS Data Analysis and Sharing.

      CSI NGS Portal is an online platform for fully automated NGS data analysis and sharing .

      CSI NGS Portal uses a single, randomly generated, persistent, secure and http-only browser cookie
      for the sole purpose of user recognition for data authorisation.'
  ChAsE_Chromatin_Analysis_and_Exploration:
    description: Provides interactive visualization, exploration, and clustering of epigenomic data such
      as ChIP-seq experiments via a desktop application
    was: 'ChAsE (Chromatin Analysis and Exploration) is a cross platform desktop application that provides
      an interactive graphical interface for analysis of epigenomic data. Features include:

      - Exploration and visualization of the data using an interactive heat map and plot interface

      - Clustering the data automatically or manually by sorting and brushing the heat map

      - Exporting results for downstream analysis or as high quality images for publications'
  ChEA3:
    description: Ranks transcription factors associated with user-submitted gene sets by integrating TF-gene
      co-expression, ChIP-seq targets, and co-occurrence libraries
    was: Transcription factor enrichment analysis by orthogonal omics integration.
  ChIA-PET:
    description: Processes short-read and long-read ChIA-PET data with multithreading to detect chromatin
      interactions associated with a specific protein
    was: Computational package to process the next-generation sequence data generated from ChIA-PET experiments.
  ChIPSummitDB:
    description: Provides a database of human transcription factor binding sites from ChIP-seq data with
      tools to analyze distances between motif centers and peak summits
    was: ChIP-seq-based database of human transcription factor binding sites and the topological arrangements
      of the proteins bound to them.
  ChIPdig:
    description: Mines multi-sample ChIP-seq data with modules for mapping, peak calling, annotation,
      and differential enrichment analysis
    was: 'A comprehensive user-friendly tool for mining multi-sample ChIP-seq data | a tool for analysing
      and mining multi-sample ChIP-seq data | ChIPdig is a tool designed for the bulk analysis of ChIP-seq
      data comprising multiple samples. Its capabilities are organized into four analysis modules: | In
      the example above, the first command establishes communication with the Bioconductor repository
      and the second command installs package “edgeR”. Repeat the second command for the remaining Bioconductor
      packages used by ChIPdig:'
  ChIPseqSpikeInFree:
    description: Normalizes ChIP-seq data to reveal global changes in histone modifications without spike-in
      controls
    was: '> CORRECT NAME OF TOOL COULD ALSO BE ''RESULTS:ChIPseqSpikeInFree'' | A ChIP-seq normalization
      approach to reveal global changes in histone modifications without spike-in | A Spike-in Free ChIP-Seq
      Normalization Approach for Detecting Global Changes in Histone Modifications | We develop ChIPseqSpikeInFree,
      a novel ChIP-seq normalization method to effectively determine scaling factors for samples across
      various conditions and treatments, which does not rely on exogenous spike-in chromatin or peak detection
      to reveal global changes in histone modification occupancy. This method is capable of revealing
      the similar magnitude of global changes as the spike-in method | Traditional reads per million (RPM)
      normalization method is inappropriate for the evaluation of ChIP-seq data when the treatment or
      mutation has the global effect'
  ChIPulate:
    description: Simulates read counts in a ChIP-seq experiment to assess biological and experimental
      sources of variation
    was: A Python3 framework to simulate read counts in a ChIP-seq experiment.
  ChiCMaxima:
    description: Detects chromatin looping interactions from Capture Hi-C data using local maxima with
      biological replicate integration
    was: Pipeline for analyzing and identificantion of chromation loops in CHi-C promoters data.
  ChromDragoNN:
    description: Predicts genome-wide chromatin accessibility across cellular contexts by integrating
      regulatory DNA sequence and gene expression
    was: 'Integrating regulatory DNA sequence and gene expression to predict genome-wide chromatin accessibility
      across cellular contexts | Code for the paper "Integrating regulatory DNA sequence and gene expression
      to predict genome-wide chromatin accessibility across cellular contexts" | ChromDragoNN: cis-trans
      Deep RegulAtory Genomic Neural Network for predicting Chromatin Accessibility'
  CiiiDER:
    description: Predicts and analyses transcription factor binding sites from regulatory regions with
      enrichment analysis via an intuitive graphical interface
    was: A tool for predicting and analysing transcription factor binding sites | CIIIDER is a user-friendly
      tool for predicting and analysing transcription factor binding sites, designed with biologists in
      mind | Transcription factor binding site prediction and visualisation software
  Cistrome-GO:
    description: Web server for functional enrichment analysis of transcription factor ChIP-seq peaks,
      with solo and ensemble modes integrating differential gene expression data
    was: Web server for functional enrichment analysis of transcription factor ChIP-seq peaks.
  ClinTAD:
    description: Evaluates the clinical relevance of copy number variants within topologically associated
      domains
    was: Quick evaluation of the clinical relevance of copy number variants (CNVs) in the context of topologically
      associated domains (TADs).
  ComHub:
    description: Averages predictions from multiple network inference methods to identify hub transcription
      factors in gene regulatory networks
    was: 'Community predictions of hubs in gene regulatory networks.


      Abstract Summary Hub transcription factors, regulating many target genes in gene regulatory networks
      (GRNs), play important roles as disease regulators and potential drug targets. However, while numerous
      methods have been developed to predict individual regulator-gene interactions from gene expression
      data, few methods focus on inferring these hubs. We have developed ComHub, a tool to predict hubs
      in GRNs. ComHub makes a community prediction of hubs by averaging over predictions by a compendium
      of network inference methods. Benchmarking ComHub to the DREAM5 challenge data and an independent
      data set of human gene expression, proved a robust performance of ComHub over all data sets. Lastly,
      we implemented ComHub to work with both predefined networks and to do standard network inference,
      which we believe will make it generally applicable'
  CyGenexpi:
    description: Validates and infers genetic networks from time series expression data using an ODE model
    was: CyGenexpi is a Cytoscape plugin for validating/inferring genetic networks from time series expression
      data. It is based on a ordinary differential equation (ODE) model of gene regulation.
  D3GRN:
    description: Infers gene regulatory networks from gene-expression data by transforming regulatory
      relationships into functional decomposition problems and solving them with ARNI, bootstrapping and
      area-based scoring
    was: 'a data driven dynamic network construction method to infer gene regulatory networks.


      Gene regulatory network;Dynamic networks construction;Regression;DREAM challenge.


      D3GRN is a Data Driven Dynamic network construction method to infer Gene Regulatory Networks'
  DAMEfinder:
    description: Detects regions of differential allele-specific methylation from bisulfite sequencing
      data across sample groups
    was: DAMEfinder (Differential Allele-specific MEthylation finder) is an R-package that detects allele-specific
      methylation (ASM) in a cohort of samples, and detects regions of differential ASM within groups
      of interest, based on Bisulfite-sequencing files.
  DAStk_-_Differential_ATAC-seq_toolkit:
    description: Detects significant changes in transcription factor activity from differential ATAC-seq
      data using accessible chromatin changes
    was: The Differential ATAC-seq Toolkit (DAStk) is a set of command-line tools to aid analyzing differential
      ATAC-seq data. By leveraging changes in accessible chromatin, we can detect significant changes
      in transcription factor (TF) activity. This is a simple but powerful tool for cellular perturbation
      analysis. In fact, the applications of DAStk are not necessarily limited to ATAC-seq, but can extend
      to comparing any pair of bedGraphs containing regions of interest, e.g. transcription regulatory
      elements (TRE) from nascent transcription assays like PRO-seq, or others like ChIP-seq peaks. To
      aid downstream analysis, DAStk also includes a graph that combines all human proteins in Uniprot,
      with their respective annotations, and all human Reactome data on biological pathways, biochemical
      reactions, and complex formation. This allows the user to query for existing knowledge about what
      aspects of the significantly changing TFs are shared among two or more of them.
  DEEPSEN:
    description: Predicts super-enhancers from genomic features using a convolutional neural network
    was: 'A convolutional neural network based method for super-enhancer prediction.


      data and material In this folder, we include all the material and data used in the DEEPSEN'
  DESSO:
    description: Identifies sequence and shape regulatory motifs from human ChIP-seq data using deep neural
      networks and a binomial distribution model
    was: DESSO is a deep learning-based framework that can be used to accurately identify both sequence
      and shape regulatory motifs from the human genome.
  DIpartite:
    description: Detects bipartite transcription factor binding motifs from DNA sequences using a dinucleotide
      weight matrix and Gibbs sampling
    was: A tool for detecting bipartite motifs by considering base interdependencies | A DNA sequence
      motif finding program | DIpartite is a tool for detecting bipartite motif based on dinucleotide
      weight matrix | DIpartite predicts transcription factor binding sites (TFBSs) based on PWM or DWM.
      Bipartite motif is defined as two conserved blocks separated by variable gaps
  DNA_Rchitect:
    description: Visualizes HiC and other genomic data as interactive network graphs with bezier curves
      and network statistics
    was: An R based visualizer for network analysis of chromatin interaction data | A Shiny App for visualizing
      genomic data | Welcome to the github repository for DNA Rchitect, a Shiny App for visualizing genomic
      data | DNA Rchitect is a Shiny App for visualizing genomic data (HiC, mRNA, ChIP, ATAC etc) in bed,
      bedgraph, and bedpe formats. HiC (bedpe format) data is visualized with both bezier curves coupled
      with network statistics and graphs (using an R port of igraph). Shiny Apps are interactive web applications
      built with R using the shiny R package. Shiny apps are built with R wrappers for HTML, CSS, and
      JS to run R code in a web browser through a dynamic and reactive user interface that is powered
      by an underlying NodeJS engine. These apps can be locally hosted from an R session or hosted in
      the cloud through a ShinyServer
  DROPA:
    description: Annotates DRIP-seq peaks to genes using gene expression information, with customizable
      options and strand-aware assignment
    was: DRIP-seq optimized peak annotator | DROPA is a fully customizable peak-annotation tool optimized
      for DRIP-seq peaks, which allows a finest gene annotation based on gene expression information.
      Its output can easily be integrated into pipelines to perform downstream analyses, while useful
      and informative summary plots and statistical enrichment tests can be produced. Although it is developed
      for R-loop mapping, DROPA can also be used to annotate other genomic sequencing data as in the case
      of Histone marks IP-seq, DNAse-seq, FAIRE-seq
  DRV:
    description: Visualizes functional groups and DNA descriptors to reveal specificity-determining patterns
      in protein-binding DNA segments
    was: DNA Readout Viewer is a free on-line service providing novel and intuitive visualisation modes
      for displaying sequence specific DNA-protein interactions.
  DeltaNeTS:
    description: Infers direct gene targets of drugs and diseases from steady-state and time-series transcriptional
      profiles using gene regulatory network information
    was: 'Elucidating the mechanism of drugs and diseases using gene expression and transcriptional regulatory
      networks.


      DeltaNeTS+ is a major improvement to our previous method DeltaNet. DeltaNeTS+ is a method for inferring
      direct gene targets of drug compounds and diseases from steady-state and/or time-series transcriptional
      profiles. DeltaNeTS+ incorporates gene regulatory information (if avaialbe) during the inference.
      DeltaNeTS+ generates a perturbation score for each gene in every sample. The score magnitude reflects
      the confidence that the transcription process of this gene was directly affected by the external
      stimuli. The score sign indicates the nature of the perturbation: positive for gene induction, negative
      for gene repression'
  Dr.seq2:
    description: Quality control and analysis pipeline for parallel single cell transcriptome, Drop-ChIP,
      and scATAC-seq data
    was: 'A quality control and analysis pipeline for parallel single cell transcriptome and epigenome
      data. It provides quality control and analysis functionalities for three data types: single cell
      transcriptome data, Drop-ChIP data and scATAC-seq data.'
  DriverDBv3:
    description: Integrates somatic mutation, RNA expression, methylation, copy number variation and clinical
      data for cancer driver gene identification
    was: DriverDBv4 is a cancer omics database which incorporates somatic mutation, RNA expression, miRNA
      expression, methylation, copy number variation and clinical data in addition to annotation bases.
  EAT-Rice:
    description: Predicts flanking gene expression of T-DNA insertion activation-tagged rice mutants using
      a two-layer machine learning model
    was: Predictive model for flanking gene expression of T-DNA insertion activation-tagged rice mutants
      by machine learning approaches.
  ENdb:
    description: Manually curated database of experimentally supported enhancers with target genes, transcription
      factors, and disease associations for human and mouse
    was: A manually curated database of experimentally supported enhancers for human and mouse. Enhancers
      are a class of cis-regulatory elements that can increase gene transcription by forming loops in
      intergenic regions, introns and exons
  EPEE:
    description: Performs differential analysis of transcription factor activity from gene expression
      data using a multivariate model that accounts for shared targets and context-specific regulatory
      networks
    was: Effector and Perturbation Estimation Engine (EPEE) conducts differential analysis of transcription
      factor activity from gene expression data.
  EPIC-TABSAT:
    description: Analyzes targeted bisulfite sequencing data and integrates array-based methylation results
      for methylation calling and epiallele computation
    was: Analysis tool for targeted bisulfite sequencing experiments and array-based methylation studies.
  EPIGENE:
    description: Annotates genome-wide transcription units from histone modification data using a constrained
      semi-supervised multivariate hidden Markov model
    was: 'genome wide transcription unit annotation using a multivariate probabilistic model of histone
      modifications.


      EPIGENE models the observed combination of histone modifications using a product of independent
      Bernoulli random variables, to identify active transcription units.


      Canadian Epigenetics, Environment and Health Research Consortium (CEEHRC) Network — Epigenomics.


      Canadian Epigenetics, Environment and Health Research Consortium (CEEHRC) Network.


      The network is funded by the Canadian Institutes of Health Research (CIHR) and Genome Canada and
      is run by epigenetics researchers from across Canada. CEEHRC is Canada''s contribution to the International
      Human Epigenome Consortium (IHEC)'
  EPIP:
    description: Predicts condition-specific enhancer-promoter interactions from genomic data
    was: A novel approach for condition-specific enhancer-promoter interaction prediction.
  EPIVAN:
    description: Predicts long-range enhancer-promoter interactions from genomic sequences using a neural
      network with pre-trained DNA vectors and attention mechanism
    was: 'Identifying enhancer-promoter interactions with neural network based on pre-trained DNA vectors
      and attention mechanism.


      EPIVAN(Promoter-Enhancer Interaction predictor with pre-trained Vector and Attention based neural
      Networks).


      EPIVAN is a new deep learning method that enables predicting long-range EPIs using only genomic
      sequences'
  EnhancerDB:
    description: Database of regulatory relationships between transcription factors, enhancers, miRNAs,
      genes, and SNPs across human tissues
    was: Database to discover the regulate relationships in the context of enhancers.
  EpiAlign:
    description: Aligns chromatin state sequences to identify locally similar regions across epigenomes
    was: Alignment-based bioinformatic tool for comparing chromatin state sequences.
  EpiAlignment:
    description: Aligns genomic regions from two species using both DNA sequence and ChIP-seq epigenomic
      profiles via dynamic programming
    was: Alignment of genomic regions with both sequence and epigenomic information.
  EpiCompare:
    description: Defines and explores genomic regions with tissue or cell type-specific epigenomic features
      using user-selected epigenomes and classification algorithms
    was: Tool to define and explore genomic regions with tissue or cell type-specific epigenomic features.
  EpiMethEx:
    description: Performs large-scale integrated analysis of methylation hotspots linked to genetic regulation
      using cyclic correlation between methylation and gene expression data
    was: R package for large-scale integrated analysis in methylation hotspots linked to genetic regulation.
  EpiMethylTag:
    description: Simultaneously detects ATAC-seq or ChIP-seq signals with DNA methylation on the same
      DNA
    was: 'EpiMethylTag simultaneously detects ATAC-seq or ChIP-seq signals with DNA methylation.

      Activation of regulatory elements is thought to be inversely correlated with DNA methylation levels'
  EpiSAFARI:
    description: Detects valley-shaped patterns in epigenetic signal profiles from ChIP-seq and bisulfite
      sequencing data using a novel smoothing method
    was: 'Sensitive detection of valleys in epigenetic signals for enhancing annotations of functional
      elements | EpiSAFARI: Sensitive Detection of Valley Shaped Patterns in Epigenetic Signal Profiles
      | EpiSAFARI is a command line tool for detection, annotation, and characterization of the valley
      shaped patterns within the functional genomics signal profiles. It takes:'
  Epigenomics_Workflow_on_Galaxy_and_Jupyter:
    description: Runs reproducible ChIP-seq and RNA-seq analysis workflows in Galaxy and Jupyter Docker
      containers
    was: Reproducible Epigenomics Analysis pipeline for the analysis of ChIP-Seq and RNA-Seq data using
      Docker images containing Galaxy and Jupyter. The analysis workflow was originally designed to analyze
      Brassica rapa data.
  FFLtool:
    description: Identifies feed forward loops of transcription factors, miRNAs, and target genes from
      integrated regulatory data in human
    was: 'A Web Server for Transcription Factor and miRNA Feed Forward Loop Analysis in Human.


      FFLtool is a webserver for analyzing Feed Forward Loop (FFL) regulatory motifs among transcription
      factors (TFs), microRNAs (miRNAs) and genes. FFLs potentially regulate thousands of target genes
      in facilitating spatiotemporal avoidance or noise buffering and play important roles in biological
      processes and diseases (see Refs. PMIDs: 20157565 and 24307685 ). It integrated TF-target data from
      hTFtarget and miR-target data from several predicted and validated databases. Except for identifying
      FFLs, FFLtools can also be used to search miR-target and TF-target information'
  FINET:
    description: Infers any network from big data using stability selection and elastic-net with parameter
      optimization
    was: FINET is a software to infer any network. Implemented by Julia with algorithms of stability selection
      and elastic-net, plus parameter optimization, finet can infer a network fast and accurately from
      a big data. Additionally, finet is user-friendly, only one single command line to complete all computational
      processes. Developed under Linux, but finet should work in any OS system. Installing and using finet
      becomes simple by using following instructions
  GLANET:
    description: Annotates and performs enrichment analysis on genomic loci with a sampling-based test
      that accounts for GC content and mappability biases
    was: Genomic loci annotation and enrichment tool.
  GOPHER:
    description: Designs probes for capture Hi-C experiments using three strategies, including promoter-focused
      and custom-region approaches
    was: Generator of probes for capture Hi-C experiments at high resolution.
  GRAM:
    description: Predicts the expression-modulating effect of non-coding variants in a cell-type specific
      manner using SELEX features and expression profiles
    was: 'A GeneRAlized Model to predict the molecular effect of a non-coding variant in a cell-type specific
      manner | GRAM: A GeneRAlized Model to predict the molecular effect of a non-coding variant in a
      cell type-specific manner'
  GRN:
    description: Infers gene regulatory networks from perturbation experiments to identify oncogenic mechanisms,
      controlling false discovery rate with NestBoot
    was: Perturbation-based gene regulatory network inference to unravel oncogenic mechanisms | Abstract
      The gene regulatory network (GRN) of human cells encodes mechanisms to ensure proper functioning.
      However, if this GRN is dysregulated, the cell may enter into a disease state such as cancer. Understanding
      the GRN as a system can therefore help identify novel mechanisms underlying disease, which can lead
      to new therapies. Reliable inference of GRNs is however still a major challenge in systems biology.
      To deduce regulatory interactions relevant to cancer, we applied a recent computational inference
      framework to data from perturbation experiments in squamous carcinoma cell line A431. GRNs were
      inferred using several methods, and the false discovery rate was controlled by the NestBoot framework.
      We developed a novel approach to assess the predictiveness of inferred GRNs against validation data,
      despite the lack of a gold standard
  GeNeCK:
    description: Constructs gene networks from expression data using ten statistical methods and optional
      hub gene information
    was: GeNeCK (Gene Network Construction Kit) is a comprehensive online tool kit that integrate various
      statistical methods to construct gene networks based on gene expression data and optional hub gene
      information.
  GeneWalk:
    description: Identifies relevant gene functions for individual genes in a biological context using
      network representation learning on a condition-specific gene regulatory network
    was: GeneWalk identifies relevant gene functions for a biological context using network representation
      learning | GeneWalk determines for individual genes the functions that are relevant in a particular
      biological context and experimental condition. GeneWalk quantifies the similarity between vector
      representations of a gene and annotated GO terms through representation learning with random walks
      on a condition-specific gene regulatory network. Similarity significance is determined through comparison
      with node similarities from randomized networks
  GkmExplain:
    description: Interprets predictive sequence patterns from nonlinear gapped k-mer SVM models using
      Integrated Gradients-based feature attribution
    was: 'Fast and accurate interpretation of nonlinear gapped k-mer SVMs | Accompanying repository for
      GkmExplain paper | GkmExplain: Fast and Accurate Interpretation of Nonlinear Gapped k-mer Support
      Vector Machines | This repository accompanies Gkmexplain: Fast and Accurate Interpretation of Nonlinear
      Gapped k-mer SVMs by Shrikumar*†, Prakash* and Kundaje† (*co-first authors †co-corresponding authors).'
  Graph_Peak_Caller:
    description: Calls ChIP-seq peaks on graph-based reference genomes by generalizing the MACS2 algorithm
    was: Tool for calling transcription factor peaks on graph-based reference genomes using ChIP-seq data.
  GripDL:
    description: Predicts gene regulatory interactions from spatial gene expression images using deep
      learning
    was: Predicting gene regulatory interactions based on spatial gene expression data and deep learning
      | Gene regulatory interaction prediction through Deep Learning | Gene regulatory interaction prediction
      through Deep Learning By Qingwei Fang, 2018
  HOT:
    description: Identifies high-occupancy target regions from ChIP-seq data and characterizes their sequence
      features
    was: Examining the basis of high-occupancy target regions.
  HaploReg:
    description: Explores annotations of noncoding genome at variants on haplotype blocks, using LD from
      1000 Genomes and chromatin state from Roadmap Epigenomics and ENCODE
    was: Association between DIO2 polymorphism and the risk of Kashin-Beck disease in the Tibetan population
      | HaploReg is a tool for exploring annotations of the noncoding genome at variants on haplotype
      blocks, such as candidate regulatory SNPs at disease-associated loci. Using LD information from
      the 1000 Genomes Project, linked SNPs and small indels can be visualized along with chromatin state
      and protein binding annotation from the Roadmap Epigenomics and ENCODE projects, sequence conservation
      across mammals, the effect of SNPs on regulatory motifs, and the effect of SNPs on expression from
      eQTL studies. HaploReg is designed for researchers developing mechanistic hypotheses of the impact
      of non-coding variants on clinical phenotypes and normal variation
  IWEPoissonPaper:
    description: Models methylation dynamics with simultaneous changes across CpG sites in CpG islands
      from cell type phylogenies
    was: Modeling methylation dynamics with simultaneous changes in CpG islands.
  ImmuneRegulation:
    description: Identifies human immune regulatory elements by exploring eQTLs, transcription factor
      binding regions, and GWAS associations across blood cell types
    was: Web-based tool for identifying human immune regulatory elements.
  LSTrAP-Lite:
    description: Infers biosynthetic and gene regulatory networks from RNA sequencing data on a credit
      card-sized ARM computer
    was: 'Inferring biosynthetic and gene regulatory networks from Artemisia annua RNA sequencing data
      on a credit card-sized ARM computer.


      Large-Scale Transcriptome Analysis Pipeline-Lite on credit card-sized ARM computer.


      If you use LSTrAP-Lite in your research, please cite: Inferring biosynthetic and gene regulatory
      networks from Artemisia annua RNA sequencing data on a credit card-sized ARM computer. Tan and Mutwil,
      2019. (https://doi.org/10.1101/661058).'
  LiPLike:
    description: Predicts high-confidence gene regulatory network interactions by iteratively removing
      interactions replaceable by linear combinations of other predictors
    was: Towards gene regulatory network predictions of high-certainty | Abstract Motivation Reverse engineering
      of gene regulatory networks has for years struggled with high correlation in expression between
      regulatory elements. If two regulators have matching expression patterns it is impossible to differentiate
      between the two, and thus false positive identifications are abundant. Results To allow for gene
      regulation predictions of high confidence, we propose a novel method, LiPLike, that assumes a regression
      model and iteratively searches for interactions that cannot be replaced by a linear combination
      of other predictors. To compare the performance of LiPLike with other available inference methods,
      we benchmarked LiPLike using three independent datasets from the previous DREAM5 challenge
  MAPS:
    description: Analyzes PLAC-seq and HiChIP data to identify long-range chromatin interactions using
      a zero-truncated Poisson regression framework to remove systematic biases
    was: MAPS (Model-based Analysis of PLAC-Seq data) pipeline is a a set of multiple scripts used to
      analyze PLAC-Seq and HiChIP data.
  MASSIF:
    description: Improves motif-to-TF linking by incorporating DNA-binding domain similarity scores
    was: 'Improved linking of motifs to their TFs using domain information.


      Improved motif enrichment analysis using protein domain type information.


      MASSIF - motif association with domain information.


      MASSIF is a novel method to improve the performance of existing tool that link motifs to TFs relying
      on TF-associated sequences.'
  MCOT:
    description: Identifies overrepresented composite elements from a single ChIP-seq dataset, including
      homo- and heterotypic motifs with various orientations and spacings
    was: 'A single ChIP-seq dataset is sufficient for comprehensive analysis of motifs co-occurrence with
      MCOT package.


      added a link to the publication · 92cb2e86.


      3rd_party/jemalloc_win_x64_5.1.0'
  MCSeEd:
    description: Profiles whole genome cytosine and adenine methylation patterns without a reference genome
      using methylation-sensitive enzyme ddRAD
    was: 'A reference-free, whole genome profiling system to address cytosine/adenine methylation changes.


      Methods for investigating DNA methylation nowadays either require a reference genome and high coverage,
      or investigate only CG methylation. Moreover, no large-scale analysis can be performed for N6-methyladenosine
      (6 mA) at an affordable price. Here we describe the methylation content sensitive enzyme double-digest
      restriction-site-associated DNA (ddRAD) technique (MCSeEd), a reduced-representation, reference-free,
      cost-effective approach for characterizing whole genome methylation patterns across different methylation
      contexts (e.g., CG, CHG, CHH, 6 mA). MCSeEd can also detect genetic variations among hundreds of
      samples. MCSeEd is based on parallel restrictions carried out by combinations of methylation insensitive
      and sensitive endonucleases, followed by next-generation sequencing.'
  MPRAnalyze:
    description: Statistical framework for analyzing massively parallel reporter assay data to quantify
      and compare enhancer activity across conditions
    was: Statistical framework for massively parallel reporter assays | Statistical Analysis of MPRA data
      | MPRAnalyze provides statistical framework for the analysis of data generated by Massively Parallel
      Reporter Assays (MPRAs), used to directly measure enhancer activity. MPRAnalyze can be used for
      quantification of enhancer activity, classification of active enhancers and comparative analyses
      of enhancer activity between conditions. MPRAnalyze construct a nested pair of generalized linear
      models (GLMs) to relate the DNA and RNA observations, easily adjustable to various experimental
      designs and conditions, and provides a set of rigorous statistical testig schemes
  MPRAnator:
    description: Designs massively parallel reporter assay experiments with tools for motif placement,
      SNP effects, and negative controls
    was: Web-based tool for the design of massively parallel reporter assay experiments.
  MariaOsmala:
    description: Predicts enhancers in the human genome by probabilistic modeling of chromatin feature
      patterns from ChIP-seq data
    was: 'Enhancer prediction in the human genome by probabilistic modeling of the chromatin feature patterns.


      This package is a PRobabilistic Enhancer PredictIoN Tool PREPRINT.


      Clone the project to the desired directory, this will be your path_to_dir.


      https://github.com/MariaOsmala/RFECS_BUG_FIXES.git.'
  MatrixMotif:
    description: Discovers de novo transcription factor binding site motifs from NGS enrichment data using
      combinatorial hybrid algorithms
    was: We propose MatrixMotif(MM), a new combinatorial hybrid algorithm allowing qualitative and quantitative
      analysis of TFBS (Transcription Factor Binding Site) motifs using NGS data originated from DNA extraction
      and enrichment techniques. MM allows de novo motifs discovery and motifs iteration employing enumerative
      and probabilistic models based on several types of matrixes. MM primarily utilizes set of sequences
      from NGS in fasta format as a template for mathematical and statistical modeling. Fasta format can
      be generated from fastq format (Illumina platform) set of individual enriched sequences. MM generates
      final motifs as PPM, PWM or TFFM allowing visualization of de novo computed motifs.
  MaveDB:
    description: An open-source platform to distribute and interpret data from multiplexed assays of variant
      effect
    was: 'An open-source platform to distribute and interpret data from multiplexed assays of variant
      effect.


      Table of Multiplexed Assay of Variant Effect (MAVE) studies.


      MaveDB - A repository for MAVE assay datasets.


      To cite this document, please use the citation details for MaveDB.


      MaveDB is a public repository for datasets from Multiplexed Assays of Variant Effect (MAVEs), such
      as those generated by deep mutational scanning (DMS) or massively parallel reporter assay (MPRA)
      experiments.


      Welcome to our table of Multiplexed Assay of Variant Effect (MAVE) studies. To contribute a study
      or amend/expand an existing entry, please use the GitHub issue tracker or create a pull request'
  MethBase:
    description: Provides a reference methylome database from public BS-seq datasets for different organisms
    was: A reference methylome database for different organisms that is created from public BS-seq datasets.
  MethylCal:
    description: Bayesian calibration of methylation levels from bisulfite amplicon sequencing using standard
      controls, with differential methylation testing
    was: Bayesian calibration of methylation levels | This package allows the calibration of methylation
      levels using MethylCal, a Bayesian calibration tool based on INLA (Rue et al., 2009). The package
      permits the visualisation of the calibration curve derived from standard controls with known methylation
      percentages for a selected assay. It also allows the correction of the methylation levels in case
      and control samples. If cases are provided, MethylCal performs a differential methylation test to
      detect hyper- and hypo-methylated samples. Besides MethylCal method, the package also includes the
      calibration and the correction provided by two alternative methods (Warnecke et al., 1997; Moskalev
      et al., 2011)
  ModEx:
    description: Extracts mode of regulation (activation vs. repression) of transcription factor-gene
      interactions from text
    was: 'A text mining system for extracting mode of regulation of transcription factor-gene regulatory
      interaction.


      Deciphering the network of TF-target interactions with information on mode of regulation (activation
      vs. repression) is an important step toward understanding the regulatory pathways that underlie
      complex traits. There are many experimental, computational, and manually curated databases of TF-gene
      interactions. In particular, high-throughput ChIP-seq datasets provide a large-scale map or transcriptional
      regulatory interactions.


      ModEx can be installed using the GitHub repository. All of the dependencies will be installed via
      setup.py script.


      Saman Farahmand, Todd Riley, Kourosh Zarringhalam, "ModEx: A text mining system for extracting mode
      of regulation of Transcription Factor-gene regulatory interaction", BioRxiv, 2019'
  MtBNN:
    description: Quantifies functional impact of non-coding variants using a multi-task Bayesian neural
      network on genomic sequences
    was: 'Quantifying Functional Impact of Noncoding Variants with Multi-task Bayesian Neural Network.


      The python script for MtBNN. The help information can be obtain by'
  MutSpot:
    description: Detects non-coding mutation hotspots in cancer genomes by modeling background mutation
      probability and testing recurrence with a Poisson binomial model
    was: Detection of non-coding mutation hotspots in cancer genomes | Non-coding MUTation hotSPOT dectection
      in cancer genomes | The MutSpot R package systematically and unbiasedly scans cancer whole genomes
      to detect mutation hotspots. MutSpot first builds a background mutation model that corrects for
      covariates of mutation probability, such as local nucleotide context, replication timing and epigenomic
      features. Then MutSpot evaluates the mutation recurrence of focal DNA regions using a Poisson binomial
      model to account for varying mutation rates across different tumors. Mutation hotspots identified
      have significantly higher mutation recurrence compared to the background genomic mutation rate,
      suggesting positive selection in cancer and involvement in tumorigenesis
  MutaNET:
    description: Scores the impact of individual mutations on gene regulation by incorporating them into
      a provided gene regulatory network
    was: Tool for automated analysis of genomic mutations in gene regulatory networks.
  NRL:
    description: Calculates nucleosome repeat length from multiple phasograms computed with NucTools
    was: 'CTCF-dependent chromatin boundaries formed by asymmetric nucleosome arrays with decreased linker
      length.


      NRLcalc: calculation of the Nucleosome Repeat Length.


      The NRLcalc app provides a visual interface for the bulk calculation of the Nucleosome Repeat Length
      (NRL) based on multiple phasograms computed with NucTools (https://github.com/homeveg/nuctools).'
  Nucleosome_Dynamics:
    description: Compares MNase-seq reads to detect nucleosome inclusions, evictions, and shifts between
      two conditions
    was: A new tool for the dynamic analysis of nucleosome positioning | R package for nucleosome architecture
      comparison | Nucleosome Dynamics - Singularity | Nucleosome Dynamics Singularity image is a containerized
      implementation of 'Nucleosome Dynamics suite' | Nucleosome Dynamics Docker Container | Nucleosome
      Dynamics - docker implementation | This repository includes the set of R programs implementing 'Nucleosome
      Dynamics' analyses | Nucleosome positioning plays a major role in transcriptional regulation and
      most DNA-related processes | Nucleosome positioning plays a major role in transcriptional regulation
      DNA replication and DNA repair | R package aimed at comparing the reads of two MNase-seq experiments
      for nucleosome positioning and detecting significant inclusions, evictions and shifts
  OnTAD:
    description: Calls nested topologically associating domains from Hi-C data using an optimized algorithm
    was: 'Hierarchical domain structure reveals the divergence of activity among TADs and boundaries.


      An Optimized Nested TAD caller for Hi-C data.


      OnTAD is an Optimized Nested TAD caller for Hi-C data.


      OnTAD <Hi-C matrix> [-penalty <float>] [-maxsz <int>] [-minsz <int>] [-ldiff <float>] [-lsize <int>]
      [-bedout <chrnum int> <chrlength int> <int>] [-log2] [-o output_file]'
  PCHi-C:
    description: Analyses topological structure of PCHi-C chromatin interaction networks by identifying
      connected components with significance scores
    was: 'Topological structure analysis of chromatin interaction networks.


      Analysis and visualisation tools for PCHi-C interaction networks'
  PIRCh-seq:
    description: Classifies non-coding RNAs associated with distinct histone modifications from PIRCh-seq
      data
    was: This tool contains scripts for PIRCh-seq. It provides a pipeline for functional classification
      of non-coding RNAs associated with distinct histone modifications
  PRAS:
    description: Predicts functional mRNA targets of RNA binding proteins by integrating intensities and
      positions of CLIP-seq binding peaks
    was: '> HOMEPAGE BROKEN! | Predicting functional targets of RNA binding proteins based on CLIP-seq
      peaks | RNA-protein interaction plays important roles in post-transcriptional regulation. Recent
      advancements in cross-linking and immunoprecipitation followed by sequencing (CLIP-seq) technologies
      make it possible to detect the binding peaks of a given RNA binding protein (RBP) at transcriptome
      scale. However, it is still challenging to predict the functional consequences of RBP binding peaks.
      In this study, we propose the Protein-RNA Association Strength (PRAS), which integrates the intensities
      and positions of the binding peaks of RBPs for functional mRNA targets prediction. We illustrate
      the superiority of PRAS over existing approaches on predicting the functional targets of two related
      but divergent CELF (CUGBP, ELAV-like factor) RBPs in mouse brain and muscle'
  PRP:
    description: Integrates curated plant genomic, epigenomic, transcriptomic and pathway data with search,
      analysis and visualisation tools
    was: 'PRP is a comprehensive integrated regulatory information and analysis portal for plant genomes.


      Gene regulation is a highly complex and networked phenomenon where multiple tiers of control determine
      the cell state in a spatio-temporal manner. Among these, the transcription factors, DNA and histone
      modifications, and post-transcriptional control by small RNAs like miRNAs serve as major regulators.
      An understanding of the integrative and spatio-temporal impact of these regulatory factors can provide
      better insights into the state of a ''cell system''. Yet, there are limited resources available
      to this effect. Therefore, we hereby report an integrative information portal (Plant Regulomics
      Portal; PRP) for plants for the first time.'
  PanoromiX:
    description: Integrates molecular assays with pathophenotypic data to visualize time-course disease
      networks
    was: Time-course network medicine platform integrating molecular assays and pathophenotypic data.
  PhysMPrePro:
