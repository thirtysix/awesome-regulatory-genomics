    was: Ultra-fast and accurate motif finder in large ChIP-seq datasets for combinatory motif discovery.
  PromoterPredict:
    description: Predicts Escherichia coli σ70 promoter strength from -10 and -35 hexamer sequences using
      multivariate linear regression
    was: 'sequence-based modelling of Escherichia coli σ70 promoter strength yields logarithmic dependence
      between promoter strength and sequence.


      Machine Learning using Multivariate Linear Regression to Predict the Strength of a Promoter.'
  PsyMuKB:
    description: Integrates transcriptional and translational annotations with de novo variants from developmental
      and neuropsychiatric disorders for isoform-level exploration and visualization
    was: 'An Integrative De Novo Variant Knowledge Base for Developmental Disorders.


      NeuroPsychiatric Mutation Knowledge Base.


      Welcome to our open access database PsyMuKB.


      PsyMuKB is a comprehensive knowledge base that links transcriptional and translational annotations
      to de novo variants, which are found in subjects but not in their parents, in developmental and
      neuropsychiatric disorders. Large-scale genomic and proteomic data are integrated into PsyMuKB,
      including developmental brain expressions, neuronal single-cell transcriptome, regulatory elements,
      and transcript annotations, protein-protein interactions (PPI) and protein isoform expressions.
      It aims to provide users with a comprehensive data exploration of de novo variants, such as their
      genomic locations on alternatively spliced isoforms, expression patterns of the mutation-disrupted
      genes and/or isoforms, and interaction network of impacted proteins'
  QBiC-Pred:
    description: Predicts quantitative transcription factor binding changes due to sequence variants using
      regression models trained on high-throughput in vitro data
    was: Quantitative predictions of transcription factor binding changes due to sequence variants.
  QTLbase:
    description: Curates and compiles genome-wide QTL summary statistics for multiple human molecular
      traits across tissues, enabling retrieval, comparison, and functional annotation
    was: 'an integrative resource for quantitative trait loci across multiple human molecular phenotypes.


      QTLbase curates and compiles genome-wide QTL summary statistics for many human molecular traits
      across over 70 tissue/cell types. The database comprises tens of millions significant genotype-molecular
      trait associations under different conditions. Users can visualize QTL results in phenome-wide and
      tissue-wide levels, and annotate their biological functions through comprehensive genomic features
      and functional evidence. QTLbase provides a one-stop shop of QTLs retrieval and comparison across
      multiple tissues and multiple layers of molecular complexity, and it will greatly help researchers
      interrogate the biological mechanism of causal variants and guide the direction of functional validation'
  RACS:
    description: Analyzes ChIP-Seq data for organisms with contig-based genomes using a one-stop computational
