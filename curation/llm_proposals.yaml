    reason: Focuses on regulatory variant effect prediction and prioritization, which is in scope.
  hrrd:
    filter_said: no-match
    name: HRRD
    reason: It is a database about regulatory relationships between HPV and host RNA, which falls under
      gene-regulatory networks.
  kegg:
    filter_said: excluded:\bpathway (map|enrichment) datab
    name: Kyoto encyclopedia of genes and genomes (KEGG)
    reason: KEGG includes gene-regulatory network analysis and pathway databases relevant to regulatory
      genomics.
  octopus-toolkit:
    filter_said: weak-operation, no corroboration
    name: OCTOPUS-toolkit
    reason: Protein binding site prediction and sequence motif recognition are in scope for transcription-factor
      binding and motifs
  patrocles:
    filter_said: no-match
