# ---------------------------------------------------------------------------
# Deliberately absent from verified_publications, so they show no aggregate:
#   EMBOSS members (jaspscan, tfscan, tfextract)
#     each links the EMBOSS suite paper (9,906 citations) and the EMBOSS guides; no per-command count exists
#   Galaxy wrappers (~13 records)
#     each links the Galaxy platform paper (1,965) and 'A public Galaxy platform at Pasteur' (34); neither is the wrapped tool's own paper
#   RSAT family (rsat, oligo-analysis, RSAT_-_Retrieve_Sequence, others)
#     suite and member papers are cross-linked in both directions, so no split is defensible from the record
#   fugu-sg (IMCB Fugu Genome Project)
#     all four linked papers are Fugu genome announcements, which this catalog puts out of scope
#   snogps
#     its most-cited linked paper is the joint tRNAscan-SE / snoscan / snoGPS server paper; the other two tools are out of scope so the shared-primary guard cannot see the collision
#   alggen
#     ALGGEN is a server hosting PROMO and MALGEN; the server paper is not the indexed tool's
#   predictprotein_open, edger, express, tact
#     protein structure prediction, generic differential expression and genome annotation; scope questions that aggregation would amplify rather than fix
#   preprint/published pairs (DeepCLIP, Chromosight, BAMscale, DAMEfinder, FINET, EAGLE, FastSK, AutoRELACS, ASHIC, bindSC, FINSURF, DriverGroup, TMELand)
#     the two linked records are the same paper, so there is nothing to aggregate
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# no_article - the tool has no paper, and that is the final answer.
#
# An empty citation cell used to mean three different things at once. These
# entries are the settled case: Bioconductor reports the package citing
# itself (doi:10.18129/B9.bioc.<pkg>), so there is no article to find and no
# amount of searching will produce one. Recorded so the catalog can say so
# outright, and so pipeline/discover_pubs.py stops re-proposing them.
#
# The second group was examined and rejected: a candidate DOI existed but
# described something other than the tool. Those reasons matter more than the
# verdict, because the next run would otherwise find the same wrong paper.
# ---------------------------------------------------------------------------
