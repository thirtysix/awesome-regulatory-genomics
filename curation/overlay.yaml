  sequence_in_sequence_finder: "It finds nucleic subsequences, not regulatory motifs; admitted on EDAM 'Sequence motif comparison' alone"
  tetrex: "It is a general-purpose sequence motif search tool, not specific to regulatory genomics"
  ting: "Clusters T cell receptor sequences by antigen-specificity, not regulatory genomics; admitted on EDAM 'Sequence motif discovery' alone"
  varianttools: "Tool is for genomic variant calling, not regulatory genomics; admitted on EDAM 'Sequence motif comparison' alone"
# ---------------------------------------------------------------------------
# aliases - collapse duplicate bio.tools records for the same tool.
# The key is kept; the listed IDs are dropped and recorded as alternates.
# ---------------------------------------------------------------------------
# publications - override the publication link on a bio.tools record.
# Used where bio.tools carries a preprint and Crossref records no
# `is-preprint-of` relation, so pipeline/resolve_pubs.py cannot upgrade it
# automatically. Every entry here was looked up and the title checked against
# the tool; do not add one from memory.
publications:
  # Hand-checked 2026-08-01 against the paper itself, after the describe stage's
  # paper_matches flag put them up for review.
  #
  # EP3 was the only real error of the four: it pointed at "Toward a gold
  # standard for promoter prediction evaluation", a benchmark of promoter
  # predictors, rather than its own Genome Research paper. Note the 10.1101
  # prefix here is Cold Spring Harbor's Genome Research, NOT bioRxiv;
  # config.is_preprint() reads the suffix shape and returns False, as it must.
  ep3: pmid:18096745             # Generic eukaryotic core promoter prediction, Genome Research 2008

  # The other three were already correct and are pinned so the flag does not
  # keep resurfacing them. Each is the pattern that makes this hard: in genomics
  # the tool ships inside its biology or method paper, so the title is about the
  # science and never names the software.
  pyPINTS: pmid:35177836         # Nat Biotech 2022 comparison paper; it introduces PINTS
  NRL: pmid:31665434             # NAR 2019 CTCF paper; introduces NRLcalc in its methods
  asseq: pmid:21838806           # Wei Sun, Biometrics 2012; the TReC+ASE method asSeq implements

  # A transposed digit, not a wrong choice of paper: bio.tools records
  # pmid:18449469, which resolves cleanly to "Ellipsoidal particles at fluid
  # interfaces" (Eur. Phys. J. E 2008) and carried its 146 citations against
  # NOBAI's true 15. The tool is excluded as out of scope either way; the
  # identifier is corrected so the archived row is not carrying a lie.
  nobai: pmid:18448469           # NOBAI, Nucleic Acids Research 2008

  signac: pmid:34725479          # Nature Methods 2021, 10.1038/s41592-021-01282-5
  archr: doi:10.1038/s41588-021-00790-6    # Nature Genetics 2021

  # bio.tools points these records at a paper that is not the tool's own, so the
  # catalog was reporting another work's citation count. Each replacement title
  # was read before being written here.
  carrie: pmid:15215383          # the primary was "Questions and answers about AIDS" (1992)
  mdscan: pmid:12101404          # the primary was a suite paper shared across several tools
  microfootprinter: pmid:16845027  # the primary was FootPrinter's paper, the parent tool
  poxo: pmid:16845065            # the primary was POCO's paper, a separate catalogued tool
  webmotifs: pmid:17584794       # the primary was a method paper, not the tool's

  # Recovered by pipeline/discover_pubs.py from the tool's own declared
  # citation, then checked against the paper title. See
  # docs/publication-discovery.md for the candidates that need a human.
  dmchmm: doi:10.1111/biom.12965        # A Hidden Markov Model for Identifying Differentially Methylated Sites
  intad: doi:10.1186/s12859-019-2655-2  # InTAD: chromosome conformation guided analysis of enhancer target genes
  nadfinder: doi:10.1101/gr.247072.118  # Two contrasting classes of nucleolus-associated domains
  sponge: doi:10.1093/bioinformatics/btz314  # Large-scale inference of competing endogenous RNA networks

  # HOMER states its citation in prose on homer.ucsd.edu/homer/ with no DOI or
  # PMID anywhere, and the paper's title carries no hint of the name, so nothing
  # name-based could ever have found it. Resolved from the reference string and
  # read before being written here.
  homer: doi:10.1016/j.molcel.2010.05.004  # Heinz et al. 2010, Simple Combinations of Lineage-Determining TFs

  # Found by cross-checking records that already HAD a publication against what
  # each tool declares for itself. Nothing had flagged these, because nothing
  # ever compared the recorded paper to the tool. Counts move in both
  # directions; three of these tools were carrying another work's citations.
  moonlightr: doi:10.7490/f1000research.1118074.1  # was a spine-surgery review, "Lateral lumbar interbody fusion"
  vulcan: doi:10.1186/s13059-019-1698-z    # was VIPER's paper, crediting VULCAN with 1,079 citations
  rtnduals: doi:10.1093/bioinformatics/btz534   # was RTN's paper rather than this package's
  rtnsurvival: doi:10.1093/bioinformatics/btz229  # was RTN's paper rather than this package's
  gothic: doi:10.1371/journal.pone.0174744  # was the Hi-C biology paper, not the GOTHiC method paper
  tigre: doi:10.1093/bioinformatics/btr057  # was the Gaussian-process method, not the package
  chippeakanno: doi:10.1186/1471-2105-11-237  # was a protocol chapter; the package paper has 1,291
  # DiffBind carried "VAV3 mediates resistance to breast cancer endocrine
  # therapy", an application paper. Bioconductor declares Ross-Innes et al. 2012
  # instead, which is a biology paper the software was written for rather than a
  # software paper; that is the maintainer's stated citation, and it is the same
  # judgement already applied to RTN. Nature version, not the RECOMB chapter.
  diffbind: doi:10.1038/nature10730

  # Preprints whose published version resolve_pubs.py could not find, because
  # Crossref records no `is-preprint-of` relation for them. Each published
  # version was read against the preprint before being written here.
  bindsc: doi:10.1186/s13059-022-02679-x   # Research Square preprint -> Genome Biology 2022
  metaboverse: doi:10.1038/s41556-023-01117-9  # bioRxiv -> Nature Cell Biology 2023
  oncoenrichr: doi:10.1002/ijc.34666       # arXiv -> International Journal of Cancer 2023
  Tulip: doi:10.1186/s12859-021-04097-5    # bioRxiv -> BMC Bioinformatics 2021
  aimodules: doi:10.1038/s41598-022-21732-0  # Research Square -> Scientific Reports 2022
  gpsa: doi:10.1093/nar/gkac1066           # was "A prognostic model for laryngeal squamous cell carcinoma"

  # OpenAlex holds two records for the Segway paper, and the PMID resolves to
  # the wrong one: `pmid:22426492` lands on a record carrying an ACM conference
  # DOI with 290 citations, while the Nature Methods record of the same paper
  # has 663. Linking the DOI sidesteps the mis-merge. Worth remembering that an
  # identifier can be correct and still reach a duplicated, undercounted record.
  segway: doi:10.1038/nmeth.1937

aliases:
