exclude:
  geneious: General-purpose sequence analysis suite; tagged "Sequence motif discovery" upstream
  cuffdiff: Differential transcript expression; tagged "Transcriptional regulatory element prediction"
    upstream
  crisprfinder: Detects CRISPR direct repeats, not regulatory elements
  ferrdb: Curated resource of ferroptosis regulators; a disease gene list, not a regulatory-genomics tool
  patmatdb: Searches PROTEIN sequences with a motif; not DNA regulatory analysis
  weblogo_3: Duplicate bio.tools record for WebLogo
  meme_fimo: Duplicate of the MEME Suite / FIMO entries
  bioconductor-methylclock: Duplicate bio.tools record for methylclock, which is already in the catalog
    under that id
  pgltools-chromatin: Duplicate bio.tools record for pgltools; the suffix is not a registry prefix, so
    the id rule in build.py cannot see it
  bowtie2: General read aligner; kept as "a preprocessing step for footprinting and peak calling"
  genomedata: Storage format for genomic tracks; kept as tracks "usable for" footprinting
  bioconductor-metapod: Combines p-values in any genome-scale differential analysis
  ROADMAP_epigenomics: Reference data repository rather than a tool; kept out to avoid inflating the ranking
  erange: RNA-seq and ChIP-seq package whose paper is the 2008 RNA-seq transcriptome method; 14,401 citations
    for work out of scope
  edger: Generic differential expression for RNA-seq; admitted by a ChIP-seq text match
  express: Transcript-level RNA-seq abundance quantification; admitted by a transcription-factor text
    match
  predictprotein_open: Predicts protein structural and functional features, not regulatory genomics; admitted
    on EDAM 'Sequence motif discovery' alone
  defuse: Discovers gene fusions from RNA-Seq data, not regulatory genomics; admitted on EDAM 'Sequence
    motif discovery' alone
  hotnet: Finds mutated subnetworks in cancer via protein interaction networks, not gene regulatory networks;
    admitted on EDAM 'Gene regulatory network analysis' alone
  promateus: Predicts protein-protein binding sites, not regulatory genomics; admitted on EDAM 'Peak calling'
    alone
  VDJdb: Focuses on T-cell receptor sequences and antigens, not regulatory genomics; admitted on EDAM
    'Sequence motif discovery' alone
  toxinpred2: Predicts protein/peptide toxicity, not regulatory genomics
  tact: Focuses on general gene annotation and transcript characterization, not regulatory genomics
  eukaryotic_linear_motif: Annotates and detects short linear motifs in proteins mediating protein-protein
    interactions, not regulatory genomics; admitted on EDAM 'Sequence motif discovery' alone
  iceberg: Database of bacterial mobile genetic elements, not regulatory genomics; admitted on EDAM 'Promoter
    prediction' alone
  propr: Tool is for compositional data analysis and proportionality, not regulatory genomics; admitted
    on EDAM 'Peak calling' alone
  sitehound-web: Identifies ligand binding sites in protein structures, not regulatory genomics; admitted
    on EDAM 'Peak calling' alone
  ireceptor: Focuses on adaptive immune receptor repertoires (B-cell/T-cell), not regulatory genomics;
    admitted on EDAM 'Sequence motif comparison' alone
  meta-meme: Tool models protein families and motifs, not regulatory genomics
  mkt: Detects natural selection via McDonald-Kreitman test, not regulatory genomics
  fugu-sg: This is a genome project and database, not a regulatory-genomics tool; admitted on EDAM 'Transcriptional
    regulatory element prediction' alone
  nobai: Paper is about colloid physics, not regulatory genomics; admitted on EDAM 'Transcriptional regulatory
    element prediction' alone
  starmir: Predicts microRNA binding sites on target RNA, which is RNA regulation, not regulatory genomics;
    admitted on EDAM 'Transcription factor binding site prediction' alone
  moma: Tool segments and tracks cells from images, not for regulatory genomics analysis; admitted on
    EDAM 'Gene regulatory network analysis' alone
  PyFeat: General feature generation tool for DNA, RNA, and protein sequences, not specific to regulatory
    genomics; admitted on EDAM 'Promoter prediction' alone
  spacer: Analyzes protein structures for allosteric and effector binding sites, not regulatory genomics;
    admitted on EDAM 'Peak calling' alone
  u-shape3D: Detects subcellular morphological motifs in 3D microscopy images, not regulatory genomics
    motifs
  DeepCLIP: Predicts protein-RNA binding, not cis-regulatory elements or DNA regulatory genomics; admitted
    on EDAM 'cis-regulatory element prediction' alone
  p-scan: Tool quantifies peaks from cDNA microarray data for gene expression analysis, not regulatory
    genomics; admitted on EDAM 'Peak calling' alone
  multibind: Tool aligns protein binding sites from protein-small molecule complexes, which is out of
    scope as it deals with protein-ligand binding, not regulatory genomics; admitted on EDAM 'Peak calling'
    alone
  talenoffer: TALENoffer predicts off-targets of TALENs for genome editing, not regulatory elements; admitted
    on EDAM 'Transcriptional regulatory element prediction' alone
  glytoucan: GlyTouCan is a glycan repository, not a regulatory genomics tool
  ZincBind: Tool identifies zinc binding sites in proteins, not transcription factor binding sites or
    regulatory genomics; admitted on EDAM 'Transcription factor binding site prediction' alone
  RNATracker: Predicts mRNA subcellular localization, not cis-regulatory elements in the regulatory genomics
    sense; admitted on EDAM 'cis-regulatory element prediction' alone
  probis: Detects protein binding sites, not regulatory genomics; admitted on EDAM 'Peak calling' alone
  grgmf: Tool predicts links in biomedical bipartite networks (e.g., drug-target, disease-gene) and is
    not specific to regulatory genomics; admitted on EDAM 'Promoter prediction' alone
  mobilomefinder: Focuses on bacterial genomic islands and mobile elements, not regulatory genomics; admitted
    on EDAM 'Sequence motif discovery' alone
  bubble_gum: Tool performs gene set enrichment analysis on transcriptomic data, not regulatory genomics;
    admitted on EDAM 'Transcriptional regulatory element prediction' alone
  hfaim: Identifies Atg8-interacting motifs in proteins for autophagy, not regulatory genomics; admitted
    on EDAM 'Sequence motif comparison' alone
  oktoberfest: Tool is for proteomics spectral library generation and rescoring, not regulatory genomics;
    admitted on EDAM 'Promoter prediction' alone
  topogsa: Focuses on general network topological properties of gene/protein sets, not specifically on
    gene regulatory networks or regulatory genomics; admitted on EDAM 'Gene regulatory network analysis'
    alone
  metaldetector: predicts metal binding sites in proteins, not regulatory genomics; admitted on EDAM 'Peak
    calling' alone
  probis-ligands: Predicts ligands for protein binding sites, not transcription factor binding or regulatory
    genomics; admitted on EDAM 'Transcription factor binding site prediction' alone
  rna-targeting: Tool predicts guide efficiency for RNA targeting, not regulatory genomics; admitted on
    EDAM 'Sequence motif discovery' alone
  VISDB: Database of viral integration sites, not regulatory genomics; admitted on EDAM 'Promoter prediction'
    alone
  trapp: predicts protein binding pockets for small-molecule inhibitors, not regulatory genomics; admitted
    on EDAM 'Peak calling' alone
  bedtoolsr: General genomic data manipulation tool, not specific to regulatory genomics; admitted on
    EDAM 'Peak calling' alone
  key_pathway_miner: Tool identifies subnetworks of co-expressed genes, not gene-regulatory networks;
    admitted on EDAM 'Gene regulatory network analysis' alone
  possum: Database of protein-ligand binding sites and pockets, out of regulatory genomics scope; admitted
    on EDAM 'Peak calling' alone
  LTMG: Models transcriptional expression states from scRNA-seq data, not cis-regulatory element prediction;
    admitted on EDAM 'cis-regulatory element prediction' alone
  modsubnetbiomident: Focuses on aging biomarkers and longevity gene function inference, not regulatory
    genomics; admitted on EDAM 'Gene regulatory network analysis' alone
  spascer: SPASCER is a spatial transcriptomics database and annotation tool, not a regulatory genomics
    tool; admitted on EDAM 'Gene regulatory network analysis' alone
  coman: Focuses on metatranscriptomics functional analysis, not regulatory genomics; admitted on EDAM
    'Transcriptional regulatory element prediction' alone
  flyrnai: It is a database for RNAi reagents and screens, not for regulatory genomics; admitted on EDAM
    'Transcriptional regulatory element prediction' alone
  noisyr: Tool is a general noise filter for sequencing data, not specific to regulatory genomics; admitted
    on EDAM 'Gene regulatory network prediction' alone
  ripseeker: RIPSeeker identifies RNA-protein interactions, not DNA regulatory elements; admitted on EDAM
    'Transcriptional regulatory element prediction' alone
  WheatCRISPR: Tool is for CRISPR guide RNA design, not regulatory genomics; admitted on EDAM 'Promoter
    prediction' alone
  circlebase: Focuses on extrachromosomal circular DNA curation and interpretation, not regulatory genomics;
    admitted on EDAM 'Gene regulatory network prediction' alone
  biobike: BioBIKE is a general-purpose bioinformatics programming environment, not a tool specifically
    for regulatory genomics; admitted on EDAM 'Sequence motif discovery' alone
  crispron_off: CRISPR gRNA design is not regulatory genomics; admitted on EDAM 'Promoter prediction'
    alone
  deepcyps: Predicts cytochrome P450 inhibitory activity, not regulatory genomics; admitted on EDAM 'Promoter
    prediction' alone
  icyp-mfe: Predicts cytochrome P450 inhibitors, which is drug metabolism, not regulatory genomics; admitted
    on EDAM 'Promoter prediction' alone
  signalink3: SignaLink3 is a signaling pathway database, not a regulatory-genomics tool; admitted on
    EDAM 'Gene regulatory network analysis' alone
  vamos: Tool annotates variable-number tandem repeats, not regulatory elements; admitted on EDAM 'Sequence
    motif discovery' alone
  ligap: Tool identifies differentially regulated transcriptome signatures in T cell differentiation,
    not regulatory genomics tools like TF binding or cis-regulatory elements; admitted on EDAM 'trans-regulatory
    element prediction' alone
  grrann: Tool predicts phenotypes from gene expression data using network-regularized neural network,
    not gene regulatory network analysis; admitted on EDAM 'Gene regulatory network analysis' alone
  netvenn: It compares gene lists with Venn diagrams and interactome networks, not specifically for gene-regulatory
    networks; admitted on EDAM 'Gene regulatory network analysis' alone
  network_of_cancer_genes: Focuses on cancer gene mutations and protein interaction networks, not regulatory
    genomics; admitted on EDAM 'Gene regulatory network analysis' alone
  subtiwiki: SubtiWiki is a general-purpose database for Bacillus subtilis, not a tool specifically for
    regulatory genomics; admitted on EDAM 'Gene regulatory network analysis' alone
  ReProMin: focuses on proteome reallocation and minimal regulatory interventions, not on regulatory genomics;
    admitted on EDAM 'Gene regulatory network analysis' alone
  bsdb: Focuses on protein mechanostability and stretching simulations, not regulatory genomics; admitted
    on EDAM 'Peak calling' alone
  rna_analyzer: Focuses on RNA structural motifs and regulatory elements, not DNA regulatory genomics
  clarion: Predicts mRNA subcellular localization, not regulatory genomics; admitted on EDAM 'Gene regulatory
    network prediction' alone
  AR-Pred: Predicts protein active and allosteric binding sites, not regulatory genomics; admitted on
    EDAM 'DNA binding site prediction' alone
  gidetector: Detects genomic islands in prokaryotic genomes, not regulatory genomics; admitted on EDAM
    'Sequence motif discovery' alone
  isma: Tool enumerates subgraph patterns in general networks, not specifically regulatory or genomic
    networks; admitted on EDAM 'Sequence motif discovery' alone
  goegcn: Focuses on breast cancer subtype classification from RNA-Seq data using differential expression
    and coexpression networks, not on regulatory genomics; admitted on EDAM 'Gene regulatory network analysis'
    alone
  hot_scan: Detects translocation breakpoint hotspots, not regulatory elements
  biotranslator: Tool performs differential expression and pathway enrichment analysis, not gene regulatory
    network analysis; admitted on EDAM 'Gene regulatory network analysis' alone
  lasergene: The tool is a general sequence analysis suite, not specifically for regulatory genomics;
    admitted on EDAM 'Peak calling' alone
  tcrconv: Predicts T-cell receptor-epitope recognition, which is immunology, not regulatory genomics
  paxtoolsr: Tool is for pathway analysis and BioPAX data, not gene regulatory networks; admitted on EDAM
    'Gene regulatory network analysis' alone
  virnatrap: Identifies viral reads and assembles viral contigs, not regulatory genomics
  cgnaweb: It models DNA shape and mechanics, not regulatory elements like promoters; admitted on EDAM
    'Promoter prediction' alone
  expansin-engineering-db: Focuses on plant cell wall proteins and carbohydrate binding, not regulatory
    genomics
  ippd: Tool extracts isotopic peak patterns from mass spectra for proteomics, not regulatory genomics;
    admitted on EDAM 'Peak calling' alone
  rldock: predicts RNA-small molecule binding, not regulatory genomics; admitted on EDAM 'Transcription
    factor binding site prediction' alone
  lise: Predicts small molecule binding sites on proteins, not regulatory genomics; admitted on EDAM 'Transcription
    factor binding site prediction' alone
  nlrexpress: Predicts protein motifs (CC, TIR, NBS, LRR) in plant NLR proteins, not regulatory genomics
