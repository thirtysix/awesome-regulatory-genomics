# ---------------------------------------------------------------------------
# verified_publications - the papers that genuinely belong to one tool.
#
# Why this is hand-written and not derived: bio.tools' publication list mixes
# a tool's own papers with the method it implements, the guidelines it follows,
# the platform that hosts it and, for suites, its members' papers. Summing the
# list blindly gives phantompeakqualtools the ENCODE ChIP-seq guidelines paper
# and hands every Galaxy wrapper the Galaxy platform's citations. Nor can the
# `type: Primary` flag carry it: 75% of entries are untyped, including all
# eight of the MEME Suite's.
#
# `citations` shows the most-cited paper in this list; `citations_total` sums
# the list and is displayed as "across N papers", never ranked on. A tool
# absent from this block gets no aggregate, which is the honest fallback.
#
# Each list was checked paper by paper against its title. Do not add an entry
# from memory, and do not machine-generate one.
# ---------------------------------------------------------------------------
