# Recall benchmark: tools this catalog should contain.
#
# A hand-written list of resources the field treats as standard. It is not a
# ranking and not exhaustive - it exists so that "did the pipeline find the
# obvious things?" is a measurement rather than an impression. `make audit`
# checks the built catalog against it and writes docs/coverage.md.
#
# When the pipeline misses an entry here, fix the *rule* in pipeline/config.py
# if the tool is in bio.tools, or add it to seeds.yaml if it is not.
#
# Each entry may carry `aka` for names the catalog might use instead.

motif discovery:
  - {name: MEME, aka: [MEME Suite]}
  - {name: STREME}
  - {name: DREME}
  - {name: HOMER, aka: [homer]}
  - {name: Weeder}
  - {name: AlignACE}
  - {name: MDscan}
  - {name: ChIPMunk}
  - {name: RSAT, aka: [RSAT suite, peak-motifs]}
  - {name: BaMMmotif, aka: [BaMM]}
  - {name: TF-MoDISco}
  - {name: gkm-SVM, aka: [LS-GKM, "gkm-SVM / LS-GKM"]}

motif scanning and enrichment:
  - {name: FIMO}
  - {name: CentriMo}
  - {name: AME}
  # bio.tools' `mast` record is the Bioconductor single-cell DE package,
  # not this one. The MEME Suite MAST is absent from bio.tools and comes
  # from seeds.yaml; matching on the bare name silently passed on the
  # wrong tool before.
  - {name: MAST, aka: [MEME MAST]}
  - {name: MOODS}
  - {name: PWMScan}
  - {name: Cluster-Buster}
  - {name: TFBSTools}
