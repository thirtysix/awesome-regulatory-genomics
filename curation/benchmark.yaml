# ---------------------------------------------------------------------------
# Second tier, added 2026-07-28.
#
# The first 89 entries all passed, which meant the number had stopped
# discriminating: a benchmark you always score 100% on measures nothing except
# that it has not been made harder. These are deliberately less obvious -
# widely used but narrower tools, older methods still cited, and the parts of
# the field that registries cover worst. A miss here is a finding, not a
# failure; work it back into pipeline/config.py or curation/seeds.yaml.
# ---------------------------------------------------------------------------

